"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# Branding for the `ubc build html` site — the ubCode counterpart of the
# Sphinx/furo theming in conf.py + _static/_css/furo.css, written against
# ubCode's documented `--ubc-*` CSS variable contract.
[build.html]
title = "Sphinx-Needs"
# `shared.css` is the theme-AGNOSTIC sheet every Sphinx theme links in conf.py
# (flow-chart sizing/animations, grid-example helpers) — reused verbatim here.
# Order matters: the theme sheet comes second so its declarations win where the
# two meet (notably the hero background, whose shared.css URL is
# `_css/`-relative and cannot survive the flat copy into `_static/`).
extra_css = ["_static/_css/shared.css", "_static/ubc-theme.css"]
# The furo pair (`light_logo` / `dark_logo` in conf.py); the long logos carry
# the wordmark, so `hide_title` keeps the sidebar logo-only (furo's
# `sidebar_hide_name`). Favicon matches conf.py's `html_favicon`.
logo = "_static/sphinx-needs-logo-long-light.svg"
logo_dark = "_static/sphinx-needs-logo-long-dark.svg"
hide_title = true
favicon = "_static/sphinx-needs-logo-square-dark.svg"
# conf.py computes `2017-{now.year}`; TOML is static, so the year is written out.
copyright = "2017-2026, team useblocks"
# The furo triple from conf.py's `html_theme_options` (source_repository /
# source_branch / source_directory), so the built site's view/edit buttons
# point at the same files the Sphinx build's do.
source_repository = "https://github.com/useblocks/sphinx-needs"
source_branch = "master"
source_directory = "docs/"

[parse]
# Enable the built-in extension ports used by these docs:
# - sphinx_syntax_example: the `.. syntax-example::` directive (also declared in
#   `extensions` in docs/conf.py), so the engine recognises it by module tag and
#   renders the same source + rendered-result shape as the Sphinx build.
# - sphinx.ext.extlinks: the `:pr:` and `:issue:` roles configured below.
# - sphinx.ext.todo: the `.. todo::` directive.
extensions = ["sphinx_syntax_example", "sphinx.ext.extlinks", "sphinx.ext.todo"]
# Mirrors conf.py's `rst_epilog`, which defines the `|br|` substitution.
rst_epilog = """
.. |br| raw:: html

   <br>
"""

# Mirrors conf.py's `extlinks`.
[parse.extlinks.pr]
url = "https://github.com/useblocks/sphinx-needs/pull/%s"
caption = "PR #%s"

[parse.extlinks.issue]
url = "https://github.com/useblocks/sphinx-needs/issues/%s"
caption = "issue #%s"

[parse.extend_directives.need-warnings]
argument = false
options = false
content = false
parse_content = false
content_required = false

[parse.extend_directives.need-core-fields]
argument = false
options = false
content = false
parse_content = false
content_required = false

[needs]
show_link_type = false
show_link_title = false
title_optional = true
max_title_length = 75
id_regex = "^[A-Za-z0-9_]+"
id_required = false
table_style = "datatables"
table_columns = "ID;TITLE;STATUS;OUTGOING"
default_layout = "clean"
service_all_data = true
# needs.json build options
build_json = true
reproducible_json = true
json_remove_defaults = true
build_json_per_id = false

[needs.fields.status]
parse_variants = true

[needs.fields.my_extra_option]
description = "Custom extra option"
nullable = true

[needs.fields.another_option]
description = "Another custom option"
default = ""

[needs.fields.author]
description = "Author of the need"
nullable = true

[needs.fields.comment]
description = "Additional comments"
nullable = true

[needs.fields.amount]
description = "Amount value"
schema.type = "number"

[needs.fields.hours]
description = "Time in hours"
schema.type = "integer"

[needs.fields.duration]
description = "Time in days"
schema.type = "integer"

[needs.fields.completion]
description = "Completion in %"
schema.type = "integer"

[needs.fields.image]
description = "Image reference"
nullable = true

[needs.fields.config]
description = "Configuration option"
nullable = true

[needs.fields.github]
description = "GitHub reference"
nullable = true

[needs.fields.value]
description = "General value field"
nullable = true

[needs.fields.unit]
description = "Unit specification"
nullable = true

[[needs.types]]
directive = "int"
title = "Interface"
content = "plantuml"
prefix = "I_"
color = "#BFD8D2"
style = "card"

[[needs.types]]
directive = "comp"
title = "Component"
content = "plantuml"
prefix = "C_"
color = "#BFD8D2"
style = "card"

[[needs.types]]
directive = "sys"
title = "System"
