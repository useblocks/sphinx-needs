[needs.links.blocks]
incoming = "is blocked by"
outgoing = "blocks"
copy = true
style = "#AA0000"
style_part = "dotted,#AA0000"
style_start = "-"
style_end = "-o"
allow_dead_links = true

[needs.links.tests]
incoming = "is tested by"
outgoing = "tests"
copy = true
style = "#00AA00"
style_part = "dotted,#00AA00"

[needs.links.checks]
incoming = "is checked by"
outgoing = "checks"
copy = false
style = "#00AA00"
style_part = "dotted,#00AA00"

[needs.links.triggers]
incoming = "triggered by"
outgoing = "triggers"
copy = false
style = "#00AA00"
style_part = "solid,#777777"
allow_dead_links = true

[needs.links.starts_with]
incoming = "triggers directly"
outgoing = "starts with"
copy = false
style = "#00AA00"
style_part = "solid,#777777"

[needs.links.starts_after]
incoming = "triggers at end"
outgoing = "starts after"
copy = false
style = "#00AA00"
style_part = "solid,#777777"

[needs.links.ends_with]
incoming = "triggers to end with"
outgoing = "ends with"
copy = false
style = "#00AA00"
style_part = "solid,#777777"

[needs.links.tutorial_required_by]
incoming = "requires"
outgoing = "required by"
style = "#00AA00"

[needs.links.tutorial_specifies]
incoming = "specified by"
outgoing = "specifies"

[needs.links.tutorial_tests]
option = "tutorial_tests"
incoming = "tested by"
outgoing = "tests"

[needs.warnings]
type_check = "type not in ['int', 'comp', 'sys', 'req', 'spec', 'impl', 'test', 'feature', 'user', 'action', 'milestone', 'tutorial-project', 'tutorial-req', 'tutorial-spec', 'tutorial-test', 'issue', 'pr', 'commit']"

[needs.constraints.critical]
check_0 = "'critical' in tags"
check_1 = "'SECURITY_REQ' in links"
severity = "CRITICAL"

[needs.constraints.security]
check_0 = "'security' in tags"
severity = "HIGH"

[needs.constraints.team]
check_0 = "author == \"Bob\""
severity = "LOW"

[needs.constraint_failed_options.CRITICAL]
on_fail = ["warn"]
style = ["red_bar"]
force_style = true

[needs.constraint_failed_options.HIGH]
on_fail = ["warn"]
style = ["orange_bar"]
force_style = true

[needs.constraint_failed_options.MEDIUM]
on_fail = ["warn"]
style = ["yellow_bar"]
force_style = false

[needs.constraint_failed_options.LOW]
on_fail = []
style = ["yellow_bar"]
force_style = false

[needs.flow_configs]
my_config = """
skinparam monochrome true
skinparam componentStyle uml2
"""
another_config = """
skinparam class {
    BackgroundColor PaleGreen
    ArrowColor SeaGreen
    BorderColor SpringGreen
}
"""
tutorial = """
left to right direction
skinparam backgroundcolor transparent
skinparam Arrow {
    Color #57ACDC
    FontColor #808080
    FontStyle Bold
}
skinparam rectangleBorderThickness 2
"""

[needs.graphviz_styles.tutorial.graph]
rankdir = "LR"
bgcolor = "transparent"

[needs.graphviz_styles.tutorial.node]
fontname = "sans-serif"
fontsize = 12
penwidth = 2
margin = "0.11,0.11"
style = "rounded"

[needs.graphviz_styles.tutorial.edge]
color = "#57ACDC"
fontsize = 10
fontcolor = "#808080"

[needs.layouts.example]
grid = "simple_side_right_partial"

[needs.layouts.example.layout]
head = ["**<<meta(\"title\")>>** for *<<meta(\"author\")>>*"]
meta = ["**status**: <<meta(\"status\")>>", "**author**: <<meta(\"author\")>>"]
side = ["<<image(\"_images/{{author}}.png\", align=\"center\")>>"]

[needs.layouts.permalink_example]
grid = "simple"

[needs.layouts.permalink_example.layout]
head = [
  "<<meta(\"type_name\")>>: **<<meta(\"title\")>>** <<meta_id()>> <<permalink()>> <<collapse_button(\"meta\", collapsed=\"icon:arrow-down-circle\", visible=\"icon:arrow-right-circle\", initial=False)>> ",
]
meta = ["<<meta_all(no_links=True)>>", "<<meta_links_all()>>"]

[needs.layouts.detail_view]
grid = "simple"

[needs.layouts.detail_view.layout]
head = [
  "<<meta(\"type_name\")>>: **<<meta(\"title\")>>** <<meta_id()>> <<permalink()>> <<collapse_button(\"meta\", collapsed=\"icon:arrow-down-circle\", visible=\"icon:arrow-right-circle\", initial=False)>> <<sidebar(\"\")>>",
]
meta = ["<<meta_all(no_links=True)>>", "<<meta_links_all()>>"]

# Card specifications, rendered live on the `card_layouts` page.
#
# The three `[needs.layouts]` entries above stay hand-written on purpose: each
# uses something the card vocabulary deliberately does not cover -- prose in the
# head, `permalink()`, `sidebar()` -- which is exactly what makes them the
# escape-hatch examples on the layout page. The two below are the cases the card
# vocabulary is for, and they are declared here rather than in `conf.py` so that
# the `needs_from_toml` path is exercised by this project's own build.

# `clean` plus the need's image beside the header and meta, with the body running
# full width underneath it (`span = "partial"`).
[needs.card_layouts.card_profile]
extends = "clean"

[needs.card_layouts.card_profile.meta]
exclude = ["layout", "style"]

[needs.card_layouts.card_profile.side]
elements = ["image:image", "id"]
position = "left"
span = "partial"

# A compact card: two named fields, no links, a footer, and the meta region
# collapsed until the reader opens it.
[needs.card_layouts.card_summary]
collapse = "closed"
footer = ["id", "type", "layout_echo"]

[needs.card_layouts.card_summary.meta]
include = ["status", "author"]
links = false

[needs.string_links.config_link]
regex = "^(?P<value>\\w+)$"
link_url = "https://sphinxcontrib-needs.readthedocs.io/en/latest/configuration.html#{{value | replace(\"_\", \"-\")}}"
link_name = "Sphinx-Needs docs for {{value | replace(\"_\", \"-\") }}"
options = ["config"]

[needs.string_links.github_link]
regex = "^(?P<value>\\w+)$"
link_url = "https://github.com/useblocks/sphinxcontrib-needs/issues/{{value}}"
link_name = "GitHub #{{value}}"
options = ["github"]

[needs_json]
path = "_build/html/furo/needs.json"
src = "."

# Cross-project references, mirroring conf.py's `intersphinx_mapping` (same
# project names, so external references resolve identically in both engines).
[intersphinx.projects.python]
url = "https://docs.python.org/3.8"

[intersphinx.projects.sphinx]
url = "https://www.sphinx-doc.org/en/master"
