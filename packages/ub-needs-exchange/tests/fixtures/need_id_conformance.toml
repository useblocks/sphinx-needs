[[join]]
name = "join-a-local-starting-with-a-colon"
why = "`nc` and `:b` would make `nc:::b`, whose last `::` is at offset 3: it would not split back"
namespace = ["nc"]
local = ":b"
invalid = true

[[join]]
name = "join-an-empty-segment"
why = "an empty segment is not a segment"
namespace = [""]
local = "X"
invalid = true

[[join]]
name = "join-an-empty-segment-after-a-valid-one"
why = "every segment is checked, not only the first"
namespace = ["nc", ""]
local = "X"
invalid = true

[[join]]
name = "join-a-segment-holding-the-separator"
why = "a namespace's TEXT is not a segment: `a::b` must be given as two segments"
namespace = ["a::b"]
local = "X"
invalid = true

[[join]]
name = "join-a-segment-with-a-dot"
why = "a `.` is not a segment character"
namespace = ["nc.x"]
local = "X"
invalid = true

[[join]]
name = "join-a-segment-of-a-non-ascii-letter"
why = "a non-ASCII letter is not a segment character"
namespace = ["caf\u00e9"]
local = "X"
invalid = true

[[join]]
name = "join-a-segment-ending-in-a-line-feed"
why = "a trailing line feed is a bad character"
namespace = ["nc\u000a"]
local = "X"
invalid = true

# --- prefix: the text that joins an id to a namespace ------------------------------

[[prefix]]
name = "prefix-the-empty-namespace"
why = "the empty namespace has the empty prefix: an id put after it is unchanged"
namespace = []
prefix = ""

[[prefix]]
name = "prefix-one-segment"
why = "the baseline: the namespace's text, then `::`"
namespace = ["SUP"]
prefix = "SUP::"

[[prefix]]
name = "prefix-two-segments"
why = "every segment joined by `::`, and one `::` after the last"
namespace = ["sup", "m2"]
prefix = "sup::m2::"

[[prefix]]
name = "prefix-eight-segments"
why = "no limit on the number of segments"
namespace = ["a", "b", "c", "d", "e", "f", "g", "h"]
prefix = "a::b::c::d::e::f::g::h::"

[[prefix]]
name = "prefix-a-segment-of-every-segment-character"
why = "every ASCII letter, every ASCII digit, `_` and `-`, in one segment"
namespace = ["ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"]
prefix = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-::"

[[prefix]]
name = "prefix-a-plain-id"
why = "a plain id joins the namespace as its local id"
namespace = ["SUP"]
prefix = "SUP::"
id = "REQ_1"
prefixed = "SUP::REQ_1"
inside = true

[[prefix]]
name = "prefix-a-namespaced-id"
why = "an id's own namespace goes under the given one: `SUP::nc::REQ_1` is in `SUP::nc`"
namespace = ["SUP"]
prefix = "SUP::"
id = "nc::REQ_1"
prefixed = "SUP::nc::REQ_1"
inside = true

[[prefix]]
name = "prefix-an-id-ending-in-a-colon"
why = "a trailing single colon makes no `::`: `SUP::X:` joins"
namespace = ["SUP"]
prefix = "SUP::"
id = "X:"
prefixed = "SUP::X:"
inside = true

[[prefix]]
name = "prefix-an-id-holding-a-dot"
why = "the local id is unrestricted: a `.` is kept and the id joins"
namespace = ["SUP"]
prefix = "SUP::"
id = "REQ_1.p1"
prefixed = "SUP::REQ_1.p1"
inside = true

[[prefix]]
name = "prefix-an-id-with-an-empty-segment"
why = "`a::::b` does not split cleanly, so `SUP::a::::b` is a plain id, outside `SUP`"
namespace = ["SUP"]
prefix = "SUP::"
id = "a::::b"
prefixed = "SUP::a::::b"
inside = false

[[prefix]]
name = "prefix-an-id-starting-with-a-colon"
why = "`SUP:::X` splits at its last `::`, leaving the head `SUP:`: a plain id, outside `SUP`"
namespace = ["SUP"]
prefix = "SUP::"
id = ":X"
prefixed = "SUP:::X"
inside = false

[[prefix]]
name = "prefix-the-empty-id"
why = "the prefix alone, `SUP::`, has nothing after its `::`: a plain id, outside `SUP`"
namespace = ["SUP"]
prefix = "SUP::"
id = ""
prefixed = "SUP::"
inside = false

[[prefix]]
name = "prefix-an-id-ending-in-the-separator"
why = "`nc::` does not split cleanly, so `SUP::nc::` is a plain id, outside `SUP`"
namespace = ["SUP"]
prefix = "SUP::"
id = "nc::"
prefixed = "SUP::nc::"
inside = false

[[prefix]]
name = "prefix-a-cpp-name"
why = "a C++ name does not split cleanly, so the prefixed text is a plain id, outside `SUP`"
namespace = ["SUP"]
prefix = "SUP::"
id = "std::vector<int>::size"
prefixed = "SUP::std::vector<int>::size"
inside = false

[[prefix]]
name = "prefix-a-plain-id-under-two-segments"
why = "a plain id joins a two-segment namespace"
namespace = ["sup", "m2"]
prefix = "sup::m2::"
id = "REQ_1"
prefixed = "sup::m2::REQ_1"
inside = true

[[prefix]]
name = "prefix-a-namespaced-id-under-two-segments"
why = "`nc::REQ_1` under `sup::m2` is in `sup::m2::nc`"
namespace = ["sup", "m2"]
prefix = "sup::m2::"
id = "nc::REQ_1"
prefixed = "sup::m2::nc::REQ_1"
inside = true

[[prefix]]
name = "prefix-an-empty-segment"
why = "an empty segment is not a segment: `::` alone is not a prefix"
namespace = [""]
invalid = true

[[prefix]]
name = "prefix-a-segment-holding-the-separator"
why = "a namespace's TEXT is not a segment: `a::b` must be given as two segments"
namespace = ["a::b"]
invalid = true

[[prefix]]
name = "prefix-a-segment-with-a-space"
why = "a space is not a segment character"
namespace = ["my ns"]
invalid = true

[[prefix]]
name = "prefix-a-segment-with-a-dot"
why = "a `.` is not a segment character"
namespace = ["nc.m2"]
invalid = true

[[prefix]]
name = "prefix-a-segment-of-a-non-ascii-letter"
why = "a non-ASCII letter is not a segment character"
namespace = ["caf\u00e9"]
invalid = true

[[prefix]]
name = "prefix-a-segment-ending-in-a-line-feed"
why = "a trailing line feed is a bad character, not ignored"
namespace = ["nc\u000a"]
invalid = true
