# Conformance corpus for the GRAMMAR OF A NEED ID: how an id splits into a namespace and a
# local id at `::`, how a namespace is parsed from its text, and how a pair is joined back.
#
# Repository of record: useblocks/sphinx-needs (public)
# Canonical path:       packages/ub-needs-exchange/tests/fixtures/need_id_conformance.toml
#
# THIS copy is CANONICAL. ubCode is to vendor it byte-for-byte, with a provenance block
# (this path, and the commit it was taken from) prepended and nothing else changed, and to
# run it against its own implementation of the grammar. The corpus travels public ->
# private, so vendoring with a recorded source commit is the sync mechanism.
#
# Do not reformat this file. `.gitattributes` pins its line endings, and the taplo and
# yamlfmt hooks exclude it: every string below is the INPUT or the expected output of a
# case, so a formatter touching one silently changes what the case tests. A change here is
# a change to the contract, and owes ubCode a re-vendor. The file is pure ASCII: every
# non-ASCII or control character in a case is written as a `\uXXXX` escape, which a TOML
# reader decodes.
#
# The grammar (the prose half is section 14 of `design/exchange-contract.md`):
#   - the separator is the two ASCII characters `::`
#   - a SEGMENT is one or more characters, each an ASCII letter, an ASCII digit, `_` or
#     `-`, in any position; segments are case-sensitive. Nothing else is a segment
#   - a NAMESPACE is zero or more segments; as text, the segments joined by `::`, and the
#     empty namespace is the empty text
#   - SPLITTING an id: find the LAST occurrence of `::`. None: the id is plain (namespace
#     empty, local id = the id, no problem). Otherwise `head` is the text before it and
#     `local` the text after it, and the id is namespaced iff `local` is not empty and
#     `head`, cut at every `::` from the left, gives only segments. The local id is
#     otherwise unrestricted
#   - an id that holds `::` and is not namespaced is a plain id with a PROBLEM, the first
#     of these classes, tested in this order:
#       empty_local       - nothing after the last `::`
#       empty_segment     - `head` is empty, or has an empty piece
#       segment_character - a piece holds a character that is not in a segment
#   - splitting never fails, whatever the text: the empty text is a plain id
#   - this is the grammar of an ID. A link target is not an id: its `[condition]` is
#     stripped and its part split off at the FIRST `.` before its id is split here
#
# Rules for every runner:
#   - strings are compared character for character (Unicode scalar values, after TOML has
#     decoded the escapes); a namespace as the list of its segments, in order
#   - a refusal (`invalid = true`) states only that the operation is refused; its message
#     is not compared
#   - every case name is unique across the whole file, kebab-case, and starts with its
#     table's name; every `why` is one line
#   - no case carries `divergent` (as the reading corpus's may): this grammar has one
#     answer, and an implementation passes a case or does not
#   - the prefix of a namespace `ns` that the prefix accepts obeys two laws for every text
#     `x`, with `(xns, xlocal)` the split of `x`: where join(ns + xns, xlocal) is accepted,
#     it equals prefix(ns) + x; where it is refused (`ns` is then not empty),
#     prefix(ns) + x is a plain id -- it splits to the empty namespace, with a problem
#
# `packages/ub-needs-exchange/tests/test_need_id_conformance.py` runs every case against
# the Python module `ub_needs_exchange.need_id`, holds the module to two laws over every
# text the corpus holds (join(split(x)) == x; split(join(ns, local)) == (ns, local) where
# join accepts the pair -- for the empty namespace, where `local` does not itself split),
# holds its `namespace_prefix` to the prefix's two laws over every text and every
# namespace the corpus holds, and asserts the COUNT of each table, so a truncated copy is
# a red test rather than reduced coverage.
#
# Four tables. Each case has a `name` and a `why` (one line saying what the case pins),
# and:
#
# [[split]] - splitting an id
#   id         - the id
#   then EITHER
#   namespace  - the segments, in order (`[]` for a plain id)
#   local      - the local id
#   OR
#   problem    - the class of an id that holds `::` and does not split cleanly; its split
#                is then the empty namespace and the id itself
#
# [[namespace]] - parsing a namespace from its text (cut at every `::`)
#   text       - the namespace as text
#   then EITHER
#   segments   - the segments, in order (`[]` for the empty text)
#   OR
#   invalid    - true: a piece is not a segment, and parsing is refused
#
# [[join]] - joining a namespace and a local id into an id
#   namespace  - the segments
#   local      - the local id
#   then EITHER
#   id         - the id. The empty namespace gives `local` unchanged, whatever it holds
#   OR
#   invalid    - true: with a non-empty namespace, a segment is not a segment, or `local`
#                is empty, holds `::`, or starts with `:` (it would not split back)
#
# [[prefix]] - the prefix of a namespace: the text that, put before an id, joins the id
#              to the namespace
#   namespace  - the segments
#   then EITHER
#   prefix     - the text: the namespace's text followed by `::`, and `""` for the empty
#                namespace
#   and, in a case that also puts the prefix before an id (only with a non-empty
#   namespace):
#   id         - the id
#   prefixed   - `prefix` followed by `id`, character for character
#   inside     - true when `prefixed` splits into a namespace that starts with the given
#                segments; false when it is a plain id (an id that could not be joined)
#   OR
#   invalid    - true: a segment is not a segment, and the prefix is refused

