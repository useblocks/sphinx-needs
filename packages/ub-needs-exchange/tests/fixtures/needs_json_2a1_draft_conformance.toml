records = { A = { docname = "index" } }
source = { A = [{ kind = "page", document = "index" }] }

[[case]]
name = "a-hop-with-a-known-key-of-the-wrong-type-is-dropped"
why = "a hop whose origin, document, language, physical or semantic is of the wrong type, null included, is reported and dropped"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": "1.0"}, "needs": [{"id": "A", "type": "req", "source": [{"kind": "page", "origin": null}, {"kind": "page", "document": 1}, {"kind": "page", "language": [".rst"]}, {"kind": "page", "physical": "index.rst"}, {"kind": "page", "semantic": {"kind": "section", "name": "S"}}, {"kind": "file"}]}]}'''
[case.expect]
diagnostics = [{ code = "hop_invalid", path = "needs.0.source.0" }, { code = "hop_invalid", path = "needs.0.source.1" }, { code = "hop_invalid", path = "needs.0.source.2" }, { code = "hop_invalid", path = "needs.0.source.3" }, { code = "hop_invalid", path = "needs.0.source.4" }]
source = { A = [{ kind = "file" }] }

[[case]]
name = "a-hop-with-an-invalid-physical-is-dropped"
why = "a physical root, path or url that is not a string, a line that is not an integer of 1 or more, or an end line before the start line drops the hop"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": "1.0"}, "needs": [{"id": "A", "type": "req", "source": [{"kind": "file", "physical": {"root": null}}, {"kind": "file", "physical": {"path": 1}}, {"kind": "file", "physical": {"url": false}}, {"kind": "file", "physical": {"start_line": 0}}, {"kind": "file", "physical": {"start_line": 1.0}}, {"kind": "file", "physical": {"end_line": true}}, {"kind": "file", "physical": {"start_line": 5, "end_line": 4}}, {"kind": "file", "physical": {"start_line": 4, "end_line": 4}}, {"kind": "file", "physical": {"end_line": 2}}]}]}'''
[case.expect]
diagnostics = [{ code = "hop_invalid", path = "needs.0.source.0" }, { code = "hop_invalid", path = "needs.0.source.1" }, { code = "hop_invalid", path = "needs.0.source.2" }, { code = "hop_invalid", path = "needs.0.source.3" }, { code = "hop_invalid", path = "needs.0.source.4" }, { code = "hop_invalid", path = "needs.0.source.5" }, { code = "hop_invalid", path = "needs.0.source.6" }]
source = { A = [{ kind = "file", physical = { start_line = 4, end_line = 4 } }, { kind = "file", physical = { end_line = 2 } }] }

[[case]]
name = "a-hop-with-an-invalid-semantic-entry-is-dropped"
why = "a semantic entry that is not an object of a string kind and name, or whose extras is not an object of strings, drops the hop"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": "1.0"}, "needs": [{"id": "A", "type": "req", "source": [{"kind": "page", "semantic": ["S"]}, {"kind": "page", "semantic": [{"kind": "section"}]}, {"kind": "page", "semantic": [{"name": "S"}]}, {"kind": "page", "semantic": [{"kind": "section", "name": 1}]}, {"kind": "page", "semantic": [{"kind": "py:class", "name": "C", "extras": [["id", "C"]]}]}, {"kind": "page", "semantic": [{"kind": "py:class", "name": "C", "extras": {"line": 3}}]}, {"kind": "page", "semantic": []}]}]}'''
[case.expect]
diagnostics = [{ code = "hop_invalid", path = "needs.0.source.0" }, { code = "hop_invalid", path = "needs.0.source.1" }, { code = "hop_invalid", path = "needs.0.source.2" }, { code = "hop_invalid", path = "needs.0.source.3" }, { code = "hop_invalid", path = "needs.0.source.4" }, { code = "hop_invalid", path = "needs.0.source.5" }]
source = { A = [{ kind = "page", semantic = [] }] }

[[case]]
name = "an-invalid-hop-is-not-the-placement"
why = "a dropped hop is not read for the placement: a later invalid hop with a document leaves the docname of the last valid one"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": "1.0"}, "needs": [{"id": "A", "type": "req", "source": [{"kind": "page", "document": "index"}, {"kind": "page", "document": "other", "physical": {"start_line": 0}}]}]}'''
[case.expect]
diagnostics = [{ code = "hop_invalid", path = "needs.0.source.1" }]
records = { A = { docname = "index", sections = [] } }

# --- every finding together ---------------------------------------------------------

[[case]]
name = "every-finding-of-a-draft-is-reported"
why = "the findings about the draft and those about each record are reported together, and every record that can be read is"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": 1}, "needs": [7, {"type": "req"}, {"id": 2}, {"id": "A", "fields": 1, "links": 2, "content": 3, "source": 4}, {"id": "A"}, {"id": "B", "fields": {"id": "X"}, "links": {"links": [null], "tests": "C"}, "source": [{"kind": 1}]}]}'''
[case.expect]
diagnostics = [{ code = "project_invalid", path = "project.version" }, { code = "record_not_object", path = "needs.0" }, { code = "id_missing", path = "needs.1" }, { code = "id_not_string", path = "needs.2.id" }, { code = "fields_not_object", path = "needs.3.fields" }, { code = "links_not_object", path = "needs.3.links" }, { code = "content_not_object", path = "needs.3.content" }, { code = "source_not_a_list", path = "needs.3.source" }, { code = "duplicate_id", path = "needs.4.id" }, { code = "field_reserved", path = "needs.5.fields.id" }, { code = "link_invalid", path = "needs.5.links.links.0" }, { code = "link_invalid", path = "needs.5.links.tests" }, { code = "hop_invalid", path = "needs.5.source.0" }]
name = ""
keys = ["A", "B"]
records = { B = { links = [] } }
