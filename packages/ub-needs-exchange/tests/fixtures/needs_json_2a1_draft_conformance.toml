[case.expect]
diagnostics = []
source = { A = [{ kind = "alm-item" }] }

[[case]]
name = "a-source-that-is-not-an-array-is-not-read"
why = "a source that is not an array is reported, and the record read with no hops"
layer = "document"
json = '''{"format_version": "2a1", "project": {"name": "up", "version": "1.0"}, "needs": [{"id": "A", "type": "req", "source": {"kind": "page", "document": "index"}}]}'''
