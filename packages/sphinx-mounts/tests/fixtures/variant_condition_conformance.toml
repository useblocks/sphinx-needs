# Conformance corpus for the `[[source.variant_sources]]` `if` grammar.
#
# This file is the CONTRACT for the rule-condition grammar, expressed as data so
# that more than one implementation can be held to it. ubCode's Rust tests read
# it directly (`rust/ubc_config/tests/test_variant_sources.rs`); it is plain TOML
# so that a Python suite can read it with `tomllib` and assert the same
# verdicts. That second reader is sphinx-mounts, which reads
# `[[source.variant_sources]]` on the Sphinx side. It is the point of the file: a
# narrowed grammar only removes the "one rule string, two document sets" hazard
# if BOTH engines refuse the same forms, and prose cannot enforce that across two
# repositories on independent release cadences.
#
# Each `[[case]]` has:
#   expr     - the condition, exactly as it would be written in `if = "…"`
#   verdict  - "accept" (a valid rule condition) or "reject" (a config error)
#   value    - for an accepted case, the truth value under `[variant_data]`
#              below; omitted when the case is rejected
#   value    - for an accepted case that cannot be EVALUATED against
#              `[variant_data]` (an unknown key, a type mismatch), use
#              `error = true` instead: the grammar accepts it, the evaluation
#              fails, and the rule's files are excluded
#   why      - one line saying what the case pins
#
# One rule is worth stating up front, because it is the one place this key is
# narrower than the `.. if::` directive for a reason a reader might not guess:
# every field reference must be rooted at `var`. `var.edition` is accepted;
# `edition` and `build_tags` are REJECTED, even though `.. if::` tolerates the
# prefix-less spelling. The reasoning is that a bare name raises NameError in the
# second engine and therefore EXCLUDES there, while it would evaluate here and
# INCLUDE. That is statically knowable, so it is a config error rather than an
# evaluation failure — unlike an unknown `var.*` KEY, which depends on the
# variant data and therefore stays accept-plus-evaluation-error.
#
# DESIGN RULE: a rule condition is evaluated over a `var`-only namespace with no
# builtins. Everything above, and the `why` on every row that cites the second
# engine, rests on it — and both engines implement it. ubCode evaluates the
# parsed condition against the variant data, resolving nothing outside `var`;
# sphinx-mounts interprets the same condition with no namespace object, no
# builtins and no `eval` at all, so the rule holds there by construction rather
# than by convention. The direction is the safe one either way: a form this
# narrowing refuses is a config error on something that might have been fine,
# never a rule that quietly stops gating.
#
# VENDORED COPY: `useblocks/sphinx-mounts` carries this file at
# `tests/fixtures/variant_condition_conformance.toml`, byte-identical to it after
# that copy's own provenance block, which records the ubCode commit it was taken
# from. Its suite runs every `[[case]]` below and asserts the case count, so a
# trimmed vendor is a red test there rather than reduced coverage.
#
# Any change here therefore owes a re-sync pull request there. The hash fence in
# `rust/ubc_config/tests/test_variant_sources.rs` pins this file's digest and its
# case count, and is the reminder: an edit turns it red, and its failure message
# says what the edit owes.
#
# Adding a case is cheap and is the preferred way to pin a grammar question.
# Removing or loosening one should be a deliberate, reviewed act: the fence
# tests re-run every case, so a validator that stops refusing a form turns this
# file red.

# The variant data every accepted case is evaluated against.
[variant_data]
edition = "pro"
count = 2
ratio = 1.5
debug = false
name = "Widget"
tags = ["alpha", "beta"]

[variant_data.build]
debug = true
features = ["core", "net"]

[variant_data.empty]

# --------------------------------------------------------------------------
# Accepted: comparisons
# --------------------------------------------------------------------------

[[case]]
expr = "var.edition == 'pro'"
verdict = "accept"
value = true
why = "the canonical rule shape"

[[case]]
expr = "var.edition != 'pro'"
verdict = "accept"
value = false
why = "inequality is a boolean top level"

[[case]]
expr = "edition == 'pro'"
verdict = "reject"
why = "a prefix-less field name is not in the second engine's namespace, under the DESIGN RULE recorded in the header, so it is unresolvable and EXCLUDES there while evaluating here — one rule string, two document sets. The content `.. if::` directive tolerates it; this key must not, and that difference is the whole point of the narrowing"

[[case]]
expr = "var.count > 1"
verdict = "accept"
value = true
why = "numeric comparison"

[[case]]
expr = "var.count >= 2"
verdict = "accept"
value = true
why = "the boundary of the comparison above"

[[case]]
expr = "var.count < 2"
verdict = "accept"
value = false
why = "the other side of the same boundary"

[[case]]
expr = "var.ratio > 1"
verdict = "accept"
value = true
why = "a float compares against an integer literal"

[[case]]
expr = "var.debug == False"
verdict = "accept"
value = true
why = "the rewrite a bare `var.debug` must be given; the literals are Python-spelled"

[[case]]
expr = "var.build.debug == True"
verdict = "accept"
value = true
why = "nested attribute access"

[[case]]
expr = "var.build.debug == var.debug"
verdict = "accept"
value = false
why = "two fields compared against each other"

