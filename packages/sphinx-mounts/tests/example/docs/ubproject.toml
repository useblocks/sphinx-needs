# Single declarative source of truth for the example project. Both
# Sphinx (via ``sphinx-mounts``) and the ubCode language server read
# this file. After ``bazel build //:all_bundles`` runs once, the
# referenced paths exist and ubCode can resolve cross-references
# against them with no further build step.
"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

[server]
index_on_save = true

# Sphinx-Needs configuration, owned by Sphinx-Needs — not by sphinx-mounts.
# The host ``conf.py`` only points at this file with
# ``needs_from_toml = "ubproject.toml"``; Sphinx-Needs then reads the ``[needs]``
# table (keys are its ``needs_*`` options with the prefix dropped) and ignores
# everything else here, exactly as sphinx-mounts ignores this table. That is the
# shared-``ubproject.toml`` convention in practice: one declarative file, one
# table per tool, no ``conf.py`` evaluation required to read either.
[needs]
id_required = true

# Bazel-generated RST bundle. Source is resolved relative to *this*
# file's directory (docs/), so ``../bazel-bin/bundles/api-foo`` lands
# at ``tests/example/bazel-bin/bundles/api-foo`` regardless of which
# OS or working directory the build is invoked from.
[[source.mounts]]
dir = "../bazel-bin/bundles/api-foo"
mount_at = "_generated/api-foo"
attach_to = "index"
entry_doc = "index"

# Bazel-generated Markdown bundle. No ``attach_to`` / ``entry_doc`` here —
# the host project references this bundle's entry doc by hand from
# ``index.rst``. This shows the two supported wiring styles side-by-side:
# auto-attach (api-foo) and manual reference (api-bar).
# ``myst-parser`` (loaded in conf.py) makes ``.md`` part of ``source_suffix``,
# so the entry doc is ``index.md``.
[[source.mounts]]
dir = "../bazel-bin/bundles/api-bar"
mount_at = "_generated/api-bar"

# ---------------------------------------------------------------------------
# Checked-in "directive showcase" bundles — NOT Bazel-generated. Each folder
# under ``../showcase/`` is a self-contained bundle demonstrating one
# file-referencing directive whose path stays inside the bundle root. They
# are plain files on disk (open the folder to see the directive next to the
# file it references), mounted in place just like the Bazel bundles above.
# Because every reference is bundle-relative, each survives ``path_check``
# (default ``"warn"``) after mounting. Each entry doc is wired into the
# host ``index`` toctree via ``attach_to``.
[[source.mounts]]
dir = "../showcase/literalinclude"
mount_at = "_generated/showcase/literalinclude"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/include"
mount_at = "_generated/showcase/include"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/csv-table"
mount_at = "_generated/showcase/csv-table"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/raw"
mount_at = "_generated/showcase/raw"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/image"
mount_at = "_generated/showcase/image"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/figure"
mount_at = "_generated/showcase/figure"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/graphviz"
mount_at = "_generated/showcase/graphviz"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/uml"
mount_at = "_generated/showcase/uml"
attach_to = "index"

[[source.mounts]]
dir = "../showcase/mermaid"
mount_at = "_generated/showcase/mermaid"
attach_to = "index"

# Sphinx-Needs kitchen sink — the only showcase bundle covering more than one
# directive, because Sphinx-Needs contributes three doc-relative file
# references: the PlantUML ``!include`` shared by ``needuml`` / ``needarch``,
# ``needimport``'s ``needs.json``, and ``needreport``'s ``:template:``. One page
# per directive, each sitting next to the file it reads.
#
# ``exclude`` keeps ``report-template.rst`` out of the doc set. It is Jinja
# *input* for ``needreport``, not a document, but it carries the conventional
# ``.rst`` suffix — so a directory mount would otherwise walk it and publish an
# orphan page of unrendered Jinja. The bundle's other referenced files
# (``.puml``, ``.json``) need no exclude: their suffixes are not in
# ``source_suffix``, so discovery never picks them up.
[[source.mounts]]
dir = "../showcase/needs"
mount_at = "_generated/showcase/needs"
attach_to = "index"
exclude = ["report-template.rst"]

# ---------------------------------------------------------------------------
# Checked-in "release notes" bundle demonstrating FILE-LIST mode (``files``)
# instead of directory mode (``dir``). Only the three files named below are
# mounted; ``../release-notes/notes/2026-q3-draft.rst`` sits in the same tree
# but is left out of the list, so — unlike a ``dir`` mount, which walks the
# whole tree — it is never discovered. Each file's *basename* (minus the
# suffix) becomes the docname tail under ``mount_at``, so the source-side
# ``notes/`` subdirectory is dropped and the notes land at the flat docnames
# ``_generated/release-notes/2026-q1`` / ``…/2026-q2``. ``include`` /
# ``exclude`` / ``gitignore`` do not apply in this mode — the list *is* the
# filter. The entry doc is wired into the host ``index`` toctree via
# ``attach_to``, exactly like the directory mounts above.
[[source.mounts]]
files = [
  "../release-notes/index.rst",
  "../release-notes/notes/2026-q1.rst",
  "../release-notes/notes/2026-q2.rst",
]
mount_at = "_generated/release-notes"
attach_to = "index"

# ---------------------------------------------------------------------------
# Checked-in "fragments" bundle demonstrating ``attach_each``. Unlike the
# release-notes bundle above (file-list mode with a hand-written index.rst
# that toctrees its notes), this is a set of LOOSE files with no index at
# all. ``attach_each = true`` makes ``attach_to`` wire *every* listed file
# into the host ``index`` toctree (in list order) instead of a single entry
# doc — so the fragments need no index to stitch them together and raise no
# orphan warnings. ``attach_each`` is file-list mode only.
[[source.mounts]]
files = ["../fragments/note-one.rst", "../fragments/note-two.rst"]
mount_at = "_generated/fragments"
attach_to = "index"
attach_each = true

# ---------------------------------------------------------------------------
# Warning showcase (all commented out)
# ---------------------------------------------------------------------------
#
# Every warning sphinx-mounts can emit, one commented-out [[mounts]] block
# per warning. Uncomment the [[mounts]] lines of ONE block at a time (keep
# the explanation comments above them) and rebuild to see that warning —
# the blocks above this section are the example's real mounts and stay
# active. See the extension's docs for how to suppress (``suppress_warnings``)
# or escalate (``sphinx-build -W``) these warnings.

# 1. mounts.docname_conflict
#    The mount would shadow a docname already provided by the host project:
#    ../warnings/bundles/conflicts/index.rst collides with the host's own
#    index.rst because this mount has no mount_at (a root mount). The WHOLE
#    mount is skipped — nothing is mounted, so no orphaned docs follow.
# [[source.mounts]]
# dir = "../warnings/bundles/conflicts"

# 2. mounts.missing_path
#    The configured dir does not exist on disk (../warnings/bundles/absent
#    is not checked in). The whole mount is skipped, so a build whose
#    upstream bundle is absent (e.g. CI that has not run the Bazel build
#    yet) can still proceed.
# [[source.mounts]]
# dir = "../warnings/bundles/absent"
# mount_at = "_generated/warnings-absent"

# 3. mounts.unknown_suffix
#    A file-list entry has no extension registered in Sphinx's
#    source_suffix (``.adoc`` is not parsed). The whole mount is skipped;
#    add a parser extension (e.g. myst_parser for ``.md``) or remove the
#    file from the list.
# [[source.mounts]]
# files = ["../warnings/bundles/suffix/notes.adoc"]
# mount_at = "_generated/warnings-suffix"

# 4. mounts.mount_at_occupied
#    strict_mount_at = true, but the host already has a directory at the
#    mount point. Create one first, then uncomment this block and rebuild:
#
#      mkdir _generated/warnings-occupied
#
#    An occupied mount point means the bundle cannot be attached without
#    modifying the host, so the whole mount is skipped. Remove the
#    directory afterwards (``rmdir _generated/warnings-occupied``) so the
#    example stays warning-clean.
# [[source.mounts]]
# dir = "../warnings/bundles/conflicts"
# mount_at = "_generated/warnings-occupied"
# strict_mount_at = true

# 5. mounts.attach_to_missing
#    attach_to names a docname that does not exist in the project, so
#    nothing is wired into a host toctree. This mount is empty
#    (../warnings/bundles/empty holds only non-source files), so the demo
#    shows exactly this warning; a real mount would additionally report its
#    docs as not included in any toctree (toc.not_included) unless the host
#    references them.
# [[source.mounts]]
# dir = "../warnings/bundles/empty"
# mount_at = "_generated/warnings-attached"
# attach_to = "no_such_doc"

# 6. mounts.toctree_index
#    attach_to's toctree_index exceeds the number of toctrees in the
#    attach_to document (the host index has one toctree). The mount is
#    left unwired and its docs are marked as orphans, so exactly this one
#    warning appears — the host project is left completely untouched.
# [[source.mounts]]
# dir = "../warnings/bundles/single"
# mount_at = "_generated/warnings-single"
# attach_to = "index"
# toctree_index = 3

# 7. mounts.path_escape
#    A mounted doc references a file outside its bundle root:
#    ../warnings/bundles/escape/index.rst literalincludes ../secret.txt,
#    which lives in ../warnings/bundles/, not in the escape/ subdir. At the
#    default path_check = "warn" this is a warning; set path_check = "error"
#    on the mount to fail the build instead. attach_to wires the entry doc
#    into the host toctree, so no orphan noise appears.
# [[source.mounts]]
# dir = "../warnings/bundles/escape"
# mount_at = "_generated/warnings-escape"
# attach_to = "index"
