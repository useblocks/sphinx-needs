# Read the Docs configuration for the sphinx-mounts project.
#
# It lives HERE, next to the package, and the mounts RTD project points at it with its
# per-project "Build configuration file" setting (`readthedocs_yaml_path`). The sphinx-needs
# project keeps the repository-root `.readthedocs.yml` and must NOT be repointed: that
# setting applies to every version a project builds, so moving an existing project's config
# path makes every pre-move tag unbuildable.
#
# EVERY PATH BELOW IS RELATIVE TO THE REPOSITORY ROOT, not to this file -- RTD's monorepo
# guide is explicit about it -- which is why they all start `packages/sphinx-mounts/`.
version: 2

build:
  # deliberately no `apt_packages`: these docs load sphinx_design, myst_parser and
  # intersphinx and render no diagrams, so there is no `dot`, `java` or plantuml to
  # install. (sphinx-needs' config installs graphviz and a JDK because its docs do.)
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: packages/sphinx-mounts/docs/conf.py
  builder: html
  # the same strictness the `docs-mounts` poe task and the old repository's docs job used
  fail_on_warning: true

python:
  install:
    - method: pip
      path: packages/sphinx-mounts
      extra_requirements:
        # the MEMBER's extra, not the root's `docs-mounts` pass-through: RTD pip-installs
        # the package directory itself, so the name it resolves is the member's own
        - docs
