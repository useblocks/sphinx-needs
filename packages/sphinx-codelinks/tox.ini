# To use tox, see https://tox.readthedocs.io
# Simply pip or conda install tox
# then run `tox` or `tox -- {pytest args}`
# To run in parallel using `tox -p`

# To rebuild the tox environment, for example when dependencies change, use
# `tox -r`

[tox]
envlist = py312-sphinx8

# There is no `needs` factor: the sphinx-needs version is pinned by the package's own
# `sphinx-needs>=8.5.0,<9`, and pytest runs against whatever that resolves to. The axis
# existed to test older sphinx-needs releases; the tracking policy is now tight, so the
# only sphinx-needs this package claims to work with is the one the floor names.

[testenv]
usedevelop = true

# Two generative sections rather than one, so that `py311-sphinx9` is not generated at all:
# tox answers `provided environments not found in configuration file` for an env no section
# declares.
#
# The sphinx-9 cell starts at 3.12 to ALIGN WITH THE SPHINX-NEEDS WORKSPACE, and for no
# other reason. That workspace expresses the sphinx-9 series as the dependency group
# `sphinx~=9.1; python_version >= '3.12'`, which is empty on 3.11, so no package there is
# tested on 3.11 against sphinx 9 -- and this matrix disappears into that one at import.
#
# It is NOT because sphinx 9 needs 3.12. Sphinx 9.0.x declares `requires-python >=3.11`
# (only 9.1.0 raised it), so under the `sphinx>=9,<10` factor below `py311-sphinx9` would
# resolve, to sphinx 9.0.4, and pass. More than that: 9.0.4 is what a Python 3.11 user of
# this package gets by default, because 9.1 excludes itself for them. That combination is
# therefore deliberately not exercised here -- a gap this repository shares with every
# other package in the workspace, and one to close there, for all of them at once, rather
# than with a row only this matrix has.
[testenv:py{311,312,313,314}-sphinx{7,8}]
deps =
    sphinx7: sphinx>=7.4,<8
    sphinx8: sphinx>=8,<9
dependency_groups = testing
commands = pytest {posargs}

[testenv:py{312,313,314}-sphinx9]
deps = sphinx>=9,<10
dependency_groups = testing
commands = pytest {posargs}

[testenv:docs-{update,clean}]
description = Build documentation with Sphinx
dependency_groups = docs
allowlist_externals = rm
passenv =
    BUILDER
    TERM
commands =
    clean: rm -rf docs/_build/{env:BUILDER:html}
    sphinx-build -nW --keep-going -b {env:BUILDER:html} -T -c docs docs/source docs/_build/{env:BUILDER:html} {posargs}

[testenv:docs-live]
description = Build the documentation and launch browser
deps = sphinx-autobuild
dependency_groups = docs
commands =
    sphinx-autobuild \
        --re-ignore _build/.* \
        --port 0 --open-browser \
        -n -b {posargs:html} -c docs docs/source docs/_build/{posargs:html}

[testenv:mypy]
dependency_groups = mypy
commands = mypy {posargs:.}

[testenv:ruff-check]
skip_install = true
dependency_groups = ruff
commands = ruff check {posargs:--fix}

[testenv:ruff-fmt]
skip_install = true
dependency_groups = ruff
commands = ruff format {posargs}

[testenv:demo]
description = Run the needextend demo (analyse, write, build)
dependency_groups = docs
allowlist_externals = rm
commands =
    rm -rf tests/data/needextend_demo/_build
    rm -rf output/marked_content.json
    rm -rf tests/data/needextend_demo/needextend.rst
    codelinks analyse tests/data/configs/minimum_config.toml
    codelinks write rst output/marked_content.json --outpath tests/data/needextend_demo/needextend.rst
    sphinx-build -nW --keep-going -b html -T -c tests/data/needextend_demo tests/data/needextend_demo tests/data/needextend_demo/_build/html
