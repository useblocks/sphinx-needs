repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: tests/__snapshots__
      - id: trailing-whitespace

  # the rev the sphinx-needs workspace pins, so that "lint-neutral at import" is measured
  # with the same ruff that will lint this package afterwards
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # `ruff-check` rather than the old `ruff` id, which upstream deprecated
      - id: ruff-check
        name: python lint
        args: [--fix]
      - id: ruff-format
        name: python format

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      # lint fetches schemas online at each call, deactivate for now
      # - id: taplo-lint # excluded because json is fetched online and not reachable (503)
