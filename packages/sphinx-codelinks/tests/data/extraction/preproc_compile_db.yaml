# compile_commands.json handling for the libclang engine.
#
# Each case materializes a real compile_commands.json (inline `compile_commands`)
# or points at an explicit `compile_commands_path`, then extracts from a single
# `case.<ext>` source. These exercise the per-file argument resolution the shared
# single-`.cpp`/defines fixtures never touch: DB-provided flags, headers absent
# from a present DB (parsed standalone), translation-unit sources absent from the
# DB (read through an entry that includes them, else skipped), an entry's
# `directory`, and an unreadable explicit DB path (defines fallback).
#
# Two optional keys serve the cases that need more than one file:
# - `files`: further files, by path relative to the case root, written next to
#   `case.<ext>` and never analysed themselves (a DB entry's main file, a header);
# - a `compile_commands` entry's `directory`: relative to the case root, written
#   absolute into the DB (default: the case root itself).

file_in_db_uses_flags_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-DVARIANT_A=1", "-c", "case.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef VARIANT_A
    // @Variant A, IMPL_VAR_A, impl, [REQ]
    #else
    // @Variant B, IMPL_VAR_B, impl, [REQ]
    #endif
  # -DVARIANT_A comes from the DB entry (global defines are empty), so the #ifdef
  # branch is active only because the DB flags were applied: IMPL_ALWAYS, IMPL_VAR_A.

header_absent_from_db_standalone_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: ["HEADER_ON=1"]
  extract: [oneline]
  compile_commands:
    - file: other.cpp
      arguments: ["clang++", "-std=c++17", "-c", "other.cpp"]
  source: |
    #pragma once
    // @Header Base, IMPL_HDR_BASE, impl, [REQ]
    #ifdef HEADER_ON
    // @Header On, IMPL_HDR_ON, impl, [REQ]
    #else
    // @Header Off, IMPL_HDR_OFF, impl, [REQ]
    #endif
  # case.h is not in the (present) DB. A header is never a compile_commands entry,
  # so it is parsed standalone with the global defines: IMPL_HDR_BASE, IMPL_HDR_ON.

tu_source_absent_from_db_skipped_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: other.cpp
      arguments: ["clang++", "-std=c++17", "-c", "other.cpp"]
  source: |
    // @Should Be Skipped, IMPL_SKIP, impl, [REQ]
    void f() {}
  # case.cpp is a translation-unit source absent from the applicable DB, so it is
  # skipped entirely (spec §3.3): no markers extracted.

unreadable_db_path_falls_back_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FALLBACK_ON=1"]
  extract: [oneline]
  compile_commands_path: "missing.json"
  source: |
    // @Base, IMPL_BASE, impl, [REQ]
    #ifdef FALLBACK_ON
    // @Fallback On, IMPL_FALLBACK, impl, [REQ]
    #endif
  # The explicit compile_commands path does not exist, so extraction falls back to
  # the global defines rather than skipping every file: IMPL_BASE, IMPL_FALLBACK.

db_flags_replace_global_defines_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FLAVOR=1", "GLOBAL_ONLY=1"]
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-DFLAVOR=2", "-c", "case.cpp"]
  source: |
    #if FLAVOR == 1
    // @Global flavor, IMPL_GLOBAL_FLAVOR, impl, [REQ]
    #endif
    #if FLAVOR == 2
    // @DB flavor, IMPL_DB_FLAVOR, impl, [REQ]
    #endif
    #ifdef GLOBAL_ONLY
    // @Global only, IMPL_GLOBAL_ONLY, impl, [REQ]
    #endif
  # The file IS in the DB, so its DB flags (-DFLAVOR=2) fully REPLACE the global
  # defines (FLAVOR=1, GLOBAL_ONLY=1) instead of merging. Only FLAVOR==2 is active
  # (IMPL_DB_FLAVOR); IMPL_GLOBAL_FLAVOR (needs FLAVOR==1) and IMPL_GLOBAL_ONLY
  # (GLOBAL_ONLY is not in the DB entry) are both excluded. This discriminates
  # "DB replaces defines" from a merge — a merge would surface IMPL_GLOBAL_ONLY.

malformed_db_falls_back_to_defines_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FALLBACK=1"]
  extract: [oneline]
  compile_commands_raw: "{ this is not valid json"
  source: |
    // @Base, IMPL_BASE, impl, [REQ]
    #ifdef FALLBACK
    // @Fallback, IMPL_FALLBACK, impl, [REQ]
    #endif
  # The compile_commands.json is present but MALFORMED. Extraction must warn and
  # fall back to the global defines (rather than crash or skip every file), so the
  # #ifdef branch is active via the fallback: IMPL_BASE + IMPL_FALLBACK.

launcher_prefix_uses_db_flags_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["ccache", "clang++", "-std=c++17", "-DVARIANT_A=1", "-c", "case.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef VARIANT_A
    // @Variant A, IMPL_VAR_A, impl, [REQ]
    #else
    // @Variant B, IMPL_VAR_B, impl, [REQ]
    #endif
  # A compiler-launcher prefix (ccache) precedes the real compiler. filter_args
  # must drop BOTH leading tokens so libclang receives a single input; -DVARIANT_A
  # from the DB then activates the #ifdef branch: IMPL_ALWAYS, IMPL_VAR_A. With the
  # launcher bug (dropping only argv[0]) the compiler leaks in as a second input
  # and the TU fails to load, dropping every marker.

tu_source_included_by_db_entry_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #define FROM_UNITY 1
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef UNITY_FLAG
    // @Unity flag, IMPL_UNITY_FLAG, impl, [REQ]
    #else
    // @No unity flag, IMPL_NO_UNITY_FLAG, impl, [REQ]
    #endif
    #if FROM_UNITY
    // @Unity context, IMPL_UNITY_CONTEXT, impl, [REQ]
    #endif
  # case.cpp has no DB entry, but the entry unity.cpp directly includes it, so it is
  # read through unity.cpp's parse: under that entry's -DUNITY_FLAG and the
  # FROM_UNITY its main file defines before the #include. IMPL_ALWAYS,
  # IMPL_UNITY_FLAG, IMPL_UNITY_CONTEXT; IMPL_NO_UNITY_FLAG is in an arm the
  # inclusion skips, so it is not extracted.

tu_source_included_twice_first_inclusion_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #define PASS 1
      #include "case.cpp"
      #undef PASS
      #define PASS 2
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #if PASS == 1
    // @First pass, IMPL_PASS_ONE, impl, [REQ]
    #else
    // @Second pass, IMPL_PASS_TWO, impl, [REQ]
    #endif
  # unity.cpp includes case.cpp twice, PASS 1 then PASS 2. The arms of case.cpp's
  # FIRST inclusion decide: IMPL_ALWAYS, IMPL_PASS_ONE. Merging the skipped ranges
  # of both inclusions would drop IMPL_PASS_ONE too; the second's alone would give
  # IMPL_PASS_TWO.

tu_source_includer_first_by_path_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    b_unity.cpp: |
      #include "case.cpp"
    a_unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: b_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=2", "-c", "b_unity.cpp"]
    - file: a_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=1", "-c", "a_unity.cpp"]
  source: |
    #if PICK == 1
    // @Picked a, IMPL_PICK_A, impl, [REQ]
    #elif PICK == 2
    // @Picked b, IMPL_PICK_B, impl, [REQ]
    #endif
  # Two entries include case.cpp. The includer is the first by its main file's
  # path, a_unity.cpp, whatever order the DB lists them in: IMPL_PICK_A only.

tu_source_includer_confirmed_by_parse_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    a_unity.cpp: |
      #if 0
      #include "case.cpp"
      #endif
    b_unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: a_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=1", "-c", "a_unity.cpp"]
    - file: b_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=2", "-c", "b_unity.cpp"]
  source: |
    #if PICK == 1
    // @Picked a, IMPL_PICK_A, impl, [REQ]
    #elif PICK == 2
    // @Picked b, IMPL_PICK_B, impl, [REQ]
    #endif
  # a_unity.cpp sorts first and has an #include line naming case.cpp, but in an
  # #if 0 arm: its parse does not confirm the inclusion, so b_unity.cpp, whose
  # parse does, is the includer: IMPL_PICK_B only.

tu_source_included_through_include_dir_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    build/unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      directory: build
      arguments: ["clang++", "-std=c++17", "-I..", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef UNITY_FLAG
    // @Unity flag, IMPL_UNITY_FLAG, impl, [REQ]
    #endif
  # The entry's main file build/unity.cpp includes "case.cpp", which is not next
  # to it: the name resolves through the entry's relative -I.., taken against the
  # entry's directory (build), to case.cpp, which is read through it:
  # IMPL_ALWAYS, IMPL_UNITY_FLAG.

relative_include_dir_resolved_against_entry_directory_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    include/config.h: |
      #define FEATURE_ON 1
  compile_commands:
    - file: ../case.cpp
      directory: build
      arguments: ["clang++", "-std=c++17", "-I../include", "-c", "../case.cpp"]
  source: |
    #include "config.h"
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef FEATURE_ON
    // @Feature on, IMPL_FEATURE_ON, impl, [REQ]
    #endif
  # The entry's directory is build, not the directory the analysis runs in, and
  # its -I../include is relative: it resolves against the entry's directory as the
  # build resolves it, so config.h is found and the arm guarded by its FEATURE_ON is
  # active: IMPL_ALWAYS, IMPL_FEATURE_ON.

tu_source_included_only_through_a_header_is_skipped_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #if 0
      #include "case.cpp"
      #endif
      #include "through.h"
    through.h: |
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Through a header, IMPL_THROUGH_HEADER, impl, [REQ]
    void f() {}
  # unity.cpp's own #include "case.cpp" makes it a lexical candidate, but it is in
  # an #if 0 arm; case.cpp IS compiled in this unit, through the header through.h.
  # Only the candidate's main file's own #include confirms an includer (no
  # transitive includers), so case.cpp has none and is skipped: no markers.
