# compile_commands.json handling for the libclang engine.
#
# Each case materializes a real compile_commands.json (inline `compile_commands`)
# or points at an explicit `compile_commands_path`, then extracts from a single
# `case.<ext>` source. These exercise the per-file argument resolution the shared
# single-`.cpp`/defines fixtures never touch: DB-provided flags, headers absent
# from a present DB (read through the entries that include them, else parsed
# standalone), translation-unit sources absent from the
# DB (read through an entry that includes them, else skipped), an entry's
# `directory`, and an unreadable explicit DB path (defines fallback).
#
# Two optional keys serve the cases that need more than one file:
# - `files`: further files, by path relative to the case root, written next to
#   `case.<ext>` and never analysed themselves (a DB entry's main file, a header);
# - a `compile_commands` entry's `directory`: relative to the case root, written
#   absolute into the DB (default: the case root itself).

file_in_db_uses_flags_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-DVARIANT_A=1", "-c", "case.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef VARIANT_A
    // @Variant A, IMPL_VAR_A, impl, [REQ]
    #else
    // @Variant B, IMPL_VAR_B, impl, [REQ]
    #endif
  # -DVARIANT_A comes from the DB entry (global defines are empty), so the #ifdef
  # branch is active only because the DB flags were applied: IMPL_ALWAYS, IMPL_VAR_A.

header_absent_from_db_standalone_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: ["HEADER_ON=1"]
  extract: [oneline]
  compile_commands:
    - file: other.cpp
      arguments: ["clang++", "-std=c++17", "-c", "other.cpp"]
  source: |
    #pragma once
    // @Header Base, IMPL_HDR_BASE, impl, [REQ]
    #ifdef HEADER_ON
    // @Header On, IMPL_HDR_ON, impl, [REQ]
    #else
    // @Header Off, IMPL_HDR_OFF, impl, [REQ]
    #endif
  # case.h is not in the (present) DB. A header is never a compile_commands entry,
  # and no entry includes this one (other.cpp is not on disk), so it is parsed
  # standalone with the global defines: IMPL_HDR_BASE, IMPL_HDR_ON.

tu_source_absent_from_db_skipped_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: other.cpp
      arguments: ["clang++", "-std=c++17", "-c", "other.cpp"]
  source: |
    // @Should Be Skipped, IMPL_SKIP, impl, [REQ]
    void f() {}
  # case.cpp is a translation-unit source absent from the applicable DB, so it is
  # skipped entirely (spec §3.3): no markers extracted.

unreadable_db_path_falls_back_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FALLBACK_ON=1"]
  extract: [oneline]
  compile_commands_path: "missing.json"
  source: |
    // @Base, IMPL_BASE, impl, [REQ]
    #ifdef FALLBACK_ON
    // @Fallback On, IMPL_FALLBACK, impl, [REQ]
    #endif
  # The explicit compile_commands path does not exist, so extraction falls back to
  # the global defines rather than skipping every file: IMPL_BASE, IMPL_FALLBACK.

db_flags_replace_global_defines_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FLAVOR=1", "GLOBAL_ONLY=1"]
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-DFLAVOR=2", "-c", "case.cpp"]
  source: |
    #if FLAVOR == 1
    // @Global flavor, IMPL_GLOBAL_FLAVOR, impl, [REQ]
    #endif
    #if FLAVOR == 2
    // @DB flavor, IMPL_DB_FLAVOR, impl, [REQ]
    #endif
    #ifdef GLOBAL_ONLY
    // @Global only, IMPL_GLOBAL_ONLY, impl, [REQ]
    #endif
  # The file IS in the DB, so its DB flags (-DFLAVOR=2) fully REPLACE the global
  # defines (FLAVOR=1, GLOBAL_ONLY=1) instead of merging. Only FLAVOR==2 is active
  # (IMPL_DB_FLAVOR); IMPL_GLOBAL_FLAVOR (needs FLAVOR==1) and IMPL_GLOBAL_ONLY
  # (GLOBAL_ONLY is not in the DB entry) are both excluded. This discriminates
  # "DB replaces defines" from a merge — a merge would surface IMPL_GLOBAL_ONLY.

malformed_db_falls_back_to_defines_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: ["FALLBACK=1"]
  extract: [oneline]
  compile_commands_raw: "{ this is not valid json"
  source: |
    // @Base, IMPL_BASE, impl, [REQ]
    #ifdef FALLBACK
    // @Fallback, IMPL_FALLBACK, impl, [REQ]
    #endif
  # The compile_commands.json is present but MALFORMED. Extraction must warn and
  # fall back to the global defines (rather than crash or skip every file), so the
  # #ifdef branch is active via the fallback: IMPL_BASE + IMPL_FALLBACK.

launcher_prefix_uses_db_flags_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["ccache", "clang++", "-std=c++17", "-DVARIANT_A=1", "-c", "case.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef VARIANT_A
    // @Variant A, IMPL_VAR_A, impl, [REQ]
    #else
    // @Variant B, IMPL_VAR_B, impl, [REQ]
    #endif
  # A compiler-launcher prefix (ccache) precedes the real compiler. filter_args
  # must drop BOTH leading tokens so libclang receives a single input; -DVARIANT_A
  # from the DB then activates the #ifdef branch: IMPL_ALWAYS, IMPL_VAR_A. With the
  # launcher bug (dropping only argv[0]) the compiler leaks in as a second input
  # and the TU fails to load, dropping every marker.

tu_source_included_by_db_entry_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #define FROM_UNITY 1
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef UNITY_FLAG
    // @Unity flag, IMPL_UNITY_FLAG, impl, [REQ]
    #else
    // @No unity flag, IMPL_NO_UNITY_FLAG, impl, [REQ]
    #endif
    #if FROM_UNITY
    // @Unity context, IMPL_UNITY_CONTEXT, impl, [REQ]
    #endif
  # case.cpp has no DB entry, but the entry unity.cpp directly includes it, so it is
  # read through unity.cpp's parse: under that entry's -DUNITY_FLAG and the
  # FROM_UNITY its main file defines before the #include. IMPL_ALWAYS,
  # IMPL_UNITY_FLAG, IMPL_UNITY_CONTEXT; IMPL_NO_UNITY_FLAG is in an arm the
  # inclusion skips, so it is not extracted.

tu_source_included_twice_first_inclusion_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #define PASS 1
      #include "case.cpp"
      #undef PASS
      #define PASS 2
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #if PASS == 1
    // @First pass, IMPL_PASS_ONE, impl, [REQ]
    #else
    // @Second pass, IMPL_PASS_TWO, impl, [REQ]
    #endif
  # unity.cpp includes case.cpp twice, PASS 1 then PASS 2. The arms of case.cpp's
  # FIRST inclusion decide: IMPL_ALWAYS, IMPL_PASS_ONE. Merging the skipped ranges
  # of both inclusions would drop IMPL_PASS_ONE too; the second's alone would give
  # IMPL_PASS_TWO.

tu_source_includer_first_by_path_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    b_unity.cpp: |
      #include "case.cpp"
    a_unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: b_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=2", "-c", "b_unity.cpp"]
    - file: a_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=1", "-c", "a_unity.cpp"]
  source: |
    #if PICK == 1
    // @Picked a, IMPL_PICK_A, impl, [REQ]
    #elif PICK == 2
    // @Picked b, IMPL_PICK_B, impl, [REQ]
    #endif
  # Two entries include case.cpp. The includer is the first by its main file's
  # path, a_unity.cpp, whatever order the DB lists them in: IMPL_PICK_A only.

tu_source_includer_confirmed_by_parse_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    a_unity.cpp: |
      #if 0
      #include "case.cpp"
      #endif
    b_unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: a_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=1", "-c", "a_unity.cpp"]
    - file: b_unity.cpp
      arguments: ["clang++", "-std=c++17", "-DPICK=2", "-c", "b_unity.cpp"]
  source: |
    #if PICK == 1
    // @Picked a, IMPL_PICK_A, impl, [REQ]
    #elif PICK == 2
    // @Picked b, IMPL_PICK_B, impl, [REQ]
    #endif
  # a_unity.cpp sorts first and has an #include line naming case.cpp, but in an
  # #if 0 arm: its parse does not confirm the inclusion, so b_unity.cpp, whose
  # parse does, is the includer: IMPL_PICK_B only.

tu_source_included_through_include_dir_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    build/unity.cpp: |
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      directory: build
      arguments: ["clang++", "-std=c++17", "-I..", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef UNITY_FLAG
    // @Unity flag, IMPL_UNITY_FLAG, impl, [REQ]
    #endif
  # The entry's main file build/unity.cpp includes "case.cpp", which is not next
  # to it: the name resolves through the entry's relative -I.., taken against the
  # entry's directory (build), to case.cpp, which is read through it:
  # IMPL_ALWAYS, IMPL_UNITY_FLAG.

relative_include_dir_resolved_against_entry_directory_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    include/config.h: |
      #define FEATURE_ON 1
  compile_commands:
    - file: ../case.cpp
      directory: build
      arguments: ["clang++", "-std=c++17", "-I../include", "-c", "../case.cpp"]
  source: |
    #include "config.h"
    // @Always, IMPL_ALWAYS, impl, [REQ]
    #ifdef FEATURE_ON
    // @Feature on, IMPL_FEATURE_ON, impl, [REQ]
    #endif
  # The entry's directory is build, not the directory the analysis runs in, and
  # its -I../include is relative: it resolves against the entry's directory as the
  # build resolves it, so config.h is found and the arm guarded by its FEATURE_ON is
  # active: IMPL_ALWAYS, IMPL_FEATURE_ON.

tu_source_included_only_through_a_header_is_skipped_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    unity.cpp: |
      #if 0
      #include "case.cpp"
      #endif
      #include "through.h"
    through.h: |
      #include "case.cpp"
  compile_commands:
    - file: unity.cpp
      arguments: ["clang++", "-std=c++17", "-DUNITY_FLAG=1", "-c", "unity.cpp"]
  source: |
    // @Through a header, IMPL_THROUGH_HEADER, impl, [REQ]
    void f() {}
  # unity.cpp's own #include "case.cpp" makes it a lexical candidate, but it is in
  # an #if 0 arm; case.cpp IS compiled in this unit, through the header through.h.
  # Only the candidate's main file's own #include confirms an includer (no
  # transitive includers), so case.cpp has none and is skipped: no markers.

builtin_headers_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["clang", "-std=c11", "-nostdlibinc", "-c", "case.c"]
  source: |
    #include <stdint.h>
    #include <stdbool.h>

    // @Always, IMPL_BH_ALWAYS, impl, [REQ]
    int always(void);

    #if UINT32_MAX > 0xFFFFu
    // @Wide counter, IMPL_BH_WIDE, impl, [REQ]
    int wide(void);
    #else
    // @Narrow counter, IMPL_BH_NARROW, impl, [REQ]
    int narrow(void);
    #endif

    #if __has_include(<stdatomic.h>)
    // @Atomic counter, IMPL_BH_ATOMIC, impl, [REQ]
    int atomic_counter(void);
    #else
    // @Locked counter, IMPL_BH_LOCKED, impl, [REQ]
    int locked_counter(void);
    #endif

    #if defined(bool) && defined(__bool_true_false_are_defined)
    // @C bool flags, IMPL_BH_BOOL, impl, [REQ]
    bool flag(void);
    #else
    // @int flags, IMPL_BH_INT, impl, [REQ]
    int flag(void);
    #endif
  # The arms test what clang's builtin headers define. -nostdlibinc leaves the
  # builtin headers as the only system headers on every host, as on a bare-metal
  # target, so <stdint.h> and <stdbool.h> come from them, and __has_include sees
  # their <stdatomic.h>: IMPL_BH_ALWAYS, IMPL_BH_WIDE, IMPL_BH_ATOMIC, IMPL_BH_BOOL.
  # A parse without the builtin headers takes all three #else arms instead.

builtin_headers_entry_nostdinc_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["clang", "-std=c11", "-nostdinc", "-c", "case.c"]
  source: |
    #include <stdint.h>

    #if UINT32_MAX > 0xFFFFu
    // @Wide counter, IMPL_BH_NOSTDINC_WIDE, impl, [REQ]
    int wide(void);
    #else
    // @Narrow counter, IMPL_BH_NOSTDINC_NARROW, impl, [REQ]
    int narrow(void);
    #endif

    #if __has_include(<stdatomic.h>)
    // @Atomic counter, IMPL_BH_NOSTDINC_ATOMIC, impl, [REQ]
    int atomic_counter(void);
    #else
    // @Locked counter, IMPL_BH_NOSTDINC_LOCKED, impl, [REQ]
    int locked_counter(void);
    #endif
  # An entry with -nostdinc (likewise -nobuiltininc or its own -resource-dir) chooses
  # its builtin headers itself, and the engine adds none: <stdint.h> is not found,
  # UINT32_MAX is undefined and <stdatomic.h> is not there, so both #else arms are
  # active, as for the compiler: IMPL_BH_NOSTDINC_NARROW, IMPL_BH_NOSTDINC_LOCKED.

options_terminator_in_entry_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-DVARIANT_A=1", "-c", "--", "case.cpp"]
  source: |
    // @Always, IMPL_DD_ALWAYS, impl, [REQ]
    #ifdef VARIANT_A
    // @Variant A, IMPL_DD_VAR_A, impl, [REQ]
    #else
    // @Variant B, IMPL_DD_VAR_B, impl, [REQ]
    #endif
    #if 0
    // @Disabled, IMPL_DD_DISABLED, impl, [REQ]
    #else
    // @Enabled, IMPL_DD_ENABLED, impl, [REQ]
    #endif
  # The entry ends its options with `--` before its input, as CMake and some
  # generators write it. Everything after a `--` is an input, so the arguments the
  # engine adds after the entry's own must not land behind it: IMPL_DD_ALWAYS,
  # IMPL_DD_VAR_A, IMPL_DD_ENABLED. Read as an input, the request for the
  # preprocessing record is lost, no arm is known to be skipped, and the markers of
  # every arm are extracted.

double_dash_value_of_pass_through_option_libclang:
  lang: cpp
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.cpp
      arguments: ["clang++", "-std=c++17", "-Xlinker", "--", "-DFEATURE", "-c", "case.cpp"]
  source: |
    // @Always, IMPL_XL_ALWAYS, impl, [REQ]
    #ifdef FEATURE
    // @Feature on, IMPL_XL_ON, impl, [REQ]
    #endif
    #ifndef FEATURE
    // @Feature off, IMPL_XL_OFF, impl, [REQ]
    #endif
  # The `--` is the value of -Xlinker, handed to the linker: it does not end the
  # options, and the compiler reads the -DFEATURE after it as an option:
  # IMPL_XL_ALWAYS, IMPL_XL_ON. Taken as the end of the options, -DFEATURE would be
  # an input and IMPL_XL_OFF extracted instead.

# A header is read through every entry that includes it (useblocks/ubcode#4866): each
# entry of the database whose own parse includes the header, at any depth, is a unit;
# an arm of the header is left out only when EVERY such unit skips it in the header's
# first inclusion (the union of the arms they compile). A unit that enters the header
# again and compiles some of it then (no include guard, or an #ifndef whose macro
# nothing defines), one whose target is unknown and one whose every parse is refused
# read it as written: no arm left out. A header no entry includes keeps its standalone
# read with the defines (above).

header_read_through_every_includer_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    a.c: |
      #include "case.h"
    b.c: |
      #define LEVEL 3
      #include "case.h"
  compile_commands:
    - file: a.c
      arguments: ["clang", "--target=arm-none-eabi", "-DFEATURE_A", "-c", "a.c"]
    - file: b.c
      arguments: ["clang", "--target=x86_64-pc-linux-gnu", "-c", "b.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H1_BASE, impl, [REQ]
    #if defined(__x86_64__)
    // @Header x86, IMPL_H1_X86, impl, [REQ]
    #elif defined(__arm__)
    // @Header Arm, IMPL_H1_ARM, impl, [REQ]
    #endif
    #ifdef FEATURE_A
    // @Header A, IMPL_H1_A, impl, [REQ]
    #endif
    #if LEVEL >= 3
    // @Header Level, IMPL_H1_LEVEL, impl, [REQ]
    #endif
    #ifdef NEVER_SET
    // @Header Never, IMPL_H1_NEVER, impl, [REQ]
    #endif
  # a.c (arm, FEATURE_A) and b.c (x86_64, LEVEL defined before its #include) both
  # include case.h: every arm one of them compiles is kept, and only the arm neither
  # compiles is left out: IMPL_H1_BASE, IMPL_H1_X86, IMPL_H1_ARM, IMPL_H1_A,
  # IMPL_H1_LEVEL; not IMPL_H1_NEVER.

header_define_before_include_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #define LEVEL 3
      #include "case.h"
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H2_BASE, impl, [REQ]
    #if LEVEL >= 3
    // @Header Level, IMPL_H2_LEVEL, impl, [REQ]
    #else
    // @Header Low, IMPL_H2_LOW, impl, [REQ]
    #endif
  # main.c defines LEVEL before it includes case.h, which no flag says: read in the
  # unit, the header takes it: IMPL_H2_BASE, IMPL_H2_LEVEL.

header_reached_through_another_header_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #include "mid.h"
    mid.h: |
      #pragma once
      #include "case.h"
  compile_commands:
    - file: main.c
      arguments: ["clang", "-DFEATURE_A", "-c", "main.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H3_BASE, impl, [REQ]
    #ifdef FEATURE_A
    // @Header A, IMPL_H3_A, impl, [REQ]
    #else
    // @Header Not A, IMPL_H3_NOT_A, impl, [REQ]
    #endif
  # main.c includes case.h only through mid.h: the unit includes it all the same,
  # with -DFEATURE_A: IMPL_H3_BASE, IMPL_H3_A.

header_included_through_a_macro_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #define HEADER "case.h"
      #include HEADER
  compile_commands:
    - file: main.c
      arguments: ["clang", "-DFEATURE_A", "-c", "main.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H4_BASE, impl, [REQ]
    #ifdef FEATURE_A
    // @Header A, IMPL_H4_A, impl, [REQ]
    #else
    // @Header Not A, IMPL_H4_NOT_A, impl, [REQ]
    #endif
  # main.c names case.h through a macro, which no #include line spells: the unit's own
  # parse includes it: IMPL_H4_BASE, IMPL_H4_A.

header_guarded_and_entered_again_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #include "case.h"
    other.h: |
      #ifndef OTHER_H
      #define OTHER_H
      #include "case.h"
      #endif
  compile_commands:
    - file: main.c
      arguments: ["clang", "-DFEATURE_A", "-c", "main.c"]
  source: |
    #ifndef CASE_H
    #define CASE_H
    #include "other.h"
    // @Header Base, IMPL_H5_BASE, impl, [REQ]
    #ifdef FEATURE_A
    // @Header A, IMPL_H5_A, impl, [REQ]
    #endif
    #ifdef NEVER_SET
    // @Header Never, IMPL_H5_NEVER, impl, [REQ]
    #endif
    #endif
  # case.h is guarded and includes other.h, which includes it back: the second entry
  # skips its whole body, which the first compiled. The first inclusion decides:
  # IMPL_H5_BASE, IMPL_H5_A; not IMPL_H5_NEVER.

header_included_twice_unguarded_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #define PASS 1
      #include "case.h"
      #undef PASS
      #define PASS 2
      #include "case.h"
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    // @Header Base, IMPL_H6_BASE, impl, [REQ]
    #if PASS == 1
    // @First pass, IMPL_H6_ONE, impl, [REQ]
    #elif PASS == 2
    // @Second pass, IMPL_H6_TWO, impl, [REQ]
    #endif
    #ifdef NEVER_SET
    // @Header Never, IMPL_H6_NEVER, impl, [REQ]
    #endif
  # case.h has no include guard and main.c includes it twice (an X-macro header): each
  # inclusion compiles other arms, so this unit reads it as written: IMPL_H6_BASE,
  # IMPL_H6_ONE, IMPL_H6_TWO, IMPL_H6_NEVER.

header_of_an_unknown_target_entry_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #include "case.h"
  compile_commands:
    - file: main.c
      arguments: ["xtensa-esp32-elf-gcc", "-DFEATURE_A", "-c", "main.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H7_BASE, impl, [REQ]
    int h7_base;
    #ifdef __XTENSA__
    // @Header Xtensa, IMPL_H7_XTENSA, impl, [REQ]
    int h7_xtensa;
    #else
    // @Header Not Xtensa, IMPL_H7_NOT_XTENSA, impl, [REQ]
    int h7_not_xtensa;
    #endif
    #ifdef FEATURE_A
    // @Header A, IMPL_H7_A, impl, [REQ]
    int h7_a;
    #endif
  # The only entry that includes case.h is built for xtensa, which the pinned libclang
  # does not model: its target is unknown, so the header is read as written, every arm
  # kept, without libclang (each marker on the declaration below it): IMPL_H7_BASE,
  # IMPL_H7_XTENSA, IMPL_H7_NOT_XTENSA, IMPL_H7_A.

header_in_a_target_arm_of_an_unknown_target_entry_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #ifdef __XTENSA__
      #include "case.h"
      #endif
  compile_commands:
    - file: main.c
      arguments: ["xtensa-esp32-elf-gcc", "-c", "main.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H8_BASE, impl, [REQ]
    int h8_base;
    #ifdef __XTENSA__
    // @Header Xtensa, IMPL_H8_XTENSA, impl, [REQ]
    int h8_xtensa;
    #else
    // @Header Not Xtensa, IMPL_H8_NOT_XTENSA, impl, [REQ]
    int h8_not_xtensa;
    #endif
  # main.c includes case.h only in an arm of its target, which no parse ubc can make
  # takes: its #include lines count, and the header is read as written without libclang
  # (each marker on the declaration below it): IMPL_H8_BASE, IMPL_H8_XTENSA,
  # IMPL_H8_NOT_XTENSA.

header_named_through_two_include_directories_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    build/a.c: |
      #include "case.h"
    src/b.c: |
      #include <case.h>
  compile_commands:
    - file: a.c
      directory: build
      arguments: ["clang", "-I..", "-DFEATURE_A", "-c", "a.c"]
    - file: src/b.c
      arguments: ["clang", "-I.", "-DLEVEL=3", "-c", "src/b.c"]
  source: |
    #pragma once
    // @Header Base, IMPL_H9_BASE, impl, [REQ]
    #ifdef FEATURE_A
    // @Header A, IMPL_H9_A, impl, [REQ]
    #endif
    #if LEVEL >= 3
    // @Header Level, IMPL_H9_LEVEL, impl, [REQ]
    #endif
    #ifdef NEVER_SET
    // @Header Never, IMPL_H9_NEVER, impl, [REQ]
    #endif
  # build/a.c finds case.h through -I.. from build, src/b.c through -I. from the case
  # root: two spellings of one file, both units count: IMPL_H9_BASE, IMPL_H9_A,
  # IMPL_H9_LEVEL; not IMPL_H9_NEVER.

header_wrapped_in_an_ifndef_nothing_defines_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      #define PASS 1
      #include "case.h"
      #undef PASS
      #define PASS 2
      #include "case.h"
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    #ifndef CASE_DISABLED
    // @Header Base, IMPL_H10_BASE, impl, [REQ]
    #if PASS == 1
    // @First pass, IMPL_H10_ONE, impl, [REQ]
    #elif PASS == 2
    // @Second pass, IMPL_H10_TWO, impl, [REQ]
    #endif
    #ifdef NEVER_SET
    // @Header Never, IMPL_H10_NEVER, impl, [REQ]
    #endif
    #endif
  # case.h is wrapped in an #ifndef whose macro nothing defines, which clang calls an
  # include guard all the same; main.c enters it twice, and the second entry compiles
  # the arm the first skipped: what decides is whether a later entry compiles some of
  # the file, so this unit reads it as written: IMPL_H10_BASE, IMPL_H10_ONE,
  # IMPL_H10_TWO, IMPL_H10_NEVER.

header_no_entry_includes_reads_undecided_arms_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      int main(void) { return 0; }
  compile_commands:
    - file: main.c
      arguments: ["arm-none-eabi-gcc", "-DCONFIG_X=1", "-c", "main.c"]
  source: |
    #pragma once
    // @Orphan Base, IMPL_O1_BASE, impl, [REQ]
    #ifdef CONFIG_X
    // @Orphan Config X, IMPL_O1_X, impl, [REQ]
    #endif
    #if defined(__arm__)
    // @Orphan Arm, IMPL_O1_ARM, impl, [REQ]
    #endif
  # No entry includes case.h, so it is read with the [preprocessor] table, which states
  # neither CONFIG_X (the entry's -D) nor a target (the entry's arm-none-eabi): neither
  # condition is decided, so both arms are read as written rather than left out
  # (useblocks/ubcode#4866, slice 2): IMPL_O1_BASE, IMPL_O1_X, IMPL_O1_ARM.

header_no_entry_includes_cuts_a_chain_at_its_undecided_arm_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  files:
    main.c: |
      int main(void) { return 0; }
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    #pragma once
    #if 0
    // @Orphan Zero, IMPL_O2_ZERO, impl, [REQ]
    #elif defined(UNSTATED)
    // @Orphan Unstated, IMPL_O2_UNSTATED, impl, [REQ]
    #else
    // @Orphan Else, IMPL_O2_ELSE, impl, [REQ]
    #endif
  # No entry includes case.h. Its parse skips the #if 0 and #elif arms in one range;
  # the #if 0 arm is decided (a constant) and stays left out, the range is cut before
  # the #elif, whose UNSTATED nothing states, and that arm and every later one of the
  # chain are read: IMPL_O2_UNSTATED, IMPL_O2_ELSE.

header_no_entry_includes_own_define_decides_nothing_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: ["STATED=1"]
  extract: [oneline]
  files:
    main.c: |
      int main(void) { return 0; }
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    #pragma once
    #define LOCAL 0
    #if LOCAL
    // @Orphan Local On, IMPL_O3_LOCAL_ON, impl, [REQ]
    #else
    // @Orphan Local Off, IMPL_O3_LOCAL_OFF, impl, [REQ]
    #endif
    #if STATED
    // @Orphan Stated On, IMPL_O3_STATED_ON, impl, [REQ]
    #else
    // @Orphan Stated Off, IMPL_O3_STATED_OFF, impl, [REQ]
    #endif
  # No entry includes case.h. LOCAL is the header's own #define, which decides nothing
  # (a condition may read it before or after the definition), so both of its arms are
  # read; STATED is stated in defines and decides its chain: IMPL_O3_LOCAL_ON,
  # IMPL_O3_LOCAL_OFF, IMPL_O3_STATED_ON.

header_no_entry_includes_stated_target_decides_its_identity_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  target: x86_64-unknown-linux-gnu
  files:
    main.c: |
      int main(void) { return 0; }
  compile_commands:
    - file: main.c
      arguments: ["clang", "-c", "main.c"]
  source: |
    #pragma once
    #if defined(__arm__)
    // @Orphan Arm, IMPL_O4_ARM, impl, [REQ]
    #else
    // @Orphan Not Arm, IMPL_O4_NOT_ARM, impl, [REQ]
    #endif
    #ifdef __ZEPHYR__
    // @Orphan Zephyr, IMPL_O4_ZEPHYR, impl, [REQ]
    #endif
  # No entry includes case.h; the target setting states x86_64-unknown-linux-gnu. That
  # decides __arm__, a macro of the target's identity, so its arm stays left out; a
  # macro a build defines (__ZEPHYR__) is no target's, and its arm is read:
  # IMPL_O4_NOT_ARM, IMPL_O4_ZEPHYR.
