# Need-id references (``need_refs`` in the snapshot).
#
# The marker list comes from ``need_id_markers`` in the config block (the harness
# wires it into NeedIdRefsConfig); the default marker is ``@need-ids:``. These
# cases set ``extract: [need_refs]`` so only reference extraction runs (the
# default one-line start is also ``@``, so running the one-line parser here would
# add unrelated noise). A marker with no id after it is no reference. The whitespace
# that separates ids is each tool's own (Python's ``str.split``, Rust's
# ``char::is_whitespace``), which differ on U+001C to U+001F: a documented non-goal,
# with no shared case.

default_marker:
  # Default ``@need-ids:`` marker -> three need_refs (REQ_1, REQ_2, REQ_3).
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    // @need-ids: REQ_1, REQ_2, REQ_3
    void f() {}

custom_marker:
  # Custom marker ``REFS:`` via need_id_markers -> two need_refs (REQ_A, REQ_B).
  lang: cpp
  config:
    need_id_markers: ["REFS:"]
  extract: [need_refs]
  source: |
    // REFS: REQ_A, REQ_B
    void f() {}

default_marker_python:
  # Same default marker, different source language (Python ``#`` comment).
  lang: python
  config: default
  extract: [need_refs]
  source: |
    # @need-ids: REQ_1
    def f():
        pass

every_extractor:
  # All three extractors on, as in a src-trace build: a line that starts with
  # the need-ids marker is a reference only, never also a one-line need.
  lang: cpp
  config: default
  source: |
    // @need-ids: REQ_1, REQ_2
    void f() {}

block_comment:
  # A reference in a one-line block comment: its closing */ is not an id.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    /* @need-ids: REQ_1, REQ_2 */
    void f() {}

space_separated_ids:
  # Ids separated by whitespace rather than commas.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    // @need-ids: REQ_1 REQ_2
    void f() {}

marker_after_text:
  # The marker need not start the comment; the text before it is not part of
  # the reference, and the line is not a one-line need.
  lang: cpp
  config: default
  source: |
    // see @need-ids: REQ_1
    void f() {}

empty_marker_is_no_reference:
  # No id after the marker: no reference record.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    /* @need-ids: */
    void f() {}

powershell_block_comment:
  # A reference in a one-line PowerShell <# #> comment: its closing #> is not an id.
  lang: powershell
  config: default
  extract: [need_refs]
  source: |
    <# @need-ids: REQ_1, REQ_2 #>
    function f { }

powershell_help_first_in_a_body:
  # A reference in comment-based help first in a function's body documents that
  # function, even when a nested function follows.
  lang: powershell
  config: default
  extract: [need_refs]
  source: |
    function Start-Px {
        <#
        .SYNOPSIS
            Starts the proxy.
        @need-ids: REQ_1, REQ_2
        #>
        function Get-Inner { }
    }

line_comment_ending_in_closer:
  # A line comment that ends in */: the */ is not an id either.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    // @need-ids: REQ_1 */
    void f() {}

# A marker's ids run to the next marker match on the line, or to the end of the line.
# A marker that ends in a word character matches only before a non-word character (or
# the end of the line), and at one index the longest marker wins.

two_markers_one_line:
  # Two markers on one line: each takes the ids up to the next match, so REQ_2 is
  # only ``\verifies``' (and ``\verifies`` is no id of ``\satisfies``).
  lang: cpp
  config:
    need_id_markers: ["\\satisfies", "\\verifies"]
  extract: [need_refs]
  source: |
    /// \satisfies REQ_1 \verifies REQ_2
    void f() {}

same_marker_twice:
  # The same marker twice on one line: both matches yield their references.
  lang: cpp
  config:
    need_id_markers: ["\\satisfies"]
  extract: [need_refs]
  source: |
    /// \satisfies REQ_1 \satisfies REQ_2
    void f() {}

marker_word_boundary:
  # ``\verifies`` does not match ``\verifiesall``: no reference.
  lang: cpp
  config:
    need_id_markers: ["\\verifies"]
  extract: [need_refs]
  source: |
    /// \verifiesall REQ_2
    void f() {}

longest_marker_wins:
  # ``\verifies`` and ``\verifiesall`` both configured: the longer one matches.
  lang: cpp
  config:
    need_id_markers: ["\\verifies", "\\verifiesall"]
  extract: [need_refs]
  source: |
    /// \verifiesall REQ_3
    void f() {}

two_markers_block_comment_end:
  # Two markers in a one-line block comment: the closing */ ends the last ids only.
  lang: cpp
  config:
    need_id_markers: ["\\satisfies", "\\verifies"]
  extract: [need_refs]
  source: |
    /* \satisfies REQ_1 \verifies REQ_2 */
    void f() {}

marker_ends_in_punctuation:
  # ``:`` is not a word character, so an id may follow the marker directly.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    // @need-ids:REQ_1
    void f() {}

longest_marker_wins_at_one_position:
  # ``REFS`` and ``REFS:`` both match at the start of the line (``:`` is not a word
  # character, so ``REFS`` has its boundary): the longer one wins, whatever the order
  # of the configuration, and ``:`` is no id.
  lang: cpp
  config:
    need_id_markers: ["REFS", "REFS:"]
  extract: [need_refs]
  source: |
    // REFS: REQ_A
    void f() {}

other_alphabetic_after_marker:
  # The word characters of the boundary rule are the characters whose Unicode general
  # category is a letter (L*) or a number (N*), and ``_``. U+24D0 (circled small a, So)
  # and U+0345 (a combining mark, Mn) are neither, though Unicode calls both
  # Alphabetic: the marker matches before each, and each is read as an id.
  lang: cpp
  config:
    need_id_markers: ["\\verifies"]
  extract: [need_refs]
  source: "// \\verifies\u24D0 REQ_6\n// \\verifies\u0345 REQ_7\nvoid f() {}\n"

second_match_after_multibyte:
  # Columns count characters, for every match on a line: a multi-byte character inside
  # the first match's id, before the first match, and (U+3000, a whitespace, so no id)
  # between the two matches.
  lang: cpp
  config:
    need_id_markers: ["\\satisfies", "\\verifies"]
  extract: [need_refs]
  source: "// \\satisfies R\u00C9Q_1 \\verifies REQ_2\n// \u00E9 \\satisfies REQ_3 \\verifies REQ_4\n// \\satisfies REQ_5\u3000\\verifies REQ_6\nvoid f() {}\n"

digit_after_marker:
  # A digit is a word character: after a marker that ends in a letter it is the same
  # word, so ``\verifies2`` holds no reference; and before the first match it makes the
  # line no reference line, so the one-line need after the reference on the third line
  # is created, where the second line, starting with the marker, withholds its own.
  lang: cpp
  config:
    need_id_markers: ["\\verifies"]
    start_sequence: "[["
    end_sequence: "]]"
  extract: [oneline, need_refs]
  source: |
    // \verifies2 REQ_1
    // \verifies REQ_2 [[A title, IMPL_1]]
    // 1 \verifies REQ_3 [[B title, IMPL_2]]
    void f() {}
