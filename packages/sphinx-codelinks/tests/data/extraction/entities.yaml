# Which code entity a marker is attached to, pinned against compiler ground truth.
#
# Each case carries a ``truth`` list, one entry per marker id, which
# ``tests/test_entity_truth.py`` checks the case's ``scope`` objects against (the
# extraction harness ignores the key):
#
#   id              the need id, or the first id of a reference
#   outcome         ``exact``: the marker documents an entity the analysis models, bound
#                   and named as the compiler names it; ``fallback``: the entity the
#                   compiler reports is none the analysis models (a macro-generated
#                   function, a data member, a lambda, an out-of-line module file), so
#                   the expected binding is the honest fallback given, the enclosing
#                   entity or the file (``null``); ``none``: by rule, no entity at all
#   entity_kind     the expected ``scope.entity_kind`` (``null``: ``scope`` is ``null``,
#                   unless ``node_kind`` is given)
#   node_kind       (optional) the expected ``scope.kind``, for an entity bound but not
#                   named (``entity_kind`` and ``qualified_name`` both ``null``), or a
#                   VHDL design element no kind fits (``entity_kind`` ``null``, its
#                   name's last component a ``scope``)
#   qualified_name  the expected in-file name: the compiler's name without the module,
#                   crate or package prefix, which the file's path decides
#   start           the expected ``scope.start``: the first line of the definition as
#                   the grammar spans it -- a Rust attribute, a Python decorator, a
#                   decorator on a TypeScript class member and a C++ template header
#                   are outside it; a C# attribute list, a C++ attribute and a
#                   decorator on a TypeScript class are inside it (unless the class is
#                   exported: then the decorator is the export's, outside the class)
#   mechanism       (rule cases) the expected ``scope.mechanism``
#   compiler        where the truth comes from, verbatim: the tool and its output, or
#                   ``syntax-only`` and why no symbol exists
#
# The ``corpus_*`` cases are whole sample files, unchanged. Their truth was measured
# with:
#
#   C++     clang++ 18 -g -c widget.cpp && nm -C -l widget.o
#   Python  CPython 3.13: compile() the module, walk the code objects' co_qualname
#   Rust    RUSTFLAGS="-C symbol-mangling-version=v0" cargo build, nm -C -l on the rlib
#   Go      go 1.24 build, go tool nm; go doc for the types
#   TS      the TypeScript checker's getFullyQualifiedName on each declaration
#   C#      no compiler: syntax-only
#   VHDL    no compiler: syntax-only, by VHDL's expanded names (``pkg.add``)
#
# Rust names follow the compiler's v0 form for trait impls (``<Widget as Shape>::area``)
# and the path form for inherent methods (``Widget::new``); a generic function or impl
# keeps its parameters as written. The ``rule_*`` cases pin one attachment rule each.
#
# The C++ naming cases at the end of the file (inline namespaces, friends, partial
# specialisations, in-file namespace macros) were measured with clang.cindex from the
# libclang 18.1.1 wheel (the root ``codelinks-libclang`` group), each source parsed with
# ``-x c++ -std=c++20``. A function's name is clang's own: the cursor pretty-printed
# (``clang_getCursorPrettyPrinted``) with ``FullyQualifiedName`` and ``TerseOutput``,
# which leaves an inline namespace out unless that is ambiguous; a namespace's or a
# class's is its semantic parents' names and its own, an inline namespace left out. A
# partial specialisation is spelled with its own parameters, its definition's where a
# forward declaration names others (clang's cursor ``P<T, 4>``, where the printed name
# of a member reads ``P<type-parameter-0-0, 4>``),
# and every name is squeezed: no whitespace but one space between two identifier
# characters.

