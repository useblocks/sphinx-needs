  extract: [need_refs]
  source: |
    /// @need-ids: REQ_R_DOC
    void documented() {}
    // @need-ids: REQ_R_LEAD
    void leading() {}
    void trailing() {} // @need-ids: REQ_R_TRAIL
    void enclosing() {
        // @need-ids: REQ_R_ENCL
        int x = 0;
    }
  truth:
    - {id: REQ_R_DOC, outcome: exact, entity_kind: "function", qualified_name: "documented", start: 2, mechanism: doc_comment, compiler: "syntax-only: rule case"}
    - {id: REQ_R_LEAD, outcome: exact, entity_kind: "function", qualified_name: "leading", start: 4, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: REQ_R_TRAIL, outcome: exact, entity_kind: "function", qualified_name: "trailing", start: 5, mechanism: trailing, compiler: "syntax-only: rule case"}
    - {id: REQ_R_ENCL, outcome: exact, entity_kind: "function", qualified_name: "enclosing", start: 6, mechanism: enclosing, compiler: "syntax-only: rule case"}

rule_trailing_after_attribute_rust:
  # A marker after an attribute on its row is not trailing code: the attribute is trivia,
  # so the marker leads the item the attribute belongs to, at the top level, in a module
  # and in an impl.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    #[test] // @After an attribute, IMPL_R_TA_RS_1, impl
    fn t() {}

    #[cfg(test)]
    mod tests {
        #[test] // @After an attribute in a module, IMPL_R_TA_RS_2, impl
        fn t2() {}
    }

    struct W;

    impl W {
        #[inline] // @After an attribute in an impl, IMPL_R_TA_RS_3, impl
        fn f(&self) {}
    }
  truth:
    - {id: IMPL_R_TA_RS_1, outcome: exact, entity_kind: "function", qualified_name: "t", start: 2, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_TA_RS_2, outcome: exact, entity_kind: "function", qualified_name: "tests::t2", start: 7, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_TA_RS_3, outcome: exact, entity_kind: "method", qualified_name: "W::f", start: 14, mechanism: leading, compiler: "syntax-only: rule case"}

rule_trailing_after_decorator_python:
  # A marker after a decorator on its row belongs to the decorated definition, and leads
  # it: the grammar puts the comment inside the decorator, the definition's head.
  lang: python
  config: default
  extract: [oneline, need_refs]
  source: |
    import pytest


    @pytest.mark.parametrize("x", [1, 2])  # @After a decorator, IMPL_R_TD_PY_1, impl
    def test_f(x):
        pass


    class TestA:
        @pytest.mark.slow  # @After a decorator in a class, IMPL_R_TD_PY_2, impl
        def test_m(self):
            pass
  truth:
    - {id: IMPL_R_TD_PY_1, outcome: exact, entity_kind: "function", qualified_name: "test_f", start: 5, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_TD_PY_2, outcome: exact, entity_kind: "method", qualified_name: "TestA.test_m", start: 11, mechanism: leading, compiler: "syntax-only: rule case"}

rule_trailing_after_decorator_ts:
  # A marker after a decorator on its row belongs to the decorated member or class.
  lang: typescript
  config: default
  extract: [oneline, need_refs]
  source: |
    class C {
      @Input() // @After a decorator in a class, IMPL_R_TD_TS_1, impl
      foo(): void {}
    }

    @Injectable() // @After a class decorator, IMPL_R_TD_TS_2, impl
    class Service {}
  truth:
    - {id: IMPL_R_TD_TS_1, outcome: exact, entity_kind: "method", qualified_name: "C.foo", start: 3, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_TD_TS_2, outcome: exact, entity_kind: "class", qualified_name: "Service", start: 6, mechanism: leading, compiler: "syntax-only: rule case"}

rule_trailing_after_template_header_cpp:
  # A marker after a template header on its row leads the templated function.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    template <typename T> // @After a template header, IMPL_R_TT_CPP, impl
    T id(T x) { return x; }
  truth:
    - {id: IMPL_R_TT_CPP, outcome: exact, entity_kind: "function", qualified_name: "id", start: 2, mechanism: leading, compiler: "syntax-only: rule case"}

rule_trailing_after_attribute_csharp:
  # A marker after an attribute list on its row belongs to the attributed method, and
  # leads it: the grammar puts the comment inside the declaration's head.
  lang: csharp
  config: default
  extract: [oneline, need_refs]
  source: |
    class C
    {
        [Test] // @After an attribute, IMPL_R_TA_CS, impl
        public void M() {}
    }
  truth:
    - {id: IMPL_R_TA_CS, outcome: exact, entity_kind: "method", qualified_name: "C.M", start: 3, mechanism: leading, compiler: "syntax-only: rule case"}

rule_doc_comment_header_blank_line_rust:
  # A declared doc comment is exempt from the file-header rule: rustc makes an outer
  # ``///`` an attribute of the next item, blank lines or not.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    /// @Documented across a blank line, IMPL_R_DOC_HDR_RS, impl

    fn f() {}
  truth:
    - {id: IMPL_R_DOC_HDR_RS, outcome: exact, entity_kind: "function", qualified_name: "f", start: 3, mechanism: doc_comment, compiler: "rustc: an outer doc comment is a #[doc] attribute of the next item"}

rule_doc_comment_header_blank_line_cpp:
  # A declared doc comment is exempt from the file-header rule: Doxygen documents the
  # next declaration with a ``/** */`` block, blank lines or not.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /** @Documented across a blank line, IMPL_R_DOC_HDR_CPP, impl */

    void f();
  truth:
    - {id: IMPL_R_DOC_HDR_CPP, outcome: exact, entity_kind: "function", qualified_name: "f", start: 3, mechanism: doc_comment, compiler: "Doxygen: a /** */ block documents the next declaration"}

rule_file_header_ends_in_doc_comment_rust:
  # A plain marker in a header whose last comment is a ``///`` line, then a blank line,
  # is file level: the doc line comment's node takes its line break, so it ends at
  # column 0 of the next row, and the blank line is measured from the row before.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    // @Plain header marker, IMPL_R_HDR_DOC_LAST, impl
    /// Documents f.

    fn f() {}
  truth:
    - {id: IMPL_R_HDR_DOC_LAST, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case"}

rule_rust_block_is_not_entered:
  # Only Python's grammar puts a comment between a header and its body's first
  # statement; in Rust a comment before a function's block is inside the function.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    fn f()
    // @Between the signature and the block, IMPL_R_RS_BLOCK, impl
    {
        fn inner() {}
    }
  truth:
    - {id: IMPL_R_RS_BLOCK, outcome: exact, entity_kind: "function", qualified_name: "f", start: 1, mechanism: enclosing, compiler: "syntax-only: rule case"}

rule_trailing_on_python_def_row:
  # A marker after code on a definition's own row is trailing, though Python's grammar
  # puts it inside the definition.
  lang: python
  config: default
  extract: [oneline, need_refs]
  source: |
    def f():  # @On the def row, IMPL_R_TRAIL_DEF_PY, impl
        pass
  truth:
    - {id: IMPL_R_TRAIL_DEF_PY, outcome: exact, entity_kind: "function", qualified_name: "f", start: 1, mechanism: trailing, compiler: "syntax-only: rule case"}

rule_cpp_function_defining_macro:
  # A macro that defines a function (a test framework's TEST) binds the definition, but
  # the syntax cannot name it: the compiler's function is generated by the macro.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #include <gtest/gtest.h>

    // @Login is rate limited, TEST_R_MACRO_1, test
    TEST(LoginTest, RateLimited) {
        EXPECT_TRUE(true);
    }

    // @Fixture test, TEST_R_MACRO_2, test
    TEST_F(LoginFixture, Locks) {
    }

    // @Boost test case, TEST_R_MACRO_3, test
    BOOST_AUTO_TEST_CASE(rate_limit) {
    }
  truth:
    - {id: TEST_R_MACRO_1, outcome: fallback, node_kind: "function_definition", entity_kind: null, qualified_name: null, start: 4, mechanism: leading, compiler: "clang++ 18 nm -C: LoginTest_RateLimited_Test::TestBody() (macro-generated)"}
    - {id: TEST_R_MACRO_2, outcome: fallback, node_kind: "function_definition", entity_kind: null, qualified_name: null, start: 9, mechanism: leading, compiler: "syntax-only: a fixture test's body, generated like TEST's"}
    - {id: TEST_R_MACRO_3, outcome: fallback, node_kind: "function_definition", entity_kind: null, qualified_name: null, start: 13, mechanism: leading, compiler: "syntax-only: Boost.Test generates the test function"}

rule_cpp_conversion_operator:
  # A conversion operator is a function: declared in its class, defined in it, and
  # defined out of line. Its name keeps the target type as written, up to the
  # conversion's own parameter list (not one inside the target type).
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    class W {
    public:
        // @In-class conversion declaration, IMPL_R_CONV_1, impl
        explicit operator bool() const;
        // @In-class conversion definition, IMPL_R_CONV_2, impl
        operator int() const { return 0; }
        // @Conversion to a pointer, IMPL_R_CONV_4, impl
        operator const char*() const;
        // @Conversion to a reference, IMPL_R_CONV_5, impl
        operator int&();
        // @Conversion to a function wrapper, IMPL_R_CONV_6, impl
        operator std::function<void(int)>() const;
    };
    }

    // @Out-of-line conversion, IMPL_R_CONV_3, impl
    ns::W::operator bool() const { return true; }
    // @Out-of-line conversion to a function wrapper, IMPL_R_CONV_7, impl
    ns::W::operator std::function<void(int)>() const { return {}; }
  truth:
    - {id: IMPL_R_CONV_1, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator bool", start: 5, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator bool() const"}
    - {id: IMPL_R_CONV_2, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator int", start: 7, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator int() const"}
    - {id: IMPL_R_CONV_4, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator const char*", start: 9, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator char const*() const (the target as written: const char*)"}
    - {id: IMPL_R_CONV_5, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator int&", start: 11, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator int&()"}
    - {id: IMPL_R_CONV_6, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator std::function<void(int)>", start: 13, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator std::function<void (int)>() const (the target as written: std::function<void(int)>)"}
    - {id: IMPL_R_CONV_3, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator bool", start: 18, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator bool() const"}
    - {id: IMPL_R_CONV_7, outcome: exact, entity_kind: "operator", qualified_name: "ns::W::operator std::function<void(int)>", start: 20, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::operator std::function<void (int)>() const (the target as written: std::function<void(int)>)"}

rule_cpp_members_under_preprocessor:
  # Class members inside #if / #else are still members: constructor, destructor, method.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    class W {
    public:
    #if defined(DEBUG)
        // @Debug constructor, IMPL_R_PP_1, impl
        W(int level);
        // @Debug destructor, IMPL_R_PP_2, impl
        ~W();
        // @Debug dump, IMPL_R_PP_3, impl
        void dump() const {}
    #else
        // @Release constructor, IMPL_R_PP_4, impl
        W();
    #endif
    };
    }
  truth:
    - {id: IMPL_R_PP_1, outcome: exact, entity_kind: "constructor", qualified_name: "ns::W::W", start: 6, mechanism: leading, compiler: "clang++ 18 -DDEBUG nm -C: ns::W::W(int)"}
    - {id: IMPL_R_PP_2, outcome: exact, entity_kind: "destructor", qualified_name: "ns::W::~W", start: 8, mechanism: leading, compiler: "clang++ 18 -DDEBUG nm -C: ns::W::~W()"}
    - {id: IMPL_R_PP_3, outcome: exact, entity_kind: "method", qualified_name: "ns::W::dump", start: 10, mechanism: leading, compiler: "clang++ 18 -DDEBUG nm -C: ns::W::dump() const"}
    - {id: IMPL_R_PP_4, outcome: exact, entity_kind: "constructor", qualified_name: "ns::W::W", start: 13, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::W()"}

rule_rust_names_trait_object_impl_and_nested_fn:
  # A non-path self type keeps its brackets, as rustc prints it; a function nested in a
  # method is a function, named through the method.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    pub trait Tr {}

    impl dyn Tr {
        // @Method on a trait object, IMPL_R_RSN_1, impl
        pub fn m(&self) {}
    }

    pub struct W;

    impl W {
        pub fn m(&self) {
            // @Helper in a method, IMPL_R_RSN_2, impl
            fn helper() {}
            helper()
        }
    }
  truth:
    - {id: IMPL_R_RSN_1, outcome: exact, entity_kind: "method", qualified_name: "<dyn Tr>::m", start: 5, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <dyn t::Tr>::m"}
    - {id: IMPL_R_RSN_2, outcome: exact, entity_kind: "function", qualified_name: "W::m::helper", start: 13, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::W>::m::helper"}

rule_entity_lines_include_attributes_cpp:
  # A C++ attribute on its own line is part of the declaration it precedes, so the
  # entity's first line is the attribute's.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    // @An attributed function, IMPL_R_ATTR_LINES_CPP, impl
    [[nodiscard]]
    int checked();
  truth:
    - {id: IMPL_R_ATTR_LINES_CPP, outcome: exact, entity_kind: "function", qualified_name: "checked", start: 2, mechanism: leading, compiler: "syntax-only: the attribute is part of the declaration"}

rule_entity_lines_include_attributes_csharp:
  # A C# attribute list is part of the declaration it precedes, so the entity's first
  # line is the attribute's.
  lang: csharp
  config: default
  extract: [oneline, need_refs]
  source: |
    class C
    {
        // @An attributed method, IMPL_R_ATTR_LINES_CS, impl
        [Obsolete]
        public void M() {}
    }
  truth:
    - {id: IMPL_R_ATTR_LINES_CS, outcome: exact, entity_kind: "method", qualified_name: "C.M", start: 4, mechanism: leading, compiler: "syntax-only: the attribute list is part of the declaration"}

rule_csharp_primary_constructor_and_record_struct:
  # C# 12 primary constructors and record structs parse as the declarations they are.
  lang: csharp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace Geo
    {
        // @A primary constructor, IMPL_R_CS12_1, impl
        public class Point(int x, int y)
        {
            // @Distance, IMPL_R_CS12_2, impl
            public double Distance() => System.Math.Sqrt(x * x + y * y);
        }

        // @A record struct, IMPL_R_CS12_3, impl
        public record struct Pair(int A, int B);
    }
  truth:
    - {id: IMPL_R_CS12_1, outcome: exact, entity_kind: "class", qualified_name: "Geo.Point", start: 4, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_CS12_2, outcome: exact, entity_kind: "method", qualified_name: "Geo.Point.Distance", start: 7, mechanism: leading, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_CS12_3, outcome: exact, entity_kind: "record", qualified_name: "Geo.Pair", start: 11, mechanism: leading, compiler: "syntax-only: rule case"}

rule_rust_unsafe_extern_block:
  # A Rust 2024 ``unsafe extern`` block's functions are entities, in the enclosing
  # module's namespace.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    unsafe extern "C" {
        // @A foreign function, IMPL_R_RS24, impl
        pub fn abs(x: i32) -> i32;
    }
  truth:
    - {id: IMPL_R_RS24, outcome: exact, entity_kind: "function", qualified_name: "abs", start: 3, mechanism: leading, compiler: "rustc 1.97 (edition 2024): the foreign function abs"}

rule_doc_comment_file_block_is_file_level_cpp:
  # A documentation comment that documents the file (Doxygen's ``@file``) keeps the
  # file-header rule: a blank line after it, it is file level.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /**
     * @file widget.h
     * @need-ids: REQ_R_FILE_CPP
     */

    namespace ns {
    void f();
    }
  truth:
    - {id: REQ_R_FILE_CPP, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "Doxygen: a block with \\file documents the file"}

rule_doc_comment_file_block_is_file_level_ts:
  # A JSDoc comment that documents the file (``@fileoverview``) keeps the file-header
  # rule: a blank line after it, it is file level.
  lang: typescript
  config: default
  extract: [oneline, need_refs]
  source: |
    /**
     * @fileoverview Widgets.
     * @need-ids: REQ_R_FILE_TS
     */

    export function f(): void {}
  truth:
    - {id: REQ_R_FILE_TS, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "JSDoc: @fileoverview documents the file"}

rule_inner_attribute_is_no_entity_head:
  # An inner attribute (``#![...]``) applies to what it is inside, so it heads no item:
  # a marker after one on its row is trailing, and belongs to the module, or the file.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    #![allow(dead_code)] // @After an inner attribute, IMPL_R_INNER_ATTR_1, impl
    fn f() {}

    mod m {
        #![allow(unused)] // @After an inner attribute in a module, IMPL_R_INNER_ATTR_2, impl
        fn g() {}
    }
  truth:
    - {id: IMPL_R_INNER_ATTR_1, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "rustc: an inner attribute applies to the enclosing crate"}
    - {id: IMPL_R_INNER_ATTR_2, outcome: exact, entity_kind: "module", qualified_name: "m", start: 4, mechanism: enclosing, compiler: "rustc: an inner attribute applies to the enclosing module"}

rule_file_tag_needs_a_left_boundary:
  # A file tag counts only at the start of the comment or after a space, ``*``, ``/`` or
  # ``!``: an address like ``a@file.com`` in a header doc block is prose, so the block
  # documents the next item.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /**
     * Widgets; mail a@file.com for help.
     * @need-ids: REQ_R_TAG_LEFT
     */

    void f();
  truth:
    - {id: REQ_R_TAG_LEFT, outcome: exact, entity_kind: "function", qualified_name: "f", start: 6, mechanism: doc_comment, compiler: "Doxygen: no file command, so the block documents the next declaration"}

rule_file_tag_is_a_whole_word:
  # A file tag must end the word: ``@filename`` is no ``@file``, so the block documents
  # the next item.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /** @filename widget.h
     * @need-ids: REQ_R_TAG_WORD */

    void f();
  truth:
    - {id: REQ_R_TAG_WORD, outcome: exact, entity_kind: "function", qualified_name: "f", start: 4, mechanism: doc_comment, compiler: "Doxygen: @filename is no file command"}

rule_file_tag_ascii_boundary:
  # The word ends at the first character that is not an ASCII letter, digit or ``_``:
  # Doxygen and JSDoc commands are ASCII, so ``@file`` followed by a combining mark is
  # still ``@file``, and the block is file level.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /** @fileͅ widget.h
     * @need-ids: REQ_R_TAG_ASCII */

    void f();
  truth:
    - {id: REQ_R_TAG_ASCII, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case (ASCII command names)"}

rule_file_tag_backslash_form:
  # Doxygen's ``\file`` is ``@file``: the block is file level.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /** \file widget.h
     * @need-ids: REQ_R_TAG_BACKSLASH */

    void f();
  truth:
    - {id: REQ_R_TAG_BACKSLASH, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "Doxygen: \\file documents the file"}

rule_file_tag_module_ts:
  # JSDoc's ``@module`` documents the file: the block is file level.
  lang: typescript
  config: default
  extract: [oneline, need_refs]
  source: |
    /**
     * @module widgets
     * @need-ids: REQ_R_TAG_MODULE
     */

    export function f(): void {}
  truth:
    - {id: REQ_R_TAG_MODULE, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "JSDoc: @module documents the file"}

rule_file_tag_package_documentation_ts:
  # TSDoc's ``@packageDocumentation`` documents the file: the block is file level.
  lang: typescript
  config: default
  extract: [oneline, need_refs]
  source: |
    /**
     * @packageDocumentation
     * @need-ids: REQ_R_TAG_PACKAGE
     */

    export function f(): void {}
  truth:
    - {id: REQ_R_TAG_PACKAGE, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "TSDoc: @packageDocumentation documents the file"}

rule_head_comment_skip_csharp:
  # Another comment between an attribute and the marker does not take the marker out
  # of the entity's head: it still leads the method.
  lang: csharp
  config: default
  extract: [oneline, need_refs]
  source: |
    class A
    {
        [Test] /* c */ // @After an attribute and a comment, IMPL_R_HEAD_SKIP_CS, impl
        public void M() {}
    }
  truth:
    - {id: IMPL_R_HEAD_SKIP_CS, outcome: exact, entity_kind: "method", qualified_name: "A.M", start: 3, mechanism: leading, compiler: "syntax-only: rule case"}

rule_head_comment_skip_ts:
  # Another comment between a class decorator and the marker does not take the marker
  # out of the class's head: it still leads the class.
  lang: typescript
  config: default
  extract: [oneline, need_refs]
  source: |
    @Injectable() /* c */ // @After a decorator and a comment, IMPL_R_HEAD_SKIP_TS, impl
    class Service {}
  truth:
    - {id: IMPL_R_HEAD_SKIP_TS, outcome: exact, entity_kind: "class", qualified_name: "Service", start: 1, mechanism: leading, compiler: "syntax-only: rule case"}

rule_head_before_trailing:
  # A marker inside an attribute list that starts the entity's row trails code on that
  # row, but it is in the head first: it leads the method.
  lang: csharp
  config: default
  extract: [oneline, need_refs]
  source: |
    class A
    {
        [Test, // @Inside an attribute list, IMPL_R_HEAD_ORDER, impl
         Category("x")]
        public void M() {}
    }
  truth:
    - {id: IMPL_R_HEAD_ORDER, outcome: exact, entity_kind: "method", qualified_name: "A.M", start: 3, mechanism: leading, compiler: "syntax-only: rule case"}

rule_file_tag_non_ascii_letter_ends_the_word:
  # The word ends at the first character that is not an ASCII letter, digit or ``_``,
  # even a non-ASCII letter: ``@file`` followed by ``é`` is still ``@file``, and the
  # block is file level.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    /** @fileé widget.h
     * @need-ids: REQ_R_TAG_NON_ASCII */

    void f();
  truth:
    - {id: REQ_R_TAG_NON_ASCII, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case (ASCII command names)"}

rule_name_chain_cpp_method_in_class:
  # Kinds describe, names identify. This case and the next define one method, here in
  # its class and there out of line: their ``semantic`` name chains (the names, and a
  # Rust impl's trait) are equal, their kinds are not -- the out-of-line qualifier
  # ``ns`` is a ``scope``, which the syntax cannot classify.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    class W {
    public:
        // @Defined in its class, IMPL_R_CHAIN_1, impl
        void f() {}
    };
    }
  truth:
    - {id: IMPL_R_CHAIN_1, outcome: exact, entity_kind: "method", qualified_name: "ns::W::f", start: 5, mechanism: leading, compiler: "clang++ 18 nm -C (odr-used): ns::W::f()"}

rule_name_chain_cpp_method_out_of_line:
  # The method of the case above, defined out of line.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    class W {
    public:
        void f();
    };
    }

    // @Defined out of line, IMPL_R_CHAIN_2, impl
    void ns::W::f() {}
  truth:
    - {id: IMPL_R_CHAIN_2, outcome: exact, entity_kind: "method", qualified_name: "ns::W::f", start: 9, mechanism: leading, compiler: "clang++ 18 nm -C: ns::W::f()"}

rule_name_chain_rust_trait_is_identity:
  # Two methods of one type, one per trait impl: their name chains differ only by the
  # impl's ``trait``, which identifies, as a name does.
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    pub trait Shape {
        fn area(&self) -> f64;
    }
    pub trait Other {
        fn area(&self) -> f64;
    }
    pub struct Widget;

    impl Shape for Widget {
        // @Area as a Shape, IMPL_R_CHAIN_3, impl
        fn area(&self) -> f64 { 0.0 }
    }

    impl Other for Widget {
        // @Area as an Other, IMPL_R_CHAIN_4, impl
        fn area(&self) -> f64 { 1.0 }
    }
  truth:
    - {id: IMPL_R_CHAIN_3, outcome: exact, entity_kind: "method", qualified_name: "<Widget as Shape>::area", start: 11, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::Widget as t::Shape>::area"}
    - {id: IMPL_R_CHAIN_4, outcome: exact, entity_kind: "method", qualified_name: "<Widget as Other>::area", start: 16, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::Widget as t::Other>::area"}

rule_name_chain_python_locals_is_identity:
  # CPython's ``<locals>`` is identity, as a name is: ``A.f.g`` (the method ``g`` of a nested
  # class ``f``) and ``A.f.<locals>.g`` (a function nested in the method ``f``) have the same
  # names and two name chains, which differ by the ``<locals>`` boundary alone.
  lang: python
  config: default
  extract: [oneline, need_refs]
  source: |
    class A:
        class f:
            # @Method of a nested class, IMPL_R_CHAIN_5, impl
            def g(self):
                pass

        def f(self):
            # @Function in a method, IMPL_R_CHAIN_6, impl
            def g():
                pass

            return g
  truth:
    - {id: IMPL_R_CHAIN_5, outcome: exact, entity_kind: "method", qualified_name: "A.f.g", start: 4, mechanism: leading, compiler: "CPython 3.13 co_qualname: A.f.g"}
    - {id: IMPL_R_CHAIN_6, outcome: exact, entity_kind: "function", qualified_name: "A.f.<locals>.g", start: 9, mechanism: leading, compiler: "CPython 3.13 co_qualname: A.f.<locals>.g"}

rule_name_chain_rust_impl_in_module:
  # An impl inside an in-file module is inside it by name chain: the module is a part of its
  # own, before the impl, and the impl is its self type as written -- a bare name is folded back
  # into the module's path when rendered (``m::G::new``), a path is not (``x::P::new``), and a
  # path from the crate root keeps its ``crate::`` (``Q::q``, not ``k::Q::q``).
  lang: rust
  config: default
  extract: [oneline, need_refs]
  source: |
    pub mod m {
        pub trait Shape {
            fn area(&self) -> f64;
        }
        pub struct G;

        impl G {
            // @New in a module, IMPL_R_MOD_1, impl
            pub fn new() -> G {
                G
            }
        }

        impl Shape for G {
            // @Area in a module, IMPL_R_MOD_2, impl
            fn area(&self) -> f64 {
                0.0
            }
        }

        // @Free function in a module, IMPL_R_MOD_3, impl
        pub fn free() {}

        pub mod n {
            pub struct H;

            impl H {
                // @Make in a nested module, IMPL_R_MOD_4, impl
                pub fn make() -> H {
                    H
                }
            }
        }
    }

    pub mod x {
        pub struct P;
    }

    pub struct Q;

    pub mod k {
        impl crate::x::P {
            // @A type written as a path, IMPL_R_MOD_5, impl
            pub fn new() -> crate::x::P {
                crate::x::P
            }
        }

        impl crate::Q {
            // @A type written from the crate root, IMPL_R_MOD_6, impl
            pub fn q() {}
        }
    }
  truth:
    - {id: IMPL_R_MOD_1, outcome: exact, entity_kind: "method", qualified_name: "m::G::new", start: 9, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::m::G>::new"}
    - {id: IMPL_R_MOD_2, outcome: exact, entity_kind: "method", qualified_name: "<m::G as m::Shape>::area", start: 16, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::m::G as t::m::Shape>::area"}
    - {id: IMPL_R_MOD_3, outcome: exact, entity_kind: "function", qualified_name: "m::free", start: 22, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: t::m::free"}
    - {id: IMPL_R_MOD_4, outcome: exact, entity_kind: "method", qualified_name: "m::n::H::make", start: 29, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::m::n::H>::make"}
    - {id: IMPL_R_MOD_5, outcome: exact, entity_kind: "method", qualified_name: "x::P::new", start: 45, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::x::P>::new"}
    - {id: IMPL_R_MOD_6, outcome: exact, entity_kind: "method", qualified_name: "Q::q", start: 52, mechanism: leading, compiler: "rustc 1.97 v0, nm -C: <t::Q>::q"}

rule_cpp_inline_namespace_is_left_out:
  # An inline namespace adds nothing to the names of what it holds, as clang prints a
  # name; the inline namespace itself keeps its own name, and so does the inline part
  # of a C++20 nested namespace name.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib {
    inline namespace v1 {
    // @A function in an inline namespace, IMPL_R_INL_1, impl
    void f() {}
    }
    // @The inline namespace itself, IMPL_R_INL_2, impl
    inline namespace v2 {
    void g() {}
    }
    }
    namespace lib::inline v3 {
    // @A function in an inline part of a nested name, IMPL_R_INL_3, impl
    void z() {}
    }
  truth:
    - {id: IMPL_R_INL_1, outcome: exact, entity_kind: "function", qualified_name: "lib::f", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::f()"}
    - {id: IMPL_R_INL_2, outcome: exact, entity_kind: "namespace", qualified_name: "lib::v2", start: 7, mechanism: leading, compiler: "clang.cindex 18.1.1: inline NAMESPACE v2, its semantic parent NAMESPACE lib (its own name kept)"}
    - {id: IMPL_R_INL_3, outcome: exact, entity_kind: "function", qualified_name: "lib::z", start: 13, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::z()"}

rule_cpp_inline_namespace_kept_where_names_collide:
  # Where leaving an inline namespace out would give two definitions of the file one
  # name and parameters, each keeps it, as clang does.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib {
    inline namespace v1 {
    // @One of two, IMPL_R_INLC_1, impl
    void h(int) {}
    }
    inline namespace v2 {
    // @The other, IMPL_R_INLC_2, impl
    void h(int) {}
    }
    }
  truth:
    - {id: IMPL_R_INLC_1, outcome: exact, entity_kind: "function", qualified_name: "lib::v1::h", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v1::h(int) (kept: lib::h would name two functions)"}
    - {id: IMPL_R_INLC_2, outcome: exact, entity_kind: "function", qualified_name: "lib::v2::h", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v2::h(int) (kept: lib::h would name two functions)"}

rule_cpp_friend_is_named_in_its_namespace:
  # A function a friend declaration declares or defines is named in its innermost
  # enclosing namespace, not in the class.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    struct A {
        friend void touch(A&) {
            // @Inside a hidden friend, IMPL_R_FR_1, impl
        }
        friend bool operator==(const A&, const A&);
    };
    // @The friend's definition, IMPL_R_FR_2, impl
    bool operator==(const A&, const A&) { return true; }
    }
  truth:
    - {id: IMPL_R_FR_1, outcome: exact, entity_kind: "function", qualified_name: "ns::touch", start: 3, mechanism: enclosing, compiler: "clang.cindex 18.1.1, fully qualified: void ns::touch(A &)"}
    - {id: IMPL_R_FR_2, outcome: exact, entity_kind: "operator", qualified_name: "ns::operator==", start: 9, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: bool ns::operator==(const A &, const A &), declared a friend on line 6"}

rule_cpp_friends_keep_their_class_where_names_collide:
  # Two classes' hidden friends of one name and parameters: clang names both in the
  # namespace, one name for two definitions, so each keeps its classes (fail closed: a
  # marker never credits another class's function).
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace ns {
    struct List { struct iterator {
        friend bool operator==(const iterator&, const iterator&) {
            // @List's, IMPL_R_FRC_1, impl
            return true;
        }
    }; };
    struct Map { struct iterator {
        friend bool operator==(const iterator&, const iterator&) {
            // @Map's, IMPL_R_FRC_2, impl
            return false;
        }
    }; };
    }
  truth:
    - {id: IMPL_R_FRC_1, outcome: fallback, entity_kind: "operator", qualified_name: "ns::List::iterator::operator==", start: 3, mechanism: enclosing, compiler: "clang.cindex 18.1.1, fully qualified: bool ns::operator==(const iterator &, const iterator &) for both hidden friends -- one name for two definitions, so each keeps its classes"}
    - {id: IMPL_R_FRC_2, outcome: fallback, entity_kind: "operator", qualified_name: "ns::Map::iterator::operator==", start: 9, mechanism: enclosing, compiler: "clang.cindex 18.1.1, fully qualified: bool ns::operator==(const iterator &, const iterator &) for both hidden friends -- one name for two definitions, so each keeps its classes"}

rule_cpp_partial_specialisation_keeps_its_arguments:
  # A partial specialisation's class name keeps its arguments, squeezed and without the
  # comments inside the list, as an explicit specialisation's does.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    template <typename T, int N> struct P {
        // @The primary's member, IMPL_R_PS_1, impl
        void fill();
    };
    // @The partial specialisation, IMPL_R_PS_2, impl
    template <typename T> struct P<T, /* four */ 4> {
        // @Its member, IMPL_R_PS_3, impl
        void fill();
    };
  truth:
    - {id: IMPL_R_PS_1, outcome: exact, entity_kind: "method", qualified_name: "P::fill", start: 3, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P::fill()"}
    - {id: IMPL_R_PS_2, outcome: exact, entity_kind: "struct", qualified_name: "P<T,4>", start: 6, mechanism: leading, compiler: "clang.cindex 18.1.1: CLASS_TEMPLATE_PARTIAL_SPECIALIZATION P<T, 4>"}
    - {id: IMPL_R_PS_3, outcome: exact, entity_kind: "method", qualified_name: "P<T,4>::fill", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P<type-parameter-0-0, 4>::fill(), its parent spelled P<T, 4>"}

rule_cpp_out_of_line_qualifier:
  # Out of line, a qualifier keeps its arguments unless they are exactly the template
  # header's parameter names; one the same as a partial specialisation of the file but
  # for its parameter names is spelled as that one; one that names none of the
  # header's parameters takes no header.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    template <typename T, int N> struct P { void fill(); };
    template <typename T> struct P<T, 4> { void fill(); };
    template <typename T> struct Box { void get(); };
    template <> struct Box<int> { void get(); };
    template <typename T> struct Outer {};
    template <> struct Outer<int> { template <typename U> struct Inner { void n(); }; };
    // @A partial specialisation's member with its parameter renamed, IMPL_R_OOL_1, impl
    template <typename U> void P<U, 4>::fill() {}
    // @The primary's member, IMPL_R_OOL_2, impl
    template <typename T, int N> void P<T, N>::fill() {}
    // @A primary template's member, IMPL_R_OOL_3, impl
    template <typename X> void Box<X>::get() {}
    // @An explicit specialisation's member, IMPL_R_OOL_4, impl
    void Box<int>::get() {}
    // @A member template of an explicit specialisation, IMPL_R_OOL_5, impl
    template <typename U> void Outer<int>::Inner<U>::n() {}
  truth:
    - {id: IMPL_R_OOL_1, outcome: exact, entity_kind: "method", qualified_name: "P<T,4>::fill", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P<type-parameter-0-0, 4>::fill(), its parent the partial specialisation P<T, 4>"}
    - {id: IMPL_R_OOL_2, outcome: exact, entity_kind: "method", qualified_name: "P::fill", start: 10, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P::fill()"}
    - {id: IMPL_R_OOL_3, outcome: exact, entity_kind: "method", qualified_name: "Box::get", start: 12, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void Box::get()"}
    - {id: IMPL_R_OOL_4, outcome: exact, entity_kind: "method", qualified_name: "Box<int>::get", start: 14, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void Box<int>::get()"}
    - {id: IMPL_R_OOL_5, outcome: exact, entity_kind: "method", qualified_name: "Outer<int>::Inner::n", start: 16, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void Outer<int>::Inner::n()"}

rule_cpp_namespace_macro:
  # A namespace macro the file defines itself is read: what lies between its
  # invocations is named in the namespaces it opens (an inline one left out), an
  # anonymous namespace there too.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define LIB_NAMESPACE_BEGIN namespace lib { inline namespace v3 {
    #define LIB_NAMESPACE_END }}

    LIB_NAMESPACE_BEGIN
    namespace detail {
    // @In the macro's namespace, IMPL_R_NSM_1, impl
    int f(int x) { return x; }
    }
    // @An anonymous namespace there, IMPL_R_NSM_2, impl
    namespace {
    void g() {}
    }
    LIB_NAMESPACE_END
  truth:
    - {id: IMPL_R_NSM_1, outcome: exact, entity_kind: "function", qualified_name: "lib::detail::f", start: 7, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: int lib::detail::f(int x)"}
    - {id: IMPL_R_NSM_2, outcome: exact, entity_kind: "namespace", qualified_name: "lib::(anonymous namespace)", start: 10, mechanism: leading, compiler: "clang.cindex 18.1.1: an anonymous NAMESPACE, its semantic parents inline NAMESPACE v3 and NAMESPACE lib (the inline one left out)"}

rule_cpp_namespace_macro_nested_pair:
  # A pair inside another is named in both, the outer one's namespaces first.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define LIB_NAMESPACE_BEGIN namespace lib {
    #define LIB_NAMESPACE_END }
    #define DETAIL_NAMESPACE_BEGIN namespace detail {
    #define DETAIL_NAMESPACE_END }
    LIB_NAMESPACE_BEGIN
    // @In the outer pair, IMPL_R_NSN_1, impl
    void f() {}
    DETAIL_NAMESPACE_BEGIN
    // @In the nested pair, IMPL_R_NSN_2, impl
    void g() {}
    DETAIL_NAMESPACE_END
    LIB_NAMESPACE_END
  truth:
    - {id: IMPL_R_NSN_1, outcome: exact, entity_kind: "function", qualified_name: "lib::f", start: 7, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::f()"}
    - {id: IMPL_R_NSN_2, outcome: exact, entity_kind: "function", qualified_name: "lib::detail::g", start: 10, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::detail::g()"}

rule_cpp_namespace_macro_short_opening:
  # An opening shorter than 12 characters is left as written, so a marker above it is
  # attached as before (to no entity here), and what lies inside is named without its
  # namespace.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define NS_OPEN namespace lib {
    #define NS_SHUT }
    int x;
    // @Before a short opening, IMPL_R_NSS_1, impl
    NS_OPEN
    struct S {};
    // @Inside a short pair, IMPL_R_NSS_2, impl
    void f() {}
    NS_SHUT
  truth:
    - {id: IMPL_R_NSS_1, outcome: fallback, entity_kind: null, qualified_name: null, start: null, compiler: "clang.cindex 18.1.1: the comment is before NAMESPACE lib, which no entity stands for -- the opening is shorter than 12 characters, left as written, and the marker attached as before"}
    - {id: IMPL_R_NSS_2, outcome: fallback, entity_kind: "function", qualified_name: "f", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::f() -- the opening is shorter than 12 characters and left as written, so the name lacks lib"}

rule_cpp_namespace_macro_pair_inside_a_scope:
  # A pair inside a namespace or a class names nothing: what lies inside is named
  # without the macro's namespace.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define LIB_NAMESPACE_BEGIN namespace lib {
    #define LIB_NAMESPACE_END }
    namespace outer {
    LIB_NAMESPACE_BEGIN
    // @Between a pair inside a namespace, IMPL_R_NSI_1, impl
    void h();
    LIB_NAMESPACE_END
    }
    struct S {
    LIB_NAMESPACE_BEGIN
        void m();
        // @Between a pair inside a class, IMPL_R_NSI_2, impl
        void n();
    LIB_NAMESPACE_END
    };
  truth:
    - {id: IMPL_R_NSI_1, outcome: fallback, entity_kind: "function", qualified_name: "outer::h", start: 6, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void outer::lib::h() -- a pair inside a namespace names nothing"}
    - {id: IMPL_R_NSI_2, outcome: fallback, entity_kind: "method", qualified_name: "S::n", start: 13, mechanism: leading, compiler: "clang.cindex 18.1.1: error, a namespace cannot be defined in a class (recovered as void lib::n()) -- a pair inside a class names nothing"}

rule_cpp_namespace_macro_not_read_as_a_block:
  # An opening the tree does not read as the block it is rewritten to (a macro
  # statement on the line before) is left as written: the functions inside are still
  # definitions, named without the macro's namespace.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define LIB_NAMESPACE_BEGIN namespace lib {
    #define LIB_NAMESPACE_END }
    #define WARNINGS_PUSH
    WARNINGS_PUSH
    LIB_NAMESPACE_BEGIN
    int f() { return 0; }
    // @After a macro statement, IMPL_R_NSX_1, impl
    int g() { return 1; }
    LIB_NAMESPACE_END
  truth:
    - {id: IMPL_R_NSX_1, outcome: fallback, entity_kind: "function", qualified_name: "g", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: int lib::g() -- the opening is not read as a block (a macro statement before it), so the file is read as written"}

rule_cpp_namespace_macro_used_other_than_alone:
  # A macro the code also uses beside other code is not read.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    #define LIB_NAMESPACE_BEGIN namespace lib {
    #define LIB_NAMESPACE_END }
    LIB_NAMESPACE_BEGIN
    void f() {}
    // @Between invocations of a macro also used beside code, IMPL_R_NSU_1, impl
    void g() {}
    LIB_NAMESPACE_END
    LIB_NAMESPACE_BEGIN void h(); LIB_NAMESPACE_END
  truth:
    - {id: IMPL_R_NSU_1, outcome: fallback, entity_kind: "function", qualified_name: "g", start: 6, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::g() -- the macro is also used beside code (line 8), so it is not read"}

rule_cpp_qualifier_through_an_inline_namespace:
  # A function written with a qualifier through one of the file's own inline
  # namespaces is named without it, as its declaration is, except where two
  # definitions of the file would then share a name and parameters.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib {
    inline namespace v1 {
    // @Declared in an inline namespace, IMPL_R_INLQ_1, impl
    void f(int);
    void g();
    }
    inline namespace v2 {
    void g();
    }
    }
    // @Defined through the inline namespace, IMPL_R_INLQ_2, impl
    void lib::v1::f(int) {}
    // @One of two siblings' definitions, IMPL_R_INLQ_3, impl
    void lib::v1::g() {}
    // @The other's, IMPL_R_INLQ_4, impl
    void lib::v2::g() {}
  truth:
    - {id: IMPL_R_INLQ_1, outcome: exact, entity_kind: "function", qualified_name: "lib::f", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::f(int)"}
    - {id: IMPL_R_INLQ_2, outcome: exact, entity_kind: "method", qualified_name: "lib::f", start: 12, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::f(int) (the syntax reads the namespace qualifier as a class: method)"}
    - {id: IMPL_R_INLQ_3, outcome: exact, entity_kind: "method", qualified_name: "lib::v1::g", start: 14, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v1::g() (kept: lib::g would name two functions; the syntax reads the namespace qualifier as a class: method)"}
    - {id: IMPL_R_INLQ_4, outcome: exact, entity_kind: "method", qualified_name: "lib::v2::g", start: 16, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v2::g() (kept: lib::g would name two functions; the syntax reads the namespace qualifier as a class: method)"}

rule_cpp_pack_beside_a_plain_partial_specialisation:
  # A pack is not a plain parameter: an out-of-line qualifier with two arguments is
  # spelled as the two-parameter partial specialisation, never as the one with a
  # pack.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    template <typename... Ts> struct S;
    template <typename T, typename... Ts> struct S<T, Ts...> {
        // @The pack's member, IMPL_R_PACK_1, impl
        void f() {}
    };
    template <typename T, typename U> struct S<T, U> { void f(); };
    // @The plain specialisation's member out of line, IMPL_R_PACK_2, impl
    template <typename A, typename B> void S<A, B>::f() {}
  truth:
    - {id: IMPL_R_PACK_1, outcome: exact, entity_kind: "method", qualified_name: "S<T,Ts...>::f", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void S<type-parameter-0-0, type-parameter-0-1...>::f(), its parent spelled S<T, Ts...>"}
    - {id: IMPL_R_PACK_2, outcome: exact, entity_kind: "method", qualified_name: "S<T,U>::f", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void S<type-parameter-0-0, type-parameter-0-1>::f(), its parent the partial specialisation S<T, U>"}

rule_cpp_forward_declared_partial_specialisation:
  # A forward declaration of a partial specialisation never sets the spelling: the
  # specialisation with a body does.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    template <class T, int N> struct P {};
    template <class T> struct P<T, 4>;
    template <class U> struct P<U, 4> {
        // @Declared in the specialisation, IMPL_R_FWD_1, impl
        void fill();
    };
    // @Defined out of line, IMPL_R_FWD_2, impl
    template <class V> void P<V, 4>::fill() {}
  truth:
    - {id: IMPL_R_FWD_1, outcome: exact, entity_kind: "method", qualified_name: "P<U,4>::fill", start: 5, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P<type-parameter-0-0, 4>::fill(), its parent the definition P<U, 4> (line 3), not the forward declaration P<T, 4>"}
    - {id: IMPL_R_FWD_2, outcome: exact, entity_kind: "method", qualified_name: "P<U,4>::fill", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void P<type-parameter-0-0, 4>::fill(), its parent the definition P<U, 4> (line 3), not the forward declaration P<T, 4>"}

rule_cpp_member_of_a_kept_class:
  # A class kept apart by its inline namespace (another class of its name is in the
  # parent) keeps its full chain for its members too, in the class and out of line.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib {
    inline namespace v1 {
    struct Widget {
        // @A member of a class kept apart, IMPL_R_KEPT_1, impl
        void draw();
    };
    }
    struct Widget { void resize() {} };
    }
    // @Its definition out of line, IMPL_R_KEPT_2, impl
    void lib::v1::Widget::draw() {}
  truth:
    - {id: IMPL_R_KEPT_1, outcome: exact, entity_kind: "method", qualified_name: "lib::v1::Widget::draw", start: 5, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v1::Widget::draw() (kept: lib::Widget would name two classes)"}
    - {id: IMPL_R_KEPT_2, outcome: exact, entity_kind: "method", qualified_name: "lib::v1::Widget::draw", start: 11, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v1::Widget::draw() (kept: lib::Widget would name two classes)"}

rule_cpp_class_head_through_an_inline_namespace:
  # A class head written through one of the file's inline namespaces leaves it out,
  # and so do its members, in the class and out of line.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib { inline namespace v2 { struct X; } }
    // @The class defined through the inline namespace, IMPL_R_CLS_1, impl
    struct lib::v2::X {
        // @Its member, IMPL_R_CLS_2, impl
        void m();
    };
    // @The member's definition, IMPL_R_CLS_3, impl
    void lib::v2::X::m() {}
  truth:
    - {id: IMPL_R_CLS_1, outcome: exact, entity_kind: "struct", qualified_name: "lib::X", start: 3, mechanism: leading, compiler: "clang.cindex 18.1.1: STRUCT_DECL X, its semantic parents inline NAMESPACE v2 and NAMESPACE lib (the inline one left out)"}
    - {id: IMPL_R_CLS_2, outcome: exact, entity_kind: "method", qualified_name: "lib::X::m", start: 5, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::X::m()"}
    - {id: IMPL_R_CLS_3, outcome: exact, entity_kind: "method", qualified_name: "lib::X::m", start: 8, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::X::m()"}

rule_cpp_pimpl_through_an_inline_namespace:
  # A nested class defined out of its class through an inline namespace (a pimpl)
  # leaves it out too.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib { inline namespace v1 { struct Widget { struct Impl; void draw(); }; } }
    struct lib::v1::Widget::Impl {
        // @The implementation's member, IMPL_R_PIMPL_1, impl
        void run();
    };
    // @Its definition, IMPL_R_PIMPL_2, impl
    void lib::v1::Widget::Impl::run() {}
    // @The outer class's member defined through the inline namespace, IMPL_R_PIMPL_3, impl
    void lib::v1::Widget::draw() {}
  truth:
    - {id: IMPL_R_PIMPL_1, outcome: exact, entity_kind: "method", qualified_name: "lib::Widget::Impl::run", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::Widget::Impl::run()"}
    - {id: IMPL_R_PIMPL_2, outcome: exact, entity_kind: "method", qualified_name: "lib::Widget::Impl::run", start: 7, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::Widget::Impl::run()"}
    - {id: IMPL_R_PIMPL_3, outcome: exact, entity_kind: "method", qualified_name: "lib::Widget::draw", start: 9, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::Widget::draw()"}

rule_cpp_conversion_operator_through_an_inline_namespace:
  # A conversion operator's qualifier through one of the file's inline namespaces
  # leaves it out, as its declaration in the class does.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib { inline namespace v1 { struct W {
        // @Declared in the class, IMPL_R_CONVI_1, impl
        operator int() const;
    }; } }
    // @Defined through the inline namespace, IMPL_R_CONVI_2, impl
    lib::v1::W::operator int() const { return 0; }
  truth:
    - {id: IMPL_R_CONVI_1, outcome: exact, entity_kind: "operator", qualified_name: "lib::W::operator int", start: 3, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: lib::W::operator int() const"}
    - {id: IMPL_R_CONVI_2, outcome: exact, entity_kind: "operator", qualified_name: "lib::W::operator int", start: 6, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: lib::W::operator int() const"}

rule_cpp_friend_of_a_kept_class:
  # A class kept apart by its inline namespace keeps its full chain for its members,
  # but not for a friend: a friend is named in its namespace.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib {
    inline namespace v1 { struct Widget {
        friend void swap(Widget&, Widget&) {
            // @Inside a kept class's hidden friend, IMPL_R_FRK_1, impl
        }
        void draw() {
            // @Inside a kept class's member, IMPL_R_FRK_2, impl
        }
    }; }
    struct Widget { void resize() {} };
    }
  truth:
    - {id: IMPL_R_FRK_1, outcome: exact, entity_kind: "function", qualified_name: "lib::swap", start: 3, mechanism: enclosing, compiler: "clang.cindex 18.1.1, fully qualified: void lib::swap(Widget &, Widget &)"}
    - {id: IMPL_R_FRK_2, outcome: exact, entity_kind: "method", qualified_name: "lib::v1::Widget::draw", start: 6, mechanism: enclosing, compiler: "clang.cindex 18.1.1, fully qualified: void lib::v1::Widget::draw() (kept: lib::Widget would name two classes)"}

rule_cpp_reopened_inline_namespace:
  # A namespace that reopens one of the file's inline namespaces without inline is
  # inline too: what it holds, and a definition written through it, leave it out.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    namespace lib { inline namespace v1 { void f(); } }
    namespace lib { namespace v1 {
    // @Declared in the reopened inline namespace, IMPL_R_REOP_1, impl
    void g();
    } }
    // @Defined through it, IMPL_R_REOP_2, impl
    void lib::v1::g() {}
  truth:
    - {id: IMPL_R_REOP_1, outcome: exact, entity_kind: "function", qualified_name: "lib::g", start: 4, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::g() (warning: inline namespace reopened as a non-inline namespace)"}
    - {id: IMPL_R_REOP_2, outcome: exact, entity_kind: "method", qualified_name: "lib::g", start: 7, mechanism: leading, compiler: "clang.cindex 18.1.1, fully qualified: void lib::g() (the syntax reads the namespace qualifier as a class: method)"}

# The VHDL rule cases: the generic attachment rules hold for VHDL. A marker in the
# leading licence banner is file level, a ``--!`` doc comment is exempt unless it holds
# ``@file``, and a marker after a header's ``is`` is trailing on the element the header
# opens.

rule_vhdl_file_header_banner:
  # A marker in the comment block before the first design unit, a blank line after the
  # block, is file level; the unit's context clauses do not change that.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    -- Copyright (c) 2026 ACME
    -- @File level requirement, IMPL_R_VHDL_HEADER, impl

    library ieee;
    use ieee.std_logic_1164.all;

    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_HEADER, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case"}

rule_vhdl_file_header_no_blank_line:
  # Without the blank line, the block documents the design unit after its context
  # clauses.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    -- Copyright (c) 2026 ACME
    -- @Counter, IMPL_R_VHDL_HEADER_ADJ, impl
    library ieee;
    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_HEADER_ADJ, outcome: exact, entity_kind: "module", qualified_name: "counter", start: 4, mechanism: leading, compiler: "syntax-only: rule case"}

rule_vhdl_doc_comment_before_first_item:
  # A ``--!`` doc comment is exempt from the file-header rule: it documents the next
  # design unit, blank line or not.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    --! @Counter, IMPL_R_VHDL_DOC_HEADER, impl

    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_DOC_HEADER, outcome: exact, entity_kind: "module", qualified_name: "counter", start: 3, mechanism: doc_comment, compiler: "syntax-only: rule case"}

rule_vhdl_file_tag:
  # A ``--!`` doc comment that holds ``@file`` documents the file, not the next unit.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    --! @file counter.vhd
    --! @Counter file, IMPL_R_VHDL_FILE_TAG, impl

    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_FILE_TAG, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case"}

rule_vhdl_file_tag_needs_the_blank_line:
  # A ``--! @file`` run documents the file only as a file header: with no blank line
  # after it, it documents the design unit it stands above.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    --! @file counter.vhd
    --! @Counter, IMPL_R_VHDL_FILE_TAG_ADJ, impl
    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_FILE_TAG_ADJ, outcome: exact, entity_kind: "module", qualified_name: "counter", start: 3, mechanism: doc_comment, compiler: "syntax-only: rule case"}

rule_vhdl_file_tag_after_a_design_unit:
  # A ``--! @file`` run after the first design unit is no file header: it documents the
  # next design unit, a blank line after it or not.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    entity first is
    end entity first;

    --! @file counter.vhd
    --! @Counter, IMPL_R_VHDL_FILE_TAG_LATE, impl

    entity counter is
    end entity counter;
  truth:
    - {id: IMPL_R_VHDL_FILE_TAG_LATE, outcome: exact, entity_kind: "module", qualified_name: "counter", start: 7, mechanism: doc_comment, compiler: "syntax-only: rule case"}

rule_vhdl_trailing_on_a_header:
  # A marker after a header's ``is`` -- a function's, a procedure's, a process's -- is
  # trailing on the element the header opens, as a marker after ``int g() {`` is.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    architecture rtl of counter is
      impure function next_count(c : natural) return natural is -- @Next count, IMPL_R_VHDL_FN_HEAD, impl
      begin
        return c + 1;
      end function next_count;
      procedure reset_all is -- @Reset all, IMPL_R_VHDL_PROC_HEAD, impl
      begin
      end procedure reset_all;
    begin
      tick : process (clk) is -- @Tick, IMPL_R_VHDL_PROCESS_HEAD, impl
      begin
      end process tick;
    end architecture rtl;
  truth:
    - {id: IMPL_R_VHDL_FN_HEAD, outcome: exact, entity_kind: "function", qualified_name: "counter.rtl.next_count", start: 2, mechanism: trailing, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_VHDL_PROC_HEAD, outcome: exact, entity_kind: "function", qualified_name: "counter.rtl.reset_all", start: 6, mechanism: trailing, compiler: "syntax-only: rule case"}
    - {id: IMPL_R_VHDL_PROCESS_HEAD, outcome: exact, entity_kind: null, node_kind: process_statement, qualified_name: "counter.rtl.tick", start: 10, mechanism: trailing, compiler: "syntax-only: rule case"}

rule_vhdl_names:
  # VHDL names: a design element is named by the design elements around it, joined
  # with ``.`` as VHDL's expanded names are, an architecture under the entity its
  # ``of`` clause names. The existing kinds where one fits (entity ``module``,
  # architecture ``impl``, package and package body ``namespace``, component
  # ``interface``, function and procedure ``function``, enum, record and protected type
  # ``enum``, ``record``, ``class``, any other type or subtype ``type``); every other
  # element has no kind, its last component a ``scope``. An element inside an unnamed
  # one (an unlabelled process) has no name.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    library ieee;
    use ieee.std_logic_1164.all;

    -- @Counter entity, IMPL_N_ENTITY, impl
    entity counter is
      generic (
        WIDTH : natural := 8 -- @Width generic, IMPL_N_GENERIC, impl
      );
      port (
        clk : in std_logic; -- @Clock port, IMPL_N_PORT, impl
        q : out natural
      );
    end entity counter;

    -- @RTL architecture, IMPL_N_ARCH, impl
    architecture rtl of counter is
      -- @State type, IMPL_N_ENUM, impl
      type state_t is (IDLE, RUN);
      -- @Pair record, IMPL_N_RECORD, impl
      type pair_t is record
        a, b : natural;
      end record;
      -- @Byte subtype, IMPL_N_SUBTYPE, impl
      subtype byte_t is natural range 0 to 255;
      -- @Count signal, IMPL_N_SIGNAL, impl
      signal count : natural := 0;
      -- @Max constant, IMPL_N_CONSTANT, impl
      constant MAX : natural := 10;
      -- @Fifo component, IMPL_N_COMPONENT, impl
      component fifo is
        port (d : in std_logic); -- @Fifo port, IMPL_N_COMPONENT_PORT, impl
      end component fifo;
      -- @Next count, IMPL_N_FUNCTION, impl
      function next_count(c : natural) return natural is
      begin
        return c + 1;
      end function next_count;
    begin
      -- @Tick process, IMPL_N_PROCESS, impl
      tick : process (clk)
        -- @Step variable, IMPL_N_VARIABLE, impl
        variable step : natural;
      begin
        count <= next_count(count);
      end process tick;
      -- @Fifo instance, IMPL_N_INSTANCE, impl
      u_fifo : fifo port map (d => clk);
      -- @Lanes, IMPL_N_GENERATE, impl
      lanes : for i in 0 to 3 generate
        -- @Lane process, IMPL_N_GEN_PROCESS, impl
        lane : process (clk) begin end process lane;
      end generate lanes;
      -- @Output, IMPL_N_ASSIGN, impl
      drive : q <= count;
      -- @Unlabelled process, IMPL_N_UNLABELLED, impl
      process (clk) begin end process;
    end architecture rtl;

    -- @Math package, IMPL_N_PACKAGE, impl
    package math_pkg is
      -- @Add declaration, IMPL_N_PROCEDURE_DECL, impl
      procedure add(signal a : inout natural; b : natural);
      -- @Shared counter, IMPL_N_PROTECTED, impl
      type shared_counter is protected
        -- @Increment, IMPL_N_METHOD, impl
        procedure increment;
      end protected shared_counter;
    end package math_pkg;

    -- @Math package body, IMPL_N_PACKAGE_BODY, impl
    package body math_pkg is
      -- @Add body, IMPL_N_PROCEDURE_BODY, impl
      procedure add(signal a : inout natural; b : natural) is
      begin
        a <= a + b;
      end procedure add;
      -- @Shared counter body, IMPL_N_PROTECTED_BODY, impl
      type shared_counter is protected body
        variable n : natural := 0;
        procedure increment is begin n := n + 1; end procedure;
      end protected body shared_counter;
    end package body math_pkg;
  truth:
    - {id: IMPL_N_ENTITY, outcome: exact, entity_kind: "module", qualified_name: "counter", start: 5, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_GENERIC, outcome: exact, entity_kind: null, node_kind: interface_declaration, qualified_name: "counter.WIDTH", start: 7, mechanism: trailing, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PORT, outcome: exact, entity_kind: null, node_kind: interface_declaration, qualified_name: "counter.clk", start: 10, mechanism: trailing, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_ARCH, outcome: exact, entity_kind: "impl", qualified_name: "counter.rtl", start: 16, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_ENUM, outcome: exact, entity_kind: "enum", qualified_name: "counter.rtl.state_t", start: 18, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_RECORD, outcome: exact, entity_kind: "record", qualified_name: "counter.rtl.pair_t", start: 20, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_SUBTYPE, outcome: exact, entity_kind: "type", qualified_name: "counter.rtl.byte_t", start: 24, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_SIGNAL, outcome: exact, entity_kind: null, node_kind: signal_declaration, qualified_name: "counter.rtl.count", start: 26, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_CONSTANT, outcome: exact, entity_kind: null, node_kind: constant_declaration, qualified_name: "counter.rtl.MAX", start: 28, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_COMPONENT, outcome: exact, entity_kind: "interface", qualified_name: "counter.rtl.fifo", start: 30, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_COMPONENT_PORT, outcome: exact, entity_kind: null, node_kind: interface_declaration, qualified_name: "counter.rtl.fifo.d", start: 31, mechanism: trailing, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_FUNCTION, outcome: exact, entity_kind: "function", qualified_name: "counter.rtl.next_count", start: 34, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PROCESS, outcome: exact, entity_kind: null, node_kind: process_statement, qualified_name: "counter.rtl.tick", start: 40, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_VARIABLE, outcome: exact, entity_kind: null, node_kind: variable_declaration, qualified_name: "counter.rtl.tick.step", start: 42, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_INSTANCE, outcome: exact, entity_kind: null, node_kind: component_instantiation_statement, qualified_name: "counter.rtl.u_fifo", start: 47, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_GENERATE, outcome: exact, entity_kind: null, node_kind: for_generate_statement, qualified_name: "counter.rtl.lanes", start: 49, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_GEN_PROCESS, outcome: exact, entity_kind: null, node_kind: process_statement, qualified_name: "counter.rtl.lanes.lane", start: 51, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_ASSIGN, outcome: exact, entity_kind: null, node_kind: concurrent_simple_signal_assignment, qualified_name: "counter.rtl.drive", start: 54, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_UNLABELLED, outcome: exact, entity_kind: null, node_kind: process_statement, qualified_name: null, start: 56, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PACKAGE, outcome: exact, entity_kind: "namespace", qualified_name: "math_pkg", start: 60, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PROCEDURE_DECL, outcome: exact, entity_kind: "function", qualified_name: "math_pkg.add", start: 62, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PROTECTED, outcome: exact, entity_kind: "class", qualified_name: "math_pkg.shared_counter", start: 64, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_METHOD, outcome: exact, entity_kind: "function", qualified_name: "math_pkg.shared_counter.increment", start: 66, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PACKAGE_BODY, outcome: exact, entity_kind: "namespace", qualified_name: "math_pkg", start: 71, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PROCEDURE_BODY, outcome: exact, entity_kind: "function", qualified_name: "math_pkg.add", start: 73, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_PROTECTED_BODY, outcome: exact, entity_kind: "class", qualified_name: "math_pkg.shared_counter", start: 78, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}

rule_vhdl_names_as_written:
  # A VHDL name is spelled as the source writes it: VHDL is case-insensitive, and the
  # architecture is named under its ``of`` clause as written (``counter.RTL`` for an
  # entity declared ``Counter``); an extended identifier keeps its backslashes, and an
  # operator function its quotes. A declaration of several names has none.
  lang: vhdl
  config: default
  extract: [oneline, need_refs]
  source: |
    entity Counter is
    end entity Counter;
    architecture RTL of counter is
      signal \weird name\ : bit; -- @Extended identifier, IMPL_N_EXTENDED, impl
      signal a, b : bit; -- @Two signals, IMPL_N_TWO_NAMES, impl
      -- @Plus, IMPL_N_OPERATOR, impl
      function "+"(l, r : bit) return bit is begin return l xor r; end function;
    begin
    end architecture RTL;
  truth:
    - {id: IMPL_N_EXTENDED, outcome: exact, entity_kind: null, node_kind: signal_declaration, qualified_name: "counter.RTL.\\weird name\\", start: 4, mechanism: trailing, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_TWO_NAMES, outcome: exact, entity_kind: null, node_kind: signal_declaration, qualified_name: null, start: 5, mechanism: trailing, compiler: "syntax-only: VHDL expanded names"}
    - {id: IMPL_N_OPERATOR, outcome: exact, entity_kind: "function", qualified_name: "counter.RTL.\"+\"", start: 7, mechanism: leading, compiler: "syntax-only: VHDL expanded names"}

rule_vhdl_double_bang_is_no_doc_comment:
  # A ``--!!`` comment is a plain comment, as ``////`` is beside ``///``: a marker in one
  # is ``leading``, where one in a ``--!`` comment is a ``doc_comment``.
  lang: vhdl
  config: default
