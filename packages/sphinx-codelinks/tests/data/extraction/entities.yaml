rule_adjacency_broken_by_code:
  # A leading marker binds the next entity only when nothing but trivia separates them:
  # a variable between the marker and the function breaks adjacency, so file level.
  lang: cpp
  config: default
  extract: [oneline, need_refs]
  source: |
    // @Adjacency broken by code, IMPL_R_ADJ, impl
    int counter = 1;
    void f() {}
  truth:
    - {id: IMPL_R_ADJ, outcome: none, entity_kind: null, qualified_name: null, start: null, compiler: "syntax-only: rule case"}

rule_blank_lines_are_trivia:
  # Blank lines are trivia: the marker binds the function below them.
  lang: cpp
  config: default
