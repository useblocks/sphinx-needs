# Marker positions (``source_map``).
#
# Rows and columns are physical: a column counts the characters before the
# position on its line, from the start of the line -- not from the start of
# the comment, and not in bytes. The cases put something before a marker on
# its line (indentation, code, a non-ASCII character), and pin where a span
# ends when whitespace follows it.
#
# A comment's lines are split on "\n" only (CR and CRLF are read as "\n"): a form
# feed is not a row break. The last line of a comment counts as terminated, and a
# block comment's closing ``*/`` is not marker text.

indented_oneline:
  # The marker is indented by four spaces inside a function body.
  lang: cpp
  config: default
  source: |
    void f() {
        // @Indented, IMPL_INDENT, impl, [REQ_1]
        return;
    }

indented_need_ref:
  # A need reference, indented; its span starts at the first id.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    void f() {
        // @need-ids: REQ_1, REQ_2
        return;
    }

comment_after_code:
  # The comment follows code on the same line.
  lang: cpp
  config: default
  source: |
    int x = 1; // @After code, IMPL_AFTER, impl, [REQ_1]
    void f() {}

non_ascii_title:
  # Non-ASCII characters count as one column each.
  lang: cpp
  config: default
  source: |
    // @Titléé, IMPL_UTF8, impl, []
    void f() {}

non_ascii_before_comment:
  # A non-ASCII character before the comment on its line.
  lang: cpp
  config: default
  source: |
    const char *s = "é"; // @After é, IMPL_UTF8_CODE, impl, [REQ_1]
    void f() {}

non_ascii_need_ref:
  # A non-ASCII need id.
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    // @need-ids: RÉQ-001
    void f() {}

non_ascii_before_comment_yaml:
  # A non-ASCII character in a YAML value before an inline comment: the comment is found.
  lang: yaml
  config: default
  source: |
    key: "é"  # @After é, IMPL_YAML_UTF8, impl, [REQ_1]

astral_before_need_ref_yaml:
  # A four-byte character before an inline reference counts as one column.
  lang: yaml
  config: default
  extract: [need_refs]
  source: |
    key: 𝔘  # @need-ids: REQ_1

non_ascii_before_marker_in_comment_yaml:
  # A non-ASCII character inside the comment, before a reference, counts as one column.
  lang: yaml
  config: default
  extract: [need_refs]
  source: |
    key: v  # é @need-ids: REQ_IN

yaml_non_ascii_value_then_later_marker:
  # A non-ASCII value does not lose a comment on a later row.
  lang: yaml
  config: default
  source: |
    a: é
    b: 1
    # @Later, IMPL_YAML_LATER, impl
    c: 2

block_comment_trailing_whitespace:
  # Whitespace after the marker inside a block comment; the span ends where
  # the end sequence (the newline) is.
  lang: cpp
  config: default
  source: "/*\n * @Block marker, IMPL_BLOCK, impl, [REQ_1]   \n */\nvoid f() {}\n"

need_and_ref_on_one_row:
  # A one-line need and a need reference on the same row. The line does not
  # start with the need-ids marker, so it keeps its one-line need.
  lang: cpp
  config:
    start_sequence: "[["
    end_sequence: "]]"
    needs_fields:
      - {name: id}
      - {name: title}
      - {name: type, default: impl}
      - {name: links, type: "list[str]", default: []}
  source: |
    // [[IMPL_PAIR, Pair need]] @need-ids: REQ_2
    void f() {}

one_row_block_comment_need:
  # The closing */ is not part of the need's last field.
  lang: cpp
  config: default
  source: |
    /* @Row one, IMPL_R1, impl */
    void f() {}

need_on_block_comment_closing_row:
  # A need on the row of the closing */: the last line counts as terminated.
  lang: cpp
  config: default
  source: |
    int t; /* x
       @Row two, IMPL_R2, impl */
    void f() {}

form_feed_is_not_a_row_break:
  # A form feed inside a line: the reference stays on its row, and the text
  # before the start sequence keeps the second comment from being a need.
  lang: cpp
  config: default
  source: "int z; /* a\f @need-ids: FF1 */\n/* b\f@Form feed, IMPL_FF, impl\n */\nvoid f() {}\n"
