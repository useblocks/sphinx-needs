# The target a file is read for (#4865): ubCode-only, pending its sphinx-codelinks twin.
#
# These cases have the shape of the shared fixture files, but no reference snapshot
# exists for them yet: this file is not one of `SHARED_FIXTURES`
# (`extraction_parity.rs`, `sync_codelinks_expected.py`), so the parity gate does not
# read it, and `check_fixture_drift.py`, which refreshes only the files upstream also
# has, leaves it alone. Only the snapshot harness (`extraction_fixtures.rs`) runs it.
# When sphinx-codelinks adds the same file byte for byte (and reads the target), it is
# added to both `SHARED_FIXTURES` lists and its references are synced like every
# other shared file's.
#
# libclang reads no target from a compile command's compiler: it parses with its own
# `clang`, for the triple it was built for (the machine running the extraction), unless
# the arguments carry `--target`. The engine reads the target the build declares: the
# entry's own `--target`, else the target its compiler's name carries by clang's own
# rule (`<triple>-gcc`, `-g++`, `-cc`, `-clang`, behind a launcher, with a version or a
# directory), when its first part is an architecture libclang models, else the `target`
# setting (key `target` here, the `[preprocessor] target` setting), else the machine
# running it. A file with no entry of its own (a header) reads the setting alone. A
# file whose declared target the pinned libclang cannot read (an entry's own
# `--target=xtensa-esp32-elf`, a setting naming one) is read as written: no arm of
# any `#if` is left out. Every case below gives the same markers on every machine:
# none of them is read for the machine running it, or each reads an arm no machine
# that runs the extraction takes (`__XTENSA__`), or it is read as written.

cross_gcc_entry_takes_its_target_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["arm-none-eabi-gcc", "-mcpu=cortex-m3", "-mthumb", "-c", "case.c"]
  source: |
    // @Always, IMPL_T1_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T1_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T1_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T1_ARM, impl, [REQ]
    #else
    // @other, IMPL_T1_OTHER, impl, [REQ]
    #endif
  # The compiler's name carries the target arm-none-eabi, and the entry's own
  # -mcpu=cortex-m3 -mthumb refine it to ARMv7-M Thumb-2, as the compiler reads them:
  # IMPL_T1_ALWAYS, IMPL_T1_CM3. Read for the machine running it, an x86-64 one would
  # give IMPL_T1_X86 and an Arm64 one IMPL_T1_OTHER.

triple_clang_name_takes_its_target_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["thumbv7em-none-eabihf-clang", "-c", "case.c"]
  source: |
    // @Always, IMPL_T2_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T2_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T2_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T2_ARM, impl, [REQ]
    #else
    // @other, IMPL_T2_OTHER, impl, [REQ]
    #endif
  # A clang named for its target carries it too: thumbv7em-none-eabihf, ARMv7E-M,
  # which is not ARMv7-M: IMPL_T2_ALWAYS, IMPL_T2_ARM.

launcher_versioned_cross_name_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["ccache", "/opt/sdk/bin/arm-zephyr-eabi-gcc-12.2.0", "-mcpu=cortex-m3", "-mthumb", "-c", "case.c"]
  source: |
    // @Always, IMPL_T3_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T3_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T3_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T3_ARM, impl, [REQ]
    #else
    // @other, IMPL_T3_OTHER, impl, [REQ]
    #endif
  # The compiler is the last leading word, behind the launcher, and its name is read
  # without its directory and its version: arm-zephyr-eabi, refined to ARMv7-M:
  # IMPL_T3_ALWAYS, IMPL_T3_CM3.

explicit_target_beats_compiler_name_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["aarch64-linux-gnu-clang", "--target=arm-none-eabi", "-c", "case.c"]
  source: |
    // @Always, IMPL_T4_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T4_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T4_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T4_ARM, impl, [REQ]
    #else
    // @other, IMPL_T4_OTHER, impl, [REQ]
    #endif
  # The entry's own --target wins over its compiler's name, as in clang:
  # arm-none-eabi, not aarch64 (which defines no __arm__): IMPL_T4_ALWAYS, IMPL_T4_ARM.

input_file_is_not_the_compiler_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["arm-none-eabi-gcc", "case.c", "-mcpu=cortex-m3", "-mthumb", "-c"]
  source: |
    // @Always, IMPL_T5_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T5_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T5_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T5_ARM, impl, [REQ]
    #else
    // @other, IMPL_T5_OTHER, impl, [REQ]
    #endif
  # The input written before the options is a leading word too, and not the
  # compiler: the compiler is the last leading word that is not the entry's file:
  # IMPL_T5_ALWAYS, IMPL_T5_CM3.

setting_states_the_target_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  std: c11
  extract: [oneline]
  target: thumbv7em-none-eabihf
  source: |
    // @Always, IMPL_T6_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T6_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T6_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T6_ARM, impl, [REQ]
    #else
    // @other, IMPL_T6_OTHER, impl, [REQ]
    #endif
  # No compilation database applies: the file is read with the defines, for the
  # target the setting states: IMPL_T6_ALWAYS, IMPL_T6_ARM.

setting_does_not_override_the_entry_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  target: x86_64-unknown-linux-gnu
  compile_commands:
    - file: case.c
      arguments: ["arm-none-eabi-gcc", "-mcpu=cortex-m3", "-mthumb", "-c", "case.c"]
  source: |
    // @Always, IMPL_T7_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T7_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T7_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T7_ARM, impl, [REQ]
    #else
    // @other, IMPL_T7_OTHER, impl, [REQ]
    #endif
  # The setting fills what the build does not say and never overrides what it says:
  # the compiler's name carries arm-none-eabi: IMPL_T7_ALWAYS, IMPL_T7_CM3.

setting_fills_an_entry_that_names_none_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  target: thumbv7em-none-eabihf
  compile_commands:
    - file: case.c
      arguments: ["gcc", "-c", "case.c"]
  source: |
    // @Always, IMPL_T8_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T8_X86, impl, [REQ]
    #elif defined(__ARM_ARCH_7M__) && defined(__thumb2__)
    // @cortex-m3, IMPL_T8_CM3, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T8_ARM, impl, [REQ]
    #else
    // @other, IMPL_T8_OTHER, impl, [REQ]
    #endif
  # A native compiler's name carries no target, and the entry has no --target: the
  # setting's target is read: IMPL_T8_ALWAYS, IMPL_T8_ARM.

header_takes_the_setting_libclang:
  lang: cpp_header
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  target: thumbv7em-none-eabihf
  compile_commands:
    - file: one.c
      arguments: ["arm-none-eabi-gcc", "-mcpu=cortex-m4", "-mthumb", "-mfloat-abi=hard", "-c", "one.c"]
  source: |
    #pragma once
    // @Always, IMPL_T9_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T9_X86, impl, [REQ]
    #elif defined(__arm__)
    // @arm, IMPL_T9_ARM, impl, [REQ]
    #else
    // @other, IMPL_T9_OTHER, impl, [REQ]
    #endif
  # A header has no entry of its own: it is read with the defines, for the target the
  # setting states, never for the target of the entries (their target without their
  # flags, -mfloat-abi=hard among them, would blank arms their build compiles):
  # IMPL_T9_ALWAYS, IMPL_T9_ARM.

unmodelled_compiler_target_reads_every_file_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["xtensa-esp32-elf-gcc", "-c", "case.c"]
  source: |
    // @Always, IMPL_T10_ALWAYS, impl, [REQ]
    #if defined(__XTENSA__)
    // @xtensa, IMPL_T10_XTENSA, impl, [REQ]
    #else
    // @not xtensa, IMPL_T10_NOT_XTENSA, impl, [REQ]
    #endif
  # The compiler's name carries xtensa-esp32-elf, whose architecture the pinned
  # libclang does not model: as clang's driver, the engine takes a name's prefix only
  # when its architecture is one libclang has (passed to it, this one would fail the
  # parse and lose every marker of the file). The file is read for the machine running
  # the extraction, and, as libclang reads the rest of the prefix as a system (`elf`),
  # a warning says so (`codelinks.preprocessor_target_unknown`, not part of this case's
  # warnings): IMPL_T10_ALWAYS, IMPL_T10_NOT_XTENSA.

unmodelled_entry_target_reads_every_file_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["clang", "--target=xtensa-esp32-elf", "-c", "case.c"]
  source: |
    // @Always, IMPL_T11_ALWAYS, impl, [REQ]
    #if defined(__XTENSA__)
    // @xtensa, IMPL_T11_XTENSA, impl, [REQ]
    #else
    // @not xtensa, IMPL_T11_NOT_XTENSA, impl, [REQ]
    #endif
  # The entry's own --target is one the pinned libclang does not model: passed on,
  # the parse fails and the file is dropped with every marker. Nothing else names
  # the build's target, so no arm can be left out soundly: the file is read as
  # written, every arm kept, and a warning says so
  # (`codelinks.preprocessor_target_unknown`, not part of this case's warnings, as
  # `codelinks.builtin_header` is not): IMPL_T11_ALWAYS, IMPL_T11_XTENSA,
  # IMPL_T11_NOT_XTENSA.

unknown_target_keeps_every_arm_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  compile_commands:
    - file: case.c
      arguments: ["clang", "--target=xtensa-esp32-elf", "-c", "case.c"]
  source: |
    // @Always, IMPL_T12_ALWAYS, impl, [REQ]
    #ifdef __XTENSA__
    // @xtensa, IMPL_T12_XTENSA, impl, [REQ]
    #endif
    #if defined(__arm__)
    // @arm, IMPL_T12_ARM, impl, [REQ]
    #elif defined(__x86_64__) || defined(_WIN32)
    // @x86 or windows, IMPL_T12_X86_WIN, impl, [REQ]
    #else
    // @other, IMPL_T12_OTHER, impl, [REQ]
    #endif
  # An Xtensa entry is read as written on every machine: the arm only Xtensa takes,
  # the Arm one, the x86-64 or Windows one and the `#else` are all kept, whatever the
  # machine running the extraction defines: IMPL_T12_ALWAYS, IMPL_T12_XTENSA,
  # IMPL_T12_ARM, IMPL_T12_X86_WIN, IMPL_T12_OTHER.

unknown_setting_keeps_every_arm_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  std: c11
  extract: [oneline]
  target: tricore-elf
  source: |
    // @Always, IMPL_T13_ALWAYS, impl, [REQ]
    #if defined(__x86_64__)
    // @x86, IMPL_T13_X86, impl, [REQ]
    #elif defined(__aarch64__)
    // @arm64, IMPL_T13_ARM64, impl, [REQ]
    #else
    // @other, IMPL_T13_OTHER, impl, [REQ]
    #endif
  # No compilation database applies, and the setting names a target the pinned
  # libclang does not model: the file is read as written: IMPL_T13_ALWAYS,
  # IMPL_T13_X86, IMPL_T13_ARM64, IMPL_T13_OTHER.

unknown_entry_target_is_not_the_settings_libclang:
  lang: c
  engine: libclang
  config: default
  defines: []
  extract: [oneline]
  target: thumbv7em-none-eabihf
  compile_commands:
    - file: case.c
      arguments: ["clang", "-target", "xtensa-esp32-elf", "-c", "case.c"]
  source: |
    // @Always, IMPL_T14_ALWAYS, impl, [REQ]
    #if defined(__arm__)
    // @arm, IMPL_T14_ARM, impl, [REQ]
    #else
    // @not arm, IMPL_T14_NOT_ARM, impl, [REQ]
    #endif
  # The setting fills what the build does not say, and this entry says Xtensa: its
  # target is unknown, not the setting's, so the file is read as written, not for
  # thumbv7em-none-eabihf: IMPL_T14_ALWAYS, IMPL_T14_ARM, IMPL_T14_NOT_ARM.
