default_oneliner_cpp:
  lang: cpp
  config: default
  source: |
    // @My Title, IMPL_1, impl, [REQ_1]
    void f() {}

default_oneliner_c:
  lang: c
  config: default
  source: |
    // @C Title, IMPL_C, impl, [REQ_C]
    void g(void) {}

default_oneliner_python:
  lang: python
  config: default
  source: |
    # @Py Title, IMPL_PY, impl, [REQ_PY]
    def f():
        pass

default_oneliner_csharp:
  lang: csharp
  config: default
  source: |
    // @Cs Title, IMPL_CS, impl, [REQ_CS]
    class C {}

default_oneliner_rust:
  lang: rust
  config: default
  source: |
    // @Rs Title, IMPL_RS, impl, [REQ_RS]
    fn f() {}

default_oneliner_yaml:
  lang: yaml
  config: default
  source: |
    # @Yaml Title, IMPL_YAML, impl, [REQ_YAML]
    key: value

default_oneliner_bash:
  lang: bash
  config: default
  source: |
    # @Bash Title, IMPL_BASH, impl, [REQ_BASH]
    greet() { echo hi; }

# the shebang is a comment node but must not yield a marker or warning;
# the marker anchors to line 2 and the `function` keyword form also parses
shebang_oneliner_bash:
  lang: bash
  config: default
  source: |
    #!/bin/bash
    # @Bash Title, IMPL_BASH_SHEBANG, impl, [REQ_BASH]
    function greet { echo hi; }

default_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    // @Ts Title, IMPL_TS, impl, [REQ_TS]
    function f(): void {}

# a JSX comment ({/* ... */}) is an ordinary block comment under the TSX
# grammar, so a marker in one extracts like in any /* */ comment
jsx_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    const App = () => (
      <div>
        {/*
          @Tsx Title, IMPL_TSX, impl, [REQ_TSX]
        */}
      </div>
    );

# the one-row form of a JSX comment: the closing */ is no marker text
jsx_inline_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    const App = () => (
      <div>
        {/* @Tsx Inline, IMPL_TSX_INLINE, impl, [REQ_TSX] */}
      </div>
    );

# JSX text is not a comment: .tsx parses with the TSX grammar, where the // and
# /* */ inside an element's text are text, so neither yields a marker. The
# TypeScript grammar would read both as comments, and widen the first scope
jsx_text_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    // @Login button, IMPL_TSX_LOGIN, impl, [REQ_TSX]
    export const Login = () => <p>// @Fake line, FAKE_LINE, impl</p>;
    export const Note = () => <p>/* @Fake block, FAKE_BLOCK, impl */</p>;

# the one-row form of a block comment in TypeScript
block_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    /* @Ts Block, IMPL_TS_BLOCK, impl, [REQ_TS] */
    function f(): void {}

# a legacy <T>x type assertion is valid in .ts, which therefore parses with the
# TypeScript grammar: under TSX the cast opens a JSX element and every marker
# after it is lost
type_assertion_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    // @Before Cast, IMPL_TS_BEFORE_CAST, impl, [REQ_TS]
    function a(): void {}
    const name = <string>value;
    // @After Cast, IMPL_TS_AFTER_CAST, impl, [REQ_TS]
    function b(): void {}

# a legacy HTML-like comment (<!-- ...), valid in JavaScript, is an
# html_comment node, not a comment node, and the query captures both. It runs
# to the end of its line like //, and so does a line that starts with -->
html_comment_oneliner_js:
  lang: js
  config: default
  source: |
    <!-- @Html Title, IMPL_HTML, impl, [REQ_HTML]
    -->
    const x = 1;

# the one-row form of a legacy HTML-like comment: a closing --> is no marker text
html_comment_closed_oneliner_js:
  lang: js
  config: default
  source: |
    <!-- @Html Closed, IMPL_HTML_CLOSED, impl, [REQ_HTML] -->
    const x = 1;
