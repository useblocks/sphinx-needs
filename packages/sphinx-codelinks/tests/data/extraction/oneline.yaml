default_oneliner_cpp:
  lang: cpp
  config: default
  source: |
    // @My Title, IMPL_1, impl, [REQ_1]
    void f() {}

default_oneliner_c:
  lang: c
  config: default
  source: |
    // @C Title, IMPL_C, impl, [REQ_C]
    void g(void) {}

default_oneliner_python:
  lang: python
  config: default
  source: |
    # @Py Title, IMPL_PY, impl, [REQ_PY]
    def f():
        pass

default_oneliner_csharp:
  lang: csharp
  config: default
  source: |
    // @Cs Title, IMPL_CS, impl, [REQ_CS]
    class C {}

default_oneliner_rust:
  lang: rust
  config: default
  source: |
    // @Rs Title, IMPL_RS, impl, [REQ_RS]
    fn f() {}

default_oneliner_yaml:
  lang: yaml
  config: default
  source: |
    # @Yaml Title, IMPL_YAML, impl, [REQ_YAML]
    key: value

default_oneliner_bash:
  lang: bash
  config: default
  source: |
    # @Bash Title, IMPL_BASH, impl, [REQ_BASH]
    greet() { echo hi; }

# the shebang is a comment node but must not yield a marker or warning;
# the marker anchors to line 2 and the `function` keyword form also parses
shebang_oneliner_bash:
  lang: bash
  config: default
  source: |
    #!/bin/bash
    # @Bash Title, IMPL_BASH_SHEBANG, impl, [REQ_BASH]
    function greet { echo hi; }

default_oneliner_powershell:
  lang: powershell
  config: default
  source: |
    # @PowerShell Title, IMPL_PS, impl, [REQ_PS]
    function Start-Demo { }

# a pwsh shebang is a comment node but must not yield a marker or warning
shebang_oneliner_powershell:
  lang: powershell
  config: default
  source: |
    #!/usr/bin/env pwsh
    # @PowerShell Title, IMPL_PS_SHEBANG, impl, [REQ_PS]
    function Start-Demo { }

# a here-string is string content, not a comment: only the real marker counts
here_string_no_marker_powershell:
  lang: powershell
  config: default
  source: |
    $text = @"
    # @Not a marker, IMPL_PS_NO, impl
    "@
    # @Real, IMPL_PS_REAL, impl
    function Start-Demo { }

# a here-string's # line after its first line is string content too, interpolation
# or not: the grammar makes it a comment node inside the string, which is skipped
here_string_content_line_powershell:
  lang: powershell
  config: default
  source: |
    $name = 'px'
    $stub = @"
    function Test-$name {
    # @Generated, IMPL_PS_GEN, impl
    }
    "@
    # @Real, IMPL_PS_REAL_AFTER, impl
    function Start-Demo { }

# in an ordinary double-quoted string, a # after an interpolation is string content too,
# though the grammar makes it a comment node inside the string
interpolated_string_content_line_powershell:
  lang: powershell
  config: default
  source: |
    $c = "one $x
    # @Fake, IMPL_PS_FAKE, impl $y
    three"
    # @Real, IMPL_PS_REAL_STRING, impl
    function Start-Demo { }

# the string's closing quote on the # line after an interpolation: the grammar takes the
# quote into a comment node under an ERROR node, which starts with the line break and is
# no comment; the rest of the file is unreadable to the grammar (a documented limitation)
string_quote_on_hash_line_powershell:
  lang: powershell
  config: default
  source: |
    $s = "one $x
    # @Fake, IMPL_PS_FAKE_QUOTE, impl"
    function Start-Demo { }

# a # right after an interpolation, or after it on its own line: the grammar's comment node
# inside the string starts with the #, and is string content all the same
interpolated_string_same_line_powershell:
  lang: powershell
  config: default
  source: |
    $a = "$x# @Fake, IMPL_PS_FAKE_TIGHT, impl $y
    three"
    $b = "one $x # @Fake, IMPL_PS_FAKE_LINE, impl $y
    three"
    # @Real, IMPL_PS_REAL_LINE, impl
    function Start-Demo { }

# a comment in a subexpression $( ... ) of a string is code, not string content
subexpression_comment_in_string_powershell:
  lang: powershell
  config: default
  source: |
    $text = @"
    $( # @In code, IMPL_PS_SUBEXPR, impl
    Get-Date )
    "@
    function Start-Demo { }

# PowerShell's @ is the sigil of a hashtable @{ } and an array @( ): commented-out code
# and .EXAMPLE help hold them at a line's start, and they open no marker, nor a warning
sigil_literal_powershell:
  lang: powershell
  config: default
  source: |
    # @{ Keys = 'k' }, $Value.Keys is the string 'k'
    # `@(9, 9, 1) -eq 1` returns 1, not a list
    <#
    .EXAMPLE
        @{ Name = 'Jakub'; Age = 30 } | Should-BeHashtable -Key Name, Age
    #>
    # @Real, IMPL_PS_SIGIL, impl
    function Start-Demo { }

# a one-line <# #> comment: its closing #> is not part of the last field
block_oneliner_powershell:
  lang: powershell
  config: default
  source: |
    <# @Block Title, IMPL_PS_BLOCK, impl, [REQ_PS] #>
    function Start-Demo { }

# comment-based help is a <# #> comment like any other: a marker in it counts
help_block_marker_powershell:
  lang: powershell
  config: default
  source: |
    <#
    .SYNOPSIS
        Starts the demo.
    @Help Title, IMPL_PS_HELP, impl, [REQ_PS]
    #>
    function Start-Demo { }

default_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    // @Ts Title, IMPL_TS, impl, [REQ_TS]
    function f(): void {}

# a JSX comment ({/* ... */}) is an ordinary block comment under the TSX
# grammar, so a marker in one extracts like in any /* */ comment
jsx_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    const App = () => (
      <div>
        {/*
          @Tsx Title, IMPL_TSX, impl, [REQ_TSX]
        */}
      </div>
    );

# the one-row form of a JSX comment: the closing */ is no marker text
jsx_inline_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    const App = () => (
      <div>
        {/* @Tsx Inline, IMPL_TSX_INLINE, impl, [REQ_TSX] */}
      </div>
    );

# JSX text is not a comment: .tsx parses with the TSX grammar, where the // and
# /* */ inside an element's text are text, so neither yields a marker. The
# TypeScript grammar would read both as comments, and widen the first scope
jsx_text_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    // @Login button, IMPL_TSX_LOGIN, impl, [REQ_TSX]
    export const Login = () => <p>// @Fake line, FAKE_LINE, impl</p>;
    export const Note = () => <p>/* @Fake block, FAKE_BLOCK, impl */</p>;

# the one-row form of a block comment in TypeScript
block_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    /* @Ts Block, IMPL_TS_BLOCK, impl, [REQ_TS] */
    function f(): void {}

# a legacy <T>x type assertion is valid in .ts, which therefore parses with the
# TypeScript grammar: under TSX the cast opens a JSX element and every marker
# after it is lost
type_assertion_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    // @Before Cast, IMPL_TS_BEFORE_CAST, impl, [REQ_TS]
    function a(): void {}
    const name = <string>value;
    // @After Cast, IMPL_TS_AFTER_CAST, impl, [REQ_TS]
    function b(): void {}

# a legacy HTML-like comment (<!-- ...), valid in JavaScript, is an
# html_comment node, not a comment node, and the query captures both. It runs
# to the end of its line like //, and so does a line that starts with -->
html_comment_oneliner_js:
  lang: js
  config: default
  source: |
    <!-- @Html Title, IMPL_HTML, impl, [REQ_HTML]
    -->
    const x = 1;

# the one-row form of a legacy HTML-like comment: a closing --> is no marker text
html_comment_closed_oneliner_js:
  lang: js
  config: default
  source: |
    <!-- @Html Closed, IMPL_HTML_CLOSED, impl, [REQ_HTML] -->
    const x = 1;

# a Swift block comment, the delimiters stripped
block_oneliner_swift:
  lang: swift
  config: default
  source: |
    /* @Swift Block Title, IMPL_SWIFT_BLOCK, impl, [REQ_SWIFT] */
    struct Point {}

# Swift's block comments nest: the inner ``*/`` does not end the comment, so the marker
# after it is still in it
nested_block_comment_swift:
  lang: swift
  config: default
  source: |
    /*
     /* an inner comment */
     @Nested Title, IMPL_SWIFT_NESTED, impl
     */
    func f() {}

# a Swift shebang is no comment node: no marker, no warning, and the marker after it
shebang_oneliner_swift:
  lang: swift
  config: default
  source: |
    #!/usr/bin/env swift
    // @Swift Title, IMPL_SWIFT_SHEBANG, impl, [REQ_SWIFT]
    func main() {}

# the grammar parses a ``/*`` that opens a string's text (or follows whitespace or an
# interpolation in it) as a comment node inside the string: it is string content, and
# skipped; ``//`` in a string is no comment node at all
string_content_no_marker_swift:
  lang: swift
  config: default
  source: |
    let a = "/* @Not a marker, IMPL_SWIFT_NO_1, impl */"
    let b = "\(a) /* @Not a marker, IMPL_SWIFT_NO_2, impl */"
    let c = """
    /* @Not a marker, IMPL_SWIFT_NO_3, impl */
    // @Not a marker, IMPL_SWIFT_NO_4, impl
    """
    // @Real, IMPL_SWIFT_REAL, impl
    func f() {}

# a comment inside a string's interpolation is in code: a marker there counts
interpolation_comment_swift:
  lang: swift
  config: default
  source: |
    let s = "\(max(/* @In code, IMPL_SWIFT_INTERP, impl */ 1, 2))"

# Under ``@``, a Swift comment line holding an attribute's shape, ``@name(`` with no
# space before the parenthesis (an attribute, a DocC directive, an attribute-shaped
# example), is no need: a ``swift_attribute`` warning where the one-line parser would
# have read the line, silence where it would not (no field separator), in any comment
swift_attribute_swift:
  lang: swift
  config: default
  source: |
    // @available(iOS 15, macOS 12, *)
    /// @Available(Swift, introduced: 6.3)
    /// @Flag(name: [.short, .long])
    //@available(SwiftStdlib 5.0, *)
    /* @available(iOS 13, *) */
    // @objc(handle:)
    // @MainActor
    // @Real Title, IMPL_SWIFT_AFTER_ATTRIBUTES, impl
    func handle() {}

# the rule reads the shape alone: a title that opens with a name and ``(`` is withheld
# too, and a space before the parenthesis makes the line a need
swift_attribute_shape_only_swift:
  lang: swift
  config: default
  source: |
    // @Title(draft), IMPL_SWIFT_WITHHELD, impl
    // @available (iOS 15, *)
    func f() {}

# with a start sequence other than ``@`` the rule does not run
swift_attribute_other_start_sequence_swift:
  lang: swift
  config:
    start_sequence: "[["
    end_sequence: "]]"
    field_split_char: ","
    needs_fields:
      - {name: title}
      - {name: id}
      - {name: type, default: impl}
      - {name: links, type: "list[str]", default: []}
  source: |
    // @available(iOS 15, *)
    // [[available(iOS 15, IMPL_SWIFT_BRACKETS]]
    func f() {}

# a comment at an interpolation's own level (beside its expression, before or after it,
# or on a line of its own in a multi-line string) is code, as a comment nested in the
# expression is: the grammar places it in the string, after the interpolation's ``\(``;
# a comment in the string's text before or after an interpolation is still text
interpolation_level_comments_swift:
  lang: swift
  config: default
  source: |
    let x = 1
    let a = "\(x /* @After the value, IMPL_SWIFT_INTERP_AFTER, impl */)"
    let b = "\(/* @Before the value, IMPL_SWIFT_INTERP_BEFORE, impl */ x)"
    let c = """
    \(
    // @Line in an interpolation, IMPL_SWIFT_INTERP_LINE, impl
    x
    )
    """
    let d = #"\#(x /* @Raw interpolation, IMPL_SWIFT_INTERP_RAW, impl */)"#
    let e = "/* @Still text, IMPL_SWIFT_TEXT_BEFORE, impl */ \(x)"
    let f = "\(x) /* @Still text, IMPL_SWIFT_TEXT_AFTER, impl */"

# the attribute shape's identifier is ASCII: a name with a letter outside ASCII, first
# or later, is no attribute's shape, and the line is read as any other line is
swift_attribute_ascii_identifier_swift:
  lang: swift
  config: default
  source: |
    // @Größe(x), IMPL_SWIFT_NON_ASCII_INSIDE, impl
    // @éclair(x), IMPL_SWIFT_NON_ASCII_FIRST, impl
    func f() {}

# the attribute shape counts only where nothing alphanumeric precedes the start sequence
# on the line: with an end sequence other than the newline, the one-line parser reads a
# marker after prose too, and the prose keeps it from being withheld
swift_attribute_after_text_swift:
  lang: swift
  config:
    start_sequence: "@"
    end_sequence: ";"
    field_split_char: ","
    needs_fields:
      - {name: title}
      - {name: id}
      - {name: type, default: impl}
      - {name: links, type: "list[str]", default: []}
  source: |
    // see @available(iOS 15, IMPL_SWIFT_AFTER_PROSE);
    // @available(iOS 15, IMPL_SWIFT_WITHHELD_SEMICOLON);
    func f() {}

# Alphanumeric, in every marker rule, is a letter or a number of any script by Unicode
# general category (L* or N*). A marker whose end sequence is the newline is anchored:
# nothing alphanumeric may precede its start sequence on the line. A combining mark (Mn
# U+0345 and U+0301, Mc U+093E) and a circled or squared letter (So U+24B6, and U+1F130
# outside the Basic Multilingual Plane) are neither, though Unicode calls each of them but
# U+0301 Alphabetic: each of those lines is a need. A titlecase letter (Lt U+01C5), a modifier
# letter (Lm U+02B0), a letter number (Nl U+2160, Alphabetic too), a superscript digit (No
# U+00B2) and an Arabic-Indic digit (Nd U+0663) are alphanumeric: each of those lines is
# prose, and no marker.
#
# The sources are written with escapes, as the characters are hard to see. Every character
# was assigned by Unicode 6.0: a character assigned after Unicode 14.0, the oldest table a
# supported interpreter carries, is classed by whichever table a tool reads, so it makes no
# shared case. The other direction has none either: on every supported interpreter
# Python's ``str.isalnum`` accepts exactly the letters and numbers, and nothing else.
oneline_letter_or_number_before_start:
  lang: cpp
  config: default
  source: "// \u0345@Mn ypogegrammeni, IMPL_MN, impl\
    \n// \u0301@Mn acute accent, IMPL_MN_ACUTE, impl\
    \n// \u093E@Mc vowel sign, IMPL_MC, impl\
    \n// \u24B6@So circled letter, IMPL_SO, impl\
    \n// \U0001F130@So squared letter, IMPL_SO_ASTRAL, impl\
    \n// \u01C5@Lt titlecase letter, IMPL_LT, impl\
    \n// \u02B0@Lm modifier letter, IMPL_LM, impl\
    \n// \u2160@Nl letter number, IMPL_NL, impl\
    \n// \u00B2@No superscript digit, IMPL_NO, impl\
    \n// \u0663@Nd Arabic-Indic digit, IMPL_ND, impl\
    \nvoid f() {}\n"

# the same rule before a Swift attribute's shape: after a combining mark it is a
# ``swift_attribute`` warning and a marker is a need, as with nothing before the ``@``;
# after a letter number each line is prose
swift_attribute_letter_or_number_before_start_swift:
  lang: swift
  config: default
  source: "// \u093E@available(iOS 15, *)\
    \n// \u093E@Title after a mark, IMPL_SWIFT_MARK, impl\
    \n// \u2160@available(iOS 15, *)\
    \n// \u2160@Title after a numeral, IMPL_SWIFT_NUMERAL, impl\
    \nfunc f() {}\n"

# with an end sequence other than the newline the one-line parser reads a marker after
# anything, so the attribute rule's own test of what precedes the start sequence decides:
# after a combining mark or a circled letter the shape is withheld with a warning, after a
# letter number the line is read as a need, as after prose
swift_attribute_letter_or_number_bounded_swift:
  lang: swift
  config:
    start_sequence: "@"
    end_sequence: ";"
    field_split_char: ","
    needs_fields:
      - {name: title}
      - {name: id}
      - {name: type, default: impl}
      - {name: links, type: "list[str]", default: []}
  source: "// \u093E@available(iOS 15, IMPL_SWIFT_MARK_WITHHELD);\
    \n// \u24B6@available(iOS 15, IMPL_SWIFT_CIRCLED_WITHHELD);\
    \n// \u2160@available(iOS 15, IMPL_SWIFT_NUMERAL_READ);\
    \nfunc f() {}\n"
