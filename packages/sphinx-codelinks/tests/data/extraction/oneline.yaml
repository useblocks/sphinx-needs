default_oneliner_cpp:
  lang: cpp
  config: default
  source: |
    // @My Title, IMPL_1, impl, [REQ_1]
    void f() {}

default_oneliner_c:
  lang: c
  config: default
  source: |
    // @C Title, IMPL_C, impl, [REQ_C]
    void g(void) {}

default_oneliner_python:
  lang: python
  config: default
  source: |
    # @Py Title, IMPL_PY, impl, [REQ_PY]
    def f():
        pass

default_oneliner_csharp:
  lang: csharp
  config: default
  source: |
    // @Cs Title, IMPL_CS, impl, [REQ_CS]
    class C {}

default_oneliner_rust:
  lang: rust
  config: default
  source: |
    // @Rs Title, IMPL_RS, impl, [REQ_RS]
    fn f() {}

default_oneliner_yaml:
  lang: yaml
  config: default
  source: |
    # @Yaml Title, IMPL_YAML, impl, [REQ_YAML]
    key: value

default_oneliner_bash:
  lang: bash
  config: default
  source: |
    # @Bash Title, IMPL_BASH, impl, [REQ_BASH]
    greet() { echo hi; }

# the shebang is a comment node but must not yield a marker or warning;
# the marker anchors to line 2 and the `function` keyword form also parses
shebang_oneliner_bash:
  lang: bash
  config: default
  source: |
    #!/bin/bash
    # @Bash Title, IMPL_BASH_SHEBANG, impl, [REQ_BASH]
    function greet { echo hi; }

default_oneliner_typescript:
  lang: typescript
  config: default
  source: |
    // @Ts Title, IMPL_TS, impl, [REQ_TS]
    function f(): void {}

# a JSX comment ({/* ... */}) is an ordinary block comment under the TSX
# grammar, so a marker in one extracts like in any /* */ comment
jsx_oneliner_tsx:
  lang: tsx
  config: default
  source: |
    const App = () => (
      <div>
        {/*
          @Tsx Title, IMPL_TSX, impl, [REQ_TSX]
        */}
      </div>
    );

# a legacy HTML-like comment (<!-- ...), valid in JavaScript, is an
# html_comment node, not a comment node, and the query captures both. It runs
# to the end of its line like //, and so does a line that starts with -->
html_comment_oneliner_js:
  lang: js
  config: default
  source: |
    <!-- @Html Title, IMPL_HTML, impl, [REQ_HTML]
    -->
    const x = 1;
