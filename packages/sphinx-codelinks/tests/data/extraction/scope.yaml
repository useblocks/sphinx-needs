# Marker scope association (``scope`` in the snapshot).
#
# ``tagged_scope`` -- the declaration a marker is associated with -- is computed
# by ``find_associated_scope`` per comment_type. Each case here pins one
# association outcome: a marker immediately above a function/method binds to
# that function, a marker at the end of a function body falls back to the
# enclosing function, and a marker with nothing scope-like around it resolves
# to no scope at all (``null``). Python additionally exercises the docstring
# path (``find_enclosing_scope`` rather than ``find_next_scope``), and YAML
# exercises its bespoke structure-association path (inline same-row
# association, and leading comments bound to a following structure).
# TypeScript exercises the declarations wrapped in ``export``, ``declare`` or an
# expression statement, and those that bind only when they hold a function or
# a class (a ``const``, a class field, an assignment, a default export).
# C++ exercises a marker directly above a preprocessor conditional's line, which
# binds to nothing outside a function body and is warned about
# (``marker_above_conditional``, one warning per marker), and the shapes around it
# that keep their scope and give no warning.

cpp_above_function:
  # Marker directly above a function definition -> binds to that function.
  lang: cpp
  config: default
  source: |
    // @Above Function, IMPL_CPP_ABOVE, impl, [REQ_CPP_ABOVE]
    void dummy_func1() {}

cpp_inside_function_body:
  # Marker is the last statement in a function body; nothing follows it, so
  # find_next_scope finds nothing and falls back to the enclosing function.
  lang: cpp
  config: default
  source: |
    void outer() {
        int x = 1;
        // @Inside Function, IMPL_CPP_INSIDE, impl, [REQ_CPP_INSIDE]
    }

cpp_no_scope:
  # Marker followed by a plain declaration (not a function/class) at file
  # scope, with nothing else around it -> no associated scope.
  lang: cpp
  config: default
  source: |
    // @No Scope, IMPL_CPP_NONE, impl, [REQ_CPP_NONE]
    int global_var = 1;

cpp_class_body:
  # Marker inside a class body above a data member: no scope follows it, so
  # the enclosing class binds.
  lang: cpp
  config: default
  source: |
    class Widget {
        // @Owns the buffer, IMPL_CPP_CLASS, impl, [REQ_CPP_CLASS]
        int buf_;
    };

cpp_struct_body:
  # Same for a struct: the enclosing struct binds.
  lang: cpp
  config: default
  source: |
    struct Point {
        // @X coordinate, IMPL_CPP_STRUCT, impl, [REQ_CPP_STRUCT]
        int x;
    };

cpp_above_conditional_namespace:
  # A marker directly above the line of a preprocessor conditional, outside a
  # function body, binds to nothing (clang attaches a comment to no declaration
  # across a ``#`` line): not to the namespace, whose every unit it would trace.
  lang: cpp
  config: default
  source: |
    namespace lib {
    // @Above a conditional, IMPL_CPP_COND_NS, impl, [REQ_CPP_COND]
    #if FEATURE_B
    void active() {}
    #endif
    }

cpp_above_conditional_class_else:
  # The same in a class body, above a conditional with an #else arm.
  lang: cpp
  config: default
  source: |
    class Widget {
        // @Above a conditional, IMPL_CPP_COND_CLASS, impl, [REQ_CPP_COND]
    #if FEATURE_B
        void active() {}
    #else
        void fallback() {}
    #endif
    };

cpp_above_conditional_class_above_else:
  # The last line of an arm, directly above #else, binds to nothing too.
  lang: cpp
  config: default
  source: |
    class Widget {
    #if FEATURE_B
        void active() {}
        // @Above else, IMPL_CPP_COND_ELSE, impl, [REQ_CPP_COND]
    #else
        void fallback() {}
    #endif
    };

cpp_above_conditional_namespace_endif:
  # And directly above #endif.
  lang: cpp
  config: default
  source: |
    namespace lib {
    #if FEATURE_B
    void active() {}
    // @Above endif, IMPL_CPP_COND_ENDIF, impl, [REQ_CPP_COND]
    #endif
    }

cpp_above_conditional_file_level:
  # At file level the marker binds to nothing, as before.
  lang: cpp
  config: default
  source: |
    void first() {}

    // @Above a conditional, IMPL_CPP_COND_FILE, impl, [REQ_CPP_COND]
    #if FEATURE_B
    void active() {}
    #endif

cpp_above_conditional_function_body:
  # In a function body the enclosing function binds, as before.
  lang: cpp
  config: default
  source: |
    void outer() {
        // @Above a conditional, IMPL_CPP_COND_BODY, impl, [REQ_CPP_COND]
    #if FEATURE_B
        fast();
    #endif
    }

cpp_above_conditional_trailing:
  # A trailing marker binds to the entity on its row, as before.
  lang: cpp
  config: default
  source: |
    namespace lib {
    void first() {}  // @Trailing, IMPL_CPP_COND_TRAIL, impl, [REQ_CPP_COND]
    #if FEATURE_B
    void active() {}
    #endif
    }

cpp_above_conditional_blank_line:
  # A blank line between makes the marker a comment on the namespace as a whole:
  # the enclosing namespace binds.
  lang: cpp
  config: default
  source: |
    namespace lib {
    // @On the namespace, IMPL_CPP_COND_BLANK, impl, [REQ_CPP_COND]

    #if FEATURE_B
    void active() {}
    #endif
    }

cpp_inside_conditional_arm:
  # Inside the arm, the marker leads the definition: where to write one for it.
  lang: cpp
  config: default
  source: |
    namespace lib {
    #if FEATURE_B
    // @Inside the arm, IMPL_CPP_COND_ARM, impl, [REQ_CPP_COND]
    void active() {}
    #endif
    }

cpp_above_define:
  # Any other directive, #define here, breaks the attachment to the next entity as
  # code does: the enclosing namespace binds, as before.
  lang: cpp
  config: default
  source: |
    namespace lib {
    // @Above a define, IMPL_CPP_DEFINE, impl, [REQ_CPP_COND]
    #define FAST 1
    void active() {}
    }

cpp_above_conditional_two_markers:
  # A comment run holding two markers above a conditional: each is on nothing, and
  # each gets its own warning, at its own line.
  lang: cpp
  config: default
  source: |
    namespace lib {
    // @First above, IMPL_CPP_COND_TWO_A, impl, [REQ_CPP_COND]
    // @Second above, IMPL_CPP_COND_TWO_B, impl, [REQ_CPP_COND]
    #ifdef FEATURE_B
    void active() {}
    #endif
    }

cpp_above_conditional_need_id_refs:
  # A need-ID reference marker above a conditional: on nothing, and warned about
  # as a reference (type ``need-id-refs``).
  lang: cpp
  config: default
  extract: [need_refs]
  source: |
    class Widget {
        // @need-ids: REQ_CPP_COND_A, REQ_CPP_COND_B
    #if FEATURE_B
        void active() {}
    #endif
    };

cpp_above_conditional_multiline_need:
  # A multi-line need whose block stands above a conditional: on nothing, and
  # warned about at its open line (type ``multiline-need``).
  lang: cpp
  config: default
  extract: [multiline]
  source: |
    namespace lib {
    // @need impl: Above a conditional
    // :id: IMPL_CPP_COND_ML
    // @endneed
    #if FEATURE_B
    void active() {}
    #endif
    }

python_above_function:
  # Marker directly above a function definition -> binds to that function.
  lang: python
  config: default
  source: |
    # @Above Function, IMPL_PY_ABOVE, impl, [REQ_PY_ABOVE]
    def dummy_func1():
        pass

python_inside_function_body:
  # Marker is the last line in a function body -> falls back to the
  # enclosing function.
  lang: python
  config: default
  source: |
    def outer():
        x = 1
        # @Inside Function, IMPL_PY_INSIDE, impl, [REQ_PY_INSIDE]

python_no_scope:
  # Marker followed by a plain statement at module scope, with nothing else
  # around it -> no associated scope.
  lang: python
  config: default
  source: |
    # @No Scope, IMPL_PY_NONE, impl, [REQ_PY_NONE]
    x = 1

python_docstring:
  # A marker inside a function's docstring. Docstrings take the
  # find_enclosing_scope path (rather than find_next_scope), so this binds to
  # the enclosing function even though nothing follows the marker within the
  # docstring itself.
  lang: python
  config: default
  source: |
    def dummy_func1():
        """
        @Docstring Marker, IMPL_PY_DOC, impl, [REQ_PY_DOC]
        """
        pass

csharp_above_method:
  # Marker directly above a method declaration -> binds to that method.
  lang: csharp
  config: default
  source: |
    public class DummyClass
    {
        // @Above Method, IMPL_CS_ABOVE, impl, [REQ_CS_ABOVE]
        public void Method() {}
    }

csharp_inside_method_body:
  # Marker is the last statement in a method body -> falls back to the
  # enclosing method.
  lang: csharp
  config: default
  source: |
    public class DummyClass
    {
        public void Method()
        {
            int x = 1;
            // @Inside Method, IMPL_CS_INSIDE, impl, [REQ_CS_INSIDE]
        }
    }

csharp_no_scope:
  # Marker at file scope, outside any class, followed by a plain using
  # directive -> no associated scope.
  lang: csharp
  config: default
  source: |
    // @No Scope, IMPL_CS_NONE, impl, [REQ_CS_NONE]
    using System;

rust_above_function:
  # Marker directly above a function item -> binds to that function.
  lang: rust
  config: default
  source: |
    // @Above Function, IMPL_RUST_ABOVE, impl, [REQ_RUST_ABOVE]
    fn dummy_func1() {}

rust_inside_function_body:
  # Marker is the last statement in a function body -> falls back to the
  # enclosing function.
  lang: rust
  config: default
  source: |
    fn outer() {
        let x = 1;
        // @Inside Function, IMPL_RUST_INSIDE, impl, [REQ_RUST_INSIDE]
    }

rust_no_scope:
  # Marker followed by a plain static item at file scope, with nothing else
  # around it -> no associated scope.
  lang: rust
  config: default
  source: |
    // @No Scope, IMPL_RUST_NONE, impl, [REQ_RUST_NONE]
    static X: i32 = 1;

go_above_function:
  # Marker directly above a function declaration -> binds to that function.
  lang: go
  config: default
  source: |
    // @Above Function, IMPL_GO_ABOVE, impl, [REQ_GO_ABOVE]
    func dummyFunc1() {}

go_inside_function_body:
  # Marker is the last statement in a function body -> falls back to the
  # enclosing function.
  lang: go
  config: default
  source: |
    func outer() {
        x := 1
        // @Inside Function, IMPL_GO_INSIDE, impl, [REQ_GO_INSIDE]
    }

go_no_scope:
  # Marker followed by a plain var declaration at file scope, with nothing
  # else around it -> no associated scope.
  lang: go
  config: default
  source: |
    // @No Scope, IMPL_GO_NONE, impl, [REQ_GO_NONE]
    var x = 1

go_non_ascii_rune_literal_scope:
  # A rune literal with a non-ASCII character before the marker: the function still binds.
  lang: go
  config: default
  source: |
    package m
    var c = 'é'
    // @T, ID_GO_UTF8, impl
    func f() {}

bash_above_function:
  # Marker directly above a function definition -> binds to that function.
  lang: bash
  config: default
  source: |
    # @Above Function, IMPL_BASH_ABOVE, impl, [REQ_BASH_ABOVE]
    greet() { echo hi; }

bash_inside_function_body:
  # Marker is the last statement in a function body -> falls back to the
  # enclosing function.
  lang: bash
  config: default
  source: |
    greet() {
        echo hi
        # @Inside Function, IMPL_BASH_INSIDE, impl, [REQ_BASH_INSIDE]
    }

bash_no_scope:
  # Marker followed by a plain command, with nothing else around it -> no
  # associated scope.
  lang: bash
  config: default
  source: |
    # @No Scope, IMPL_BASH_NONE, impl, [REQ_BASH_NONE]
    echo hi

bash_non_ascii_identifier_scope:
  # A function name with a non-ASCII character still binds the marker above it.
  lang: bash
  config: default
  source: |
    # @T, ID_BASH_UTF8, impl
    fé() { :; }

powershell_above_function:
  # Marker directly above a top-level function -> binds to that function, which
  # sits inside a statement_list wrapper rather than beside the comment.
  lang: powershell
  config: default
  source: |
    # @Above Function, IMPL_PS_ABOVE, impl, [REQ_PS_ABOVE]
    function Start-Px { }

powershell_inside_function_body:
  # Marker is the last statement in a function body -> falls back to the
  # enclosing function.
  lang: powershell
  config: default
  source: |
    function Start-Px {
        Write-Host 'start'
        # @Inside Function, IMPL_PS_INSIDE, impl, [REQ_PS_INSIDE]
    }

powershell_no_scope:
  # Marker followed by a plain command, with nothing else around it -> no
  # associated scope: only Pester's blocks are scopes among commands.
  lang: powershell
  config: default
  source: |
    # @No Scope, IMPL_PS_NONE, impl, [REQ_PS_NONE]
    Write-Host 'hi'

powershell_scope_after_a_plain_command:
  # A plain command between the marker and the function, at the top of a file -> the
  # command is code between them, so the marker binds neither.
  lang: powershell
  config: default
  source: |
    # @After Command, IMPL_PS_AFTER_CMD, impl, [REQ_PS]
    Set-StrictMode -Version Latest
    function Start-Px { }

powershell_pester_first_in_describe:
  # A marker first in a Describe, followed by BeforeAll -> the command is code
  # before the It, so the marker binds the Describe it is in.
  lang: powershell
  config: default
  source: |
    Describe 'px' {
        # @First Test, TEST_PS_FIRST, test, [REQ_PS]
        BeforeAll { $x = 1 }
        It 'a' { }
    }

powershell_pester_it:
  # Marker above a Pester It nested in a Describe -> binds to the It, five
  # wrapper nodes below the comment's next sibling.
  lang: powershell
  config: default
  source: |
    Describe 'px' {
        # @Starts px, TEST_PS_IT, test, [REQ_PS]
        It 'starts' {
            1 | Should -Be 1
        }
    }

powershell_pester_parameters_before_the_name:
  # Parameters before a Pester block's name -> the name is the -Name argument, else
  # the first positional argument past Pester's switches (-Skip, -AllowNullOrEmptyForEach,
  # -Pending, each also as -X:value) and valued parameters (-Tag, -Tags, -Fixture, -Test,
  # -ForEach, -TestCases); past a parameter Pester does not declare (-Focus), no name.
  lang: powershell
  config: default
  source: |
    Describe -Tag Unit 'px' {
        # @Named, TEST_PS_NAMED, test
        It -Name 'named' { }
        # @Skipped, TEST_PS_SKIPPED, test
        It -Skip 'skipped' { }
        # @Qualified, TEST_PS_QUALIFIED, test
        Pester\It -Tag:Fast -Skip:$false 'qualified' { }
        # @Cases, TEST_PS_CASES, test
        It -ForEach @(1, 2) -AllowNullOrEmptyForEach 'cases <_>' { }
        # @Undeclared, TEST_PS_UNDECLARED, test
        It -Focus 'focused' { }
    }

powershell_constructor:
  # Marker above a method named as its class, in any letter case -> a constructor.
  lang: powershell
  config: default
  source: |
    class Proxy {
        # @Ctor, IMPL_PS_CTOR, impl
        proxy([string] $c) { }
    }

powershell_scope_modifier:
  # Marker above a function defined with a scope modifier -> named without it, as it
  # is called.
  lang: powershell
  config: default
  source: |
    # @Global, IMPL_PS_GLOBAL, impl
    function global:Get-Px { }

powershell_help_first_in_a_body:
  # Comment-based help first in a function's body documents that function, even when
  # a nested function follows; a plain comment there binds the nested function, as in
  # every other language.
  lang: powershell
  config: default
  source: |
    function Start-Px {
        <#
        .SYNOPSIS
            Starts the proxy.
        @Help, IMPL_PS_HELP_BODY, impl
        #>
        function Get-Inner { }
    }
    function Stop-Px {
        # @Plain, IMPL_PS_PLAIN_BODY, impl
        function Get-Inner { }
    }

powershell_trailing_pester_it:
  # A trailing marker after an It on its row -> binds that It, not the Describe
  # around it.
  lang: powershell
  config: default
  source: |
    Describe 'd' {
        It 'x' { } # @Trailing It, TEST_PS_TRAIL_IT, test
    }

powershell_trailing_describe:
  # A trailing marker after a top-level Describe on its row -> binds that Describe.
  lang: powershell
  config: default
  source: |
    Describe 'top' { } # @Trailing Describe, TEST_PS_TRAIL_TOP, test
    function Start-Px { }

powershell_trailing_last_function:
  # A trailing marker after the file's last statement, a function -> binds that
  # function, though the grammar puts the comment beside the statement list.
  lang: powershell
  config: default
  source: |
    function Start-Px { } # @Trailing Function, IMPL_PS_TRAIL_FN, impl

powershell_trailing_describe_at_eof:
  # A trailing marker after the closing brace of the file's last statement, a
  # Describe -> binds that Describe; the grammar puts the comment beside the statement
  # list.
  lang: powershell
  config: default
  source: |
    Describe 'd' {
        It 'x' { }
    } # @Trailing Describe EOF, TEST_PS_TRAIL_DESC_EOF, test

powershell_trailing_pester_it_at_eof:
  # A trailing marker on the closing line of the last It of a Describe that ends the
  # file -> binds that It.
  lang: powershell
  config: default
  source: |
    Describe 'd' {
        It 'x' {
        } # @Trailing It EOF, TEST_PS_TRAIL_IT_EOF, test
    }

powershell_pester_context:
  # A marker above a Context -> binds it, a namespace, as a Describe is; an It is a
  # test.
  lang: powershell
  config: default
  source: |
    Describe 'px' {
        # @Context, TEST_PS_CONTEXT, test
        Context 'when idle' {
            # @It, TEST_PS_IN_CONTEXT, test
            It 'waits' { }
        }
    }

powershell_scope_modifiers:
  # Every scope modifier, in any letter case, is left out of the function's name.
  lang: powershell
  config: default
  source: |
    # @Script, IMPL_PS_SCRIPT_SCOPE, impl
    function Script:Get-Px { }
    # @Private, IMPL_PS_PRIVATE_SCOPE, impl
    filter private:Get-Odd { $_ }
    # @Local, IMPL_PS_LOCAL_SCOPE, impl
    function local:Get-Local { }

powershell_static_constructor:
  # A static constructor is a constructor too; another method is a method, and so is a
  # method named as its class with a return type: a constructor has none.
  lang: powershell
  config: default
  source: |
    class Proxy {
        # @Static ctor, IMPL_PS_STATIC_CTOR, impl
        static Proxy() { }
        # @Method, IMPL_PS_METHOD, impl
        [void] Start() { }
        # @Typed, IMPL_PS_TYPED_PROXY, impl
        [void] Proxy([int] $x) { }
    }

powershell_help_hash_run_first_in_a_body:
  # A run of # lines holding a help keyword, first in a function's body, is that
  # function's help: a marker in it documents the function, even when a nested
  # function follows.
  lang: powershell
  config: default
  source: |
    function Start-Px {
        # .SYNOPSIS
        #     Starts the proxy.
        # @Help run, IMPL_PS_HELP_RUN, impl
        function Get-Inner { }
    }

powershell_help_keyword_lines:
  # A help keyword line holds the keyword alone, or a keyword that takes an argument
  # and that one argument, in any letter case: such a run first in a body is help
  # and documents the function. "# .NOTES: ..." holds more, so it is a plain comment,
  # and the marker after it binds the nested function.
  lang: powershell
  config: default
  source: |
    function Start-Px {
        # .parameter Path
        # .EXTERNALHELP Px-help.xml
        # @Help lines, IMPL_PS_HELP_LINES, impl
        function Get-Inner { }
    }
    function Stop-Px {
        # .NOTES: a detail, not help
        # @Not help, IMPL_PS_NOT_HELP, impl
        function Get-Inner { }
    }

powershell_help_before_and_after:
  # Help before a function binds it as any comment does (leading); help at the end of
  # its body is inside it (enclosing).
  lang: powershell
  config: default
  source: |
    <#
    .SYNOPSIS
    @Help before, IMPL_PS_HELP_BEFORE, impl
    #>
    function Start-Px {
        Get-Date
        <# .NOTES
        @Help after, IMPL_PS_HELP_AFTER, impl
        #>
    }

powershell_pipeline_first_entity:
  # A pipeline, or a chain of pipelines, is the first of its commands in source order
  # that is an entity, on the leading and the trailing path; with none, it is no entity.
  # A comment inside a command of a pipeline is in that command: inside ForEach-Object's
  # block it is not in the Describe before it, and binds the enclosing block.
  lang: powershell
  config: default
  source: |
    Describe 'outer' {
        # @Entity first, TEST_PS_PIPE_FIRST, test
        Describe 'x' { } | Out-Null
        It 'tx' { } | Out-Null # @Trailing entity first, TEST_PS_PIPE_TRAIL, test
        # @Entity after a command, TEST_PS_PIPE_AFTER, test
        Get-Thing | It 'y' { }
        # @Chain, TEST_PS_PIPE_CHAIN, test
        It 'a' { } && It 'b' { }
        Describe 'z' { } | ForEach-Object {
            # @In ForEach-Object, TEST_PS_PIPE_INNER, test
            $_
        }
    }

powershell_trailing_nested_function:
  # A trailing marker after a nested function, the last statement of its body -> binds
  # the nested function, through the body's script block and statement list.
  lang: powershell
  config: default
  source: |
    function Outer { function Inner { } # @Trailing nested, IMPL_PS_TRAIL_NESTED, impl
    }

powershell_non_ascii_scope:
  # Non-ASCII text before the marked function does not lose the scope.
  lang: powershell
  config: default
  source: |
    $greeting = 'Grüße'
    # @T, ID_PS_UTF8, impl
    function Get-Grüße { $greeting }

typescript_above_function:
  # Marker directly above a function declaration -> binds to it.
  lang: typescript
  config: default
  source: |
    // @Above Function, IMPL_TS_ABOVE, impl, [REQ_TS]
    function handle(): void {}

typescript_inside_function_body:
  # Nothing follows the marker in the body -> the enclosing function binds.
  lang: typescript
  config: default
  source: |
    function outer(): void {
      const x = 1;
      // @Inside Function, IMPL_TS_INSIDE, impl, [REQ_TS]
    }

typescript_no_scope:
  # Only a plain (not function-valued) const follows -> no scope.
  lang: typescript
  config: default
  source: |
    // @No Scope, IMPL_TS_NONE, impl, [REQ_TS]
    const limit = 3;

typescript_class_method:
  # Marker inside a class body above a method -> binds to the method.
  lang: typescript
  config: default
  source: |
    class Service {
      // @Method, IMPL_TS_METHOD, impl, [REQ_TS]
      run(): void {}
    }

typescript_export_function:
  # An exported declaration is wrapped in export_statement; the declaration
  # inside binds.
  lang: typescript
  config: default
  source: |
    // @Exported, IMPL_TS_EXPORT, impl, [REQ_TS]
    export function handle(): void {}

typescript_const_arrow:
  # A const whose value is an arrow function binds.
  lang: typescript
  config: default
  source: |
    // @Arrow, IMPL_TS_ARROW, impl, [REQ_TS]
    export const handle = (): void => {};

typescript_plain_const_is_skipped:
  # A plain const is no entity, and it is code: between the marker and the
  # function it ends the marker's adjacency, so the marker binds neither (null).
  lang: typescript
  config: default
  source: |
    // @Skip Const, IMPL_TS_SKIP, impl, [REQ_TS]
    const enabled = true;
    function handle(): void {}

typescript_plain_var_is_skipped:
  # A `var` declaration is an entity only when it holds a function: `var limit = 3;`
  # is code between the marker and the function, so the marker binds neither.
  lang: typescript
  config: default
  source: |
    // @Skip Var, IMPL_TS_SKIP_VAR, impl, [REQ_TS]
    var limit = 3;
    function check(): void {}

typescript_interface:
  # Type-level declarations bind; the function after them does not.
  lang: typescript
  config: default
  source: |
    // @Interface, IMPL_TS_INTERFACE, impl, [REQ_TS]
    interface Options {
      retries: number;
    }
    function unrelated(): void {}

typescript_enum:
  lang: typescript
  config: default
  source: |
    // @Enum, IMPL_TS_ENUM, impl, [REQ_TS]
    enum Mode { Fast, Safe }
    function unrelated(): void {}

typescript_type_alias:
  lang: typescript
  config: default
  source: |
    // @Type Alias, IMPL_TS_ALIAS, impl, [REQ_TS]
    type Handler = (event: string) => void;
    function unrelated(): void {}

typescript_abstract_class:
  lang: typescript
  config: default
  source: |
    // @Abstract Class, IMPL_TS_ABSTRACT, impl, [REQ_TS]
    abstract class Base {}
    function unrelated(): void {}

typescript_generator_function:
  lang: typescript
  config: default
  source: |
    // @Generator, IMPL_TS_GENERATOR, impl, [REQ_TS]
    function* ids(): Generator<number> {}
    function unrelated(): void {}

typescript_const_generator_and_class:
  # A const holding a generator function or a class expression binds.
  lang: typescript
  config: default
  source: |
    // @Const Generator, IMPL_TS_CONST_GEN, impl, [REQ_TS]
    const ids = function* () {};
    // @Const Class, IMPL_TS_CONST_CLASS, impl, [REQ_TS]
    const Widget = class {};
    function unrelated(): void {}

typescript_const_wrapped_function:
  # The function value is seen through `as`, `satisfies`, `!` and parentheses.
  lang: typescript
  config: default
  source: |
    // @As, IMPL_TS_AS, impl, [REQ_TS]
    const onClick = (() => {}) as Handler;
    // @Satisfies, IMPL_TS_SATISFIES, impl, [REQ_TS]
    const onKey = (() => {}) satisfies Handler;
    // @Non Null, IMPL_TS_NON_NULL, impl, [REQ_TS]
    const onDrop = (() => {})!;
    function unrelated(): void {}

typescript_const_type_assertion:
  # A legacy <T>x assertion, legal in .ts only: it parses (no JSX) and binds.
  lang: typescript
  config: default
  source: |
    // @Assertion, IMPL_TS_ASSERTION, impl, [REQ_TS]
    const onFocus = <Handler>(() => {});
    function unrelated(): void {}

typescript_class_field_function:
  # A class field holding an arrow function binds to the field, not the class.
  lang: typescript
  config: default
  source: |
    class Button {
      // @Field, IMPL_TS_FIELD, impl, [REQ_TS]
      onClick = () => {};
      label = "ok";
    }

typescript_plain_class_field_is_skipped:
  # A class field is an entity only when it holds a function: `label = "ok";` ends
  # the marker's adjacency, so it binds the enclosing class, not the method after it.
  lang: typescript
  config: default
  source: |
    class Button {
      // @Skip Field, IMPL_TS_SKIP_FIELD, impl, [REQ_TS]
      label = "ok";
      render(): void {}
    }

typescript_declare:
  # Ambient declarations (`declare …`, the shape of a .d.ts file) bind.
  lang: typescript
  config: default
  source: |
    // @Declare Function, IMPL_TS_DECLARE_FN, impl, [REQ_TS]
    declare function render(): void;
    // @Declare Module, IMPL_TS_DECLARE_MODULE, impl, [REQ_TS]
    declare module "widgets" {}

typescript_export_declare:
  # `export declare …` nests one container in another (export_statement >
  # ambient_declaration), the shape tsc writes into every .d.ts: the declaration
  # inside binds, not the function after it.
  lang: typescript
  config: default
  source: |
    // @Export Declare, IMPL_TS_EXPORT_DECLARE, impl, [REQ_TS]
    export declare function render(): void;
    export function unrelated(): void {}

typescript_declare_const_binds:
  # A const, let or var declared with `declare` holds no value, so it is a scope
  # whatever its type: tsc writes `export const handle = () => {}` into a .d.ts as
  # below. Only the `declare`-prefixed form: a variable inside a `declare namespace`,
  # `module` or `global` body, or a bare `export const x: T;` in a .d.ts, still binds
  # the next declaration.
  lang: typescript
  config: default
  source: |
    // @Declare Const, IMPL_TS_DECLARE_CONST, impl, [REQ_TS]
    export declare const handle: () => void;
    // @Declare Let, IMPL_TS_DECLARE_LET, impl
    export declare let fn: (a: number) => void;
    // @Declare Var, IMPL_TS_DECLARE_VAR, impl
    declare var version: string;
    export declare function unrelated(): void;

typescript_namespace:
  lang: typescript
  config: default
  source: |
    // @Namespace, IMPL_TS_NAMESPACE, impl, [REQ_TS]
    namespace Geometry {
      export const unit = 1;
    }

typescript_interface_method_signature:
  # Marker above a method signature inside an interface binds to the signature.
  lang: typescript
  config: default
  source: |
    interface Store {
      // @Signature, IMPL_TS_SIGNATURE, impl, [REQ_TS]
      load(id: string): void;
    }

typescript_abstract_method_signature:
  # An abstract method signature is a scope: the marker binds it, not the method
  # after it.
  lang: typescript
  config: default
  source: |
    abstract class Job {
      // @Abstract Method, IMPL_TS_ABSTRACT_METHOD, impl, [REQ_TS]
      abstract run(): void;
      helper(): void {}
    }

js_module_exports_function:
  # CommonJS assignments of a function bind to the assignment.
  lang: js
  config: default
  source: |
    // @Module Exports, IMPL_JS_EXPORTS, impl, [REQ_JS]
    module.exports = function handle() {};
    // @Prototype, IMPL_JS_PROTOTYPE, impl, [REQ_JS]
    Widget.prototype.render = function () {};
    function unrelated() {}

js_export_default_anonymous:
  # An anonymous default export binds to the export statement.
  lang: js
  config: default
  source: |
    // @Default Export, IMPL_JS_DEFAULT, impl, [REQ_JS]
    export default () => {};

js_plain_assignment_is_skipped:
  # An assignment is an entity only when it assigns a function: `count = 1;` ends
  # the marker's adjacency, so it binds neither it nor the function after it.
  lang: js
  config: default
  source: |
    // @Skip Assignment, IMPL_JS_SKIP_ASSIGN, impl, [REQ_JS]
    count = 1;
    function tick() {}

js_export_default_value_is_skipped:
  # A default export is an entity only when it exports a function or a class:
  # `export default 42;` ends the marker's adjacency, so it binds neither.
  lang: js
  config: default
  source: |
    // @Skip Default, IMPL_JS_SKIP_DEFAULT, impl, [REQ_JS]
    export default 42;
    function tick() {}

js_jsx_component:
  # JSX in a .js file parses with the TSX grammar, so the component binds.
  lang: js
  config: default
  source: |
    // @Component, IMPL_JS_JSX, impl, [REQ_JS]
    export function Button() {
      return <button>Click</button>;
    }

tsx_jsx_component:
  lang: tsx
  config: default
  source: |
    // @Component, IMPL_TSX_JSX, impl, [REQ_TSX]
    export function Button(): JSX.Element {
      return <button>Click</button>;
    }

yaml_inline_same_row:
  # An inline comment sharing a row with a key-value pair binds to that pair
  # (find_prev_sibling_on_same_row), not to whatever follows.
  lang: yaml
  config: default
  source: |
    key: value  # @Inline Marker, IMPL_YAML_INLINE, impl, [REQ_YAML_INLINE]
    other: 1

yaml_leading_key_value:
  # A leading comment with no same-row predecessor binds to the following
  # key-value pair (find_yaml_next_structure).
  lang: yaml
  config: default
  source: |
    # @Leading Pair Marker, IMPL_YAML_PAIR, impl, [REQ_YAML_PAIR]
    key: value

yaml_leading_list_item:
  # A leading comment binds to the following sequence item (a scalar target,
  # as opposed to a key-value pair).
  lang: yaml
  config: default
  source: |
    # @Leading List Marker, IMPL_YAML_LIST, impl, [REQ_YAML_LIST]
    - item1

yaml_no_scope:
  # A comment with nothing before it on the same row and nothing following
  # it at all -> no associated structure.
  lang: yaml
  config: default
  source: |
    # @No Scope, IMPL_YAML_NONE, impl, [REQ_YAML_NONE]

yaml_non_ascii_key_scope:
  # A key with a non-ASCII character still binds the leading marker above it.
  lang: yaml
  config: default
  source: |
    # @T, ID_YAML_UTF8, impl
    ké: 1
