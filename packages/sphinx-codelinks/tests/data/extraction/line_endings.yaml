# Line endings (``line_endings`` on a case).
#
# Each case's source is written with the line ending it names, and the harness
# also runs it with LF endings and requires the same output: CRLF and a lone CR
# are both read as a line break, so rows, columns, captured text (a multi-line
# ``tagged_scope`` included) and warning lines never depend on the ending.

multi_line_scope_crlf:
  # Every line ends in CRLF, the shape a Windows checkout gives a file.
  lang: cpp
  config:
    need_id_markers: ["REFS:"]
  line_endings: crlf
  source: |
    // @Multi-line title, IMPL_CRLF, impl, [REQ_1]
    void f(
        int a,
        int b
    ) {
        return;
    }
    // REFS: REQ_2, REQ_3
    void g() {}
    // @extra, IMPL_2, impl, [REQ_1], oops
    void h() {}

multi_line_scope_cr:
  # Every line ends in a lone CR (classic Mac OS line endings).
  lang: cpp
  config:
    need_id_markers: ["REFS:"]
  line_endings: cr
  source: |
    // @Multi-line title, IMPL_CR, impl, [REQ_1]
    void f(
        int a,
        int b
    ) {
        return;
    }
    // REFS: REQ_2, REQ_3
    void g() {}
    // @extra, IMPL_2, impl, [REQ_1], oops
    void h() {}

powershell_scope_crlf:
  # A Windows checkout of a PowerShell script: CRLF endings, a marker with a link
  # above a multi-line function.
  lang: powershell
  config: default
  line_endings: crlf
  source: |
    # @Multi-line title, IMPL_PS_CRLF, impl, [REQ_1]
    function Start-Px {
        param([string] $Config)
        Write-Host $Config
    }

powershell_pester_and_help_crlf:
  # A Windows checkout of a Pester test file: CRLF endings, a marker in help first in a
  # function's body, a marker above an It and one trailing another.
  lang: powershell
  config: default
  line_endings: crlf
  source: |
    function Start-Px {
        <# .SYNOPSIS
        @Help, IMPL_PS_HELP_CRLF, impl
        #>
        function Get-Inner { }
    }
    Describe 'px' {
        # @Starts, TEST_PS_IT_CRLF, test
        It 'starts' { }
        It 'stops' { } # @Stops, TEST_PS_TRAIL_CRLF, test
    }

vhdl_crlf:
  # A VHDL ``--`` comment's node ends with its line break: under CRLF the grammar would
  # hold the CR and leave the LF outside, under LF it holds the LF. Read either way, the
  # markers, their columns and the multi-line need are the same.
  lang: vhdl
  config: default
  line_endings: crlf
  source: |
    -- @Crlf need, IMPL_VHDL_CRLF, impl
    entity top is
    end entity top; -- @need-ids: REQ_1
    -- @need impl: Crlf block
    -- :id: IMPL_VHDL_CRLF_BLOCK
    -- @endneed
