why = "refused at load, once, at its entry: a new name that is already a need type; the preset is left out"
config = '''
[parse.directive_presets.spec]
base = "note"
'''
source = '''
Text.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_name_taken"
path = "parse.directive_presets.spec"

[[case]]
name = "refused-unknown-option"
why = "refused at load, once, at its entry: an option the base does not take; the preset is left out"
config = '''
[parse.directive_presets.x]
base = "note"
options = { colour = "red" }
'''
source = '''
.. x::

   Body.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_unknown_option"
path = "parse.directive_presets.x.options.colour"

