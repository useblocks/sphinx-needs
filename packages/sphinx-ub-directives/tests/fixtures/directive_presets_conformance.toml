[[case]]
name = "refused-case-duplicate-names"
why = "two presets whose names differ only in case are one name: the second spelling is refused, the first is used"
config = '''
[parse.directive_presets.Callout]
base = "note"
append_options = { class = "first" }

[parse.directive_presets.callout]
base = "note"
append_options = { class = "second" }
'''
source = '''
.. callout::

   Body.
'''
equivalent = '''
.. note::
   :class: first

   Body.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_name_taken"
path = "parse.directive_presets.callout"

[[case]]
name = "unknown-key-keeps-the-preset"
