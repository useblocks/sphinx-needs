config = '''
[parse.directive_presets.x]
base = "note"
force_option = { class = "typo" }
'''
source = '''
.. x::

   Body.
'''
equivalent = '''
.. note::

   Body.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_unknown_key"
path = "parse.directive_presets.x.force_option"

[[case]]
name = "every-problem-of-an-entry-is-reported"
why = "every problem of one entry is reported, and the entry is left out"
config = '''
[parse.directive_presets.x]
base = "note"
options = { colour = "red", class = ["a"] }
argument = "T"
'''
source = '''
Text.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_unknown_option"
path = "parse.directive_presets.x.options.colour"
[[case.expect.findings]]
code = "directive_preset_invalid_value"
path = "parse.directive_presets.x.options.class"
[[case.expect.findings]]
code = "directive_preset_argument_not_accepted"
path = "parse.directive_presets.x.argument"

[[case]]
name = "a-refused-preset-costs-only-its-entry"
why = "a refused entry costs only that entry: the project's other presets are used"
config = '''
[parse.directive_presets.bad]
base = "no-such"

[parse.directive_presets.callout]
base = "note"
append_options = { class = "callout" }
'''
source = '''
.. callout::

   Body.
'''
equivalent = '''
.. note::
   :class: callout

   Body.
'''
[case.expect]
[[case.expect.findings]]
code = "directive_preset_unknown_base"
path = "parse.directive_presets.bad.base"

[[case]]
name = "refused-wrong-field-type"
why = "refused at load: a need field value of the wrong type (ubCode checks field schemas at load; a Sphinx build checks them at each need)"
config = '''
[needs.fields.priority]
schema = { type = "integer" }

[parse.directive_presets.x]
base = "req"
options = { priority = "high" }
'''
source = '''
Text.
'''
ubcode_only = true
[case.expect]
[[case.expect.findings]]
code = "directive_preset_invalid_value"
path = "parse.directive_presets.x.options.priority"

