# Conformance corpus for DIRECTIVE PRESETS: a `[parse.directive_presets.<name>]` entry of
# `ubproject.toml` -- how an entry is read and checked, and what a use of the preset is.
#
# Repository of record: useblocks/sphinx-needs (public)
# Canonical path:       packages/sphinx-ub-directives/tests/fixtures/directive_presets_conformance.toml
#
# THIS copy is CANONICAL. ubCode is to vendor it byte-for-byte, with a provenance block
# (this path, and the commit it was taken from) prepended and nothing else changed, and to
# run it against its own engine. The corpus travels public -> private, so vendoring with a
# recorded source commit is the sync mechanism.
#
# Do not reformat this file. `.gitattributes` pins its line endings, and the taplo hook
# excludes it: every `config`, `source`, `equivalent` and `files` body below is the INPUT
# of a case, so a formatter touching one silently changes what the case tests. A change
# here is a change to the contract (`packages/sphinx-ub-directives/design/directives-contract.md`),
# and owes ubCode a re-vendor.
#
# Rules for every runner:
#   - a case is one project. `config` is its `ubproject.toml`; `source` is the body of its
#     one document, under a title the runner adds: `index.rst` under "Case\n====\n\n" when
#     `markup` is "rst" (the default), `index.md` under "# Case\n\n" when it is "md".
#     `files` (optional) are other files of the project, relative to the case directory. A
#     case writes only inside its own directory: a `files` key that would land outside it
#     (`../x.json`) is a broken case, and the runner refuses it. A Markdown case's `config`
#     carries `[parse.parsers.md] flavour = "myst"` for ubCode; the Sphinx runner loads
#     myst-parser for every case
#   - the Sphinx runner's `conf.py` loads `sphinx_needs`, `sphinx_design`, `myst_parser`,
#     `sphinx.ext.autodoc` and `sphinx_ub_directives`, and reads the needs configuration from the same `ubproject.toml`
#     (`needs_from_toml`); nothing else. ubCode reads the file as a project
#   - every need id satisfies the default id regex (`^[A-Z0-9_]{5,}`); the need types are
#     the default ones (`req`, `spec`, `impl`, `test`), so a case never carries a need type
#     spelled with upper-case letters (the contract refuses one as a preset base, and a Sphinx
#     build cannot use one at all)
#   - a case never depends on the order of a mapping, never holds YAML, and never names a
#     third-party directive (a directive of no extension listed above), except where it is
#     about exactly that
#   - `equivalent` (optional) is the same page written WITHOUT the preset: the base directive
#     with the options the preset merges in written out. It is built as a project of its
#     own, with the same `config` and `files`, and each runner asserts that the two give the
#     SAME PRODUCTS IN THAT TOOL -- its rendered page and its needs (positions dropped) --
#     never across tools: the two tools' page forms are not compared with each other
#   - a case with `python_only = true` is one only the Sphinx runner runs, and ubCode's
#     runner skips it; `ubcode_only = true` is the converse. Each says in its `why` why the
#     other tool cannot run it
#   - needs values are compared as `needs.json` writes them, TYPE INCLUDED: `7.0` is a float
#     and `7` an integer, and the two differ; a link list is a list of id strings, and
#     `sections` the list of section titles from the need's own section outwards
#   - findings are compared as a MULTISET of `code`, and of `path` and `directive` where the
#     finding names them; a key a finding leaves out is not compared. `code` is the BARE
#     contract code (`directive_preset_unknown_base`, not `config.directive_preset_unknown_base`
#     or `ub_directives.directive_preset_unknown_base`). `path` is the dotted `ubproject.toml`
#     path a configuration finding is reported at, spelled as ub-project's reading contract
#     (section 7.2) spells one; `directive` is the name of the directive a finding at a use is
#     reported at, in lower case. Lines, columns, messages and severities are NEVER compared.
#     Only the codes of the presets contract are compared --
#         directive_preset_unknown_base, directive_preset_base_is_preset,
#         directive_preset_name_taken, directive_preset_unknown_option,
#         directive_preset_invalid_value, directive_preset_option_conflict,
#         directive_preset_append_not_list, directive_preset_argument_not_accepted,
#         directive_preset_identity_option, directive_preset_unknown_key,
#         preset_forced_option
#     -- every other finding (an image file that cannot be read, a document in no toctree)
#     is each tool's own
#   - a `nulls` entry names a need of the case and a field that need carries, pinned as null;
#     a `missing` entry names a need id the case must NOT create
#
# `packages/sphinx-ub-directives/tests/test_presets_conformance.py` runs every case AND
# asserts the case COUNT, so a truncated copy is a red test rather than reduced coverage.
#
# Each `[[case]]` has:
#   name         - unique, kebab-case
#   why          - one line saying what the case pins
#   markup       - optional; "rst" (the default) or "md": the markup of the one page
#   config       - the `ubproject.toml`
#   source       - the body of the page
#   equivalent   - optional; the same page written with the base (see the rules above)
#   files        - optional; other files, relative to the case directory, and their text
#   python_only  - optional; see the rules above
#   ubcode_only  - optional; see the rules above
#   [case.expect]
#     findings         - the findings, `[]` for none; or one `[[case.expect.findings]]`
#                        table per finding: `code`, and `path` or `directive` where named
#     needs.<ID>       - one table per pinned need: field = value
#     nulls            - <ID> = [the fields pinned as null]
#     missing          - [the need ids the case must not create]

[[case]]
name = "identity-admonition-rst"
why = "an option-less preset of admonition is admonition: the same page and needs as the base"
config = '''
[parse.directive_presets.pf-admonition]
base = "admonition"
'''
source = '''
.. pf-admonition:: A *title*
   :class: x
   :name: adm-a

   Body.

See :ref:`adm-a`.
'''
equivalent = '''
.. admonition:: A *title*
   :class: x
   :name: adm-a

   Body.

See :ref:`adm-a`.
'''
[case.expect]
findings = []

