"c.json" = '''
{"rows": [{"id": "REQ_DA01", "title": "First", "links": []}, {"id": "REQ_DA02", "title": "Second", "links": ["REQ_DA01"]}, {"id": "REQ_DA03", "title": "Third", "links": ["REQ_DA01", "REQ_DA02"]}]}
'''
"_t/gen.rst.j2" = '''
{% for r in contexts.c.rows %}
.. req:: {{ r.title }}
