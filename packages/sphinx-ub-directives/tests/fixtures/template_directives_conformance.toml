[[case]]
name = "rx-nested-template-name-in-capitals"
why = "a declared template written in capitals in output is a nested expansion"
config = '''
[parse.directive_templates.emit]
body = "{{ body }}\n\n.. req:: Kept after the refused directive\n   :id: REQ_KEPT\n"
content = true

[parse.directive_templates.inner]
body = ".. req:: Inner\n   :id: REQ_INNER\n"
'''
source = '''
.. emit::

   .. INNER::
'''
[case.expect]
expansions = [
'''
.. INNER::

.. req:: Kept after the refused directive
   :id: REQ_KEPT''',
]
missing = ["REQ_INNER"]
[case.expect.needs.REQ_KEPT]
title = "Kept after the refused directive"
[[case.expect.findings]]
code = "template_nested_expansion"
directive = "emit"

[[case]]
name = "rx-reading-fence-name-in-capitals-md"
why = "a MyST include fence written in capitals in Markdown output is refused"
markup = "md"
config = '''
[parse.directive_templates.emit]
body = "{{ body }}\n\n```{req} Kept after the refused directive\n:id: REQ_KEPT\n```\n"
content = true
markup = "md"

[parse.parsers.rst]

[parse.parsers.md]
flavour = "myst"
'''
source = '''
`````{emit}
```{Include} inc.txt
```
`````
'''
[case.files]
"inc.txt" = '''
.. req:: Leaked
   :id: REQ_LEAK
'''
"code.py" = '''
x = 1
'''
"page.html" = '''
<p>SECRET</p>
'''
[case.expect]
expansions = [
'''
```{Include} inc.txt
```

```{req} Kept after the refused directive
:id: REQ_KEPT
```''',
]
missing = ["REQ_LEAK"]
[case.expect.needs.REQ_KEPT]
title = "Kept after the refused directive"
[[case.expect.findings]]
code = "template_output_reads_file"
directive = "emit"

