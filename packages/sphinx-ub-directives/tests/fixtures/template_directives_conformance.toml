why = "a JSON key written twice keeps its first position and its last value"
config = '''
[parse.template_contexts.c]
file = "c.json"

[parse.directive_templates.d]
body = "{% for k, v in contexts.c|items %}{{ k }}={{ v }};{% endfor %}"
'''
source = '''
.. d::
'''
[case.files]
"c.json" = '''
{"a": 1, "b": 2, "a": 3}
'''
[case.expect]
expansions = [
'''
a=3;b=2;''',
]
findings = []

