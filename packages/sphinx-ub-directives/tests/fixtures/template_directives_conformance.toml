[[case]]
name = "bx-breaker-successes-do-not-reset"
why = "the breaker: successful uses between failures neither count nor reset it"
config = '''
[parse.directive_templates.big]
body = "{% for i in range(argument|int) %}{{ 'x' * 1024 }}{% endfor %}"
argument = { required = true }
'''
source = '''
.. big:: 1100

.. big:: 1

.. big:: 1101

.. big:: 1102

.. big:: 2

.. big:: 1100
'''
[case.expect]
expansions = [
'''
''',
]
[[case.expect.findings]]
code = "template_disabled"
directive = "big"
[[case.expect.findings]]
code = "template_output_limit"
directive = "big"
[[case.expect.findings]]
code = "template_output_limit"
directive = "big"
[[case.expect.findings]]
code = "template_output_limit"
directive = "big"
[[case.expect.findings]]
code = "template_output_limit"
directive = "big"

