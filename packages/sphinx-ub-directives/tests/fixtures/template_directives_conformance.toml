{% if r.links %}   :links: {{ r.links|join(', ') }}
{% endif %}
{% endfor %}'''
[case.expect]
expansions = [
'''

.. req:: First
   :id: REQ_DA01


.. req:: Second
   :id: REQ_DA02
   :links: REQ_DA01


.. req:: Third
   :id: REQ_DA03
   :links: REQ_DA01, REQ_DA02

''',
]
findings = []
[case.expect.needs.REQ_DA01]
title = "First"
sections = ["Sub", "Case"]
[case.expect.needs.REQ_DA02]
links = ["REQ_DA01"]
[case.expect.needs.REQ_DA03]
links = ["REQ_DA01", "REQ_DA02"]

