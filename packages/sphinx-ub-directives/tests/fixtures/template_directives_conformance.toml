.. d::
'''
[case.files]
"c.json" = '''
{"q": "say \"hi\"", "b": "back\\slash", "j": "{{ x }} {% raw %} %}", "n": "l1\nl2", "t": "a\tb", "u": "\u00e9\ud83d\ude00", "s": "it's"}
'''
[case.expect]
expansions = [
'''
q=[say "hi"]b=[back\slash]j=[{{ x }} {% raw %} %}]n=[l1
l2]t=[a	b]u=[é😀]s=[it's]''',
]
findings = []

