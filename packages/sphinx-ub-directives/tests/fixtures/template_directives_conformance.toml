[[case]]
name = "declared-sees-every-context"
why = "a declared template sees every context by name, under contexts"
config = '''
[parse.template_contexts.team]
lead = "Ada"
members = ["Bob", "Cy"]

[parse.directive_templates.team-reqs]
body = "The lead is **{{ contexts.team.lead }}**.\n\n{% for m in contexts.team.members %}\n.. req:: Member {{ m }}\n   :id: REQ_{{ m|upper }}\n\n{% endfor %}\n"
'''
source = '''
.. team-reqs::
'''
equivalent = '''
The lead is **Ada**.


.. req:: Member Bob
   :id: REQ_BOB


.. req:: Member Cy
   :id: REQ_CY


'''
[case.expect]
expansions = [
'''
The lead is **Ada**.


.. req:: Member Bob
   :id: REQ_BOB


.. req:: Member Cy
   :id: REQ_CY

''',
]
findings = []
[case.expect.needs.REQ_BOB]
title = "Member Bob"
[case.expect.needs.REQ_CY]
title = "Member Cy"

[[case]]
name = "needs-from-a-json-file"
why = "needs generated from a JSON data file are ordinary needs of the page, under the heading the template writes"
config = '''
[parse.template_contexts.reqs]
file = "data/reqs.json"

[parse.directive_templates.reqs-table]
template = "_templates/reqs.rst.j2"
'''
source = '''
.. reqs-table::
'''
equivalent = '''
Generated requirements
----------------------


.. req:: Boot in under a second
   :id: REQ_001
   :status: open


.. req:: Never lose data
   :id: REQ_002
   :status: closed
   :links: REQ_001


'''
[case.files]
"data/reqs.json" = '''
{"title": "Generated requirements", "reqs": [
  {"id": "REQ_001", "title": "Boot in under a second", "status": "open"},
  {"id": "REQ_002", "title": "Never lose data", "status": "closed", "links": ["REQ_001"]}
]}
'''
"_templates/reqs.rst.j2" = '''
{{ contexts.reqs.title }}
{{ "-" * contexts.reqs.title|length }}

{% for r in contexts.reqs.reqs %}
.. req:: {{ r.title }}
   :id: {{ r.id }}
   :status: {{ r.status }}
{%- if r.links is defined %}
   :links: {{ r.links|join(", ") }}
{%- endif %}

{% endfor %}
'''
[case.expect]
expansions = [
'''
Generated requirements
----------------------


.. req:: Boot in under a second
   :id: REQ_001
   :status: open


.. req:: Never lose data
   :id: REQ_002
   :status: closed
   :links: REQ_001

''',
]
findings = []
[case.expect.needs.REQ_001]
type = "req"
title = "Boot in under a second"
status = "open"
sections = ["Generated requirements", "Case"]
[case.expect.needs.REQ_002]
status = "closed"
links = ["REQ_001"]
sections = ["Generated requirements", "Case"]

[[case]]
