# Conformance corpus for TEMPLATE DIRECTIVES: declared template directives
# (`[parse.directive_templates.<name>]`), their data (`[parse.template_contexts.<name>]` and
# `var`), and the generic `ub-template` directive (`[parse] ub_template_enabled`) -- what a
# template sees, what it renders, how the output joins the page, and what is reported.
#
# Repository of record: useblocks/sphinx-needs (public)
# Canonical path:       packages/sphinx-ub-directives/tests/fixtures/template_directives_conformance.toml
# minijinja:            2.24.0 (the series both tools pin, and the version this corpus was
#                       recorded against; a runner asserts the version it renders with)
#
# THIS copy is CANONICAL. ubCode is to vendor it byte-for-byte, with a provenance block
# (this path, and the commit it was taken from) prepended and nothing else changed, and to
# run it against its own engine. The corpus travels public -> private, so vendoring with a
# recorded source commit is the sync mechanism.
#
# Do not reformat this file. `.gitattributes` pins its line endings, and the taplo hook
# excludes it: every `config`, `source`, `equivalent` and `files` body below is the INPUT
# of a case, and every `expansions` string is compared EXACTLY, so a formatter touching one
# silently changes what the case tests. A change here is a change to the contract
# (`packages/sphinx-ub-directives/design/directives-contract.md`), and owes ubCode a
# re-vendor.
#
# Rules for every runner:
#   - a case is one project. `config` is its `ubproject.toml`; `source` is the body of its
#     one document, under a title the runner adds: `<page>.rst` under "Case\n====\n\n" when
#     `markup` is "rst" (the default), `<page>.md` under "# Case\n\n" when it is "md".
#     `page` (optional, default "index") is that document's name, `/`-separated; when it is
#     not "index", the runner also writes `index.rst` holding only "Index\n=====\n\n" and a
#     `toctree` naming the page, and every comparison below is of the page, not the index.
#     `files` (optional) are other files of the project, relative to the case directory,
#     which is also the SOURCE ROOT. A case writes only inside its own directory: a `files`
#     key that would land outside it (`../x.json`) is a broken case, and the runner refuses
#     it. A Markdown case's `config` carries `[parse.parsers.md] flavour = "myst"` for
#     ubCode; the Sphinx runner loads myst-parser for every case
#   - the Sphinx runner's `conf.py` loads `sphinx_needs`, `myst_parser` and
#     `sphinx_ub_directives`, and reads the needs configuration (and the variants) from the
#     same `ubproject.toml` (`needs_from_toml`); nothing else. ubCode reads the file as a
#     project
#   - every need id satisfies the default id regex (`^[A-Z0-9_]{5,}`); the need types are
#     the default ones (`req`, `spec`, `impl`, `test`), never one spelled with upper-case
#     letters
#   - a case never holds an integer outside the signed 64-bit range except to pin that it is
#     refused, and never the JSON number `-0` (unspecified)
#   - a case never pins a fuel, value-size or recursion edge (which template exceeds one of
#     those limits is implementation-defined; only "an output over 1 MiB is refused" is
#     pinned), never depends on the order of a mapping unless the case is about order,
#     never holds YAML except to pin that it is refused, and never names a third-party
#     directive (one of no extension listed above) except as the subject of a reads-a-file
#     row of the contract, refused or allowed
#   - `expansions` lists, in document order, the text of every template use whose output
#     joins the page (parsed, or emitted raw), EXACTLY as the engine rendered it; a use that
#     renders nothing contributes nothing. ubCode's runner reads the text from its
#     expansion driver; the Sphinx runner from the package's one render seam
#   - `equivalent` (optional) is the same page with each use's output written out by hand.
#     It is built as a project of its own, with the same `config` and `files`, and each
#     runner asserts that the two give the SAME PRODUCTS IN THAT TOOL -- its rendered page
#     and its needs (positions dropped) -- never across tools
#   - a case with `python_only = true` is one only the Sphinx runner runs, and ubCode's
#     runner skips it; `ubcode_only = true` is the converse. Each says in its `why` why.
#   - `var` iterates in SORTED key order, recursively (§4.4's one carve-out: the merged
#     variant map is sorted in ubCode, where it is part of every project's configuration
#     hash); every other mapping iterates in the order its data writes it
#   - a case never writes an RST option name with capitals, except the cases that pin that
#     a declared signature and the reads-a-file refusal compare RST option names
#     case-insensitively (ubCode's RST parser compares them as written elsewhere: a
#     registered difference); a case never writes an option twice; no case depends on the
#     order of a TOML table defined implicitly before its own header; no case holds an
#     integer beyond the signed 64-bit range in VARIANT data
#   - template output never holds a section title, except to pin that it is refused
#     (`template_heading`): headings in template output are not part of this version
#   - ubCode has no `{eval-rst}` (a general registered difference), so a case that uses one
#     is python_only
#   - needs values are compared as `needs.json` writes them, TYPE INCLUDED; `sections` is
#     the list of section titles from the need's own section outwards
#   - findings are compared as a MULTISET of `code`, and of `path` and `directive` where the
#     finding names them; a key a finding leaves out is not compared. `code` is the BARE
#     contract code (`template_signature`, which ubCode spells `template.signature` and a
#     Sphinx build reports as `ub_directives.template_signature`; the contract lists every
#     spelling). `path` is the dotted `ubproject.toml` path of a configuration finding;
#     `directive` is the name of the template directive whose use a finding is reported at,
#     in lower case (`ub-template`, or a declared name). Lines, columns, messages and
#     severities are NEVER compared. Only the codes of the template contract are compared --
#         directive_template_invalid, template_context_reserved, template_switched_off,
#         template_signature, template_option_invalid, template_context_unknown,
#         template_context_invalid, template_context_unavailable, template_missing,
#         template_outside_root, template_render_error, template_output_limit,
#         template_disabled, template_nested_expansion, template_output_reads_file,
#         template_heading, template_markup_construct, directive_template_unknown_key
#     -- and, in a case that also declares presets, the presets corpus's codes
#     -- every other finding (an unknown directive, an image that cannot be read) is each
#     tool's own
#   - a `nulls` entry names a need of the case and a field that need carries, pinned as null;
#     a `missing` entry names a need id the case must NOT create
#
# `packages/sphinx-ub-directives/tests/test_templates_conformance.py` runs every case AND
# asserts the case COUNT, so a truncated copy is a red test rather than reduced coverage.
#
# Each `[[case]]` has:
#   name         - unique, kebab-case
#   why          - one line saying what the case pins
#   markup       - optional; "rst" (the default) or "md": the markup of the one page
#   page         - optional; the page's document name (default "index"), see the rules
#   config       - the `ubproject.toml`
#   source       - the body of the page
#   equivalent   - optional; the page with the output written out (see the rules above)
#   files        - optional; other files, relative to the case directory, and their text
#   python_only  - optional; see the rules above
#   ubcode_only  - optional; see the rules above
#   [case.expect]
#     expansions       - the rendered texts, in document order, `[]` for none; absent only
#                        where the text is too large to write, and then not compared
#     findings         - the findings, `[]` for none; or one `[[case.expect.findings]]`
#                        table per finding: `code`, and `path` or `directive` where named
#     needs.<ID>       - one table per pinned need: field = value
#     nulls            - <ID> = [the fields pinned as null]
#     missing          - [the need ids the case must not create]

[[case]]
name = "declared-file-template"
why = "a declared template renders its file with argument and options (a default applied), and the output is the page's"
config = '''
[parse.directive_templates.req-row]
template = "_templates/req_row.rst.j2"
description = "One requirement row"
argument = { required = true, description = "Requirement id" }

[parse.directive_templates.req-row.options]
owner = { required = true, description = "Who owns it" }
status = { choices = ["open", "closed"], default = "open" }
'''
source = '''
.. req-row:: REQ_ROW
   :owner: Ada
'''
equivalent = '''
.. req:: Owned by Ada
   :id: REQ_ROW
   :status: open
'''
[case.files]
"_templates/req_row.rst.j2" = '''
.. req:: Owned by {{ options.owner }}
   :id: {{ argument }}
   :status: {{ options.status }}
'''
[case.expect]
expansions = [
'''
.. req:: Owned by Ada
   :id: REQ_ROW
   :status: open''',
]
findings = []
[case.expect.needs.REQ_ROW]
type = "req"
title = "Owned by Ada"
status = "open"
sections = ["Case"]

[[case]]
name = "declared-use-is-case-insensitive"
why = "a declared name is looked up case-insensitively, as every directive name is"
config = '''
[parse.directive_templates.req-row]
template = "_templates/req_row.rst.j2"
description = "One requirement row"
argument = { required = true, description = "Requirement id" }

[parse.directive_templates.req-row.options]
owner = { required = true, description = "Who owns it" }
status = { choices = ["open", "closed"], default = "open" }
'''
source = '''
.. REQ-Row:: REQ_ROW
   :owner: Ada
'''
[case.files]
"_templates/req_row.rst.j2" = '''
.. req:: Owned by {{ options.owner }}
   :id: {{ argument }}
   :status: {{ options.status }}
'''
[case.expect]
expansions = [
'''
.. req:: Owned by Ada
   :id: REQ_ROW
   :status: open''',
]
findings = []
[case.expect.needs.REQ_ROW]
title = "Owned by Ada"

[[case]]
name = "declared-uses-in-document-order"
why = "two uses render in document order, each with its own options"
config = '''
[parse.directive_templates.req-row]
template = "_templates/req_row.rst.j2"
description = "One requirement row"
argument = { required = true, description = "Requirement id" }

[parse.directive_templates.req-row.options]
owner = { required = true, description = "Who owns it" }
status = { choices = ["open", "closed"], default = "open" }
'''
source = '''
.. req-row:: REQ_ROW
   :owner: Ada

.. req-row:: REQ_TWO
   :owner: Bob
   :status: closed
'''
[case.files]
"_templates/req_row.rst.j2" = '''
.. req:: Owned by {{ options.owner }}
   :id: {{ argument }}
   :status: {{ options.status }}
'''
[case.expect]
expansions = [
'''
.. req:: Owned by Ada
   :id: REQ_ROW
   :status: open''',
'''
.. req:: Owned by Bob
   :id: REQ_TWO
   :status: closed''',
]
findings = []
[case.expect.needs.REQ_ROW]
status = "open"
[case.expect.needs.REQ_TWO]
status = "closed"

[[case]]
name = "declared-inline-body"
why = "a declared template's body is the template text itself"
config = '''
[parse.directive_templates.inline-row]
body = ".. req:: Inline {{ argument }}\n   :id: REQ_{{ argument|upper }}\n"
argument = { required = true }
'''
source = '''
.. inline-row:: one
'''
equivalent = '''
.. req:: Inline one
   :id: REQ_ONE
'''
[case.expect]
expansions = [
'''
.. req:: Inline one
   :id: REQ_ONE''',
]
findings = []
[case.expect.needs.REQ_ONE]
title = "Inline one"

[[case]]
name = "declared-options-surface"
why = "options holds every declared option: a default applied, a flag as a boolean, an unset one none; an absent argument is none"
config = '''
[parse.directive_templates.seen]
body = "Seen: {{ argument is none }} {{ options.status }} {{ options.draft }} {{ options.note is none }}"
argument = { required = false }

[parse.directive_templates.seen.options]
status = { default = "open" }
draft = { flag = true }
note = {}
'''
source = '''
.. seen::

.. seen:: A
   :status: done
   :draft:
   :note: n
'''
equivalent = '''
Seen: True open False True

Seen: False done True False
'''
[case.expect]
expansions = [
'''
Seen: True open False True''',
'''
Seen: False done True False''',
]
findings = []

[[case]]
name = "declared-content-is-body"
why = "content = true passes the directive's body to the template as body"
config = '''
[parse.directive_templates.boxed]
body = ".. note::\n\n   {{ body|indent(3) }}\n"
content = true
'''
source = '''
