<!--
  sphinx-test-reports logo (dark theme).

  A clipboard holding three test results (pass, fail, pass), each a mark and a result
  line, with the failure's line cut short. Drawn in the same flat geometry as the
  sibling sites' logos (sphinx-mounts, sphinx-codelinks): one accent colour
  (#e4ff3e), the name below in Liberation Mono Bold (#ffffff), transparent background.

  The name is converted to outlines, so the logo looks the same whatever fonts the
  reader has. The light and dark logos differ only in their two colours.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 400"
     width="760"
     height="400"
     role="img"
     aria-label="sphinx-test-reports">
  <title>sphinx-test-reports</title>

  <g transform="translate(290 24) scale(1.5)">
    <g fill="#e4ff3e">
      <!-- Board: an outline, so the background shows through it -->
      <rect x="4.5" y="18.5" width="111" height="127" rx="12"
            fill="none" stroke="#e4ff3e" stroke-width="9"/>
      <!-- Clip -->
      <rect x="34" y="0" width="52" height="28" rx="6"/>
      <!-- Results: pass, fail, pass -->
      <polyline points="23,58 30,65 43,50" fill="none" stroke="#e4ff3e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="55" y="52" width="42" height="10" rx="5"/>
      <path d="M25,81 L41,97 M41,81 L25,97" fill="none" stroke="#e4ff3e" stroke-width="6" stroke-linecap="round"/>
      <rect x="55" y="84" width="24" height="10" rx="5"/>
      <polyline points="23,122 30,129 43,114" fill="none" stroke="#e4ff3e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="55" y="116" width="42" height="10" rx="5"/>
    </g>
  </g>

