<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  sphinx-test-reports favicon.

  The sphinx-mounts convention: a dark rounded square with the dark-variant accent on
  top. At 16 to 32 px the logo's three result rows smear together, so the clipboard
  keeps one large tick: still the same board and clip as the full logo.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-label="sphinx-test-reports favicon">
  <title>sphinx-test-reports</title>

  <!-- Dark rounded-square background -->
  <rect x="0" y="0" width="64" height="64" rx="8" ry="8" fill="#0a0000"/>

  <g fill="#e4ff3e">
    <!-- Board -->
    <rect x="15" y="12" width="34" height="44" rx="5"
          fill="none" stroke="#e4ff3e" stroke-width="5"/>
    <!-- Clip -->
    <rect x="23" y="6" width="18" height="11" rx="3"/>
    <!-- One passing result -->
    <polyline points="23,35 30,42 42,27"
              fill="none" stroke="#e4ff3e" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
