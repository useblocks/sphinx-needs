name: CI
on: [pull_request]
jobs:
  tests:
    name: "Test (python: ${{ matrix.python-version }}, sphinx: ${{ matrix.sphinx-version }}, sphinx-needs: ${{ matrix.sphinx_needs-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        sphinx-version: ["7.4.7", "8.1.3"]
        sphinx_needs-version: ["6.0.1", "6.3.0", "7.0.0", "8.0.0", "8.5.0"]
    steps:
      - uses: actions/checkout@v2
      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nox Dependencies
        run: |
          python -m pip install poetry nox nox-poetry
      - name: Run Tests
        run: nox --non-interactive --session "tests-${{ matrix.python-version }}(sphinx='${{ matrix.sphinx-version }}', sphinx_needs='${{ matrix.sphinx_needs-version }}')" -- --full-trace

  plugin-floor:
    name: "Plugin (python: ${{ matrix.python-version }}, pytest: ${{ matrix.pytest-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            pytest-version: "7.0.1"
          - python-version: "3.12"
            pytest-version: "7.3.2"
    steps:
      - uses: actions/checkout@v2
      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nox Dependencies
        run: |
          python -m pip install poetry nox nox-poetry
      - name: Run the plugin's tests on the oldest supported pytest
        run: nox --non-interactive --session "plugin_floor(python='${{ matrix.python-version }}', pytest_version='${{ matrix.pytest-version }}')" -- --full-trace

  toolchain-free:
    # The converter and the pytest plugin run without Sphinx; this installs the
    # package with the `pytest` extra alone and runs their tests where Sphinx is
    # absent, the only thing that guarantees it.
    name: "Test without Sphinx (python: ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v2
      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Nox
        run: |
          python -m pip install nox
      - name: Run Tests
        run: nox --non-interactive --session "toolchain_free-${{ matrix.python-version }}" -- --full-trace

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set Up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"
      - name: Install Nox Dependencies
        run: |
          python -m pip install poetry nox nox-poetry
      - uses: pre-commit/action@v3.0.0

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: uv sync
        # The toolchain is an extra: without it, mypy cannot follow the
        # extension's Sphinx and docutils imports.
        run: |
          uv sync --group dev --extra sphinx

      - name: Run mypy
        run: |
          uv run mypy

  linkcheck:
    name: Docs-Linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set Up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"
      - name: Install Nox Dependencies
        run: |
          python -m pip install poetry nox nox-poetry
      - name: Run LinkCheck
        run: nox --non-interactive --session linkcheck -- --full-trace

  all_good:
    # This job does nothing and is only used for the branch protection
    # see https://github.com/marketplace/actions/alls-green#why

    if: ${{ !cancelled() }}

    needs:
      - tests
      - plugin-floor
      - toolchain-free
      - pre-commit
      - mypy
      - linkcheck

    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
