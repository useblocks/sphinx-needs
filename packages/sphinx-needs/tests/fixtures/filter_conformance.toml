# --- logic -----------------------------------------------------------------------------

[[case]]
name = "logic"
why = "and, or and not combine expressions with Python's precedence, parentheses group them and not negates a group; True and False are expressions; and and or stop where Python's stop, so an operand they do not reach is never read"
config = '''
[needs]
'''
source = '''
.. req:: Alpha
   :id: REQ_001
   :status: open
   :tags: a

.. req:: Beta
   :id: REQ_002
   :status: closed
   :tags: b

.. spec:: Gamma
   :id: SPEC_001
   :status: open
   :tags: a, b
'''

[[case.filters]]
filter = 'status == "open" and "a" in tags'
expected = ["REQ_001", "SPEC_001"]
tier = "index"

[[case.filters]]
filter = 'status == "closed" or "b" in tags'
expected = ["REQ_002", "SPEC_001"]
tier = "fast"

[[case.filters]]
filter = 'not status == "open"'
expected = ["REQ_002"]

[[case.filters]]
filter = 'not ("b" in tags or type == "spec")'
expected = ["REQ_001"]

[[case.filters]]
filter = '(type == "spec" or status == "closed") and "b" in tags'
expected = ["REQ_002", "SPEC_001"]

[[case.filters]]
filter = 'type == "spec" or status == "closed" and "b" in tags'
expected = ["REQ_002", "SPEC_001"]
why = "and binds tighter than or"

[[case.filters]]
filter = 'not (not status == "open")'
expected = ["REQ_001", "SPEC_001"]

[[case.filters]]
filter = "type=='spec'or status!='open'"
expected = ["REQ_002", "SPEC_001"]
why = "a filter is a Python expression: an operator needs no space around it"
divergent = { ubcode = "refused when the filter is parsed: a keyword operator needs a space on each side" }

[[case.filters]]
filter = '(status == "open")and("a" in tags)'
expected = ["REQ_001", "SPEC_001"]
why = "nor does and between parentheses"
divergent = { ubcode = "refused when the filter is parsed: a keyword operator needs a space on each side" }

[[case.filters]]
filter = 'True'
expected = ["REQ_001", "REQ_002", "SPEC_001"]
tier = "index"

[[case.filters]]
filter = 'False'
expected = []
tier = "index"

[[case.filters]]
filter = 'False or type == "spec"'
expected = ["SPEC_001"]
tier = "fast"

[[case.filters]]
filter = 'not True'
expected = []
tier = "fast"

[[case.filters]]
filter = 'not False and status == "open"'
expected = ["REQ_001", "SPEC_001"]

[[case.filters]]
filter = 'type == "test" and absent == 1'
expected = []
why = "no need is a test, so absent is never read: no error"

[[case.filters]]
filter = 'type == "req" or absent == 1'
expected = ["REQ_001", "REQ_002"]
error = "filter"
why = "the reqs stop at the first operand; SPEC_001 reads absent, and fails"
divergent = { ubcode = "an evaluation error fails the whole filter, so nothing is selected" }

