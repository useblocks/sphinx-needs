.. plain:: Refused: not derived
   :id: PLAIN_1

.. spec:: Does not declare it
   :id: SPEC_1
   :mentions: REQ_1

.. early:: Sets the shape, not derived
   :id: EARLY_1
   :notes: REQ_1

.. late:: Refused: derived
