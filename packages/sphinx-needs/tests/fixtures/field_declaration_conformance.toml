type = "spec"
field = "links"
[[case.expect.findings]]
code = "type_conflict"
type = "spec"
field = "owner"
[[case.expect.findings]]
code = "type_conflict"
type = "spec"
field = "title"
[[case.expect.findings]]
code = "type_conflict"
type = "impl"
field = "owner"
[[case.expect.findings]]
code = "type_conflict"
type = "test"
field = "owner"
