[[case]]
name = "type-local-fingerprint"
why = "a field declared on need types alone enters the fingerprint of a declaring need where it is not None, its type's default too, never on a need of another type"
# the JSON texts hashed:
#   A_001  {"id":"A_001","title":"Set","type":"a","x":"v"}
#   A_002  {"id":"A_002","title":"Its type's default","type":"a","x":"d"}
#   C_001  {"id":"C_001","title":"Not declaring it","type":"c"}
config = '''
