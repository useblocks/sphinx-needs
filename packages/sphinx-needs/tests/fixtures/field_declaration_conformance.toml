[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
default = "QM"

[needs.fields.weight]
schema = { type = "number" }
default = 1

[needs.fields.weights]
schema = { type = "array", items = { type = "number" } }
default = [1]

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.asil]
default = "A"

[needs.types.spec.fields.lvl]
schema = { type = "integer" }
default = 1

[needs.types.child]
title = "Child"
prefix = "C_"
inherits = "spec"

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. spec:: Its type's default
   :id: SPEC_001
   :weight: 1.0
   :weights: 1.0

.. spec:: The field's own default, authored
   :id: SPEC_002
   :asil: QM

.. child:: An inherited type default
   :id: CHILD_001

.. req:: The field's own default
   :id: REQ_001
'''
[case.expect]
findings = []
[case.expect.needs.SPEC_001]
