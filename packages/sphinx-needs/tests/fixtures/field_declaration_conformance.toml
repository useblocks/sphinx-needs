fp = "57501c8cc5c85edda788545556aa52e23bbc9e581adef74ff394d31bc1e665f2"
[case.expect.needs.SPEC_1]
asil = "A"
fp = "1d8265e8b356f03ac07d6fef52c49e3d44575c9ef64c7c8a7b40007e170c78db"
[case.expect.needs.SPEC_2]
asil = "QM"
fp = "474d91e1c8f4c48cff7420a4074fa18dc65cdde78303bcb667a3d1b8fba63051"

# --- link types declared on need types alone ------------------------------------------

[[case]]
name = "type-local-link-type"
why = "a links entry naming what nothing else declares is a link type of the types declaring it, by their entry, an empty one, or a parent's (a child's own agreeing entry included): [] on every other type's needs, never null, and a link set there is one undeclared_for_type and ignored; its back links are on every need (a derived count over them); needs.json declares it once, by the types without a declaring ancestor"
config = '''
[needs.fields.n]
schema = { type = "integer" }
nullable = false
derive = { kind = "count", over = "verifies_back" }

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.links.verifies]
incoming = "is verified by"

[needs.types.sreq]
title = "Safety requirement"
prefix = "SR_"
inherits = "req"

[needs.types.sreq.links.verifies]
incoming = "is verified by"

[needs.types.test]
title = "Test case"
prefix = "T_"

[needs.types.test.links.verifies]

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.preq]
title = "Plain child"
prefix = "PR_"
inherits = "req"
'''
source = '''
.. req:: Declares it
   :id: REQ_1
   :verifies: SPEC_1

.. sreq:: Declares it by its parent
   :id: SREQ_1
   :verifies: SPEC_1

.. test:: Declares it by an empty entry
   :id: TEST_1
   :verifies: REQ_1

.. spec:: Does not declare it
   :id: SPEC_1
   :verifies: REQ_1

.. preq:: Declares it by its parent alone
   :id: PREQ_1
   :verifies: SPEC_1
'''
[case.expect]
[case.expect.needs.REQ_1]
verifies = ["SPEC_1"]
n = 1
[case.expect.needs.SREQ_1]
verifies = ["SPEC_1"]
n = 0
[case.expect.needs.TEST_1]
verifies = ["REQ_1"]
n = 0
[case.expect.needs.SPEC_1]
verifies = []
n = 3
[case.expect.needs.PREQ_1]
verifies = ["SPEC_1"]
[case.expect.schema.verifies]
type = "array"
description = "Declared by need types 'req', 'test'"
[[case.expect.findings]]
code = "undeclared_for_type"
need = "SPEC_1"
field = "verifies"
type = "spec"

[[case]]
name = "type-local-link-first-root-sets-the-shape"
why = "the first root declaration of a link type, an empty one too, sets its incoming, outgoing, copy, dead links and style (the needs_links defaults for what it leaves out); another declaration may repeat a value and no more: a later root giving another value, a key the first left out included, is one type_conflict and does not declare the link type (its need holds [], a link there is undeclared_for_type); a child giving another value is one type_conflict, its default ignored, and still declares it through its parent; a child of a refused root is a root of its own"
config = '''
[needs.types.a]
title = "A"
prefix = "A_"

[needs.types.a.links.rel]

[needs.types.b]
title = "B"
prefix = "B_"

[needs.types.b.links.rel]
incoming = "related from"

[needs.types.c]
title = "C"
prefix = "C_"

[needs.types.c.links.rel]
outgoing = "rel"

[needs.types.ca]
title = "CA"
prefix = "CA_"
inherits = "a"

[needs.types.ca.links.rel]
outgoing = "other"
default = ["A_001"]

[needs.types.bb]
title = "BB"
prefix = "BB_"
inherits = "b"

[needs.types.bb.links.rel]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.links.verifies]
incoming = "is verified by"

[needs.types.bad]
title = "Bad"
prefix = "BAD_"

[needs.types.bad.links.verifies]
incoming = "verified by"
'''
source = '''
.. a:: Sets the shape, empty
   :id: A_001

.. b:: Refused: it cannot add an incoming
   :id: B_001
   :rel: A_001

.. c:: Repeats a default
   :id: C_001
   :rel: A_001

.. ca:: Refused child, no default
   :id: CA_001

.. ca:: Refused child, still declaring
   :id: CA_002
   :rel: A_001

.. bb:: A root of its own: its parent is refused
   :id: BB_001
   :rel: A_001

.. req:: Sets the shape
   :id: REQ_1
   :verifies: A_001

.. bad:: Refused: another incoming
   :id: BAD_001
   :verifies: A_001
'''
[case.expect]
[case.expect.needs.B_001]
rel = []
[case.expect.needs.C_001]
rel = ["A_001"]
[case.expect.needs.CA_001]
