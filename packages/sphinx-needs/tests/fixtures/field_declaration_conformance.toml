[[case]]
name = "a-bare-entry-narrows-an-extensions-field-on-its-type"
why = "a bare entry naming a need type an extension registers narrows the extension's field on that type: a value its narrower schema refuses is field_fail on that type's needs, not on the extension's other types"
extensions = ["sphinx_test_reports"]
config = '''
[needs.types.testcase.fields.suite]
schema = { minLength = 10 }
'''
source = '''
.. test-file:: Report
   :id: TF_0001
   :file: report.xml
   :auto_suites:
   :auto_cases:
'''
files = { "report.xml" = '''
<?xml version="1.0" encoding="utf-8"?>
<testsuites>
<testsuite name="suite_a" tests="2" errors="0" failures="1" skipped="0" time="0.5">
<testcase classname="tests.test_x" name="test_pass" time="0.1"/>
<testcase classname="tests.test_x" name="test_fail[a-b]" time="0.2"><failure message="boom">trace</failure></testcase>
</testsuite>
</testsuites>
''' }
[case.expect]
[case.expect.needs.TF_0001_F0D]
suite = "suite_a"
[case.expect.needs.TF_0001_F0D_61F00]
suite = "suite_a"
[[case.expect.findings]]
code = "field_fail"
need = "TF_0001_F0D_61F00"
field = "suite"
[[case.expect.findings]]
code = "field_fail"
need = "TF_0001_F0D_85463"
field = "suite"

[[case]]
name = "a-full-entry-narrows-an-extensions-type"
why = "an entry with a title and a prefix naming a need type an extension registers narrows it too, the keys it gives winning, the extension's other types untouched"
extensions = ["sphinx_test_reports"]
config = '''
[needs.types.testcase]
title = "Case"
prefix = "C_"
'''
source = '''
.. test-file:: Report
   :id: TF_0001
   :file: report.xml
   :auto_suites:
   :auto_cases:
'''
files = { "report.xml" = '''
<?xml version="1.0" encoding="utf-8"?>
<testsuites>
<testsuite name="suite_a" tests="2" errors="0" failures="1" skipped="0" time="0.5">
<testcase classname="tests.test_x" name="test_pass" time="0.1"/>
<testcase classname="tests.test_x" name="test_fail[a-b]" time="0.2"><failure message="boom">trace</failure></testcase>
</testsuite>
</testsuites>
''' }
[case.expect]
findings = []
[case.expect.needs.TF_0001_F0D_61F00]
type_name = "Case"
result = "passed"
[case.expect.needs.TF_0001_F0D]
type_name = "Test-Suite"
