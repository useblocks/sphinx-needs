[needs.types.sspec]
title = "Sub-specification"
prefix = "SS_"
inherits = "spec"

[needs.types.impl]
title = "Implementation"
prefix = "I_"
'''
source = '''
.. req:: Target
   :id: REQ_1

.. spec:: The type's rule
   :id: SPEC_1

.. sspec:: The parent's rule
   :id: SSPEC_1

.. impl:: No rule, authored
   :id: IMPL_1
   :covers: REQ_1
'''
[case.expect]
[case.expect.needs.REQ_1]
covers = []
[case.expect.needs.SPEC_1]
covers = ["REQ_1"]
[case.expect.needs.SSPEC_1]
covers = ["REQ_1"]
[case.expect.needs.IMPL_1]
covers = []
[[case.expect.findings]]
code = "derive_authored"
need = "IMPL_1"
field = "covers"

