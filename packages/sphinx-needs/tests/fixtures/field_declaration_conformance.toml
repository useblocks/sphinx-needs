prefix = "SS_"
inherits = "safety_req"

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.fields.asil]
schema = { enum = ["A", "B", "C"] }
default = "A"

[needs.types.safety_req]
title = "Safety requirement"
prefix = "SR_"
inherits = "req"

[needs.types.safety_req.fields.asil]
schema = { enum = ["B", "C"] }
default = "B"

[needs.types.safety_test]
title = "Safety test"
prefix = "ST_"
inherits = "req"

[needs.types.safety_test.fields.asil]
schema = { enum = ["A", "B"] }
'''
source = '''
.. req:: Root
   :id: REQ_1

.. safety_req:: Child
   :id: SREQ_1

.. safety_spec:: Grandchild
   :id: SSPEC_1

.. safety_spec:: Grandchild, outside the inherited enum
   :id: SSPEC_2
   :asil: A

.. safety_test:: The parent's default, under its own schema
   :id: STEST_1
'''
[case.expect]
[case.expect.needs.REQ_1]
asil = "A"
[case.expect.needs.SREQ_1]
asil = "B"
[case.expect.needs.SSPEC_1]
asil = "B"
[case.expect.needs.SSPEC_2]
asil = "A"
[case.expect.needs.STEST_1]
asil = "A"
