[[case]]
name = "what-cannot-be-declared"
why = "a declaration naming no field of its table (a link type under fields, a field under links), changing the field's type, giving a default of another type, or giving title a default is one type_conflict each and ignored; the needs hold what the field's own declaration gives"
config = '''
[needs.fields.owner]
schema = { type = "string" }
default = "nobody"

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.links]
description = "A link type under fields"

[needs.types.spec.links.owner]
description = "A field under links"

[needs.types.spec.fields.title]
default = "Untitled"

[needs.types.impl]
title = "Implementation"
prefix = "I_"

[needs.types.impl.fields.owner]
schema = { type = "integer" }
default = 3

[needs.types.test]
title = "Test case"
prefix = "T_"

[needs.types.test.fields.owner]
default = 3
'''
source = '''
.. req:: Target
   :id: REQ_1

.. spec:: Spec
   :id: SPEC_1
   :links: REQ_1

.. impl:: Impl
   :id: IMPL_1

.. test:: Test
   :id: TEST_1
'''
[case.expect]
[case.expect.needs.SPEC_1]
title = "Spec"
owner = "nobody"
links = ["REQ_1"]
[case.expect.needs.IMPL_1]
owner = "nobody"
[case.expect.needs.TEST_1]
owner = "nobody"
[[case.expect.findings]]
