[[case]]
name = "defaults-left-out-restored-from-the-file"
why = "a value a needs.json leaves out is restored from the file's own needs_schema, the field's default in the project that wrote it, and not from the importing project's declarations, a need type's default or the field's; the importing project's defaults fill only a field the file's schema gives no default; a value the file states is kept"
config = '''
[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
default = "B"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.asil]
default = "A"

[needs.types.spec.fields.lvl]
schema = { type = "integer" }
default = 1
'''
source = '''
.. needimport:: other.json
   :filter: id == 'SPEC_001'

.. needimport:: other.json
   :filter: id == 'SPEC_002'

.. needimport:: other.json
   :filter: id == 'SPEC_003'
'''
files = { "other.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "needs_amount": 3,
      "needs_defaults_removed": true,
      "needs_schema": {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "type": "object",
        "properties": {
          "asil": {"type": ["string", "null"], "description": "", "field_type": "extra", "default": "QM"}
        }
      },
      "needs": {
        "SPEC_001": {"id": "SPEC_001", "type": "spec", "title": "Left out"},
        "SPEC_002": {"id": "SPEC_002", "type": "spec", "title": "Written", "asil": "A"},
        "SPEC_003": {"id": "SPEC_003", "type": "spec", "title": "Written in full", "asil": "QM"}
      }
    }
  }
}
''' }
[case.expect]
findings = []
[case.expect.needs.SPEC_001]
asil = "QM"
lvl = 1
[case.expect.needs.SPEC_002]
asil = "A"
lvl = 1
[case.expect.needs.SPEC_003]
asil = "QM"
lvl = 1

# --- the target types of a link type --------------------------------------------------

[[case]]
name = "link-target-types-global"
why = "target_types on a [needs.links] entry holds for the links of every need type: a link to a need of another type is one link_target_type at the source need, naming the target's type, and the link is kept"
config = '''
[needs.links.verifies]
target_types = ["req"]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.test]
title = "Test"
prefix = "T_"
'''
source = '''
.. req:: Target
   :id: REQ_1

.. spec:: Target of another type
   :id: SPEC_1

.. test:: Verifies both
   :id: TEST_1
   :verifies: REQ_1, SPEC_1

.. spec:: Verifies a spec
   :id: SPEC_2
   :verifies: SPEC_1
'''
[case.expect]
[case.expect.needs.TEST_1]
verifies = ["REQ_1", "SPEC_1"]
[case.expect.needs.SPEC_2]
verifies = ["SPEC_1"]
[[case.expect.findings]]
code = "link_target_type"
need = "TEST_1"
field = "verifies"
type = "spec"
[[case.expect.findings]]
code = "link_target_type"
need = "SPEC_2"
field = "verifies"
type = "spec"

