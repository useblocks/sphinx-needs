[needs.links.verifies]
target_types = ["req"]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.test]
title = "Test"
prefix = "T_"
'''
