inherits = "req"

[needs.types.safety_req.fields.asil]
schema = { enum = ["A", "B", "C"] }
default = "B"
'''
source = '''
.. safety_req:: Inside the widened enum
   :id: SREQ_1
   :asil: C

.. safety_req:: Inside the parent's
   :id: SREQ_2
   :asil: A

.. safety_req:: Unset: the entry's default is not taken
   :id: SREQ_3
'''
