why = "while a link type copies into links (copy = true), links holds links written in it and links copied into it, so its target_types is refused, on [needs.links.links] and on a need type's entry alike (each tool's configuration finding, not compared: the case pins its consequence), and no link of links is checked against it; the copying link type's own target_types still holds"
config = '''
[needs.links.links]
target_types = ["spec"]

[needs.links.verifies]
copy = true
target_types = ["spec"]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.test]
title = "Test"
prefix = "T_"

[needs.types.test.links.links]
target_types = ["spec"]
'''
source = '''
.. req:: Requirement
   :id: REQ_1

.. req:: Requirement
   :id: REQ_2

.. test:: Verifies a req, and links reqs
   :id: TEST_1
   :verifies: REQ_1
   :links: REQ_1, REQ_2
'''
[case.expect]
[case.expect.needs.TEST_1]
verifies = ["REQ_1"]
links = ["REQ_1", "REQ_2"]
[[case.expect.findings]]
code = "link_target_type"
need = "TEST_1"
field = "verifies"
type = "req"

[[case]]
name = "link-target-types-beside-condition"
why = "the target type and a [condition] on the same link are checked apart: a link failing both is a link_target_type (and the condition's finding, each tool's own, not compared), and a link failing its condition alone is no link_target_type"
