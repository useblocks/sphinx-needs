# Conformance corpus for FIELDS PER NEED TYPE: the `inherits`, `fields` and `links` of a
# `[needs.types.<t>]` entry -- how a need type declares a field anew, what its needs then
# hold, and what is reported.
#
# Repository of record: useblocks/sphinx-needs (public)
# Canonical path:       packages/sphinx-needs/tests/fixtures/field_declaration_conformance.toml
#
# THIS copy is CANONICAL. ubCode is to vendor it byte-for-byte, with a provenance block
# (this path, and the commit it was taken from) prepended and nothing else changed, and to
# run it against its own engine. The corpus travels public -> private, so vendoring with a
# recorded source commit is the sync mechanism.
#
# Do not reformat this file. `.gitattributes` pins its line endings, and the taplo hook
# excludes it: every `config = '''...'''` and `source = '''...'''` body below is the INPUT
# of a case, so a formatter touching one silently changes what the case tests. A change
# here is a change to the contract, and owes ubCode a re-vendor.
#
# Rules for every runner:
#   - a case is one project. `config` is its `ubproject.toml` (the `[needs]` configuration
#     only); `source` is the body of its one reStructuredText document, `index.rst`, under
#     a title the runner adds; `files` (optional) are other files of the project, relative
#     to the case directory. A case writes only inside its own directory: a `files` key
#     that would land outside it (`../x.json`) is a broken case, and the runner refuses it
#   - a case declares ITS OWN need types, each with a `title` and a `prefix`: a
#     `needs_types` that is given replaces the default list, so no case relies on `req` or
#     `spec` existing unless it declares them. The cases use the mapping shape,
#     `[needs.types.<t>]`, but one, which pins the list shape, `[[needs.types]]`
#   - every need id satisfies the default id regex (`^[A-Z0-9_]{5,}`)
#   - the agreement rule: a type's declaration of a field starts from the field's own
#     declaration and takes its ancestors' from the root down, then its own; each must
#     narrow the one before it. A field need types alone declare has ONE shape (its type,
#     its items' type, whether it is derived) on every type declaring it, set by the
#     first root declaration -- of a type none of whose ancestors declares it -- giving a
#     `schema` `type`; a root of another shape is refused. A link type need types alone
#     declare has one shape too: whether it is derived, and its `incoming`, `outgoing`,
#     `copy`, `allow_dead_links`, `color` and `style*` keys, set by its first root
#     declaration, an empty one included (the `[needs.links.*]` defaults for the keys it
#     leaves out); every other declaration may repeat a value, and no more
#   - the walk order decides which is first: the types in the order the `config` gives
#     them, but each parent before its children wherever it is given, and the members of a
#     broken `inherits` cycle in the order of the walk up from the first type given that is
#     on the cycle or inherits into it -- the last reached first (`a` inheriting `b`
#     inheriting `a`, `a` given first, resolves `b`, then `a`; with `c` inheriting `a`
#     given before both, the walk starts at `c` and reaches `a`, then `b`, so it resolves
#     `b`, then `a`, then `c`, whichever of `a` and `b` is given first)
#   - absence is per field: a field that need types alone declare (no `[needs.fields.*]`
#     entry, no core field, no link type) is carried by every need, `null` on the needs of
#     a type that does not declare it; a field no declaration of which is usable does not
#     exist, and is no key of any need. A link type need types alone declare (no
#     `[needs.links.*]` or `[[needs.extra_links]]` entry, no core link type, no field) is
#     carried by every need too, `[]` -- no links -- on the needs of a type that does not
#     declare it, never null: no link list is null, and an empty one is no links
#   - a `[needs.fields.<name>]` entry without `nullable` is nullable in both tools, so its
#     unset value is null; a case writes `nullable = false` where it means the type's empty
#     value instead
#   - a case with `python_only = true` is one only sphinx-needs runs, and ubCode's runner
#     skips it; `ubcode_only = true` is the converse
#   - values are compared as `needs.json` writes them, TYPE INCLUDED: `7.0` is a float and
#     `7` an integer, and the two differ; a link list is a list of id strings, as
#     `needs.json` writes it
#   - findings are compared as a MULTISET of `code`, and of `need`, `field` and `type`
#     where the finding names them; a key a finding leaves out is not compared. `code` is
#     the BARE subcode (`type_conflict`, not `needs.type_conflict`). Messages and
#     severities are NOT compared. Only the codes of the per-type declaration contract are
#     compared --
#         type_inherits, type_conflict, type_widening, undeclared_for_type, needextend,
#         derive_authored, derive_invalid, dynamic_function, create_need, field_fail,
#         link_fail
#     -- every other finding is each tool's own. `config` is not among them: it is every
#     configuration finding, so a bare `config` would match any; a case that would pin a
#     `needs.config` warning pins its consequence for a value instead, and says so
#   - a finding's `need` is the need it is reported at (the need's directive, or for
#     `field_fail` and `link_fail` the need validated); a finding of the configuration has
#     none, and so has one at a `needextend`, and a `create_need` finding, whose need is
#     not created, and one about a need from `needs_external_needs`, which has no
#     directive. A finding about a need a `needimport` imports is reported at the
#     `needimport`, so a case imports ONE need per `needimport`, and the finding's `need`
#     is that need's own id. Its `field` is the field or link type it is about (a link
#     type's, as a field's, is its name: `.links['<l>']` in an entry). Its
#     `type` is the need type it is about. As sphinx-needs spells them (ubCode's runner
#     reads its own diagnostics for the same facts): the entry a finding of the schema's
#     build names (`needs_types['<t>']`, whose `.fields['<f>']` or `.links['<f>']` is its
#     `field`), the type a `type_inherits` finding opens with (`Need type '<t>'`), the type
#     an `undeclared_for_type` or a `needextend` finding names (`on need type '<t>'`); a
#     finding of another code (`field_fail`, `derive_authored`) has none
#   - `create_need` is the finding of a need that is not created: here, one without a value
#     of a field its type makes not nullable, with no default (`Field '<f>'` is its field)
#   - `field_fail` and `link_fail` are the schema validation's findings of a need whose
#     value of a field (`field_fail`: an enum, a `minItems`) or whose links of a link type
#     (`link_fail`: a `maxItems`) fail the schema as its need type declares it; a value
#     failing two keywords is two findings, one per keyword, in both tools.
#     sphinx-needs reports them as `[sn_schema_violation.field_fail]` and
#     `[sn_schema_violation.link_fail]` with no source location, and its runner reads the
#     need and the field or link type from the `schema_violations.json` the validation
#     writes beside `needs.json` (`validation_warnings.<need id>[]`, `subtype` and
#     `details.field`), not from the warning stream, so each is counted once
#   - a runner that cannot read a record carrying one of these codes FAILS the case rather
#     than skip the record
#   - a `nulls` entry names a need of the case and a field that need carries: `needs.json`
#     writes every declared field (and link type) on every need, null included, so a
#     runner asserts the need and the field are PRESENT, then that the value is null; a
#     missing need or field fails the case
#   - an `absent` entry names a need of the case and a field that does NOT exist: the
#     runner asserts the need is present and the field is no key of its record (not a
#     null: a null is a field that exists and is unset)
#   - a `missing` entry names a need the case's source gives that is NOT created: the
#     runner asserts its id is no key of the needs `needs.json` writes
#   - a `schema.<field>` table names keys of the field's entry in the `needs_schema`
#     `properties` `needs.json` writes, each compared as a value is; a key it leaves out
#     is not compared
#
# `packages/sphinx-needs/tests/test_field_declaration_conformance.py` runs every case with
# the `needs` builder AND asserts the case COUNT, so a truncated copy is a red test rather
# than reduced coverage. The prose half of the contract is the "Fields per need type"
# section of the sphinx-needs documentation (`needs_types`).
#
# Each `[[case]]` has:
#   name         - unique, kebab-case
#   why          - one line saying what the case pins
#   config       - the `ubproject.toml`, its need types included
#   source       - the body of `index.rst`
#   files        - optional; other files, relative to the case directory, and their text
#   python_only  - optional; see the rules above
#   ubcode_only  - optional; see the rules above
#   [case.expect]
#     findings         - the findings, `[]` for none; or one `[[case.expect.findings]]`
#                        table per finding: `code`, and `need`, `field` and `type` where
#                        named
#     needs.<ID>       - one table per pinned need: field = value
#     nulls            - <ID> = [the fields pinned as unset] (TOML has no null)
#     absent           - <ID> = [the fields pinned as not existing]
#     missing          - [the ids of needs pinned as not created]
#     schema.<field>   - one table per pinned field schema: key = value

# --- the field's own declaration, and the value of a need ---------------------------

[[case]]
name = "global-only"
why = "with no declaration on a need type, a needs_fields default and enum reach every type: unset needs take the default, a value outside the enum fails on each type"
config = '''
[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B"] }
default = "QM"

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"
'''
source = '''
.. req:: Unset
   :id: REQ_1

.. spec:: Unset
   :id: SPEC_1

.. req:: Outside the enum
   :id: REQ_2
   :asil: Z

.. spec:: Outside the enum
   :id: SPEC_2
   :asil: Z
'''
[case.expect]
[case.expect.needs.REQ_1]
asil = "QM"
[case.expect.needs.SPEC_1]
asil = "QM"
[case.expect.needs.REQ_2]
asil = "Z"
[case.expect.needs.SPEC_2]
asil = "Z"
[[case.expect.findings]]
code = "field_fail"
need = "REQ_2"
field = "asil"
[[case.expect.findings]]
code = "field_fail"
need = "SPEC_2"
field = "asil"

[[case]]
name = "type-default-and-predicates"
why = "a need's unset field takes the first matching predicate of its type (the field's, unless the type declares predicates), else the type's default, else the field's; its own value wins; predicates = [] leaves the type none"
config = '''
[needs.fields.asil]
schema = { type = "string" }
default = "QM"
predicates = [["status == 'hot'", "B"]]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.asil]
default = "A"

[needs.types.impl]
title = "Implementation"
prefix = "I_"

[needs.types.impl.fields.asil]
default = "A"
predicates = [["status == 'cold'", "C"]]

[needs.types.test]
title = "Test case"
prefix = "T_"

[needs.types.test.fields.asil]
predicates = []
'''
source = '''
.. req:: The field's default
   :id: REQ_1

.. req:: The field's predicate
   :id: REQ_2
   :status: hot

.. spec:: The type's default
   :id: SPEC_1

.. spec:: The field's predicate, before the type's default
   :id: SPEC_2
   :status: hot

.. impl:: The type's predicate
   :id: IMPL_1
   :status: cold

.. impl:: The type's predicates replace the field's
   :id: IMPL_2
   :status: hot

.. impl:: Its own value
   :id: IMPL_3
   :status: cold
   :asil: D

.. test:: No predicate on the type
   :id: TEST_1
   :status: hot
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
asil = "QM"
[case.expect.needs.REQ_2]
asil = "B"
[case.expect.needs.SPEC_1]
asil = "A"
[case.expect.needs.SPEC_2]
asil = "B"
[case.expect.needs.IMPL_1]
asil = "C"
[case.expect.needs.IMPL_2]
asil = "A"
[case.expect.needs.IMPL_3]
asil = "D"
[case.expect.needs.TEST_1]
asil = "QM"

[[case]]
name = "core-field-per-type"
why = "a core field is declared like any other: status with a default and an enum on req holds the default on req's unset needs and fails outside the enum there; spec is free"
config = '''
[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.fields.status]
default = "open"
schema = { enum = ["open", "closed"] }

[needs.types.spec]
title = "Specification"
prefix = "S_"
'''
source = '''
.. req:: Unset
   :id: REQ_1

.. req:: Outside the enum
   :id: REQ_2
   :status: wip

.. spec:: Unset
   :id: SPEC_1

.. spec:: Free
   :id: SPEC_2
   :status: wip
'''
[case.expect]
[case.expect.needs.REQ_1]
status = "open"
[case.expect.needs.REQ_2]
status = "wip"
[case.expect.needs.SPEC_2]
status = "wip"
[case.expect.nulls]
SPEC_1 = ["status"]
[[case.expect.findings]]
code = "field_fail"
need = "REQ_2"
field = "status"

[[case]]
name = "unsupported-key-ignored"
why = "a key a type's declaration does not take (parse_variants) is ignored and the rest of the entry used: spec's default applies (the needs.config warning is not compared; this pins its consequence)"
config = '''
[needs.fields.owner]
schema = { type = "string" }

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.owner]
parse_variants = true
default = "bob"
'''
source = '''
.. req:: Unset
   :id: REQ_1

.. spec:: Unset
   :id: SPEC_1
'''
[case.expect]
findings = []
[case.expect.needs.SPEC_1]
owner = "bob"
[case.expect.nulls]
REQ_1 = ["owner"]

[[case]]
name = "list-shape-sub-table"
why = "in the [[needs.types]] list shape, a [needs.types.fields.asil] table after the last element belongs to that element: spec's needs read its default, req's the field's"
config = '''
[needs.fields.asil]
schema = { type = "string" }
default = "QM"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "R_"

[[needs.types]]
directive = "spec"
title = "Specification"
prefix = "S_"

[needs.types.fields.asil]
default = "B"
'''
source = '''
.. req:: Unset
   :id: REQ_1

.. spec:: Unset
   :id: SPEC_1
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
asil = "QM"
[case.expect.needs.SPEC_1]
asil = "B"

[[case]]
name = "link-type-per-type"
why = "a type declares a link type's default and predicates for its needs as for a field: spec's unset links take its default, impl's its predicate, req's none; a type's predicates of a needs_links link type are in place of the link type's, and [] is none"
config = '''
[needs.links.covers]
predicates = [["status == 'done'", ["REQ_1"]]]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.links.links]
default = ["REQ_1"]

[needs.types.spec.links.covers]
predicates = [["status == 'done'", ["REQ_2"]]]

[needs.types.impl]
title = "Implementation"
prefix = "I_"

[needs.types.impl.links.links]
predicates = [["status == 'done'", ["REQ_2"]]]

[needs.types.impl.links.covers]
predicates = []
'''
source = '''
.. req:: Target
   :id: REQ_1

.. req:: Other target
   :id: REQ_2

.. req:: The link type's predicate
   :id: REQ_3
   :status: done

.. spec:: The type's default
   :id: SPEC_1

.. spec:: Its own links
   :id: SPEC_2
   :links: REQ_2

.. spec:: The type's predicate in place of the link type's
   :id: SPEC_3
   :status: done

.. impl:: The type's predicate
   :id: IMPL_1
   :status: done

.. impl:: No predicate matching
   :id: IMPL_2
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
links = []
[case.expect.needs.SPEC_1]
links = ["REQ_1"]
[case.expect.needs.SPEC_2]
links = ["REQ_2"]
[case.expect.needs.IMPL_1]
links = ["REQ_2"]
covers = []
[case.expect.needs.REQ_3]
covers = ["REQ_1"]
[case.expect.needs.SPEC_3]
covers = ["REQ_2"]
[case.expect.needs.IMPL_2]
links = []

[[case]]
name = "link-type-schema-per-type"
why = "a type's schema of a link type narrows its needs' links alone, for links and for a needs_links link type: spec's maxItems fails spec's need with too many (link_fail each), impl's same links are clean"
config = '''
[needs.links.covers]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.links.links]
schema = { maxItems = 3 }

[needs.types.spec.links.covers]
schema = { maxItems = 2 }

[needs.types.impl]
title = "Implementation"
prefix = "I_"
'''
source = '''
.. req:: First
   :id: REQ_1

.. req:: Second
   :id: REQ_2

.. req:: Third
   :id: REQ_3

.. req:: Fourth
   :id: REQ_4

.. spec:: Four links, three at most; three covers, two at most
   :id: SPEC_1
   :links: REQ_1, REQ_2, REQ_3, REQ_4
   :covers: REQ_1, REQ_2, REQ_3

.. impl:: The same, free
   :id: IMPL_1
   :links: REQ_1, REQ_2, REQ_3, REQ_4
   :covers: REQ_1, REQ_2, REQ_3
'''
[case.expect]
[case.expect.needs.SPEC_1]
links = ["REQ_1", "REQ_2", "REQ_3", "REQ_4"]
covers = ["REQ_1", "REQ_2", "REQ_3"]
[case.expect.needs.IMPL_1]
links = ["REQ_1", "REQ_2", "REQ_3", "REQ_4"]
covers = ["REQ_1", "REQ_2", "REQ_3"]
[[case.expect.findings]]
code = "link_fail"
need = "SPEC_1"
field = "links"
[[case.expect.findings]]
code = "link_fail"
need = "SPEC_1"
field = "covers"

[[case]]
name = "link-derive-in-a-type-entry"
why = "a derive in a type's entry of a needs_links link type is the link type's rule for the type and its children without one: spec and sspec compute their links; the link type is closed to authors on every type, so impl's written links are one derive_authored and ignored, and a type without a rule has none"
config = '''
[needs.links.covers]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.links.covers]
derive = { kind = "links", where = "type == 'req'" }

[needs.types.sspec]
title = "Sub-specification"
prefix = "SS_"
inherits = "spec"

[needs.types.impl]
title = "Implementation"
prefix = "I_"
'''
source = '''
.. req:: Target
   :id: REQ_1

.. spec:: The type's rule
   :id: SPEC_1

.. sspec:: The parent's rule
   :id: SSPEC_1

.. impl:: No rule, authored
   :id: IMPL_1
   :covers: REQ_1
'''
[case.expect]
[case.expect.needs.REQ_1]
covers = []
[case.expect.needs.SPEC_1]
covers = ["REQ_1"]
[case.expect.needs.SSPEC_1]
covers = ["REQ_1"]
[case.expect.needs.IMPL_1]
covers = []
[[case.expect.findings]]
code = "derive_authored"
need = "IMPL_1"
field = "covers"

# --- narrowing ------------------------------------------------------------------------

[[case]]
name = "type-narrows-enum"
why = "a type's schema narrows the field's enum for its needs alone: QM fails on spec, the same value is clean on req"
config = '''
[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B"] }

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.fields.asil]
schema = { enum = ["A", "B"] }
'''
source = '''
.. req:: QM on req
   :id: REQ_1
   :asil: QM

.. spec:: QM on spec
   :id: SPEC_1
   :asil: QM

.. spec:: A on spec
   :id: SPEC_2
   :asil: A
'''
[case.expect]
[case.expect.needs.REQ_1]
asil = "QM"
[case.expect.needs.SPEC_1]
asil = "QM"
[case.expect.needs.SPEC_2]
asil = "A"
[[case.expect.findings]]
code = "field_fail"
need = "SPEC_1"
field = "asil"

[[case]]
name = "two-level-inheritance"
why = "a type without a declaration of its own reads its parent's, given before or after it: the grandchild takes the parent's narrowed enum and default, and its own value outside that enum fails; a child's entry giving only a schema keeps its parent's default"
config = '''
[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C"] }
default = "QM"

[needs.types.safety_spec]
title = "Safety specification"
prefix = "SS_"
inherits = "safety_req"

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.fields.asil]
schema = { enum = ["A", "B", "C"] }
default = "A"

[needs.types.safety_req]
title = "Safety requirement"
prefix = "SR_"
inherits = "req"

[needs.types.safety_req.fields.asil]
schema = { enum = ["B", "C"] }
default = "B"

[needs.types.safety_test]
title = "Safety test"
prefix = "ST_"
inherits = "req"

[needs.types.safety_test.fields.asil]
schema = { enum = ["A", "B"] }
'''
source = '''
.. req:: Root
   :id: REQ_1

.. safety_req:: Child
   :id: SREQ_1

.. safety_spec:: Grandchild
   :id: SSPEC_1

.. safety_spec:: Grandchild, outside the inherited enum
   :id: SSPEC_2
   :asil: A

.. safety_test:: The parent's default, under its own schema
   :id: STEST_1
'''
[case.expect]
[case.expect.needs.REQ_1]
asil = "A"
[case.expect.needs.SREQ_1]
asil = "B"
[case.expect.needs.SSPEC_1]
asil = "B"
[case.expect.needs.SSPEC_2]
asil = "A"
[case.expect.needs.STEST_1]
asil = "A"
[[case.expect.findings]]
code = "field_fail"
need = "SSPEC_2"
field = "asil"

[[case]]
name = "widening-refused"
why = "a declaration widening its parent's is one type_widening and ignored as a whole: the parent's narrowing stands, so a value inside the widened enum fails on the child, and the entry's default is dropped with it"
config = '''
[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C"] }

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.fields.asil]
schema = { enum = ["A", "B"] }

[needs.types.safety_req]
title = "Safety requirement"
prefix = "SR_"
inherits = "req"

[needs.types.safety_req.fields.asil]
schema = { enum = ["A", "B", "C"] }
default = "B"
'''
source = '''
.. safety_req:: Inside the widened enum
   :id: SREQ_1
   :asil: C

.. safety_req:: Inside the parent's
   :id: SREQ_2
   :asil: A

.. safety_req:: Unset: the entry's default is not taken
   :id: SREQ_3
'''
[case.expect]
[case.expect.needs.SREQ_1]
asil = "C"
[case.expect.needs.SREQ_2]
asil = "A"
[case.expect.nulls]
SREQ_3 = ["asil"]
[[case.expect.findings]]
code = "type_widening"
