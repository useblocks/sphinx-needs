[[case]]
name = "type-local-chain-into-cycle-walk-order"
why = "the walk that reaches a broken cycle starts at the first type given that is on it or inherits into it: c, given first, inherits a, so the walk is c, a, b and resolves b, then a, then c; b's type is the field's though a is given after it, and a's other type is refused, so c, inheriting a, declares nothing"
config = '''
[needs.types.c]
title = "C"
prefix = "C_"
inherits = "a"

[needs.types.b]
title = "B"
prefix = "B_"
inherits = "a"

[needs.types.b.fields.x]
schema = { type = "string" }

[needs.types.a]
title = "A"
prefix = "A_"
inherits = "b"

[needs.types.a.fields.x]
schema = { type = "integer" }
'''
source = '''
.. a:: Refused
   :id: A_001
   :x: 4

.. b:: Sets the type
   :id: B_001
   :x: four

.. c:: Inherits the refused entry
   :id: C_001
'''
[case.expect]
[case.expect.needs.B_001]
x = "four"
[case.expect.nulls]
A_001 = ["x"]
C_001 = ["x"]
[[case.expect.findings]]
code = "type_inherits"
type = "a"
[[case.expect.findings]]
code = "type_inherits"
type = "b"
[[case.expect.findings]]
code = "type_conflict"
type = "a"
field = "x"
[[case.expect.findings]]
code = "undeclared_for_type"
need = "A_001"
field = "x"
type = "a"

