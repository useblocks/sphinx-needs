[[case]]
name = "type-local-link-needextend"
why = "a needextend deleting, setting or appending to the link type on a non-declaring type is refused, its needs unchanged (the delete first, so a set that went through would show), one needextend finding per needextend, need type and option; on a declaring type it applies"
config = '''
[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.req.links.verifies]

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.impl]
title = "Implementation"
prefix = "I_"
'''
source = '''
.. req:: Target
   :id: REQ_1

.. req:: Extended
   :id: REQ_2

.. spec:: Not declaring it
   :id: SPEC_1

.. spec:: Not declaring it
   :id: SPEC_2

.. impl:: Not declaring it
   :id: IMPL_1

.. needextend:: type in ['spec', 'impl']
   :-verifies:

.. needextend:: type == 'spec'
   :verifies: REQ_1

.. needextend:: type == 'spec'
   :+verifies: REQ_1

.. needextend:: REQ_2
   :+verifies: REQ_1
'''
[case.expect]
[case.expect.needs.REQ_2]
verifies = ["REQ_1"]
[case.expect.needs.SPEC_1]
verifies = []
[case.expect.needs.SPEC_2]
verifies = []
[case.expect.needs.IMPL_1]
verifies = []
[[case.expect.findings]]
code = "needextend"
type = "spec"
field = "verifies"
[[case.expect.findings]]
code = "needextend"
type = "impl"
field = "verifies"
[[case.expect.findings]]
code = "needextend"
type = "spec"
field = "verifies"
[[case.expect.findings]]
code = "needextend"
type = "spec"
field = "verifies"

[[case]]
name = "link-shape-keys-on-a-narrowing"
why = "a need type's declaration of a link type [needs.links] declares, giving its incoming and copy, keeps neither (each tool's configuration finding, not compared: the case pins its consequence) and is used for the rest: its default applies, nothing is copied into links, and the link type is on every type"
config = '''
[needs.links.blocks]
incoming = "is blocked by"

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.links.blocks]
incoming = "stops"
copy = true
default = ["REQ_1"]
'''
source = '''
.. req:: Target
   :id: REQ_1

.. spec:: Takes the default
   :id: SPEC_1

.. req:: Sets it
   :id: REQ_2
   :blocks: REQ_1
'''
[case.expect]
findings = []
[case.expect.needs.SPEC_1]
blocks = ["REQ_1"]
links = []
[case.expect.needs.REQ_2]
blocks = ["REQ_1"]
links = []

[[case]]
name = "link-and-field-of-one-name"
why = "a name one type declares under fields and another under links, neither declared otherwise, is a field, whichever comes first: the links entry is one type_conflict, and on its type the field is null, a value there undeclared_for_type"
config = '''
[needs.types.e]
title = "E"
prefix = "E_"

[needs.types.e.links.both]

[needs.types.f]
title = "F"
prefix = "F_"

[needs.types.f.fields.both]
schema = { type = "string" }
'''
source = '''
.. e:: Its links entry is refused
   :id: E_001
   :both: F_001

.. f:: Declares the field
   :id: F_001
   :both: x
'''
[case.expect]
[case.expect.needs.F_001]
both = "x"
[case.expect.nulls]
E_001 = ["both"]
[[case.expect.findings]]
code = "type_conflict"
type = "e"
field = "both"
[[case.expect.findings]]
code = "undeclared_for_type"
need = "E_001"
field = "both"
type = "e"

