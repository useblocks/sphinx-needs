schema = { type = "string" }
derive = { kind = "fingerprint" }

[needs.types.a]
title = "A"
prefix = "A_"

[needs.types.a.fields.x]
schema = { type = "string" }
default = "d"

[needs.types.c]
title = "C"
prefix = "C_"
'''
source = '''
.. a:: Set
   :id: A_001
   :x: v

.. a:: Its type's default
   :id: A_002

.. c:: Not declaring it
   :id: C_001
'''
[case.expect]
findings = []
[case.expect.needs.A_001]
x = "v"
fp = "cfea47381d3fba92a7853b55c2995a5a53bd7982a76753a249a0520760213635"
[case.expect.needs.A_002]
x = "d"
fp = "9f3497bdf566e68a6bec40e39659b7e0a26b97db79a919cec4e727d8a0dad29e"
[case.expect.needs.C_001]
fp = "062792c8e44175378b99b32363362991281305d936acc9d240c231922b2f3b54"
[case.expect.nulls]
C_001 = ["x"]

[[case]]
name = "fingerprint-and-type-default"
why = "a need's value equal to its type's default enters the fingerprint, unless it equals the field's own default too"
# the JSON texts hashed:
#   REQ_1  {"id":"REQ_1","title":"Unset","type":"req"}
#   SPEC_1 {"asil":"A","id":"SPEC_1","title":"Unset","type":"spec"}
