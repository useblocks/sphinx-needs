[[case]]
name = "type-local-from-outside"
why = "a need from outside drops a value of the field where its type does not declare it, with undeclared_for_type: imported by needimport (at the needimport), and loaded from needs_external_needs (no location, so no need, and not in needs.json, so its values are not pinned); a null is dropped silently; a declaring type's need keeps its value"
config = '''
[needs]
external_needs = [{ base_url = "http://example.org", json_path = "other.json", id_prefix = "E_" }]

[needs.types.a]
title = "A"
prefix = "A_"

[needs.types.a.fields.x]
schema = { type = "string" }

[needs.types.c]
title = "C"
prefix = "C_"
'''
source = '''
.. needimport:: other.json
   :filter: id == 'C_001'

.. needimport:: other.json
   :filter: id == 'C_002'

.. needimport:: other.json
   :filter: id == 'A_001'
'''
files = { "other.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "needs": {
        "A_001": {"id": "A_001", "type": "a", "title": "Declaring", "x": "kept"},
        "C_001": {"id": "C_001", "type": "c", "title": "A value", "x": "dropped"},
        "C_002": {"id": "C_002", "type": "c", "title": "A null", "x": null}
      }
    }
  }
}
''' }
[case.expect]
[case.expect.needs.A_001]
x = "kept"
[case.expect.nulls]
C_001 = ["x"]
C_002 = ["x"]
[[case.expect.findings]]
code = "undeclared_for_type"
need = "C_001"
field = "x"
type = "c"
[[case.expect.findings]]
code = "undeclared_for_type"
field = "x"
type = "c"

