[[case]]
name = "link-target-types-with-min-items"
why = "target_types and the schema's minItems and maxItems are independent: the count is every link the need holds, a link target_types refuses and a dead link included, checked by the schema validation (link_fail); so a refused link alone satisfies minItems, a dead one too, a need without links fails it, and one refused link over maxItems is reported by both"
config = '''
[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.test]
title = "Test"
prefix = "T_"

[needs.types.test.links.verifies]
target_types = ["req"]
schema = { minItems = 1, maxItems = 1 }
'''
source = '''
.. req:: Requirement
   :id: REQ_1

.. spec:: Specification
   :id: SPEC_1

.. test:: Its only link refused
   :id: TEST_1
   :verifies: SPEC_1

.. test:: Its only link dead
   :id: TEST_2
   :verifies: REQ_404

.. test:: No link
   :id: TEST_3

.. test:: Two links, one refused
   :id: TEST_4
   :verifies: REQ_1, SPEC_1
'''
[case.expect]
[case.expect.needs.TEST_1]
verifies = ["SPEC_1"]
[case.expect.needs.TEST_2]
verifies = ["REQ_404"]
[case.expect.needs.TEST_3]
verifies = []
[case.expect.needs.TEST_4]
verifies = ["REQ_1", "SPEC_1"]
[[case.expect.findings]]
code = "link_target_type"
need = "TEST_1"
field = "verifies"
type = "spec"
[[case.expect.findings]]
code = "link_fail"
need = "TEST_3"
field = "verifies"
[[case.expect.findings]]
code = "link_target_type"
need = "TEST_4"
field = "verifies"
type = "spec"
[[case.expect.findings]]
code = "link_fail"
need = "TEST_4"
field = "verifies"

[[case]]
name = "union-declared-on-need-types-alone"
why = "a union declared in a need type's links entry alone is a link type of the types declaring it, a child inheriting the rule: their needs hold its members' links, every other type's []; an author's links in it are derive_authored on a declaring type, undeclared_for_type on another"
config = '''
[needs.links.tests]

[needs.types.req]
title = "Requirement"
prefix = "R_"

[needs.types.spec]
title = "Specification"
prefix = "S_"

[needs.types.spec.links.all_links]
derive = { kind = "union", fields = ["links", "tests"] }

[needs.types.subspec]
title = "Subspecification"
prefix = "SS_"
inherits = "spec"
'''
source = '''
.. req:: One
   :id: REQ_1

.. req:: Two
   :id: REQ_2
   :links: REQ_1
   :all_links: REQ_1

.. spec:: Links them
   :id: SPEC_1
   :links: REQ_1
   :tests: REQ_2
   :all_links: REQ_1

.. subspec:: Inherits the rule
   :id: SUBSPEC_1
   :tests: REQ_1
'''
[case.expect]
[case.expect.needs.SPEC_1]
all_links = ["REQ_1", "REQ_2"]
[case.expect.needs.SUBSPEC_1]
all_links = ["REQ_1"]
[case.expect.needs.REQ_2]
all_links = []
[case.expect.schema.all_links]
description = "Declared by need types 'spec'"
readOnly = true
[[case.expect.findings]]
code = "derive_authored"
need = "SPEC_1"
field = "all_links"
[[case.expect.findings]]
code = "undeclared_for_type"
need = "REQ_2"
field = "all_links"
type = "req"

