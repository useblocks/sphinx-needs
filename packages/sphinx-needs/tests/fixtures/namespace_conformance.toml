[[case]]
name = "on-an-unmarked-external-source-is-split-with-one-note"
why = "an external source is read as an import is: its unmarked ids are split, and it is reported once"
config = '''
[needs]
namespaced_ids = true

[[needs.external_needs]]
base_url = "http://ext.example"
json_path = "data.json"

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. req:: A need of the project
   :id: REQ_001
'''
files = { "data.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "needs": {
        "ext::EXT_001": {"type": "req", "title": "One level"},
        "ext::sub::EXT_002": {"type": "req", "title": "Two levels"}
      }
    }
  }
}
''' }
[case.expect]
findings = []
notes = ["namespaced_ids_unmarked"]
marked = true
[case.expect.split."ext::EXT_001"]
ns = ["ext"]
local_id = "EXT_001"
[case.expect.split."ext::sub::EXT_002"]
ns = ["ext", "sub"]
local_id = "EXT_002"

[[case]]
name = "on-an-imported-id-that-does-not-split-is-refused"
why = "an imported id that does not split is not read: one warning per need, at the needimport"
config = '''
[needs]
namespaced_ids = true

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. req:: A need of the project
   :id: REQ_001

.. needimport:: data.json
'''
files = { "data.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "namespaced_ids": true,
      "needs": {
        "ext::": {"type": "req", "title": "Empty local id"}
      }
    }
  }
}
''' }
[case.expect]
notes = []
marked = true
missing = ["ext::"]
[[case.expect.findings]]
code = "import_need"
[case.expect.split.REQ_001]
ns = []
local_id = "REQ_001"

[[case]]
name = "on-an-imported-id-is-not-held-to-the-id-regex"
why = "imported and external needs are exempt from needs_id_regex, as they are with the switch off: ext::imp_1 is read though the default refuses imp_1"
config = '''
[needs]
namespaced_ids = true

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. needimport:: data.json
'''
files = { "data.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "namespaced_ids": true,
      "needs": {
        "ext::imp_1": {"type": "req", "title": "A lowercase local id"}
      }
    }
  }
}
''' }
[case.expect]
findings = []
notes = []
marked = true
[case.expect.split."ext::imp_1"]
ns = ["ext"]
local_id = "imp_1"

[[case]]
name = "off-a-marked-import-keeps-plain-ids-with-one-note"
why = "into a project with the switch off, a marked version's ids are read as plain ids, :: included, with one note per source"
config = '''
[needs]
id_regex = ""

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. needimport:: data.json
'''
files = { "data.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "namespaced_ids": true,
      "needs": {
        "ext::IMP_001": {"type": "req", "title": "One level"},
        "ext::sub::IMP_002": {"type": "req", "title": "Two levels"}
      }
    }
  }
}
''' }
[case.expect]
findings = []
notes = ["namespaced_ids_off"]
marked = false
[case.expect.split."ext::IMP_001"]
ns = []
local_id = "ext::IMP_001"
[case.expect.split."ext::sub::IMP_002"]
ns = []
local_id = "ext::sub::IMP_002"
