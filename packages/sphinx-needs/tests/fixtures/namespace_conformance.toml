# --- reading a needs.json ---------------------------------------------------------------

[[case]]
name = "on-a-marked-import-is-split"
why = "into a project with the switch on, every id of a marked version is split, and nothing is reported"
config = '''
[needs]
namespaced_ids = true

[needs.types.req]
title = "Requirement"
prefix = "R_"
'''
source = '''
.. needimport:: data.json
'''
files = { "data.json" = '''
{
  "current_version": "1.0",
  "versions": {
    "1.0": {
      "namespaced_ids": true,
      "needs": {
        "ext::IMP_001": {"type": "req", "title": "One level"},
        "ext::sub::IMP_002": {"type": "req", "title": "Two levels"}
      }
    }
  }
}
''' }
[case.expect]
findings = []
notes = []
marked = true
[case.expect.split."ext::IMP_001"]
ns = ["ext"]
local_id = "IMP_001"
[case.expect.split."ext::sub::IMP_002"]
ns = ["ext", "sub"]
local_id = "IMP_002"

