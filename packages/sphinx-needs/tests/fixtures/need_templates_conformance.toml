[[case]]
name = "import-keeps-applying-a-records-decoration-the-importer-has"
why = "until sphinx-needs 10.0 a record's pre or post template is applied where the importer has that template (with a deprecation, not compared), and dropped where it has not; pre_content and post_content are never imported"
rules = [17]
python_only = true
config = '''
[needs]
'''
source = '''
.. needimport:: a_needs.json
'''
files."needs_templates/pre.need" = '''
IMPORTER-PRE {{ id }}
