# --- a broken template keeps the need (rule 14) --------------------------------------

[[case]]
name = "missing-template-keeps-the-need"
why = "a template file that does not exist leaves the need created, with empty output for that template and one template_missing; the need is still a link target"
rules = [14, 16]
config = '''
[needs]
'''
source = '''
.. req:: No such template
   :id: REQ_1
   :template: nope

   Authored body.

.. req:: No such post template
   :id: REQ_2
   :post_template: nope

   Authored body.

.. spec:: Links it
   :id: SPEC_1
   :links: REQ_1, REQ_2
'''
[case.expect]
[[case.expect.findings]]
code = "template_missing"
need = "REQ_1"
[[case.expect.findings]]
code = "template_missing"
need = "REQ_2"
[case.expect.needs.REQ_1]
content = ""
template = "nope"
links_back = ["SPEC_1"]
[case.expect.needs.REQ_2]
content = "Authored body."
post_content = ""
post_template = "nope"
links_back = ["SPEC_1"]
[case.expect.nulls]
REQ_1 = ["pre_content", "post_content"]

[[case]]
name = "missing-template-folder-keeps-the-need"
why = "a template folder that does not exist is a missing template, never a lost need"
rules = [14, 2]
config = '''
[needs]
template_folder = "nowhere"
'''
source = '''
.. req:: No folder
   :id: REQ_1
   :pre_template: pre

   Authored body.
'''
[case.expect]
[[case.expect.findings]]
code = "template_missing"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "Authored body."
pre_content = ""
pre_template = "pre"

[[case]]
name = "template-syntax-error-keeps-the-need"
why = "a template that does not parse leaves the need created with empty output and one template_syntax"
rules = [14]
config = '''
[needs]
'''
source = '''
.. req:: Broken template
   :id: REQ_1
   :template: broken

   Authored body.
'''
files."needs_templates/broken.need" = '''
before {% if %} after
'''
[case.expect]
[[case.expect.findings]]
code = "template_syntax"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = ""
template = "broken"

[[case]]
name = "template-render-error-keeps-the-need"
why = "a template that fails while rendering (an invalid operation) leaves the need created with empty output and one template_render; the need's other templates still render"
rules = [14]
config = '''
[needs]
'''
source = '''
.. req:: Failing template
   :id: REQ_1
   :post_template: failing
   :pre_template: pre

   Authored body.
'''
files."needs_templates/failing.need" = '''
{{ id + 1 }}
'''
files."needs_templates/pre.need" = '''
PRE {{ id }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_render"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "Authored body."
pre_content = "PRE REQ_1"
post_content = ""

[[case]]
name = "jinja-content-syntax-error-keeps-the-need"
why = "a :jinja_content: body that does not parse leaves the need created with empty content and one template_syntax"
rules = [14, 21]
config = '''
[needs]
'''
source = '''
.. req:: Broken body
   :id: REQ_1
   :jinja_content:

   Body {% if %} here.
'''
[case.expect]
[[case.expect.findings]]
code = "template_syntax"
need = "REQ_1"
[[case.expect.findings]]
code = "deprecated_jinja_content"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = ""
jinja_content = true

[[case]]
name = "needimport-missing-template-keeps-the-imported-need"
why = "a template named on needimport that does not exist leaves each imported need created, with empty output and one template_missing"
rules = [14, 3]
config = '''
[needs]
'''
source = '''
.. needimport:: a_needs.json
   :id_prefix: B_
   :template: nope
'''
files."a_needs.json" = '''
{"created": "2026-11-04T01:05:50.795231", "current_version": "1.0", "project": "Producer", "versions": {"1.0": {"created": "2026-11-04T01:05:50.795229", "creator": {"program": "sphinx_needs", "version": "9.1.0"}, "needs_amount": 1, "needs": {
"SPEC_PLAIN": {"arch": {}, "completion": null, "constraints": [], "constraints_error": null, "constraints_passed": true, "constraints_results": {}, "content": "Plain body *em*.", "docname": "index", "doctype": ".rst", "duration": null, "external_css": "external_link", "external_url": null, "has_dead_links": false, "has_forbidden_dead_links": false, "id": "SPEC_PLAIN", "is_external": false, "is_import": false, "is_modified": false, "jinja_content": false, "layout": null, "lineno": 9, "links": [], "links_back": [], "modifications": 0, "parent_need": null, "parent_needs": [], "parent_needs_back": [], "parts": {}, "post_content": null, "post_template": null, "pre_content": null, "pre_template": null, "section_name": "Prod", "sections": ["Prod"], "signature": null, "status": null, "style": null, "tags": [], "template": null, "title": "Plain", "type": "spec", "type_name": "Specification"}
}}}}
'''
[case.expect]
[[case.expect.findings]]
code = "template_missing"
need = "B_SPEC_PLAIN"
[case.expect.needs.B_SPEC_PLAIN]
content = ""
template = "nope"

# --- undefined names (rules 9, 12) ---------------------------------------------------

[[case]]
name = "undefined-name-renders-empty-and-is-reported"
why = "a name no need defines (a typo) renders empty, as it always has, and is reported once per template at the need"
rules = [9]
config = '''
[needs]
'''
source = '''
.. req:: Typo
   :id: REQ_1
   :template: typo

   Body.
'''
files."needs_templates/typo.need" = '''
[{{ titel }}] {{ content }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "[] Body."

[[case]]
name = "guarded-undefined-is-clean"
why = "the rule is a RUNTIME one: a name tested with `is defined`, or given a `default`, is not reported, though the template names it"
rules = [9]
config = '''
[needs]
'''
source = '''
.. req:: Guarded
   :id: REQ_1
   :template: guarded
'''
files."needs_templates/guarded.need" = '''
{% if extra is defined %}has {{ extra }}{% else %}no extra{% endif %}, {{ other | default("fallback") }}
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
content = "no extra, fallback"

[[case]]
name = "undefined-in-a-condition-is-reported"
why = "testing an undefined name for truth (without `is defined`) is a use of it: the false branch renders, and it is reported"
rules = [9]
config = '''
[needs]
'''
source = '''
.. req:: Condition
   :id: REQ_1
   :post_template: cond
'''
files."needs_templates/cond.need" = '''
{% if maybe %}yes{% else %}no{% endif %}
'''
[case.expect]
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[case.expect.needs.REQ_1]
post_content = "no"

[[case]]
name = "undefined-is-reported-per-template"
why = "a need whose pre and post templates both use an undefined name is reported once for each; a template that uses none is not"
rules = [9, 1]
config = '''
[needs]
'''
source = '''
.. req:: Two typos
   :id: REQ_1
   :pre_template: pre
   :post_template: post
   :template: clean

   Body.
'''
files."needs_templates/pre.need" = '''
pre {{ nope1 }}{{ nope2 }}.
'''
files."needs_templates/post.need" = '''
post {{ nope3 }}.
'''
files."needs_templates/clean.need" = '''
{{ content }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "Body."
pre_content = "pre ."
post_content = "post ."

[[case]]
name = "undefined-in-jinja-content-is-reported"
why = "a :jinja_content: body using an undefined name renders it empty and is reported"
rules = [9, 21]
config = '''
[needs]
'''
source = '''
.. req:: Jinja typo
   :id: REQ_1
   :jinja_content:

   Hello {{ nobody }}from {{ id }}.
'''
[case.expect]
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[[case.expect.findings]]
code = "deprecated_jinja_content"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "Hello from REQ_1."

[[case]]
name = "undefined-attribute-of-an-unset-field-is-reported"
why = "an attribute of a declared but unset field (None) is undefined: it renders empty and is reported"
rules = [9, 4]
config = '''
[needs.fields.owner]
schema = { type = "string" }
'''
source = '''
.. req:: Unset owner
   :id: REQ_1
   :template: attr
'''
files."needs_templates/attr.need" = '''
owner=[{{ owner.name }}]
'''
[case.expect]
[[case.expect.findings]]
code = "template_undefined"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "owner=[]"

[[case]]
name = "render-context-is-merged-over-the-need"
why = "[needs.render_context] in ubproject.toml is merged over the need's fields: a key it gives is defined, and not reported (a conf.py-only value, such as a function, is sphinx-needs' alone: rule 12)"
rules = [12, 9]
config = '''
[needs.render_context]
team = "blue"
'''
source = '''
.. req:: Context
   :id: REQ_1
   :template: ctx
'''
files."needs_templates/ctx.need" = '''
team={{ team }}
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
content = "team=blue"

[[case]]
name = "attribute-of-an-undefined-name-is-a-render-error"
why = "an attribute of an undefined name fails even leniently (the engine's rule, unlike one of None): the template cannot be rendered, the need is kept"
rules = [9, 14]
config = '''
[needs]
'''
source = '''
.. req:: Deep typo
   :id: REQ_1
   :template: deep

   Body.
'''
files."needs_templates/deep.need" = '''
[{{ typo.attr }}]
'''
[case.expect]
[[case.expect.findings]]
code = "template_render"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = ""

# --- unresolved fields (rule 11) -----------------------------------------------------

[[case]]
name = "dynamic-function-field-is-unresolved"
why = "a field holding a dynamic function is unresolved when the template is rendered: it renders as None and is reported, naming the field; needs.json holds the resolved value"
rules = [11, 4]
config = '''
[needs.fields.copied]
schema = { type = "string" }
'''
source = '''
.. req:: Source title
   :id: REQ_1
   :copied: [[copy("title")]]
   :template: show
'''
files."needs_templates/show.need" = '''
copied={{ copied }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_unresolved"
need = "REQ_1"
field = "copied"
[case.expect.needs.REQ_1]
content = "copied=None"
copied = "Source title"

[[case]]
name = "variant-field-is-unresolved"
why = "a field holding a variant is unresolved when the template is rendered: it renders as None and is reported"
rules = [11]
config = '''
[needs.fields.level]
schema = { type = "string" }
parse_variants = true
'''
source = '''
.. req:: Variant
   :id: REQ_1
   :level: <<[type == 'req']:high, low>>
   :post_template: show
'''
files."needs_templates/show.need" = '''
level={{ level }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_unresolved"
need = "REQ_1"
field = "level"
[case.expect.needs.REQ_1]
post_content = "level=None"
level = "high"

[[case]]
name = "derived-field-is-unresolved-where-its-type-has-a-rule"
why = "a derived field is unresolved on a need whose type has a rule (None, reported); on a type without a rule it holds its fixed value, which is not reported"
rules = [11, 4]
config = '''
[needs.fields.title_copy]
schema = { type = "string" }
derive_by_type = { spec = { kind = "copy", field = "title" } }
'''
source = '''
.. spec:: Derived here
   :id: SPEC_1
   :template: show

.. req:: Not derived here
   :id: REQ_1
   :template: show
'''
files."needs_templates/show.need" = '''
copy={{ title_copy }}
'''
[case.expect]
[[case.expect.findings]]
code = "template_unresolved"
need = "SPEC_1"
field = "title_copy"
[case.expect.needs.SPEC_1]
content = "copy=None"
title_copy = "Derived here"
[case.expect.needs.REQ_1]
content = "copy=None"

[[case]]
name = "unresolved-field-not-named-is-not-reported"
why = "a need holding a dynamic function whose template does not name the field is not reported; one naming it in a filter is (each named field once)"
rules = [11]
config = '''
[needs.fields.copied]
schema = { type = "string" }

[needs.fields.other]
schema = { type = "string" }
'''
source = '''
.. req:: Quiet
   :id: REQ_1
   :copied: [[copy("title")]]
   :other: [[copy("id")]]
   :template: quiet

.. req:: Loud
   :id: REQ_2
   :copied: [[copy("title")]]
   :other: [[copy("id")]]
   :template: loud
'''
files."needs_templates/quiet.need" = '''
id={{ id }}
'''
files."needs_templates/loud.need" = '''
{{ copied | default("x") }} {{ copied }} {% if other %}o{% else %}-{% endif %}
'''
[case.expect]
[[case.expect.findings]]
code = "template_unresolved"
need = "REQ_2"
field = "copied"
[[case.expect.findings]]
code = "template_unresolved"
need = "REQ_2"
field = "other"
[case.expect.needs.REQ_1]
content = "id=REQ_1"
[case.expect.needs.REQ_2]
content = "None None -"

# --- hidden needs (rule 8) -----------------------------------------------------------

[[case]]
name = "hidden-need-renders-its-content-only"
why = "a hidden need's content template is rendered (needs.json content), its pre and post templates are not rendered at all (null; nothing reported for a missing one, or for one using an undefined name); the names stay as provenance"
rules = [8, 16, 14]
config = '''
[needs]
'''
source = '''
.. req:: Hidden
   :id: REQ_1
   :hide:
   :template: wrap
   :pre_template: pre
   :post_template: missing

   Authored body.
'''
files."needs_templates/wrap.need" = '''
WRAP {{ content }}
'''
files."needs_templates/pre.need" = '''
PRE {{ id }} {{ typo }}
'''
[case.expect]
findings = []
[case.expect.needs.REQ_1]
content = "WRAP Authored body."
template = "wrap"
pre_template = "pre"
post_template = "missing"
[case.expect.nulls]
REQ_1 = ["pre_content", "post_content"]

# --- headings in pre/post output (rule 7) --------------------------------------------

[[case]]
name = "pre-template-heading-opens-a-section-in-place"
why = "a heading in pre_template output opens a section where the output is, inside the page's section, whatever its level, on an RST page and on a MyST page alike (a need in the output is in that section)"
rules = [7, 6]
python_only = true
config = '''
[needs]
'''
source = '''
Section A
---------

.. req:: On RST
   :id: REQ_R
   :pre_template: hrst

   Body.
'''
source_md = '''
## MD section

```{req} On MyST
:id: REQ_M
:pre_template: hmd

Body.
```
'''
files."needs_templates/hrst.need" = '''
Pre {{ id }}
~~~~~~~~~~~~

.. spec:: Inner
   :id: IN_{{ id }}
'''
files."needs_templates/hmd.need" = '''
## Pre {{ id }}

```{spec} Inner
:id: IN_{{ id }}
```
'''
[case.expect]
findings = []
[case.expect.needs.IN_REQ_R]
sections = ["Pre REQ_R", "Section A", "Case"]
section_name = "Pre REQ_R"
[case.expect.needs.IN_REQ_M]
sections = ["Pre REQ_M", "MD section", "Page"]
section_name = "Pre REQ_M"
[case.expect.needs.REQ_R]
section_name = "Section A"
pre_content = "Pre REQ_R\n~~~~~~~~~~~~\n\n.. spec:: Inner\n   :id: IN_REQ_R"
[case.expect.needs.REQ_M]
section_name = "MD section"

[[case]]
name = "pre-template-heading-is-refused-by-ubcode"
why = "ubCode cannot open a section from template output: it refuses the heading (template_heading at the need), and the need is kept"
rules = [7]
ubcode_only = true
config = '''
[needs]
'''
source = '''
.. req:: Heading
   :id: REQ_1
   :pre_template: heading

   Body.
'''
files."needs_templates/heading.need" = '''
Pre {{ id }}
~~~~~~~~~~~~

text
'''
[case.expect]
[[case.expect.findings]]
code = "template_heading"
need = "REQ_1"
[case.expect.needs.REQ_1]
content = "Body."
pre_template = "heading"

# --- a reader never re-applies a record's template keys (rules 17, 18) ----------------

[[case]]
name = "import-never-re-renders-a-records-template"
why = "an imported record's content is already its template's output: the importer's template of the same name is not applied again (no double wrap), and the imported need names no template"
rules = [17, 16]
config = '''
[needs]
'''
source = '''
.. needimport:: a_needs.json
'''
files."needs_templates/wrap.need" = '''
IMPORTER-WRAP {{ content }}
'''
files."a_needs.json" = '''
{"created": "2026-11-04T01:05:50.795231", "current_version": "1.0", "project": "Producer", "versions": {"1.0": {"created": "2026-11-04T01:05:50.795229", "creator": {"program": "sphinx_needs", "version": "9.1.0"}, "needs_amount": 1, "needs": {
"SPEC_TPL": {"arch": {}, "completion": null, "constraints": [], "constraints_error": null, "constraints_passed": true, "constraints_results": {}, "content": "WRAP[SPEC_TPL]\n\nAuthored body.", "docname": "index", "doctype": ".rst", "duration": null, "external_css": "external_link", "external_url": null, "has_dead_links": false, "has_forbidden_dead_links": false, "id": "SPEC_TPL", "is_external": false, "is_import": false, "is_modified": false, "jinja_content": false, "layout": null, "lineno": 14, "links": [], "links_back": [], "modifications": 0, "parent_need": null, "parent_needs": [], "parent_needs_back": [], "parts": {}, "post_content": null, "post_template": null, "pre_content": null, "pre_template": null, "section_name": "Prod", "sections": ["Prod"], "signature": null, "status": null, "style": null, "tags": [], "template": "wrap", "title": "Wrapped", "type": "spec", "type_name": "Specification"}
}}}}
'''
[case.expect]
findings = []
[case.expect.needs.SPEC_TPL]
content = "WRAP[SPEC_TPL]\n\nAuthored body."
jinja_content = false
[case.expect.nulls]
SPEC_TPL = ["template", "pre_template", "post_template", "pre_content", "post_content"]

