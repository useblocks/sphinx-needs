# Conformance corpus for NEED PARTS: what a part is (an id, a text and the links that point
# at it, of one need), how the `:need_part:` role makes one, which need it belongs to, how a
# link names it, and what it answers -- the executable half of `design/parts-contract.md`.
#
# Repository of record: useblocks/sphinx-needs (public)
# Canonical path:       packages/sphinx-needs/tests/fixtures/parts_conformance.toml
#
# THIS copy is CANONICAL. ubCode is to vendor it byte-for-byte, with a provenance block
# (this path, and the commit it was taken from) prepended and nothing else changed, and to
# run it against its own engine. The corpus travels public -> private, so vendoring with a
# recorded source commit is the sync mechanism.
#
# Do not reformat this file. `.gitattributes` pins its line endings, and the taplo hook
# excludes it: every `config`, `source` and `files` body, `'''...'''` or `"""..."""`, is
# the INPUT of a case, and a part's text is compared character for character, so a
# formatter touching one silently changes what the case tests. A change here is a change
# to the contract, and owes ubCode a re-vendor. A character that cannot be seen (a tab, a
# no-break space, a control character) or a combining mark is written as an escape, so a
# body holding one is a `"""..."""` string.
#
# Rules for every runner:
#   - a case is one project. `config` is its `ubproject.toml` (its `[needs]` table, and the
#     `[codelinks]` and `[test_reports]` tables the rules below name); `source` is the body
#     of its one reStructuredText document, `index.rst`, under a title the runner adds:
#     `Case`, `====` and a blank line; `files` (optional) are other files of the project,
#     relative to the case directory. A case writes only inside its own directory: a
#     `files` key that would land outside it (`../x.json`) is a broken case, and the runner
#     refuses it
#   - a case with `extensions` loads those Sphinx extensions besides sphinx-needs:
#     `myst_parser`, `sphinx_codelinks` or `sphinx_test_reports`. The Python runner adds
#     them to `conf.py`, points the last two at the case's `ubproject.toml`, and SKIPS a
#     case whose extension is not installed; ubCode's runner models each from its table of
#     the same file; a runner that needs no extension for MyST reads the MyST documents of
#     a case loading `myst_parser` with its own MyST reading. A case loading
#     `sphinx_codelinks` is a git checkout: the RUNNER writes two files beside
#     `ubproject.toml`. `.git/HEAD` is
#     `0123456789abcdef0123456789abcdef01234567` and a newline; `.git/config` is
#     `[remote "origin"]`, a newline, a tab, `url = https://github.com/example/case.git`
#     and a newline
#   - every need id satisfies the default id regex (`^[A-Z0-9_]{5,}`), matched at the start
#     of the id; the need types are the default ones (`req`, `spec`, `impl`, `test`) and
#     those the loaded extensions add
#   - every character of a case is assigned in Unicode 14.0, the oldest version a supported
#     reader has, so no answer depends on the reader's Unicode tables
#   - `parts.<ID>` is the SET of the need's parts, each its id and its text, the text
#     exactly as the tool stores it (an `(id)` part's text has no white space at its
#     ends, a text a record states is as given); `{}` says the need has none. A need the
#     case does not name there is not compared
#   - "as given" above has one exception: a need whose content is read takes a stated
#     part's text on one line, each run of white space holding a line break one space
#     (`design/parts-contract.md` section 2); a hidden and an external need keep it as given
#   - `order.<ID>` is the LIST of the need's part ids in the order the tool stores the
#     need's parts, read from the stored need: a needs.json lists a need's parts sorted
#     by id, so it cannot show the order. `[]` says the need has none. A need the case
#     does not name there is not compared
#   - `dead.<ID>` is the set of the need's links the tool reports as dead, each the address
#     as written with its condition taken off
#     (`REQ_1.nope` for `REQ_1.nope[status == "x"]`); `[]` says it reports none. No case
#     sets `allow_dead_links`
#   - `back.<ADDRESS>`, the address a need's id or `<ID>.<part>` (split at the first `.`),
#     gives per link type the set of the ids of the needs whose links of that type are
#     back links of that need or part; `[]` says there are none. It names only link types
#     the case has (`links`, or one its `config` declares); a link type it does not name is
#     not compared
#   - `findings` are compared as a MULTISET of `class`, the name of a class of finding of
#     the contract; a runner maps its tool's own codes to the classes, and messages,
#     locations and severities are NOT compared. The classes, and sphinx-needs' codes --
#         duplicate part id      needs.duplicate_part_id
#         part outside a need    needs.part
#         dead link              needs.link_outgoing
#         link target type       needs.link_target_type
#         link condition         needs.link_condition_failed
#         unresolved reference   needs.link_ref
#         unknown part key       needs.unknown_part_keys
#     -- every other finding is each tool's own and not compared, unless the case says
#     `clean = true`: then the project reports nothing at all but its `findings`
#   - a report, for `clean = true` and for a filter that "reports nothing", is any warning
#     or error the build emits. A case's `config` may configure a schema
#     (`[[needs.schema_definitions.schemas]]`): a schema finding is a report like any other,
#     so such a case checks the schema only through `clean`, and a tool with no schema
#     validation passes it without having checked anything
#   - each `[[case.filters]]` entry is one filter string in the portable filter language
#     (the one `filter_conformance.toml` pins), evaluated after the build, when derived
#     values are final, over the needs of the built project and their parts
#     (`include_parts = true`, required) as a filter written in `index.rst` is. That means
#     only that `c.this_doc()` compares with `index`: it says nothing about which
#     candidates a directive on that page would have. `expected` lists the ids it selects,
#     sorted by code point, a part as `<need>.<part>`, and the filter reports nothing. An
#     entry pins only what a part ANSWERS; which of needs and parts a view's filter
#     selects is pinned by the `view = true` entries below
#   - an entry saying `view = true`, in place of `include_parts` (never both), is
#     evaluated as the `:filter:` of a view written in `index.rst` (a needtable, a
#     needlist) is, under the `views_include_parts` of the case's `[needs]` table, which
#     every case with such an entry writes: `true` tests the filter on the needs and their
#     parts, `false` on the needs alone. These entries, of the section `selection`, pin
#     which of needs and parts a view's filter selects when the view does not ask for parts
#   - `table` and `flow`, of the section `views`, are what a view lists and draws: data,
#     never markup or an engine's syntax. A case of the section holds at most one
#     needtable and at most one needflow in its `source`, and writes `views_include_parts`
#     in its `[needs]` table, as a case with a `view = true` entry does
#   - `table` is the case's needtable: its rows in the order it lists them, each `row`,
#     the address the row lists (a need's id, or `<need>.<part>`), and `target`, the
#     address its id cell links (absent: the id is no link). `cells` (optional) names the
#     cells the case compares, each named by the field's name, or by the link type's name
#     with `_back` added for its incoming links, in lower case: a field's text, or for a
#     link column the LIST of what the cell lists, in order, each `to`, the
#     address as shown, and `target`, the address it links (absent: shown as text, a dead
#     link). A `target` is compared with the fragment of the link, the text after its `#`
#     (`""` for a link with none): the address as the linked page anchors it, which for
#     an external need is what its URL names, its id without its source's `id_prefix` for
#     the default URL
#   - `flow` is the case's needflow, as a graph: `nodes`, the ids of what it draws, sorted
#     by code point, a part's node as its address `<need>.<part>`; `containers`
#     (optional), for each need drawn with parts inside it, the ids of those parts in the
#     order drawn (absent: no need is drawn with a part inside it); and `edges`, a
#     MULTISET of the edges it draws between two of them, each `from` and `to` (the ids it
#     joins, a part's node as its address), `type` (its link type) and `parts`, the ids of
#     the parts its label names, in the label's order; `[]` says its label names no part,
#     as for an edge of a whole link and an edge ending on a part's node. The cases whose
#     needflow has `:show_parts:` draw each need it draws with every part it has inside
#     it, whatever `views_include_parts` says, and a link to a part drawn then ends on
#     the part; every other case with a `flow` writes `views_include_parts = false`, and
#     a link to a part of a need the needflow draws is then an edge to that need
#   - `expected` -- every key of `[case.expect]` and every filter's `expected` -- is what the
#     CONTRACT says. A case carrying `divergent` is one a tool answers otherwise: each key
#     names a tool (`sphinx-needs`, `ubcode`), its value what that tool answers instead. A
#     marker for `sphinx-needs` ends with the issue that tracks it, `(#N)`, or with
#     `(not filed yet)`; a marker for `ubcode` names no issue, as the filter corpus's
#     markers name none. The runner of a named tool runs the case and requires it to
#     FAIL, and fails it when it passes, so a fix removes the marker in the same change;
#     every other runner runs it as any case. (The filter corpus's `divergent` names a tool
#     the same way; there the named runner skips the entry.)
#
# `packages/sphinx-needs/tests/test_parts_conformance.py` runs every case with the `html`
# builder (a role outside every need is reported where a page is written) AND asserts the
# case COUNT, so a truncated copy is a red test rather than reduced coverage. The prose half
# of the contract is `packages/sphinx-needs/design/parts-contract.md`; each case's `why`
# restates the sentence of it the case holds the tools to.
#
# Sections, in this order: grammar, placement, duplicates, stated, addressing, links,
# answers, selection, views, derived.
# `selection`, what a view's filter selects, sits between `answers` and `derived`.
#
# Each `[[case]]` has:
#   name         - unique, kebab-case
#   section      - the section it belongs to (the list above)
#   why          - one line saying what the case pins
#   config       - the `ubproject.toml`
#   source       - the body of `index.rst`
#   files        - optional; other files, relative to the case directory, and their text
#   extensions   - optional; the extensions the case loads besides sphinx-needs
#   clean        - optional; true: the project reports nothing but its `findings`
#   divergent    - optional; { sphinx-needs = "...", ubcode = "..." }, see the rules above
#   [case.expect]
#     findings         - `[]` for none, or one `{ class = "..." }` per finding
#     parts.<ID>       - optional; { <part id> = "<text>" }, `{}` for none
#     order.<ID>       - optional; [the need's part ids, in stored order], `[]` for none
#     dead.<ID>        - optional; [the addresses of its dead links]
#     back.<ADDRESS>   - optional; { <link type> = [the ids of its back links] }
#     table            - optional; [the needtable's rows, in order] (the section `views`)
#     flow             - optional; { nodes, containers, edges }, the needflow (`views`)
#   [[case.filters]]
#     filter         - the filter string
#     expected       - the ids it selects, sorted by code point
#     include_parts  - true
#     view           - true, in place of `include_parts` (the section `selection`)
#     why            - optional; one line saying what the entry pins

# --- grammar ---------------------------------------------------------------------------

[[case]]
name = "grammar-id-and-text"
section = "grammar"
why = "(id) text gives the part id and, as its text, everything after the closing parenthesis without white space at its ends, none added; :need_part: is :np:"
clean = true
config = '''
[needs]
'''
source = '''
.. req:: Parts
   :id: REQ_1

   :np:`(p1) with a space` and :np:`(p2)without one` and :need_part:`(p3) by the long name`.
'''
[case.expect]
findings = []
[case.expect.parts]
REQ_1 = { p1 = "with a space", p2 = "without one", p3 = "by the long name" }

