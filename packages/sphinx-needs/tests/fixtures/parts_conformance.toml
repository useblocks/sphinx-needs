# --- placement -------------------------------------------------------------------------

[[case]]
name = "placement-a-nested-need"
section = "placement"
why = "a part belongs to the innermost need holding it: the nested need's part is not the outer need's, so the outer need's address of it is dead"
config = '''
[needs.links.tests]
'''
source = '''
.. req:: Outer
   :id: REQ_OUT

   :np:`(o1) before`

   .. spec:: Inner
      :id: SPEC_IN

      :np:`(n1) inside`

   :np:`(o2) after`

.. test:: Links
   :id: TEST_1
   :tests: SPEC_IN.n1, REQ_OUT.n1
'''
[case.expect]
findings = [{ class = "dead link" }]
[case.expect.parts]
REQ_OUT = { o1 = " before", o2 = " after" }
SPEC_IN = { n1 = " inside" }
[case.expect.dead]
TEST_1 = ["REQ_OUT.n1"]

