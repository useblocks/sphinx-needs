[[case]]
name = "derived-a-part-is-matched-by-its-text-as-title"
section = "derived"
why = "a part answers its text as title wherever it is a candidate, not in a filter alone: SPEC_1, whose ref is one, links REQ_1.p1 through a links rule's where and its join, links_from_filter and links_from_match, each asking for parts; SPEC_2, whose ref is Parts, its need's title, links REQ_1 and not its part"
config = '''
[needs.fields.ref]
schema = { type = "string" }

[needs.links.l_where]
derive = { kind = "links", where = "title == 'one'", include_parts = true }

[needs.links.l_join]
derive = { kind = "links", join = { field = "title", equals = "ref" }, include_parts = true }

[needs.links.lf_link]

[needs.links.lm_link]
'''
source = '''
.. req:: Parts
   :id: REQ_1

   :np:`(p1) one`

.. spec:: Spec one
   :id: SPEC_1
   :ref: one
   :lf_link: [[links_from_filter("title == 'one'", include_parts=True)]]
   :lm_link: [[links_from_match("title", "ref", include_parts=True)]]

.. spec:: Spec two
   :id: SPEC_2
   :ref: Parts
   :lm_link: [[links_from_match("title", "ref", include_parts=True)]]
'''
[case.expect]
findings = []

[[case.filters]]
filter = '"REQ_1.p1" in l_where and "REQ_1.p1" in l_join and "REQ_1.p1" in lf_link and "REQ_1.p1" in lm_link'
expected = ["SPEC_1"]
include_parts = true
why = "the part is found by its text on each of the four routes"

[[case.filters]]
filter = '"REQ_1" in l_join and "REQ_1.p1" not in l_join and "REQ_1" in lm_link and "REQ_1.p1" not in lm_link'
expected = ["SPEC_2"]
include_parts = true
why = "the need's title finds the need and not its part"
