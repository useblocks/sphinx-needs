# --- the link kinds -----------------------------------------------------------------

[[case]]
name = "links-where-include-self"
why = "links: every need passing where, in need-id order, the need itself left out unless include_self; an empty where is refused, and an empty filter fails the inline links_from_filter"
config = '''
[needs.links.l_open]
derive = { kind = "links", where = "type == 'req' and status == 'open'" }

[needs.links.l_specs]
derive = { kind = "links", where = "type == 'spec'", include_self = true }

[needs.links.bad_empty]
derive = { kind = "links", where = "" }

[needs.links.inline_empty]
'''
source = '''
.. req:: Open
   :id: REQ_1
   :status: open

.. req:: Closed
   :id: REQ_2
   :status: closed

.. req:: Open too
   :id: REQ_3
   :status: open

.. spec:: A spec
   :id: SPEC_1

.. spec:: Another spec
   :id: SPEC_2
   :inline_empty: [[links_from_filter("")]]
'''
[case.expect]
[case.expect.needs.REQ_1]
l_open = ["REQ_3"]
l_specs = ["SPEC_1", "SPEC_2"]
bad_empty = []
[case.expect.needs.REQ_2]
l_open = ["REQ_1", "REQ_3"]
[case.expect.needs.SPEC_1]
l_open = ["REQ_1", "REQ_3"]
l_specs = ["SPEC_1", "SPEC_2"]
[case.expect.needs.SPEC_2]
inline_empty = []
[[case.expect.findings]]
code = "derive_invalid"
field = "bad_empty"
[[case.expect.findings]]
code = "dynamic_function"
need = "SPEC_2"
field = "inline_empty"

