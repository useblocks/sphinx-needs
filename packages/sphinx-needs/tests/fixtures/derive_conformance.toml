[[case]]
name = "content-links-from-where"
why = "content_links: the content's :need: references, each once (a part reference a part link, a dead one and the need itself kept; a disabled one and those in a nested need not); where keeps the references to needs it holds on (a part through its need); from reads another need's content"
config = '''
[needs.links.l_mentions]
derive = { kind = "content_links" }

[needs.links.l_reqs]
derive = { kind = "content_links", where = "type == 'req'" }

[needs.links.l_from]
derive = { kind = "content_links", from = "SPEC_1" }
'''
source = '''
.. req:: Mentioned
   :id: REQ_1

   A part: :np:`(p) the part`.

.. req:: Disabled
   :id: REQ_2

.. spec:: Mentions
   :id: SPEC_1

   Mentions :need:`REQ_1`, :need:`REQ_1.p`, :need:`NOPE_1`, :need:`SPEC_1`,
   :need:`!REQ_2` and :need:`REQ_1` again.

   .. req:: Nested
      :id: REQ_3

      Mentions :need:`REQ_2`.
'''
[case.expect]
findings = []
[case.expect.needs.SPEC_1]
l_mentions = ["NOPE_1", "REQ_1", "REQ_1.p", "SPEC_1"]
l_reqs = ["REQ_1", "REQ_1.p"]
l_from = ["NOPE_1", "REQ_1", "REQ_1.p", "SPEC_1"]
[case.expect.needs.REQ_3]
l_mentions = ["REQ_2"]
l_reqs = ["REQ_2"]
[case.expect.needs.REQ_1]
l_mentions = []
l_from = ["NOPE_1", "REQ_1", "REQ_1.p", "SPEC_1"]

[[case]]
name = "content-links-hidden"
why = "a :hide: need's references in its text and in docutils' containers of body content (a note) are read, by its content_links rule and by a links_from_content naming it; one with none has none, without a finding. UNPINNED: a reference nested in any other directive (only, a figure caption, ...), which ubCode reads and sphinx-needs does not (a registered divergence)"
config = '''
[needs.links.mentions]
derive = { kind = "content_links" }

[needs.links.inline]
'''
source = '''
.. req:: One
   :id: REQ_1

.. req:: Two
   :id: REQ_2

   A part: :np:`(p) the part`.

.. req:: Three
   :id: REQ_3

.. req:: Hidden
   :id: HIDE_1
   :hide:

   Mentions :need:`REQ_1`, :need:`REQ_2.p` and :need:`REQ_1` again.

   .. note:: In a note, :need:`REQ_3`.

.. req:: Hidden, mentioning nothing
   :id: HIDE_2
   :hide:

   No reference.

