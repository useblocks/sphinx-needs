why = "fingerprint takes one optional role, exclude: a list naming what the fingerprint would include, each once (an empty list leaves nothing out); exclude as a string, a name that is nothing a need has, a name a fingerprint never includes (a location, a derived field, back links, parent_needs), a name twice, the roles fields and after, exclude on hash, a schema that cannot hold a string and a fingerprint on a link type are each one derive_invalid, and the field holds its empty value"
# the JSON text hashed, REQ_1 fp and fp_nothing_left_out: {"id":"REQ_1","status":"open","title":"Shapes","type":"req"}
