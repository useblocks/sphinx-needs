[[case]]
name = "max-transitive-enum"
why = "max transitive reads every need reachable through over, each once; a need on a cycle reaches itself; include_self adds its own value; a field with no order is refused"
config = '''
[needs.links.satisfies]

[needs.fields.note]
schema = { type = "string" }

[needs.fields.asil_own]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }

[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
derive = { kind = "max", field = "asil_own", over = "satisfies", transitive = true, include_self = true }

[needs.fields.asil_out]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
derive = { kind = "max", field = "asil_own", over = "satisfies", transitive = true }

[needs.fields.bad_order]
derive = { kind = "max", field = "note", over = "satisfies", transitive = true }
'''
source = '''
.. req:: Enters the cycle
   :id: TRAN_1
   :asil_own: QM
   :satisfies: TRAN_2

.. req:: On the cycle
   :id: TRAN_2
   :asil_own: A
   :satisfies: TRAN_3

.. req:: On the cycle too
   :id: TRAN_3
   :asil_own: C
   :satisfies: TRAN_2

.. req:: Above it all
   :id: TRAN_4
   :asil_own: D
   :satisfies: TRAN_1

.. req:: Alone
   :id: TRAN_5
   :asil_own: B
'''
[case.expect]
[case.expect.needs.TRAN_1]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_2]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_3]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_4]
asil = "D"
asil_out = "C"
[case.expect.needs.TRAN_5]
asil = "B"
[case.expect.nulls]
TRAN_5 = ["asil_out", "bad_order"]
[[case.expect.findings]]
code = "derive_invalid"
field = "bad_order"

