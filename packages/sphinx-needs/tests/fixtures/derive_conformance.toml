[[case]]
name = "fingerprint-whole-need"
why = "fingerprint is the SHA-256 of the need as ONE compact JSON object with sorted keys: id, type, title, status, tags, content, every declared field and link type that is not derived, each entering only when its value differs from the field's default (a link list with conditions dropped, deduplicated, in the export's order); location, presentation, derived fields, hashes and back links never enter, nor a value written equal to its default (SPEC_1's prio)"
# the JSON texts hashed:
#   REQ_1  {"content":"Some *body* text.\n\nÜnïcode paragraph.","done":false,"effort":1e+16,"id":"REQ_1","labels":["x","y"],"owner":"alice","points":3,"status":"open","tags":["b","a"],"title":"Größe \"quoted\"","type":"req"}
#   REQ_2  {"effort":1.5e-05,"id":"REQ_2","title":"Two","type":"req"}
#   REQ_10 {"id":"REQ_10","title":"Ten","type":"req"}
#   SPEC_1 {"content":"Spec body.","id":"SPEC_1","satisfies":["REQ_1","REQ_2","REQ_10"],"title":"The spec","type":"spec"}
config = '''
[needs.links.satisfies]

[needs.fields.owner]
schema = { type = "string" }

[needs.fields.points]
schema = { type = "integer" }

[needs.fields.effort]
schema = { type = "number" }

[needs.fields.done]
schema = { type = "boolean" }

[needs.fields.labels]
schema = { type = "array", items = { type = "string" } }

[needs.fields.prio]
schema = { type = "string" }
default = "low"

[needs.fields.total]
schema = { type = "number" }
derive = { kind = "sum", field = "effort", over = "satisfies" }

[needs.fields.h_title]
schema = { type = "string" }
derive = { kind = "hash", fields = ["title"] }

[needs.fields.fp]
schema = { type = "string" }
derive = { kind = "fingerprint" }
'''
