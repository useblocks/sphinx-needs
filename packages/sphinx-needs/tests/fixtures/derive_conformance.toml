[needs.fields.bad_hash]
derive = { kind = "hash", fields = ["title", "links_back"] }
'''
source = '''
.. req:: Größe
   :id: REQ_1
   :status: open
   :hours: 2

.. spec:: Spec
   :id: SPEC_1
   :status: open
