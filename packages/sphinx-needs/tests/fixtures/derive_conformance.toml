nullable = false
derive = { kind = "count", over = "links" }

[needs.fields.ok]
schema = { type = "boolean", const = true }
nullable = false
derive = { kind = "all", over = "links", test = "hours > 0" }
'''
source = '''
.. req:: Banana
   :id: REQ_1
   :fruit: Banana
   :hours: -2

.. req:: Apple
   :id: REQ_2
   :fruit: apple
   :hours: 3

.. spec:: Sums REQ_1
   :id: SPEC_1
   :links: REQ_1

.. spec:: Sums REQ_2
   :id: SPEC_2
   :links: REQ_2
'''
[case.expect]
[case.expect.needs.REQ_1]
pick = ""
n = 0
ok = true
[case.expect.needs.REQ_2]
