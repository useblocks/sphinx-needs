[case.expect.needs.REQ_1]
owners = []
all_labels = []

[[case]]
name = "max-transitive-enum"
why = "max transitive reads every need reachable through over, each once; a need on a cycle reaches itself; include_self adds its own value; a field with no order is refused"
config = '''
[needs.links.satisfies]

[needs.fields.note]
schema = { type = "string" }

[needs.fields.asil_own]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }

[needs.fields.asil]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
derive = { kind = "max", field = "asil_own", over = "satisfies", transitive = true, include_self = true }

[needs.fields.asil_out]
schema = { type = "string", enum = ["QM", "A", "B", "C", "D"] }
derive = { kind = "max", field = "asil_own", over = "satisfies", transitive = true }

[needs.fields.bad_order]
derive = { kind = "max", field = "note", over = "satisfies", transitive = true }
'''
source = '''
.. req:: Enters the cycle
   :id: TRAN_1
   :asil_own: QM
   :satisfies: TRAN_2

.. req:: On the cycle
   :id: TRAN_2
   :asil_own: A
   :satisfies: TRAN_3

.. req:: On the cycle too
   :id: TRAN_3
   :asil_own: C
   :satisfies: TRAN_2

.. req:: Above it all
   :id: TRAN_4
   :asil_own: D
   :satisfies: TRAN_1

.. req:: Alone
   :id: TRAN_5
   :asil_own: B
'''
[case.expect]
[case.expect.needs.TRAN_1]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_2]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_3]
asil = "C"
asil_out = "C"
[case.expect.needs.TRAN_4]
asil = "D"
asil_out = "C"
[case.expect.needs.TRAN_5]
asil = "B"
[case.expect.nulls]
TRAN_5 = ["asil_out", "bad_order"]
[[case.expect.findings]]
code = "derive_invalid"
field = "bad_order"

[[case]]
name = "hash-late"
why = "hash is the SHA-256 of the compact JSON array of the listed fields, computed after every other rule (a derived field hashed as computed), a link list sorted and deduplicated, a number field's float as 4.0; a <t>_back is refused"
config = '''
[needs.fields.hours]
schema = { type = "number" }

[needs.fields.d_total]
schema = { type = "number" }
nullable = false
derive = { kind = "sum", field = "hours", over = "links" }

[needs.fields.h_all]
schema = { type = "string" }
derive = { kind = "hash", fields = ["title", "status", "d_total", "links"] }

[needs.fields.h_two]
schema = { type = "string" }
derive = { kind = "hash", fields = ["hours", "title"] }

[needs.fields.bad_hash]
derive = { kind = "hash", fields = ["title", "links_back"] }
'''
source = '''
.. req:: Größe
   :id: REQ_1
   :status: open
   :hours: 2

.. spec:: Spec
   :id: SPEC_1
   :status: open
   :links: REQ_1, REQ_1
'''
[case.expect]
[case.expect.needs.SPEC_1]
h_all = "3d71b7f078fd90feec0d9c9e12a6420ea9102b689833d21292a9efbe24a1eaac"
h_two = "85370a75e506227c0cb45ac5450a0935f2e9543d04b5e80d7aaaa2d6d3553764"
[case.expect.needs.REQ_1]
h_all = "7410a8991c69d8f917ea1d2b85f2ccd75a9d8e0cac45249448a0eb3b96642c9c"
h_two = "03571c08cce08fd7013de6bb9f18b255c69252477d0d8257fee0b1aab875b0c1"
[case.expect.nulls]
REQ_1 = ["bad_hash"]
[[case.expect.findings]]
code = "derive_invalid"
field = "bad_hash"
