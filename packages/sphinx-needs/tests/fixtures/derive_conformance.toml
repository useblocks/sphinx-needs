[[case]]
name = "fingerprint-late-and-scope"
why = "fingerprint is computed in the late step, like hash, from final values (owner, set by an inline copy, enters as computed): a rule outside the late step reading it is derive_scope and holds null (early_copy), a late rule reads it on this need (late_copy) and on another (upstream_fp), a hash can hash it (h_fp), and a second fingerprint reads no fingerprint, so it holds the same hex (fp_again)"
# the JSON texts hashed:
#   REQ_1  fp, fp_again {"id":"REQ_1","owner":"Late","title":"Late","type":"req"}
#   SPEC_1 fp, fp_again {"id":"SPEC_1","links":["REQ_1"],"title":"Reads","type":"spec"}
#   REQ_1  h_fp         ["a8a0b44a8bc7cbb9eef954c27b2aae886ab2512db7e7a321184caf05e2069b70"]
#   SPEC_1 h_fp         ["3d54dc26e50dd6e318aa03ab4d57012f124507f30c4f8cb633d34b5d65469807"]
config = '''
[needs.fields.owner]
schema = { type = "string" }

[needs.fields.fp]
schema = { type = "string" }
derive = { kind = "fingerprint" }

[needs.fields.fp_again]
schema = { type = "string" }
derive = { kind = "fingerprint" }

[needs.fields.early_copy]
schema = { type = "string" }
derive = { kind = "copy", field = "fp" }

[needs.fields.late_copy]
schema = { type = "string" }
derive = { kind = "copy", field = "fp", after = "derived" }

[needs.fields.upstream_fp]
schema = { type = "string" }
derive = { kind = "copy", field = "fp", over = "links", after = "derived" }

[needs.fields.h_fp]
schema = { type = "string" }
derive = { kind = "hash", fields = ["fp"] }
'''
