[[case]]
name = "candidate-order"
why = "the orders a rule reads in, where needs.json shows another: <t>_back in need-id order, the ids in code-point order (TEST_10, TEST_2, TEST_9; collect and a list copy), the links kind in need-id order, code-point order too, and content_links in document order, first occurrence kept (each read through a copy into an array field); needs.json writes every link list in natural order (REQ_2, REQ_9, REQ_10) (A-24)"
