[[case]]
name = "by-type-mixed-strata"
why = "one field's rules may sit in different strata per type (req late, spec not): a read is decided by the TARGET need's rule, so a stratum-2 reader of the field is derive_scope only on the needs whose rule is late (REQ_1), never on the others, and a column read over every need names those needs alone"
config = '''
[needs.fields.num]
schema = { type = "integer" }
nullable = false
derive_by_type.req = { kind = "count", over = "links", after = "derived" }
derive_by_type.spec = { kind = "count", over = "links" }

[needs.fields.label]
schema = { type = "string" }
derive_by_type.req = { kind = "copy", field = "title", after = "derived" }
derive_by_type.spec = { kind = "copy", field = "title" }

[needs.fields.seen]
schema = { type = "string" }
derive = { kind = "copy", field = "label", over = "links" }

[needs.fields.total]
schema = { type = "number" }
'''
source = '''
.. impl:: Reader of every num
   :id: IMPL_1
   :total: [[calc_sum("num")]]

.. impl:: Reader of a late label
   :id: IMPL_2
   :links: REQ_1

.. impl:: Reader of a stratum-2 label
   :id: IMPL_3
   :links: SPEC_1

.. req:: Late
   :id: REQ_1
   :links: IMPL_1, IMPL_2

.. spec:: Not late
   :id: SPEC_1
   :links: IMPL_1
'''
[case.expect]
[case.expect.needs.REQ_1]
num = 2
label = "Late"
[case.expect.needs.SPEC_1]
num = 1
label = "Not late"
[case.expect.needs.IMPL_1]
num = 0
[case.expect.needs.IMPL_3]
seen = "Not late"
[case.expect.nulls]
IMPL_1 = ["total", "label"]
IMPL_2 = ["seen"]
[[case.expect.findings]]
code = "derive_scope"
need = "IMPL_1"
field = "total"
[[case.expect.findings]]
code = "derive_scope"
need = "IMPL_2"
field = "seen"

[[case]]
name = "by-type-recursive-rollup"
why = "per-type rules make the multi-level roll-up of one field: leaves (spec) copy an authored field, every req sums the same field over its links, through any depth; a transitive max of its own field likewise; a link cycle among the summing needs is an instance derive_cycle"
config = '''
[needs.fields.hours]
schema = { type = "number" }

[needs.fields.total]
schema = { type = "number" }
nullable = false
derive_by_type.req = { kind = "sum", field = "total", over = "links" }
derive_by_type.spec = { kind = "copy", field = "hours" }

[needs.fields.level_own]
schema = { type = "integer" }

[needs.fields.level]
schema = { type = "integer" }
derive_by_type.req = { kind = "max", field = "level", over = "links", transitive = true }
derive_by_type.spec = { kind = "copy", field = "level_own" }
'''
source = '''
.. req:: Top
   :id: REQ_1
   :links: REQ_2, SPEC_1

.. req:: Middle
   :id: REQ_2
   :links: SPEC_2

.. spec:: Leaf one
   :id: SPEC_1
   :hours: 3
   :level_own: 2

.. spec:: Leaf two
   :id: SPEC_2
   :hours: 5
   :level_own: 7

.. req:: Cycle one
   :id: REQ_8
   :links: REQ_9

.. req:: Cycle two
   :id: REQ_9
   :links: REQ_8, SPEC_1
'''
[case.expect]
[case.expect.needs.REQ_1]
total = 8.0
level = 7
[case.expect.needs.REQ_2]
total = 5.0
level = 7
[case.expect.needs.SPEC_1]
total = 3.0
level = 2
[case.expect.needs.REQ_8]
total = 0.0
[case.expect.needs.REQ_9]
total = 0.0
[case.expect.nulls]
REQ_8 = ["level"]
REQ_9 = ["level"]
[[case.expect.findings]]
code = "derive_cycle"
need = "REQ_8"
field = "total"
[[case.expect.findings]]
code = "derive_cycle"
need = "REQ_9"
field = "total"
[[case.expect.findings]]
code = "derive_cycle"
need = "REQ_8"
field = "level"
[[case.expect.findings]]
code = "derive_cycle"
need = "REQ_9"
field = "level"

