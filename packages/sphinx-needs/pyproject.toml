[build-system]
requires = ["flit_core >=3.4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "sphinx-needs"
# Static, and deliberately so: `uv version --package sphinx-needs` cannot read (or write) a
# dynamic version, and every gate downstream of it -- the release workflow's tag/version
# agreement check, the floor propagation, the workspace fence -- needs the number without
# running the build backend. It is duplicated once, as `__version__` in
# `src/sphinx_needs/__init__.py` (which is stamped into every generated `needs.json`, so it
# cannot become an `importlib.metadata` lookup); `.github/scripts/check_workspace.py` is
# what keeps the two equal.
version = "8.5.0"
# `description` stays dynamic: flit_core reads the module docstring by AST, so a static
# version alongside a dynamic description is a supported combination.
dynamic = ["description"]
authors = [{ name = "team useblocks", email = "info@useblocks.com" }]
license.file = "LICENSE"
readme = "README.rst"
urls.Repository = "http://github.com/useblocks/sphinx-needs"
urls.Documentation = "https://sphinx-needs.readthedocs.io/en/latest/"
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Documentation',
  'Topic :: Utilities',
  'Framework :: Sphinx :: Extension',
]
requires-python = ">=3.11,<4"
dependencies = [
  "sphinx>=7.4,<10",
  "requests-file>=2.1,<4.0",       # external links
  "requests~=2.32",                # external links
  "jsonschema-rs>=0.37.1,<0.53.0", # schema validation
  "sphinx-data-viewer~=0.1.5",     # needservice debug output
  "sphinxcontrib-jquery~=4.0",     # needed for datatables in sphinx>=6
  "typing-extensions>=4.14.0",     # for `**kwargs: Unpack[...]` (PEP 692), which typing supports from 3.12
  "minijinja~=2.15",               # lightweight jinja2-compatible template engine
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.3.0"] # for needpie / needbar
docs = [
  "matplotlib>=3.3.0",
  "sphinxcontrib-plantuml~=0.0",
  "sphinx-copybutton~=0.5",
  "sphinxcontrib-programoutput~=0.17",
  "sphinx-design~=0.6",
  "sphinx-ai-index~=0.1.0",
  "sphinx-syntax-example~=0.2.0",      # the `syntax-example` directive
]
theme-im = ["sphinx-immaterial>=0.11.11,<0.14.0"]
# furo before 2025.12.19 caps sphinx at <9.0, which the `sphinx-9` group cannot resolve.
# A floor rather than `~=`: furo versions are dates, so `~=` would admit one month only
theme-furo = ["furo>=2025.12.19"]
theme-pds = ["pydata-sphinx-theme>=0.15.2,<0.20.0"]
theme-rtd = ["sphinx_rtd_theme>=3.0.2,<4"]

# The sdist. flit 3 inferred its contents from git (`flit build --use-vcs`, which is what
# CI ran until this workflow was rewritten); flit 4 flipped that default off, and
# `uv build` -- which resolves `flit_core >=3.4,<5` to 4.x -- never had it at all. Without
# this table the sdist silently drops from ~28 MB / ~1400 files to ~2.5 MB / ~700: module
# only, no warning, exit 0. (Approximate on purpose -- the exact counts move with every
# test file added; measured 2026-09.) Declaring the contents makes the sdist independent of
# which flit_core is resolved and of whether the build ran in a git checkout at all.
#
# `tests/`, `docs/` and `performance/` ship on purpose, and the two downstream cases were
# checked rather than assumed: conda-forge builds from this sdist (its test step is an
# import check), and Debian runs the suite -- out of the GitHub tag tarball its
# `debian/watch` fetches, not out of this file. `scripts/smoke_needs.py` asserts the trees
# are here (and that none of the junk below is), so losing them would be a red gate rather
# than a discovery on PyPI.
[tool.flit.sdist]
include = ["docs/", "tests/", "performance/"]
# Whatever a *used* checkout leaves lying under those three trees. flit reads the working
# directory, not git, so anything a docs build or a test run wrote is a candidate: measured
# on a tree where `poe docs-needs` and part of the suite had run, the docs build alone adds
# 456 files (`docs/_build/`) plus the two generated artefacts named below. The `__pycache__`
# and `.pyc` patterns are belt and braces -- flit_core 4 already drops those -- and they
# cost nothing to state next to the ones it does not.
exclude = [
  "docs/_build/",
  "docs/github_images/",
  "docs/_static/tutorial_needs.json",
  "**/_build/",
  "**/__pycache__/",
  "**/*.pyc",
  "**/.pytest_cache/",
]
