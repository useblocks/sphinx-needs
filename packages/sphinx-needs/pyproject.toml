[build-system]
requires = ["flit_core >=3.4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "sphinx-needs"
dynamic = ["version", "description"]
authors = [{ name = "team useblocks", email = "info@useblocks.com" }]
license.file = "LICENSE"
readme = "README.rst"
urls.Repository = "http://github.com/useblocks/sphinx-needs"
urls.Documentation = "https://sphinx-needs.readthedocs.io/en/latest/"
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Documentation',
  'Topic :: Utilities',
  'Framework :: Sphinx :: Extension',
]
requires-python = ">=3.10,<4"
dependencies = [
  "sphinx>=7.4,<10",
  "requests-file>=2.1,<4.0",        # external links
  "requests~=2.32",                 # external links
  "jsonschema-rs>=0.37.1,<0.53.0",  # schema validation
  "sphinx-data-viewer~=0.1.5",      # needservice debug output
  "sphinxcontrib-jquery~=4.0",      # needed for datatables in sphinx>=6
  "tomli; python_version < '3.11'", # for needs_from_toml configuration
  "typing-extensions>=4.14.0",      # for dict NotRequired type indication
  "minijinja~=2.15",                # lightweight jinja2-compatible template engine
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.3.0"] # for needpie / needbar
docs = [
  "matplotlib>=3.3.0",
  "sphinxcontrib-plantuml~=0.0",
  "sphinx-copybutton~=0.5",
  "sphinxcontrib-programoutput~=0.17",
  "sphinx-design~=0.6",
  "sphinx-ai-index~=0.1.0",
  # the `syntax-example` directive; the marker keeps the extra resolvable on
  # python 3.10 (the directive, and so a docs build, needs python>=3.11)
  "sphinx-syntax-example~=0.2.0; python_version >= '3.11'",
]
theme-im = ["sphinx-immaterial>=0.11.11,<0.14.0"]
# furo before 2025.12.19 caps sphinx at <9.0, which the `sphinx-9` group cannot resolve.
# A floor rather than `~=`: furo versions are dates, so `~=` would admit one month only
theme-furo = ["furo>=2025.12.19"]
theme-pds = ["pydata-sphinx-theme>=0.15.2,<0.20.0"]
theme-rtd = ["sphinx_rtd_theme>=3.0.2,<4"]

# Development dependency sets. These are groups rather than extras: they exist only to
# develop this package, so they are not published metadata, and `uv sync` installs `dev`
# (which includes `test`) by default. The three `sphinx-*` groups are the CI test matrix
# and are declared conflicting below, so one cell is exactly
#   uv sync --frozen --no-default-groups --group test --group sphinx-9
# `typing` is in the same conflict set, and for the same reason: it caps sphinx at the 7.4
# series, and no single resolution satisfies every group — without it, `uv lock` fails.
[dependency-groups]
dev = [
  "prek>=0.5.1",
  "poethepoet~=0.48",
  "uv>=0.12.9",
  { include-group = "test" },
]
test = [
  "defusedxml~=0.7.1",
  "matplotlib>=3.3.0",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "syrupy>=4,<7",
  "sphinxcontrib-plantuml~=0.0",
  "lxml~=6.0",
  "responses>=0.22,<0.27",
  "pydantic~=2.12",
  "pytest-xprocess~=1.0",
  "pyyaml ~= 6.0",
  "myst-parser>=4,<6",           # host coverage for directives usable from Markdown
  "pytest-xdist~=3.0",           # for `pytest -n auto`
]
benchmark = [
  { include-group = "test" },
  "pytest-benchmark~=5.0; sys_platform != 'win32'",
  "memray>=1.3.1,<2.0.0; sys_platform != 'win32'",
]
# The sphinx test matrix, one group per series. The markers are required for the lock to
# resolve on python 3.10: sphinx 8.2 needs python>=3.11 and sphinx 9.1 needs python>=3.12.
sphinx-7 = ["sphinx~=7.4"]
sphinx-8 = ["sphinx~=8.2; python_version >= '3.11'"]
sphinx-9 = ["sphinx~=9.1; python_version >= '3.12'"]
typing = [
  # the type-checking floor: the oldest supported sphinx and docutils series, resolved from
  # the lock like every other environment, plus the stubs ty needs for docutils and requests
  "sphinx~=7.4",
  "docutils~=0.20.0",
  "types-docutils~=0.20.0",
  "types-requests",
  "ty~=0.0.77",
]

[tool.uv]
# Each group in the set pins one sphinx series, so a single universal resolution would have to
# satisfy all three at once and every environment would be capped at the lowest of them.
# Declaring them conflicting gives each its own resolution in `uv.lock`, so the lock holds
# all three sphinx versions and a plain `uv sync` resolves to the newest.
conflicts = [
  [
    { group = "sphinx-7" },
    { group = "sphinx-8" },
    { group = "sphinx-9" },
    { group = "typing" },
  ],
]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fixture_file: marks tests that use a fixture file (deselect with '-m \"not fixture_file\"')",
  "jstest: marks tests as JavaScript test (deselect with '-m \"not jstest\"')",
  "benchmark: marks tests as expensive benchmark test (deselect with '-m \"not benchmark\"')",
]
filterwarnings = [
  "ignore:.*removed in Python 3.14.*:DeprecationWarning",
  "ignore::PendingDeprecationWarning:sphinx_data_viewer.*",
]


[tool.ruff.lint]
# ruff's pre-0.16 default rule set, pinned explicitly.
# ruff 0.16 replaced its default `select` wholesale, and this project only ever set
# `extend-select`, so without this line the enabled set would change with every ruff
# release. Adopting 0.16's much larger default set is a deliberate, separate decision.
select = ["E4", "E7", "E9", "F"]
extend-select = [
  "B",   # flake8-bugbear  
  "C4",  # flake8-comprehensions
  "I",   # isort
  "ICN", # flake8-import-conventions
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
# ISC004 is ignored for now: every occurrence here is a deliberately wrapped string
# literal and its only fix is unsafe, so adopting it belongs with the wider ruleset review
extend-ignore = ["B904", "ISC001", "ISC004", "ICN001", "N818", "RUF012"]

[tool.ruff.format]
# ruff 0.16 formats python code blocks embedded in markdown; the conformance corpus is
# shared byte-for-byte with ubCode and checksummed in its own manifest (see the yamlfmt
# exclude in .pre-commit-config.yaml), so a formatter local to this repository must not
# rewrite markdown here
exclude = ["*.md"]

[tool.ty.src]
include = ["sphinx_needs"]

[tool.ty.environment]
python-version = "3.10"
# so a bare `ty check` and the editor extension see the same environment as the gate;
# `uv run poe typecheck` creates it, and ty errors naming this path if it is missing
python = ".venvs/typing"

[tool.ty.analysis]
# modules without type information that the floor environment does not install
allowed-unresolved-imports = [
  "matplotlib",
  "matplotlib.**",
  "requests_file",
  "sphinx_data_viewer.**",
  "sphinxcontrib.plantuml",
  "sphinxcontrib.plantuml.**",
  "tomli",
  "tomli.**",
]

[tool.ty.terminal]
# the unused-ignore ratchet: `unused-ignore-comment` is a warning by default, so without
# this a suppression that stopped suppressing anything would pass. There are no other
# warning-level diagnostics in this tree
error-on-warning = true

[[tool.ty.overrides]]
# SphinxNeedsData stores its state as dynamic attributes on BuildEnvironment (#1725, Tier 2)
include = ["sphinx_needs/data.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

# --- Task runner --------------------------------------------------------------------
# poethepoet lives in the `dev` group, so it is in the lock and needs no separate install:
#   uv run poe            # list every task with its help
#   uv run poe test -k …  # trailing words are appended to the task's command verbatim
# poe detects the uv project and runs every task through `uv run`; a task that needs a
# dependency set other than the default one says so with `executor` options (never with a
# nested `uv run` in the cmd — that syncs twice and pollutes the environment) and redirects
# `UV_PROJECT_ENVIRONMENT`, so `.venv` is never clobbered by a matrix cell or a docs build.
# Type checking is one of them: `typecheck` installs the `typing` group into `.venvs/typing`
# — the oldest supported sphinx and docutils, plus ty itself, all from the lock — and checks
# against it, so the task, the prek `ty` hook (which runs the task) and CI all see the same
# environment. The interpreter is the other axis, from `UV_PYTHON`, e.g.
#   UV_PYTHON=3.12 uv run --no-sync poe test-sphinx8
# (`--no-sync` on the outer `uv run`, or uv also rebuilds the default `.venv` on that
# interpreter). uv downloads the interpreter it does not have, so no pyenv is needed.

[tool.poe.executor]
type = "uv"
# `frozen` is uv's "do not update the lock", NOT "assert the lock is current" — the
# currency gate is the `uv-lock` prek hook that the Lint job runs.
frozen = true

[tool.poe.tasks.lint]
help = "Run every prek hook over the whole tree (ruff check + format, taplo, yamlfmt, ty, uv-lock)"
cmd = "prek run --all-files"

[tool.poe.tasks.test]
help = "Run the test suite against the default (newest) sphinx; trailing args go to pytest"
cmd = "pytest --ignore=tests/benchmarks -m 'not jstest'"

[tool.poe.tasks.test-js]
help = "Run only the JavaScript (Cypress) tests; needs `npm install cypress` first"
cmd = "pytest --ignore=tests/benchmarks -m jstest"

[tool.poe.tasks.test-sphinx7]
help = "Run the suite against sphinx 7.4 (set UV_PYTHON to pick the interpreter)"
cmd = "pytest --ignore=tests/benchmarks -m 'not jstest'"
executor = { type = "uv", frozen = true, no-group = "dev", group = [
  "test",
  "sphinx-7",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/sphinx-7" }

[tool.poe.tasks.test-sphinx8]
help = "Run the suite against sphinx 8.2 (python >= 3.11; set UV_PYTHON to pick the interpreter)"
cmd = "pytest --ignore=tests/benchmarks -m 'not jstest'"
executor = { type = "uv", frozen = true, no-group = "dev", group = [
  "test",
  "sphinx-8",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/sphinx-8" }

[tool.poe.tasks.test-sphinx9]
help = "Run the suite against sphinx 9.1 (python >= 3.12; set UV_PYTHON to pick the interpreter)"
cmd = "pytest --ignore=tests/benchmarks -m 'not jstest'"
executor = { type = "uv", frozen = true, no-group = "dev", group = [
  "test",
  "sphinx-9",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/sphinx-9" }

[tool.poe.tasks.typecheck]
help = "Type-check sphinx_needs with ty against the oldest supported sphinx (the `typing` group)"
cmd = "ty check --python .venvs/typing"
executor = { type = "uv", frozen = true, no-group = "dev", group = ["typing"] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/typing" }

[tool.poe.tasks.benchmark]
help = "Run the benchmark suite (time + memory); needs the docs extra for the corpus"
cmd = "pytest tests/benchmarks"
executor = { type = "uv", frozen = true, no-group = "dev", group = "benchmark", extra = "docs" }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/benchmark" }

# --- The built package ---
# These two are named for the distribution they act on rather than for the repository, so
# the names stay correct if a second distribution is ever built here. Every other task in
# this file exercises a checkout; these exercise the artefact that is actually published,
# which nothing else does (#1829).

[tool.poe.tasks.build-needs]
help = "Build the sphinx-needs sdist + wheel into dist/sphinx-needs"
cmd = "uv build . -o dist/sphinx-needs"

[tool.poe.tasks.smoke-needs]
help = "Install the built sphinx-needs wheel out of this project and build a doc with it"
# builds the wheel itself -- a stale one left in dist/ would be a silent pass -- so this
# does not depend on `build-needs` having been run first
cmd = "python scripts/smoke_needs.py ."

# --- Documentation ---
# One task per theme, because the theme selects a different *extra* and executor options
# are not interpolated from task arguments. `docs` (furo) is the one Read the Docs builds.

[tool.poe.tasks.docs]
help = "Build the HTML docs with the furo theme"
cmd = "sphinx-build -nW --keep-going -b html docs docs/_build/html/furo -T"
executor = { type = "uv", frozen = true, no-group = "dev", extra = [
  "docs",
  "theme-furo",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs", DOCS_THEME = "furo" }

[tool.poe.tasks.docs-clean]
help = "Delete the built HTML docs, then build them again from scratch"
sequence = [
  { script = "shutil:rmtree('docs/_build/html', ignore_errors=True)" },
  { ref = "docs" },
]

[tool.poe.tasks.docs-linkcheck]
help = "Check every external link in the documentation"
cmd = "sphinx-build -E -W -b linkcheck docs docs/_build/linkcheck"
executor = { type = "uv", frozen = true, no-group = "dev", extra = "docs" }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs-plain" }

[tool.poe.tasks.docs-alabaster]
help = "Build the HTML docs with the alabaster (sphinx built-in) theme"
cmd = "sphinx-build -nW --keep-going -b html docs docs/_build/html/alabaster -T"
executor = { type = "uv", frozen = true, no-group = "dev", extra = "docs" }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs-plain", DOCS_THEME = "alabaster" }

[tool.poe.tasks.docs-im]
help = "Build the HTML docs with the sphinx-immaterial theme"
cmd = "sphinx-build -nW --keep-going -b html docs docs/_build/html/sphinx_immaterial -T"
executor = { type = "uv", frozen = true, no-group = "dev", extra = [
  "docs",
  "theme-im",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs-im", DOCS_THEME = "sphinx_immaterial" }

[tool.poe.tasks.docs-pds]
help = "Build the HTML docs with the pydata-sphinx-theme"
cmd = "sphinx-build -nW --keep-going -b html docs docs/_build/html/pydata_sphinx_theme -T"
executor = { type = "uv", frozen = true, no-group = "dev", extra = [
  "docs",
  "theme-pds",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs-pds", DOCS_THEME = "pydata_sphinx_theme" }

[tool.poe.tasks.docs-rtd]
help = "Build the HTML docs with the sphinx-rtd-theme"
cmd = "sphinx-build -nW --keep-going -b html docs docs/_build/html/sphinx_rtd_theme -T"
executor = { type = "uv", frozen = true, no-group = "dev", extra = [
  "docs",
  "theme-rtd",
] }
env = { UV_PROJECT_ENVIRONMENT = ".venvs/docs-rtd", DOCS_THEME = "sphinx_rtd_theme" }
