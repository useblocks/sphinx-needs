# The one PlantUML the workspace uses: the sphinx-needs test suite and docs, the sphinx-mounts
# tests, CI, Read the Docs and the docker image all read THIS file. The jar it names is
# COMMITTED beside it, so a bump is these two lines PLUS the file (README.md, "Bumping the
# pin"); `uv run poe verify-plantuml`, which CI's Lint job runs, fails when they disagree.
#
# `url` is a format string, and `{version}` is the only placeholder. The VERSIONED asset name
# is deliberate: releases from ~v1.2025.0 ship both `plantuml.jar` and `plantuml-<version>.jar`,
# but older ones ship only the second, so a pin that could be moved backwards has to use it.
version = "1.2026.8"
sha256 = "5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462"
url = "https://github.com/plantuml/plantuml/releases/download/v{version}/plantuml-{version}.jar"
