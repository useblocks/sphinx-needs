repos:

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # the conformance corpus is shared byte-for-byte with ubCode and checksummed in
        # its own manifest, so a formatter local to this repository must not rewrite it
        exclude: ^tests/conformance/

  - repo: local
    hooks:
      - id: ty
        name: ty
        language: system
        # runs the poe task, so this, `uv run poe typecheck` and CI check the same locked
        # environment (.venvs/typing): the `typing` dependency group, which pins the oldest
        # supported sphinx and docutils and ty itself
        entry: uv run --frozen --no-sync poe typecheck
        pass_filenames: false
        files: ^(sphinx_needs/|pyproject\.toml$|uv\.lock$)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      # keeps the committed uv.lock in step with pyproject.toml;
      # it only runs when pyproject.toml, uv.lock or uv.toml changes
      - id: uv-lock

  - repo: local
    hooks:
      - id: check-readme
        name: check-readme
        files: README.rst
        language: python
        entry: rst2html.py README.rst --halt=warning
        pass_filenames: false
        additional_dependencies:
          - docutils==0.20.1
          - pygments
