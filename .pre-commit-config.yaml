repos:

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # the conformance corpus is shared byte-for-byte with ubCode and checksummed in
        # its own manifest, so a formatter local to this repository must not rewrite it
        exclude: ^packages/sphinx-needs/tests/conformance/

  - repo: local
    hooks:
      - id: check-workspace
        name: check-workspace
        language: system
        # the manifests have to agree with each other in five ways that no other gate can
        # see -- see the script's docstring. CI runs the same script with
        # `--no-project --with packaging`, so that a mistake in the manifests is named
        # rather than reported as a failed sync; here the synced environment already
        # exists, so the hook uses it and stays fast
        entry: uv run --frozen --no-sync python tools/src/sn_tools/check_workspace.py
        pass_filenames: false
        files: ^(pyproject\.toml|packages/[^/]+/pyproject\.toml|packages/[^/]+/src/[^/]+/__init__\.py)$
      - id: ty
        name: ty
        language: system
        # runs the poe task, so this, `uv run poe typecheck-needs` and CI check the same locked
        # environment (.venvs/typing): the `typing` dependency group, which pins the oldest
        # supported sphinx and docutils and ty itself
        entry: uv run --frozen --no-sync poe typecheck-needs
        pass_filenames: false
        # the ROOT pyproject.toml carries [tool.ty], so it triggers the hook too
        files: ^(packages/sphinx-needs/(src/sphinx_needs/|pyproject\.toml$)|pyproject\.toml$|uv\.lock$)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      # keeps the committed uv.lock in step with pyproject.toml;
      # it only runs when pyproject.toml, uv.lock or uv.toml changes
      - id: uv-lock
        # upstream's pattern is anchored at the repository root, which in a workspace
        # means a dependency change in a member's pyproject.toml never triggers the
        # hook and the lock silently goes stale. Match the file name at any depth.
        files: (^|/)(uv\.lock|pyproject\.toml|uv\.toml)$

  - repo: local
    hooks:
      - id: check-readme
        name: check-readme
        files: ^packages/sphinx-needs/README\.rst$
        language: python
        entry: rst2html.py packages/sphinx-needs/README.rst --halt=warning
        pass_filenames: false
        additional_dependencies:
          - docutils==0.20.1
          - pygments
