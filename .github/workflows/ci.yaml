name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the pinned interpreter (root `.python-version`) is not on the runner image, so
          # without this uv downloads it on every run
          cache-python: true
      - name: Check the workspace manifests agree with each other
        # FIRST, and with `--no-project`: this fence reads the manifests, so it must not
        # need an environment built from them -- a mistake in a manifest is exactly when
        # `uv sync` fails, and a fence that syncs first reports "sync failed" instead of
        # naming the mistake. It also replaces the inline requires-python check that used
        # to sit further down this job, and adds four more assertions of the same kind
        # (see the script's docstring). The local prek hook runs the same script against
        # the synced environment, so `uv run poe lint` covers it too
        run: >
          uv run --no-project --with packaging python .github/scripts/check_workspace.py
      - run: uv run --frozen prek run --all-files --show-diff-on-failure
        env:
          PREK_COLOR: always
      - name: Check the type gate still sees the package
        # the gate must see the package: a stale `[tool.ty.src] include` makes ty check zero
        # files and exit 0, because ty intersects the CLI path with the include rather than
        # overriding it -- so the type check stays green with the whole package unchecked.
        # A non-zero exit is not enough on its own: `typecheck-needs` also exits non-zero for
        # reasons that have nothing to do with the probe (an unreadable `[tool.ty]` value, a
        # `--python` that names no environment), and reading those as success would revive
        # exactly the silent green this step exists to kill -- hence the `case`, which demands
        # that the failure NAME the probe. Running after the prek step (whose `ty` hook is the
        # same command) is belt and braces on top of that, not the guarantee: a healthy gate
        # has already had to pass on this command before the probe is planted.
        run: |
          probe=packages/sphinx-needs/src/sphinx_needs/_ty_gate_probe.py
          trap 'rm -f "$probe"' EXIT
          echo 'x: int = "not an int"' > "$probe"
          if out=$(uv run --frozen --no-sync poe typecheck-needs 2>&1); then
            printf '%s\n' "$out"
            echo "::error::the type check passed with a deliberate type error in the package"
            exit 1
          fi
          printf '%s\n' "$out"
          case "$out" in
            *_ty_gate_probe*) echo "the type gate is looking at the package" ;;
            *) echo "::error::the type check failed, but not on the probe -- the gate is broken"
               exit 1 ;;
          esac
      - name: Check the sphinx groups are declared conflicting
        # if this sync ever succeeds, `[tool.uv] conflicts` has been dropped and the lock
        # holds one sphinx again, so every matrix cell below would test the same version
        env:
          UV_PROJECT_ENVIRONMENT: .venvs/conflict-check
        run: |
          if uv sync --frozen --no-default-groups --group sphinx-7 --group sphinx-9; then
            echo "::error::syncing sphinx-7 and sphinx-9 together should be an error"
            exit 1
          fi
      - name: Check the default environment is the one the repository pins
        # Two assertions about a bare `uv sync`, because it has two axes and each drifts on
        # its own.
        # Sphinx: the `sphinx-7` and `typing` groups both cap sphinx at the 7.4 series, and
        # both are in the conflict set so that a plain `uv sync` is not capped by either.
        # Interpreter: the root `.python-version` is what makes a bare `uv sync` the same
        # environment everywhere. `setup-uv` is given no `python-version` input in THIS job
        # precisely so uv reads that file (the monthly `prek-update` job omits it too, so it
        # runs on the pin as well); every other job passes one, which `setup-uv` turns into
        # `UV_PYTHON`, and the environment variable beats the file. So this is the job that
        # tests the pin. The expected series is read back out of the file rather than written
        # down a second time here.
        run: |
          v=$(cut -d. -f1,2 .python-version)
          uv run --frozen python -c "
          import sys, sphinx
          assert sphinx.version_info[0] >= 9, 'sphinx ' + sphinx.__version__ + ' is not the newest series'
          series = '%d.%d' % sys.version_info[:2]
          assert series == '$v', 'the default environment is on python ' + series + ', but .python-version says $v'
          "
      - name: Check the typing floor is the floor it claims to be
        # .venvs/typing exists because the `ty` hook ran the typecheck task above; the
        # stubs must match the installed docutils, and that docutils must be the lowest
        # series the floor sphinx accepts
        env:
          UV_PROJECT_ENVIRONMENT: .venvs/typing
        run: uv run --frozen --no-sync --no-group dev --group typing python .github/scripts/check_typing_floor.py
      - name: Test the repository's own scripts
        # `.github/scripts/` holds the release fences: the one that decides whether a tag
        # may publish, and the one that rewrites floors. They are not in any package, so
        # this is the only job that runs their tests. They are in the root `testpaths`, so
        # a bare `pytest` at the root runs them too -- but every matrix cell names the
        # package's `tests` path explicitly and so never collects them
        run: uv run --frozen --no-sync pytest .github/scripts/tests -q

  # ubc:
  #   name: ubc
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: useblocks/ubc-action@main
  #       with:
  #         version: 0.19.1
  #     - name: Run 'ubc check docs'
  #       run: ubc check docs
  #     - name: Run 'ubc build index docs'
  #       run: ubc build index docs --show-warnings

  tests-core:
    name: "Core py${{ matrix.python-version }} ${{ matrix.sphinx-group }} ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Set on "false" to get the results of ALL builds
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        sphinx-group: ["sphinx-7", "sphinx-8", "sphinx-9"]
        include:
          # corner cases for Windows
          - os: "windows-latest"
            python-version: "3.11"
            sphinx-group: "sphinx-7"
          - os: "windows-latest"
            python-version: "3.12"
            sphinx-group: "sphinx-8"
          - os: "windows-latest"
            python-version: "3.14"
            sphinx-group: "sphinx-9"
        exclude:
          # Sphinx 9.1 requires python 3.12, one above this project's floor, so the
          # `sphinx-9` group carries a `python_version >= '3.12'` marker and contributes
          # nothing on 3.11. The sync would still exit 0 -- the environment just falls back
          # to the project's own sphinx range -- and `check_sphinx_cell.py` below would then
          # fail the cell for testing a sphinx it never asked for. Exclude it instead.
          - os: "ubuntu-latest"
            python-version: "3.11"
            sphinx-group: "sphinx-9"

    steps:
      - uses: actions/checkout@v7
      - name: Install graphviz (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install graphviz
      - name: Install graphviz (windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y --no-progress graphviz
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the lock is the same file for every cell while the installed set is not,
          # so each cell needs its own cache entry
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.sphinx-group }}
          python-version: ${{ matrix.python-version }}
      - name: Install the cell
        run: uv sync --frozen --no-default-groups --group test --group ${{ matrix.sphinx-group }}
      - name: Report the resolved versions
        run: uv run --no-sync python -c "import sys, sphinx, docutils; print(sys.version, sphinx.__version__, docutils.__version__)"
      - name: Check the cell installed the sphinx it names
        # against the group's own specifier: a group whose marker excludes this python
        # contributes nothing, the environment falls back to the project's sphinx range and
        # the sync still exits 0, so without this the cell would silently test another series
        run: uv run --no-sync python .github/scripts/check_sphinx_cell.py ${{ matrix.sphinx-group }}
      - name: Run pytest
        run: uv run --no-sync pytest -v packages/sphinx-needs/tests --ignore=packages/sphinx-needs/tests/benchmarks -m "not jstest" --cov=sphinx_needs --cov-report=xml --cov-report=term-missing
      - name: Upload to Codecov
        # dependabot PRs get no secrets; without a token the upload fails and takes the required `check` gate with it
        if: github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'useblocks/sphinx-needs' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: sphinx-need-pytests
          flags: pytests
          files: ./coverage.xml # `file` was renamed to `files` in codecov-action v5
          fail_ci_if_error: true

  tests-js:
    name: "JS py${{ matrix.python-version }} ${{ matrix.sphinx-group }} ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            python-version: "3.11"
            sphinx-group: "sphinx-7"
          - os: "ubuntu-latest"
            python-version: "3.13"
            sphinx-group: "sphinx-9"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.sphinx-group }}
          python-version: ${{ matrix.python-version }}
      - name: Install the cell
        # `js` is the browser driver (pytest-playwright); it is not in `test`, because only
        # these two cells want it
        run: uv sync --frozen --no-default-groups --group test --group js --group ${{ matrix.sphinx-group }}
      - name: Check the cell installed the sphinx it names
        # against the group's own specifier — see the comment in tests-core
        run: uv run --no-sync python .github/scripts/check_sphinx_cell.py ${{ matrix.sphinx-group }}
      - name: Install the browser
        # the binary is not a package: playwright fetches it from cdn.playwright.dev into
        # ~/.cache/ms-playwright. `--with-deps` adds the apt libraries a runner lacks.
        # Deliberately uncached for now — measure this step, and if it is slow enough to
        # matter, add actions/cache on ~/.cache/ms-playwright keyed on the playwright
        # version in uv.lock (the browser revision follows it)
        run: uv run --frozen --no-sync playwright install --with-deps chromium
      - name: Run pytest
        run: uv run --no-sync pytest -v packages/sphinx-needs/tests --ignore=packages/sphinx-needs/tests/benchmarks -m "jstest"

  tests-no-mpl:
    name: Test matplotlib uninstalled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # 3.12+: on 3.11 the lock resolves sphinx 8.2, and this job wants the newest sphinx
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          uv sync --frozen --no-default-groups --group test --extra docs
          # `uv pip` is not a project interface: it ignores UV_PROJECT_ENVIRONMENT and
          # targets whatever virtualenv is active, so the environment is named here.
          # There is none active on a runner, but there usually is one locally.
          uv pip uninstall --python .venv/bin/python matplotlib numpy
      - name: Check matplotlib really is gone
        # every command below has to be `uv run --no-sync`: a bare `uv run` would re-sync
        # the group that matplotlib is in and put it straight back
        run: |
          if uv run --no-sync python -c "import matplotlib"; then
            echo "::error::matplotlib is still installed, the job would test nothing"
            exit 1
          fi
      - name: Run pytest
        run: uv run --no-sync pytest -v packages/sphinx-needs/tests/no_mpl_tests.py
      - name: Run HTML build
        # the docs should build without matplotlib (just issuing warnings)
        run: uv run --no-sync sphinx-build -b html . _build
        working-directory: packages/sphinx-needs/docs

  smoke-needs:
    name: Smoke test the built package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install graphviz
        run: sudo apt-get install graphviz
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the declared `requires-python` floor: the throwaway environment the wheel is
          # installed into inherits it through UV_PYTHON, so this cell is what keeps that
          # floor honest. `setup-uv` sets UV_PYTHON from this input, which beats the root
          # `.python-version` -- drop the input and this job would silently test 3.13.
          python-version: "3.11"
      - name: Build the wheel, install it out of the project and build a doc with it
        run: uv run --frozen poe smoke-needs

  check:

    # This job does nothing and is only used for the branch protection
    # see https://github.com/marketplace/actions/alls-green#why

    if: always()

    needs:
      - lint
      - tests-core
      - tests-js
      - tests-no-mpl
      - smoke-needs

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
