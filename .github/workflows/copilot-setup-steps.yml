name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # We clone the repository as part of setup steps to install dependencies
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the docs extra requires python>=3.11 (sphinx-syntax-example)
          python-version: "3.12"

      - name: Install dev tools
        # no group is named on purpose: the root's default `dev` group includes the root's
        # `test` group, and the root depends on every member, so a bare sync is already an
        # environment the agent can run the suite in
        run: uv sync --frozen

      - name: Install pre-commit hooks
        run: uv run --frozen prek install
