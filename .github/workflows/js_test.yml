name: Cypress E2E tests for Sphinx Needs
on: [pull_request]
jobs:
  js_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the docs extra requires python>=3.11 (sphinx-syntax-example)
          python-version: "3.12"
      - name: Install package
        run: uv sync --frozen --no-default-groups --extra docs
      - name: Install Node dependencies
        run: npm install cypress
      - name: Build Docs
        id: sphinx-build-docs
        run: uv run --no-sync sphinx-build -a -T -E -j 4 -b html -d /tmp/sphinx_build/doctrees ./docs /tmp/sphinx_build/html
      - name: E2E Cypress Test on Chrome
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          config-file: tests/js_test/cypress.config.js
          start: npm start
          # quote the url to be safe against YML parsing surprises
          wait-on: 'http://localhost:8080'

