name: Docker-Image

on:
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      # Ask if docker deployment needed when manually triggered
      deploy:
        description: 'Deploy Docker Image (y/n)?'
        required: true
        default: 'n'
  push:
    # This image is sphinx-needs', so it keys on sphinx-needs' tags only. The previous
    # filter was `'*.*.*'`, and GitHub's tag globs match hyphens (only `/` is excluded), so
    # under `<dist>-v<version>` tags it fired for EVERY member of the workspace and handed
    # `docker/metadata-action` a string that is not PEP 440.
    tags: ['sphinx-needs-v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['docker/**']

env:
  # On a tag run this IS the tag: the Dockerfile uses it as a git ref
  # (`git+...@$NEEDS_VERSION#subdirectory=packages/sphinx-needs`), and the prefixed tag is
  # the ref that release.yaml was triggered by -- the bare companion tag it pushes may not
  # exist yet when this workflow starts. That is #540.
  #
  # The literal is only for the runs that have no tag: the `docker/**` `pull_request` path
  # filter and a manual dispatch. It has to name a ref cut AFTER the workspace move,
  # because the subdirectory in that URL does not exist in an earlier one -- `8.5.0`
  # predates the move, so this path stays red until the first monorepo release, at which
  # point the release recipe bumps it to `sphinx-needs-v<version>`. (The `pre-release`
  # branch of the Dockerfile is never exercised by CI at all.)
  NEEDS_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '8.5.0' }}
  DEPLOY_IMAGE: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: ${{ github.event_name != 'pull_request' }}
      matrix:
        base-image: ["sphinxdoc/sphinx:latest", "sphinxdoc/sphinx-latexpdf:latest"]
        image: ["sphinxneeds", "sphinxneeds-latexpdf"]
        exclude:
          - base-image: "sphinxdoc/sphinx:latest"
            image: "sphinxneeds-latexpdf"
          - base-image: "sphinxdoc/sphinx-latexpdf:latest"
            image: "sphinxneeds"
    name: "Image: ${{ matrix.image }} | Baseimage: ${{ matrix.base-image }}"
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Set up Docker Build 🐋
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: |
            latest=true
          tags: |
            # the image version is the tag with its `sphinx-needs-v` prefix stripped;
            # `type=pep440` cannot be used because the tag itself is not PEP 440
            type=match,pattern=sphinx-needs-v(.*),group=1

      - name: Check if deployment manually disabled
        if: github.event.inputs.deploy == 'n'
        run: |
          echo "DEPLOY_IMAGE=false" >> "$GITHUB_ENV"

      - name: Login to Docker Hub Docker Registry 🐸
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push html image to Doker Hub Docker Registry 🐳
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ env.DEPLOY_IMAGE == 'true' }}
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEEDS_VERSION=${{ env.NEEDS_VERSION }}
            BASE_IMAGE=${{ matrix.base-image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
