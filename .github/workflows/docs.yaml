name: Docs CI
on:
  pull_request:
    paths: [packages/sphinx-needs/docs/**]
jobs:
  linkcheck:
    name: Docs-Linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # 3.12+: on 3.11 the lock resolves sphinx 8.2, and this job wants the newest sphinx
          python-version: "3.12"
      - name: Fetch the pinned PlantUML
        # the one jar `vendor/plantuml/pin.toml` names. `shell: bash` (pipefail) and
        # `tr -d '\r'` (Windows) are both load-bearing -- vendor/plantuml/README.md,
        # "The step CI runs", says why
        shell: bash
        run: |
          jar="$(uv run --no-project python tools/src/sn_tools/fetch_plantuml.py | tr -d '\r')"
          echo "PLANTUML_JAR=$jar" >> "$GITHUB_ENV"
      - name: Install Dependencies
        run: uv sync --frozen --no-default-groups --extra docs
      - name: Run linkcheck
        run: uv run --no-sync sphinx-build -W -b linkcheck . _build
        working-directory: packages/sphinx-needs/docs
