name: Docs CI
on:
  pull_request:
    paths: [packages/sphinx-needs/docs/**]
jobs:
  linkcheck:
    name: Docs-Linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the docs extra requires python>=3.11 (sphinx-syntax-example)
          python-version: "3.12"
      - name: Install Dependencies
        run: uv sync --frozen --no-default-groups --extra docs
      - name: Run linkcheck
        run: uv run --no-sync sphinx-build -W -b linkcheck . _build
        working-directory: packages/sphinx-needs/docs
