name: Test the sphinx extensions

# ONE cell running every extension package's suite, called once per sphinx series from
# `ci.yaml`.
#
# `test-package.yaml` cannot do this and should not learn to: a `workflow_call` input is a
# scalar, a job's steps cannot be generated from data, and a second suite would need an
# input that switches the body. So this is a second unit -- and the eight steps the two
# units share, from the renderer installs to the sphinx-series fence, are
# `.github/actions/prepare-cell`, which is what stops it being a second copy of them.
#
# WHY ONE JOB AND NOT ONE CALLER OF `test-package.yaml` PER PACKAGE. This used to rest on
# sphinx-codelinks' suite being under 20 seconds. It is not any more: 1051 tests and the
# job's largest step (104-147 s serial on ubuntu and 313 s on Windows in run 38399647972;
# ~30 s under `-n 4` locally, ~100 s on Windows by estimate). The premise changed and the
# conclusion holds: run as separate cells, every package would pay checkout, setup-uv and
# a cell sync again (21-27 s on ubuntu, 52 s on Windows, in that run), and the checks list
# on every pull request would grow by one entry per cell for every package split out. One
# cell per series with a step per package keeps the checks list where it is and pays the
# job start-up once. The cost is that a failure in one suite could hide the next, which is
# why every pytest step after the first runs even when an earlier one has failed.
#
# `./`-referenced workflows and actions come from the caller's own commit, so a pull
# request that changes this file, the composite and `ci.yaml` together is tested as one
# change.

on:
  workflow_call:
    inputs:
      os:
        description: The runner to test on.
        type: string
        default: ubuntu-latest
      sphinx-group:
        # deliberately no `python-version`: these cells vary the sphinx series, not the
        # interpreter, so they run on the root `.python-version`
        description: The dependency group naming the sphinx series this cell tests against.
        type: string
        required: true
      cache-suffix:
        description: "`setup-uv`'s cache key suffix."
        type: string
        required: true
      upload-coverage:
        description: Whether THIS cell uploads coverage, for every package whose step has an upload.
        type: boolean
        default: false
      pytest-workers:
        # pytest-xdist's `-n` for the four suites that take minutes; ub-project's and
        # sphinx-ai-index's take seconds, which the workers' start-up would eat, and run
        # serially everywhere. `0` is xdist's own "no workers": the suite runs in the pytest
        # process, in collection order, which is how ci.yaml keeps one cell serial
        description: "pytest-xdist's `-n` for the sphinx-mounts, sphinx-codelinks, sphinx-test-reports and ub-test-reports suites; `0` runs them serially."
        type: string
        default: "4"
    secrets:
      CODECOV_TOKEN:
        description: Read only by the upload steps, on this repository's own pull requests and on pushes to master.
        required: false

jobs:
  # The job id and its display name are both `pytest`, because a called job's name is
  # appended to the caller's: the checks read `Extensions sphinx-9 ubuntu-latest / pytest`.
  pytest:
    name: pytest
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ inputs.cache-suffix }}
          # no `python-version` above, so the cell runs on the root `.python-version`,
          # which is not on the runner image -- without this uv downloads it every run
          cache-python: true
      - uses: ./.github/actions/prepare-cell
        id: prepare
        with:
          sphinx-group: ${{ inputs.sphinx-group }}
          # sphinx-codelinks' optional preprocessor-aware C/C++ engine. Without it 56 of
          # its tests SKIP rather than fail, so a cell that lost this line would be a
          # quieter green rather than a red one
          extra-groups: codelinks-libclang
          # sphinx-mounts' path directives render with `dot`; sphinx-codelinks renders
          # nothing at all, and pays for the install here because the two share a cell
          needs-graphviz: true
          # sphinx-mounts' uml tests render for real, and the shared resolution RAISES
          # rather than skipping when it finds no renderer
          needs-plantuml: true
      - name: Check the libclang engine this cell asked for is really there
        # `extra-groups: codelinks-libclang` above is the ONLY executable place that wheel
        # is named in this repository, and losing it is SILENT: the four modules that need
        # `clang.cindex` carry `pytest.importorskip`, so the cell would report
        # `303 passed, 26 skipped` and exit 0 with 56 test cases gone. Measured. The same
        # would happen if the group ever gained a marker (the `sphinx-9` group already has
        # one) or if a runner platform had no libclang wheel.
        #
        # This is the libclang half of the composite's "Check the renderers this cell asked
        # for are really there", and it is here rather than in the composite because the
        # composite must not know what any one group means. It asserts in the CELL only:
        # the polite skips are what make `poe test-codelinks` usable for a developer who
        # has not installed the engine, and turning those into failures would make the
        # thing CI runs stop being the thing a developer runs.
        shell: bash
        run: |
          uv run --no-sync python -c "import clang.cindex" || {
            echo "::error::libclang did not install: no clang.cindex in this cell. The codelinks-libclang dependency group is what provides it; without it 56 of sphinx-codelinks tests skip instead of running and this cell is a quieter green, not a red"
            exit 1
          }
      # ONE pytest and ONE codecov upload per package. Each `--cov-report` names its own
      # file: plain `xml` writes `coverage.xml`, so the second run would overwrite the
      # first and both uploads would carry the same numbers under different flags.
      - name: "sphinx-mounts: pytest"
        # `-m "not bazel"` deselects the two tests the `bazel` job owns
        #
        # `-n`, here and on the next three suites: four workers by default, the runner's core
        # count, as in the Needs cells. Measured locally in this step's own form, coverage
        # on, three runs each (medians): sphinx-codelinks 94 s -> 30 s, sphinx-mounts
        # 42 -> 18, sphinx-test-reports 39 -> 14, ub-test-reports 15.5 -> 6.3, every run green
        # with the serial counts and the same coverage totals (codelinks' to one line, which
        # varied between serial runs too). Serially the Windows cell pays 1.9-2.4x ubuntu per
        # suite; the Needs cells, at `-n 4`, pay 1.0-1.3x -- the workers overlap the
        # platform's per-file and per-process latency. The suites had
        # three hazards under it, all fixed, all sphinx-codelinks tests writing at one path
        # in the checkout: `output/` and `invalid_objs.json` in the CWD, and a Sphinx
        # `_build` under the in-tree `tests/data/sphinx`. The first also showed a race in
        # `codelinks analyse` itself -- two runs creating its output directory -- fixed with
        # it. The job's last step fails on the next such test
        run: uv run --no-sync pytest -v packages/sphinx-mounts/tests -m "not bazel" -n ${{ inputs.pytest-workers }} --durations=25 --cov=sphinx_mounts --cov-report=xml:mounts.xml --cov-report=term-missing
      - name: "sphinx-mounts: upload to Codecov"
        # dependabot PRs get no secrets; without a token the upload fails and takes the required `check` gate with it.
        # A push to master uploads too. The fork guard below (#1229, 2024-08) had no push case, so no master commit
        # uploaded a report after it; Codecov compares a pull request against the newest ancestor that HAS one, so every
        # pull request was compared against a stale base, and once the sphinx-test-reports split (#2009) moved
        # statements out of the `reports` flag, that flag read as a coverage drop on changes that never touched it.
        # `fail_ci_if_error` stays limited to pull requests: a Codecov outage must not turn master red
        if: inputs.upload-coverage && github.repository == 'useblocks/sphinx-needs' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: sphinx-mounts-pytests
          flags: mounts
          files: ./mounts.xml # `file` was renamed to `files` in codecov-action v5
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
      - name: "sphinx-codelinks: pytest"
        # `!cancelled()` and not the default `success()`: letting a sphinx-mounts failure
        # hide this suite would mean a second push to learn a second fact. The job is still
        # red either way. This once rested on this suite being 20 seconds and the one above
        # minutes; it is now the largest step in the job (1051 tests), and the argument is
        # truer for it: the suites are the same order of magnitude.
        #
        # But `!cancelled()` ALONE would also run it when `prepare-cell` failed -- and then
        # there is no environment, `uv run --no-sync` silently CREATES an empty one, and
        # the step dies on `ModuleNotFoundError: No module named 'sphinx_codelinks'`, which
        # reads as "the package is broken" four steps away from the cause (the sphinx-mounts
        # step above, on its implicit `success()`, is skipped and gives no clue).
        # `steps.prepare.outcome` covers the whole prologue: it is `skipped` when checkout
        # or setup-uv failed, so this condition says what it means -- run even if the FIRST
        # SUITE failed, not run even if setup failed.
        #
        # Run from the REPOSITORY ROOT, like every other cell. That is only legal because
        # `test_form_https_url` no longer passes a filepath relative to the CWD -- until
        # that fix this suite passed only from `packages/sphinx-codelinks`, and a
        # `working-directory:` here would also have moved where `--cov-report` writes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        #
        # `-n`: see the sphinx-mounts step
        run: uv run --no-sync pytest -v packages/sphinx-codelinks/tests -n ${{ inputs.pytest-workers }} --durations=25 --cov=sphinx_codelinks --cov-report=xml:codelinks.xml --cov-report=term-missing
      - name: "sphinx-codelinks: upload to Codecov"
        if: inputs.upload-coverage && github.repository == 'useblocks/sphinx-needs' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: sphinx-codelinks-pytests
          flags: codelinks
          files: ./codelinks.xml
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
      - name: "sphinx-test-reports: pytest"
        # `!cancelled()` plus the prologue check, for the reason the step above gives: a
        # failure in either suite before it must not hide this one, but a failed
        # `prepare-cell` must, or `uv run --no-sync` silently creates an empty environment
        # and the step dies on an import error four steps from the cause.
        #
        # `--cov=sphinx_test_reports` measures the real package only; the old-name aliases
        # under `sphinxcontrib/test_reports/` are exercised by the suite but not counted.
        # This cell needs no new tool: nothing in this
        # suite renders a diagram, so neither the graphviz nor the PlantUML the cell
        # already installs for sphinx-mounts is for it. `-n`: see the sphinx-mounts step
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: uv run --no-sync pytest -v packages/sphinx-test-reports/tests -n ${{ inputs.pytest-workers }} --durations=25 --cov=sphinx_test_reports --cov-report=xml:reports.xml --cov-report=term-missing
      - name: "sphinx-test-reports: upload to Codecov"
        if: inputs.upload-coverage && github.repository == 'useblocks/sphinx-needs' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: sphinx-test-reports-pytests
          flags: reports
          files: ./reports.xml
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
      - name: "ub-test-reports: pytest"
        # sphinx-test-reports' Sphinx-free core: the converter, the pytest plugin, the parsers
        # and the `[test_reports]` model. Here for every cell's platform and interpreter --
        # Windows above all, where the converter's path handling and the plugin's source
        # locations are the platform-sensitive part -- and for coverage under a flag of its
        # own; `toolchain-free` in ci.yaml stays the run that proves it imports no Sphinx.
        # Same `if:` as the steps above; `-n`: see the sphinx-mounts step
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: uv run --no-sync pytest -v packages/ub-test-reports/tests -n ${{ inputs.pytest-workers }} --cov=ub_test_reports --cov-report=xml:ub-test-reports.xml --cov-report=term-missing
      - name: "ub-test-reports: upload to Codecov"
        if: inputs.upload-coverage && github.repository == 'useblocks/sphinx-needs' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ub-test-reports-pytests
          flags: ub-test-reports
          files: ./ub-test-reports.xml
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
      - name: "ub-project: pytest"
        # The shared `ubproject.toml` reader, which every extension above is to depend on.
        # Its suite takes under a second and needs nothing this cell does not already have;
        # it is here for the Windows cell -- path anchoring, symlinks and the walk up are
        # the platform-sensitive part of it -- and runs in every cell because a step that
        # ran in one would need a condition to explain. The `toolchain-free` job in ci.yaml
        # stays the run that proves it imports no Sphinx. Same `if:` as the step above
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: uv run --no-sync pytest -v packages/ub-project/tests
      - name: "sphinx-ai-index: pytest"
        # The extension every `sphinx-*` docs site loads to publish `ai_docs_index.json`. Its
        # suite builds small Sphinx projects in `tmp_path` and needs nothing this cell does
        # not already have -- no renderer, no git, no libclang, no network -- and its
        # property-based tests get `hypothesis` from the root `test` group. hypothesis
        # writes its example database into the working directory, the repository root here,
        # which the root `.gitignore` covers. Same `if:` as the steps above
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: uv run --no-sync pytest -v packages/sphinx-ai-index/tests --cov=sphinx_ai_index --cov-report=xml:ai-index.xml --cov-report=term-missing
      - name: "sphinx-ai-index: upload to Codecov"
        if: inputs.upload-coverage && github.repository == 'useblocks/sphinx-needs' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: sphinx-ai-index-pytests
          flags: ai-index
          files: ./ai-index.xml
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
      - name: Check the suites wrote nothing into the checkout
        # What `-n` exposes is a test that writes at a fixed path inside the checkout: two
        # workers meet there, and the failure is a rare race rather than a red step. The root
        # `.gitignore` HIDES such a write (`output/` is ignored), so `--ignored` is what makes
        # this step see it, and the step fails on the FIRST run of such a test instead of
        # waiting for the race to fire. A suite that modifies a tracked file fails it too.
        #
        # `--ignored=traditional --untracked-files=normal` lists an ignored or untracked
        # directory as one line (`!! output/`), not every file under it: the same verdict,
        # and a short listing. The allowlist is what the cell itself creates, and anything
        # else is printed as an error. Two entries are NOT measured: `.coverage\..+`, which
        # only an interrupted combine would leave, and `codecov…`, derived from reading
        # `codecov-action@v7` (303a32d7) `dist/codecov.sh`, which with the action's default
        # `cleanup: false` sets `CC_DOWNLOAD_DIR="."` and downloads its CLI, `.SHA256SUM` and
        # `.sig` into the CWD, removing them only under `CC_CLEANUP=true`; the first run of
        # the uploading cell (ubuntu, sphinx-9) is its measurement. The rest were measured
        # locally. grep's exit 1 ("nothing left") is the only non-zero status let through, so
        # a mistyped allowlist entry is a red step, not a silent green. git prints
        # `/`-separated paths on Windows too, so the same script runs there. Same `if:` as
        # the suites
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          allowed=(
            '\.venv/'                 # the cell's `uv sync`
            '\.pytest_cache/'         # pytest's cache, at the rootdir
            '(.+/)?__pycache__/'      # bytecode, beside every imported module
            '\.coverage'              # pytest-cov's data file
            '\.coverage\..+'          # a worker's data file, if one is left uncombined (not measured: see above)
            '(mounts|codelinks|reports|ub-test-reports|ai-index)\.xml'  # the `--cov-report=xml:` files
            '\.hypothesis/'           # sphinx-ai-index's example database
            'codecov(\.SHA256SUM(\.sig)?)?'  # the upload steps' CLI and its checksums (read, not measured: see above)
          )
          pattern="^(!!|\?\?) ($(IFS='|'; echo "${allowed[*]}"))\$"
          listing="$(git status --porcelain --ignored=traditional --untracked-files=normal)"
          offending="$(grep -v -E "$pattern" <<<"$listing")" || { rc=$?; [ "$rc" -eq 1 ] || { echo "::error::the fence's own pattern failed (grep exit $rc)"; exit 1; }; }
          if [ -n "$offending" ]; then
            while IFS= read -r line; do
              echo "::error::a suite wrote into the checkout: $line"
            done <<<"$offending"
            exit 1
          fi
          echo "the checkout holds nothing the suites wrote"
