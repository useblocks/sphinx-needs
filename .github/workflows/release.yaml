name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:

    name: Publish to PyPi
    # needs: check
    # if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # this job only runs flit to build a pure-python wheel, so the interpreter is
          # free; 3.12 matches every other utility workflow
          python-version: "3.12"
      - name: install flit
        # both distributions are pinned together: flit declares an unbounded
        # flit_core lower bound, so pinning only flit lets the two drift apart
        run: pip install flit==3.12.0 flit_core==3.12.0
      - name: Build and publish
        # --use-vcs is the flit 3 default, but flit 4 flipped it: state it
        # explicitly so tests/ and docs/ stay in the sdist across upgrades
        # flit builds the project whose pyproject.toml is in the working directory,
        # and scopes `--use-vcs` to that directory's git listing
        working-directory: packages/sphinx-needs
        run: flit publish --use-vcs
        env:
          FLIT_USERNAME: __token__
          FLIT_PASSWORD: ${{ secrets.PYPI }}
