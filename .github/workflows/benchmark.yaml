name: Benchmark
on:
  push:
    branches:
      - master
jobs:
  benchmarks:
    name: "Benchmark time & memory"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # the docs extra requires python>=3.11 (sphinx-syntax-example)
          python-version: "3.12"
      - name: Install dependencies
        # the `benchmark` group includes the `test` group
        run: uv sync --frozen --no-default-groups --group benchmark --extra docs
      - name: Run Benchmark for time
        run: uv run --no-sync pytest --benchmark-json output.json -k _time tests/benchmarks

      - name: Download previous benchmark data
        uses: actions/cache@v6
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
      - name: Extract benchmark data
        run: uv run --no-sync python .github/scripts/extract_benchmark_data.py output.json output_action.json
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # What benchmark tool the output.txt came from
          tool: 'customSmallerIsBetter'
          # Where the output from the benchmark tool is stored
          output-file-path: output_action.json
          # Where the previous data file is stored
          # external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '150%'
          comment-on-alert: true
          comment-always: false
          auto-push: true
          gh-pages-branch: "benchmarks"
          benchmark-data-dir-path: "docs/bench"
          alert-comment-cc-users: '@danwos'

      - name: Run Benchmark for memory
        run: uv run --no-sync pytest --benchmark-json output.json -k _memory tests/benchmarks
      - name: Create memory flamegraph
        run: uv run --no-sync memray flamegraph -o mem_out.html mem_out.bin
      - name: Publish memory flamegraph
        run: |
          git checkout benchmarks
          cp mem_out.html docs/memory.html
          git add docs/memory.html
          git -c "user.name=Sphinx-Needs CI" -c "user.email=ci@sphinx-needs.com" commit -m "memory.html update"
      - name: Push changes
        run: git push origin benchmarks
