# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# NO `uv` ecosystem below, deliberately: the lock is updated by the monthly `UV update`
# workflow (.github/workflows/uv-update.yaml). Dependabot pins its candidate version on
# every requirement line at once, and this workspace locks some packages at two versions
# across its `[tool.uv] conflicts` splits (`docutils` 0.20.1 in `typing`, the newest
# elsewhere) -- it cannot express that, and every refresh died with "Dependabot can't
# resolve your Python dependency files". Its default strategy also rewrote manifest
# specifiers nobody asked it to touch; the job never edits a manifest, and asserts it.
# Security alerts and security-update pull requests are a separate repository feature
# that reads uv.lock independently of this file, so the lock is still covered there.
# The account: #1942, #1944, #1946, #1948 and the pull request that made this change.
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 🔧
    schedule:
      interval: monthly
