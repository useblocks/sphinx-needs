name: Prepare a test cell
description: The renderer installs, the cell sync and the fences that guard them.

# WHY A COMPOSITE ACTION AND NOT A THIRD REUSABLE WORKFLOW.
#
# `test-package.yaml` runs ONE suite with ONE codecov upload, deliberately: `workflow_call`
# inputs are scalars, a job's steps cannot be generated from data, and folding a second
# suite in would need an input that switches the body. `test-extensions.yaml` runs every
# extension package's suite in one job because the extensions share a cell. Neither can be
# expressed as the other -- but the eight steps before the first `pytest` are the
# same in both, and copying them would restore exactly the duplication #1864 removed.
#
# A composite action is what holds steps that are not a whole job. What it CANNOT hold
# usefully is `uses:` steps: dependabot's `github-actions` ecosystem does not read composite
# actions, so a pin moved in here would stop being bumped. So `actions/checkout`,
# `astral-sh/setup-uv` and `codecov/codecov-action` stay written in the two workflows, and
# this file is `run:` steps only.
#
# One consequence, and it is the only behaviour difference from the steps as they were
# written inline: `setup-uv` now runs BEFORE the renderer installs rather than after them,
# because the composite is one step and the two `uses:` lines have to precede it. The
# Windows graphviz install now relies on that order: it unzips with `uv run --no-project
# python`. The workflows also restore its zip from `actions/cache` before this action and
# save it after, which is the other reason those `uses:` steps sit around it.
#
# Composite inputs are strings, so the two boolean-shaped ones are compared against
# 'true'. A caller that forwards a `workflow_call` boolean gets exactly that, because
# `${{ inputs.x }}` renders a boolean as `true`/`false`.

inputs:
  sphinx-group:
    description: The dependency group naming the sphinx series this cell tests against.
    required: true
  extra-groups:
    # `workflow_call` and composite inputs are both scalars only, so a list is one
    # space-separated string. The values are written in `ci.yaml` and the two workflows,
    # never by anything a pull request controls
    description: Further dependency groups for the sync, space separated.
    required: false
    default: ""
  needs-graphviz:
    # a package that never calls `dot` passes 'false' rather than paying for `apt-get` or
    # the Windows download per cell for a renderer it does not use
    description: Install graphviz ('true' or 'false').
    required: false
    default: "true"
  needs-plantuml:
    # no runner image has a `plantuml` package, and every image has `java`
    description: Verify the vendored PlantUML against its pin and point PLANTUML_JAR at it ('true' or 'false').
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install graphviz (linux)
      if: inputs.needs-graphviz == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install graphviz
    - name: Install graphviz (windows)
      # Not Chocolatey. `choco install graphviz` asks the community feed, which answers
      # HTTP 406 often enough to be a regular red (job 115845047323: "Failed to fetch
      # results from V2 feed ... 406 (Not Acceptable)", "Chocolatey installed 0/0
      # packages") -- and exits 0 when it does. This takes the Graphviz project's own
      # portable zip at the version and sha256 `graphviz-windows.env` pins.
      #
      # The zip lives in `$RUNNER_TEMP/graphviz-download`, the directory the calling
      # workflow restores from `actions/cache` before this action and saves after it (the
      # `uses:` steps cannot live here; this file's header says why). On a hit there is
      # no download at all. A restored zip is still hashed, and one that does not match is
      # thrown away and fetched again rather than failing the cell.
      #
      # `dot -c` writes the plugin configuration an installer would; without it the
      # portable build knows no output formats.
      if: inputs.needs-graphviz == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/graphviz-windows.env"
        tmp="$(cygpath -u "$RUNNER_TEMP")"
        zip="$tmp/graphviz-download/$GRAPHVIZ_ASSET"
        fetch() {
          mkdir -p "$(dirname "$zip")"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$zip" "$GRAPHVIZ_URL"
        }
        if [ -f "$zip" ]; then
          echo "graphviz $GRAPHVIZ_VERSION: zip restored from the actions cache"
          if ! echo "$GRAPHVIZ_SHA256  $zip" | sha256sum -c --quiet -; then
            echo "::warning::the cached graphviz zip does not match its pin; downloading it again"
            rm -f "$zip"
            fetch
          fi
        else
          fetch
        fi
        echo "$GRAPHVIZ_SHA256  $zip" | sha256sum -c -
        rm -rf "$tmp/graphviz"
        uv run --no-project python -m zipfile -e "$(cygpath -w "$zip")" "$(cygpath -w "$tmp/graphviz")"
        bin="$tmp/graphviz/Graphviz-$GRAPHVIZ_VERSION-win64/bin"
        "$bin/dot.exe" -c
        cygpath -w "$bin" >> "$GITHUB_PATH"
    - name: No graphviz install step for macOS
      # neither branch above fires on macOS, so a cell that asked for graphviz would run
      # without `dot` and fail somewhere far from the cause. Say so here instead
      if: inputs.needs-graphviz == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        echo "::error::no graphviz install step for macOS; add one before enabling this combination"
        exit 1
    - name: Point PLANTUML_JAR at the vendored jar
      # the one jar `vendor/plantuml/pin.toml` names, verified against the pin first.
      # `shell: bash` (pipefail) and `tr -d '\r'` (Windows) are both load-bearing, and so
      # is this being a conditional STEP rather than a job-level `env:` expression --
      # vendor/plantuml/README.md, "The step CI runs", says why
      #
      # `$GITHUB_ENV` written inside a composite action reaches the rest of the JOB, not
      # only the rest of this file, which is what the pytest steps need.
      if: inputs.needs-plantuml == 'true'
      shell: bash
      run: |
        jar="$(uv run --no-project python tools/src/sn_tools/fetch_plantuml.py --verify | tr -d '\r')"
        echo "PLANTUML_JAR=$jar" >> "$GITHUB_ENV"
    - name: Check the renderers this cell asked for are really there
      # Written when the Windows install was `choco install graphviz`, which EXITS 0 WHEN
      # THE FEED FAILS. Measured on run 34000562220, job 101398550280: "Failed to fetch
      # results from V2 feed ... Unable to find package 'Graphviz' ... Chocolatey installed
      # 0/0 packages", a green install step, and then two graphviz tests asserting 90 s
      # later inside pytest. The Windows install no longer uses Chocolatey, but the check
      # stays for every installer: a renderer that did not arrive should be one red step
      # that names it, not N assertions in the suite.
      #
      # For PlantUML this is also the mechanical check on the step above: if that step
      # ever stops writing a path that exists, THIS is the red, rather than every cell
      # that wanted a jar.
      if: inputs.needs-graphviz == 'true' || inputs.needs-plantuml == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.needs-graphviz }}" = "true" ]; then
          dot -V || { echo "::error::graphviz did not install: no dot on PATH"; exit 1; }
        fi
        if [ "${{ inputs.needs-plantuml }}" = "true" ]; then
          test -f "$PLANTUML_JAR" || { echo "::error::PLANTUML_JAR names no file: '$PLANTUML_JAR'"; exit 1; }
          java -version || { echo "::error::no java on PATH, so the plantuml jar cannot be run"; exit 1; }
        fi
    - name: Install the cell
      shell: bash
      run: |
        groups=""
        for group in ${{ inputs.extra-groups }}; do
          groups="$groups --group $group"
        done
        # shellcheck disable=SC2086
        uv sync --frozen --no-default-groups --group test --group ${{ inputs.sphinx-group }} $groups
    - name: Report the resolved versions
      shell: bash
      run: uv run --no-sync python -c "import sys, sphinx, docutils; print(sys.version, sphinx.__version__, docutils.__version__)"
    - name: Check the cell installed the sphinx it names
      # against the group's own specifier: a group whose marker excludes this python
      # contributes nothing, the environment falls back to the project's sphinx range and
      # the sync still exits 0, so without this the cell would silently test another series
      shell: bash
      run: uv run --no-sync python .github/scripts/check_sphinx_cell.py ${{ inputs.sphinx-group }}
