# One repository, two packages, two coverage uploads -- so two flags with targets of their
# own. Without them both would land on the `default` status and a young package's coverage
# would be averaged into a mature one's 80%, moving a gate nobody decided to move.
coverage:
  status:
    project:
      # sphinx-needs, uploaded by the `tests-core` cell with `flags: pytests`
      needs:
        flags: [pytests]
        target: 80%
        threshold: 0.5%
      # sphinx-mounts, uploaded by the `tests-mounts` cell with `flags: mounts`.
      # `target: auto` -- do not hold it against itself -- until its real number is known;
      # picking one blind is how a gate ends up disabled
      mounts:
        flags: [mounts]
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 67%
        threshold: 0.5%
