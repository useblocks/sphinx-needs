id: style-class-unknown
title: A style rule naming a class the configuration does not define
purpose: |
  Registry id `style-class-unknown`, and the only tier-3 degradation that is a plain authoring mistake rather than a conflict. The rule is skipped, the LATER rule still applies -- an unknown name must not abort the cascade -- and the diagram is still drawn.
needs:
- id: REQ_1
  type: req
  title: Requirement one
  links:
    links:
    - REQ_2
- id: REQ_2
  type: req
  title: Requirement two
config:
  styles:
    known:
      border: '#00FF00'
options:
  styles: nosuchclass, known
expect:
  plantuml:
    source: |
      @startuml

      ' Nodes definition

      node "<size:12>Requirement</size>\n**Requirement one**\n<size:10>REQ_1</size>" as REQ_1 [[<NODE_URL:REQ_1>]] #line:00FF00
      node "<size:12>Requirement</size>\n**Requirement two**\n<size:10>REQ_2</size>" as REQ_2 [[<NODE_URL:REQ_2>]] #line:00FF00

      ' Connection definition

      REQ_1 --> REQ_2

      @enduml
    degradations:
    - id: style-class-unknown
      tier: 3
      once: false
  graphviz:
    source: |
      digraph needflow {
      compound=true;
      node [
        margin="0.21,0.11";
      ]
      edge [
        minlen="2";
      ]

      // node definitions
      "REQ_1" [label=<<font point-size="12">Requirement</font><br align="left"/><b>Requirement one</b><br align="left"/><font point-size="10">REQ_1</font><br align="left"/>>, tooltip="REQ_1", href="<NODE_URL:REQ_1>", target="_top", shape="box3d", color="#00FF00"];
      "REQ_2" [label=<<font point-size="12">Requirement</font><br align="left"/><b>Requirement two</b><br align="left"/><font point-size="10">REQ_2</font><br align="left"/>>, tooltip="REQ_2", href="<NODE_URL:REQ_2>", target="_top", shape="box3d", color="#00FF00"];

      // edge definitions
      "REQ_1" -> "REQ_2" [arrowhead=vee];
      }
    degradations:
    - id: style-class-unknown
      tier: 3
      once: false
