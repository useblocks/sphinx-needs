id: arrow-unsupported
title: An arrow head PlantUML has no form for
purpose: |
  Registry id `arrow-unsupported`. `cross` is in the neutral enum because Graphviz and mermaid can draw it; PlantUML cannot, so it degrades to a plain head with one warning for the project. The case exists to pin that the gap is a degradation and never an error -- a diagram is not refused for naming a member of its own vocabulary.
needs:
- id: REQ_1
  type: req
  title: Requirement one
  links:
    links:
    - REQ_2
- id: REQ_2
  type: req
  title: Requirement two
links:
- option: links
  incoming: is linked by
  outgoing: links to
  arrow: cross
expect:
  plantuml:
    source: |
      @startuml

      ' Nodes definition

      node "<size:12>Requirement</size>\n**Requirement one**\n<size:10>REQ_1</size>" as REQ_1 [[<NODE_URL:REQ_1>]]
      node "<size:12>Requirement</size>\n**Requirement two**\n<size:10>REQ_2</size>" as REQ_2 [[<NODE_URL:REQ_2>]]

      ' Connection definition

      REQ_1 --> REQ_2

      @enduml
    degradations:
    - id: arrow-unsupported
      tier: 2
      once: true
  graphviz:
    source: |
      digraph needflow {
      compound=true;
      node [
        margin="0.21,0.11";
      ]
      edge [
        minlen="2";
      ]

      // node definitions
      "REQ_1" [label=<<font point-size="12">Requirement</font><br align="left"/><b>Requirement one</b><br align="left"/><font point-size="10">REQ_1</font><br align="left"/>>, tooltip="REQ_1", href="<NODE_URL:REQ_1>", target="_top", shape="box3d"];
      "REQ_2" [label=<<font point-size="12">Requirement</font><br align="left"/><b>Requirement two</b><br align="left"/><font point-size="10">REQ_2</font><br align="left"/>>, tooltip="REQ_2", href="<NODE_URL:REQ_2>", target="_top", shape="box3d"];

      // edge definitions
      "REQ_1" -> "REQ_2" [arrowhead=tee];
      }
